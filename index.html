// m3-input.js — A-ORG-2 M3 pointer interaction (PORTED from A-ORG-1)

// versions; "v1.23.0 movement feel (known-good) on a no-roll yaw+pitch core"):
//   globeMark              (~L13934)  request a redraw (sets GlobeState.dirty)
//   _rebuildGlobeQ         (~L16009)  yaw+pitch → orientation quaternion GlobeState.q
//   _faceLonLatAngles      (~L16017)  set yaw/pitch so (lon,lat) faces the viewer

//                                     ctrl/cmd-wheel zoom, two-finger pinch+pan
//   glide block            (~L16733)  momentum glide from startGlobeLoop's frame(),
//                                     hoisted here as globeGlideStep(dt) — see dev 2

// OWNERSHIP NOTES (concatenation law — no duplicate top-level declarations):
//   - globeMark and _rebuildGlobeQ/_faceLonLatAngles are DECLARED HERE (m1-geom.js
//     header explicitly deferred the interaction trio to this file; globeMark's first
//     consumer is input). The render module must NOT redeclare them.
//   - Uses (declared elsewhere): GlobeState (shell), _qMul/_qNorm/_qFromAxisAngle/
//     globeMetrics (m1-geom.js), startGlobeLoop (render module, called guarded),
//     tapAtScreen (selection/dossier module hook, called guarded).
//
// DEVIATIONS (everything changed vs. A-ORG-1, and why):
//   1. NO POINTER CAPTURE (reliability contract). A-ORG-1 calls setPointerCapture/
//      releasePointerCapture on the canvas and listens for lostpointercapture; capture
//      is what kept a drag alive once the pointer left the canvas. Here pointermove/

//      the handlers no-op unless this drag's pointerId is active — same drag-outside-
//      canvas behavior, zero capture API. The lostpointercapture safety-reset is gone

//   2. globeGlideStep(dt) is NEW-NAMED: in A-ORG-1 the glide integrator is an inline
//      block of startGlobeLoop's frame(). The render loop is not this file (exclusive

//      globeGlideStep(dt) once per frame BEFORE its dirty check; the step sets
//      GlobeState.dirty itself, so the redraws-only-when-dirty law holds.
//   3. Glide constants are the CURRENT source's: decay Math.pow(0.94, dt/16.67),
//      stop < 0.005 (the mission brief's grep hooks 0.78 / 0.02 are a pre-Apple-settle

//   4. Tap fires the M3 hook tapAtScreen(x, y) — canvas-relative px/py, the exact

//   5. endPointer's stale-pointer guard is TIGHTENED for the window listeners:
//      A-ORG-1's (e.pointerId!==activeId && activeId!==null) let a pointerup with no
//      active drag fall through to tap logic — harmless when the listener sat on the
//      canvas, but on window it would fire taps for clicks anywhere in the app. Now
//      activeId===null returns early too.
//   6. startGlobeLoop call on release is guarded (typeof) — the render module may not
//      be concatenated yet during construction; A-ORG-1 called it bare.
//   7. GlobeState._lastInteract is NOT touched here (A-ORG-1 sets it in fly-to paths
//      for idle-spin resume; A-ORG-2 has no idle spin). The spin=false /_spinAxis /
//      _spinVel resets in pointerdown ARE kept verbatim so ported state names survive.
//
// CONTRACTS HONORED:
//   - Reads GlobeState at event/call time only — concatenation-order safe. No DOM
//     beyond the canvas passed in (+ window listeners). Plain sloppy-mode JS, no
//     classes, no modules. Nothing here draws; every visual change routes through
//     GlobeState.dirty (globeMark) and the render loop's dirty gate.
//   - Zoom clamps: wheel/pinch Math.max(1.0, Math.min(28, …)), double-tap
//     Math.min(28, z0*2) — span widened 16→28 at v0.8.0 (owner: deeper zoom-in)

function globeMark(){ GlobeState.dirty=true; }   // request a redraw

// Rebuild the orientation quaternion from yaw + pitch: pitch about the camera X axis, then yaw
// about the world Y (polar) axis. Verified to reach ±90° latitude with north up and no roll.
function _rebuildGlobeQ(){
  GlobeState.q = _qNorm(_qMul(
    _qFromAxisAngle(1,0,0, GlobeState.pitch||0),
    _qFromAxisAngle(0,1,0, GlobeState.yaw||0)
  ));
}

// Set yaw/pitch so geographic (lon,lat) sits at screen center (used by fly-to). Verified:
// yaw = lon-90 and pitch = lat center the point with east-right and north-up in this projection.
function _faceLonLatAngles(lon,lat){
  GlobeState.yaw   = (lon-90)*Math.PI/180;
  GlobeState.pitch =  lat*Math.PI/180;
  const lim=Math.PI/2-0.001;
  GlobeState.pitch=Math.max(-lim,Math.min(lim,GlobeState.pitch));
  _rebuildGlobeQ();
}

function setupGlobeInteraction(cv){
  // ===== v1.23.0 movement feel (known-good) on a no-roll yaw+pitch core. =====
  // Drag left/right spins around the polar axis (yaw); up/down tilts latitude (pitch). We keep
  // yaw & pitch as plain numbers and rebuild the orientation each drag: pitch wraps freely so
  // you can spin continuously over the poles, but the globe never rolls. This is the simplest
  // model that reaches the poles AND keeps north up — no drift, no guards, no lock.
  let activeId=null, lastX=0, lastY=0, lastT=0, sx0=0, sy0=0;
  function applyDrag(dx, dy){
    const R = Math.min(cv.clientWidth, cv.clientHeight)/2 * Math.max(1e-3,GlobeState.zoom) * (GlobeState.baseK||0.72);
    const sensDeg = Math.max(0.02, Math.min(0.5, 57.2958 / R));   /* ~54% of finger speed at rest */
    GlobeState.yaw   = (GlobeState.yaw||0)   - dx * sensDeg * Math.PI/180;   // drag right → turn right
    GlobeState.pitch = (GlobeState.pitch||0) + dy * sensDeg * Math.PI/180;   // drag up → globe follows finger up
    // NO clamp — pitch wraps freely so you can spin continuously over the poles and all the way
    // around, like a real globe. (Keep pitch bounded to ±2π just so the number never grows huge.)
    if(GlobeState.pitch >  Math.PI*2) GlobeState.pitch -= Math.PI*2;
    if(GlobeState.pitch < -Math.PI*2) GlobeState.pitch += Math.PI*2;
    _rebuildGlobeQ();
  }
  cv.addEventListener('pointerdown', e=>{
    if(e.pointerType==='touch' && GlobeState._pinching) return;
    try{ if(typeof cameraCancel==='function') cameraCancel(); }catch(_){}   // user wins over any live fly tween
    activeId=e.pointerId;
    GlobeState.dragging=true; GlobeState.moved=false;
    GlobeState.spin=false; GlobeState._gliding=false;
    GlobeState._spinAxis=null; GlobeState._spinVel=0;
    lastX=e.clientX; lastY=e.clientY; lastT=performance.now(); sx0=e.clientX; sy0=e.clientY;
    GlobeState.dirty=true;
  });
  // Move/up/cancel live on window (NOT the canvas): with pointer capture banned, this is
  // what keeps a drag alive when the pointer leaves the canvas. Handlers no-op unless
  // OUR pointer is mid-drag, so app-wide events cost one compare. (Deviations 1 & 5.)
  window.addEventListener('pointermove', e=>{
    if(!GlobeState.dragging || e.pointerId!==activeId) return;
    if(e.cancelable) e.preventDefault();
    const dx=e.clientX-lastX, dy=e.clientY-lastY;
    if(Math.hypot(e.clientX-sx0, e.clientY-sy0) > (e.pointerType==='touch'?6:3)) GlobeState.moved=true;
    applyDrag(dx, dy);
    // track drag velocity in px/ms for a v1.23.0-style flick glide (smoothed)
    const now=performance.now(); const dt=Math.max(8, now-lastT);
    GlobeState._velDX = 0.7*(dx/dt) + 0.3*(GlobeState._velDX||0);
    GlobeState._velDY = 0.7*(dy/dt) + 0.3*(GlobeState._velDY||0);
    lastX=e.clientX; lastY=e.clientY; lastT=now;
    globeMark();
  }, {passive:false});
  function endPointer(e){
    if(activeId===null || e.pointerId!==activeId) return;   // tightened vs. A-ORG-1 (deviation 5)
    const wasMoved=GlobeState.moved;
    GlobeState.dragging=false; activeId=null;
    let speed=Math.hypot(GlobeState._velDX||0, GlobeState._velDY||0);
    const CAP=1.6;   /* fling cap: a hard flick can't launch a multi-rev spin */
    if(speed>CAP){ const _s=CAP/speed; GlobeState._velDX*=_s; GlobeState._velDY*=_s; speed=CAP; }
    if(wasMoved && speed>0.05 && !GlobeState._pinching){ GlobeState._gliding=true; }
    else { GlobeState._gliding=false; GlobeState._velDX=0; GlobeState._velDY=0; }
    if(!wasMoved && !GlobeState._pinching){
      // Tap-vs-drag already settled (moved thresholds above); now tap-vs-DOUBLE-tap:
      // two stationary releases within 300ms and 24px = double-tap zoom, else a tap.
      const nowT=performance.now();
      if(nowT-(GlobeState._dtT||0)<300 && Math.hypot(e.clientX-(GlobeState._dtX||0), e.clientY-(GlobeState._dtY||0))<24){
        // v0.30.0 (audit #6): a DOUBLE-tap is a zoom, full stop — cancel the
        // pending single-tap so the first tap never selects a dot under the
        // zoom gesture. The 260ms defer below is what makes this possible.
        GlobeState._dtT=0;
        if(GlobeState._tapT){ clearTimeout(GlobeState._tapT); GlobeState._tapT=null; }
        try{ _dblZoom(e); }catch(_){}
      } else {
        GlobeState._dtT=nowT; GlobeState._dtX=e.clientX; GlobeState._dtY=e.clientY;
        // M3 hook boundary: canvas-relative coords, exactly what A-ORG-1's
        // handleGlobeTap derived before hit-testing GlobeState._screen. (Deviation 4.)
        // v0.30.0: the tap DEFERS 260ms — if a second tap lands, it was a zoom.
        try{
          if(typeof tapAtScreen==='function'){
            const r=cv.getBoundingClientRect();
            const tx=e.clientX-r.left, ty=e.clientY-r.top;
            if(GlobeState._tapT) clearTimeout(GlobeState._tapT);
            GlobeState._tapT=setTimeout(function(){
              GlobeState._tapT=null;
              try{ tapAtScreen(tx, ty); }catch(_){}
            }, 260);
          }
        }catch(_){}
      }
    }
    GlobeState.dirty=true;
    if(!GlobeState.raf && typeof startGlobeLoop==='function') startGlobeLoop(cv);   // guarded (deviation 6)
  }
  // v15.14.0 double-tap: animated x2 toward the tap point (at max: reset to 2.0, Apple-style)
  function _dblZoom(e){
    try{ if(typeof cameraCancel==='function') cameraCancel(); }catch(_){}   // don't fight a live fly tween
    const m=globeMetrics(cv), r=cv.getBoundingClientRect();
    const ox=(e.clientX-r.left)-m.cx, oy=(e.clientY-r.top)-m.cy;
    // one gesture, one entry: a double-tap ON a marker already pushed via the
    // first tap's select ms ago — don't charge the dive a second Back press
    try{
      const _u=GlobeState._undo, _lastTs=(_u&&_u.length)?(_u[_u.length-1].ts||0):0;
      if(typeof _undoPush==='function' && !(performance.now()-_lastTs<450)) _undoPush();
    }catch(_){}
    const z0=GlobeState.zoom, zT=(z0>=6)?1.4:Math.min(28, z0*2);   // v0.21.0: deep double-tap zooms OUT — always an escape
    const t0=performance.now(), dur=260;
    let zPrev=z0;
    (function step(now){
      const p=Math.min(1,(now-t0)/dur), ez=1-(1-p)*(1-p);
      const z=z0+(zT-z0)*ez, k=z/zPrev; zPrev=z;
      GlobeState.zoom=z;
      if(GlobeState._applyDrag && k!==1) GlobeState._applyDrag(-(k-1)*ox, -(k-1)*oy);
      globeMark();
      if(p<1) requestAnimationFrame(step);
    })(t0);
  }
  // expose applyDrag so the glide loop can reuse the exact same no-roll rotation
  GlobeState._applyDrag = applyDrag;
  window.addEventListener('pointerup', endPointer);
  window.addEventListener('pointercancel', endPointer);

  // ZOOM via wheel: Ctrl/Cmd+wheel (or trackpad pinch) zooms; plain wheel scrolls page.
  cv.addEventListener('wheel', e=>{
    if(!(e.ctrlKey || e.metaKey)) return;               // gesture ownership unchanged
    e.preventDefault();
    try{ if(typeof cameraCancel==='function') cameraCancel(); }catch(_){}   // wheel zoom wins over a live fly
    const m=globeMetrics(cv), r=cv.getBoundingClientRect();
    const ox=(e.clientX-r.left)-m.cx, oy=(e.clientY-r.top)-m.cy;
    const z0=GlobeState.zoom;
    const z1=Math.max(1.0, Math.min(28, z0*Math.exp(-e.deltaY*0.0015)));
    if(z1===z0) return;
    GlobeState.zoom=z1;
    const k=z1/z0;
    if(GlobeState._applyDrag) GlobeState._applyDrag(-(k-1)*ox, -(k-1)*oy);   // zoom dives at the cursor
    globeMark();
  }, {passive:false});

  // ZOOM via two-finger pinch — incremental, focal-anchored, and it PANS (v15.14.0).
  let pinchPrevD=0, pinchPrevX=0, pinchPrevY=0;
  function dist(t){ const dx=t[0].clientX-t[1].clientX, dy=t[0].clientY-t[1].clientY; return Math.hypot(dx,dy); }
  function mid(t){ return [(t[0].clientX+t[1].clientX)/2, (t[0].clientY+t[1].clientY)/2]; }
  cv.addEventListener('touchstart', e=>{
    if(e.touches.length===2){ GlobeState._pinching=true; GlobeState.dragging=false; GlobeState._gliding=false;
      pinchPrevD=dist(e.touches); const c=mid(e.touches); pinchPrevX=c[0]; pinchPrevY=c[1]; }
  }, {passive:true});
  cv.addEventListener('touchmove', e=>{
    if(GlobeState._pinching && e.touches.length===2){
      if(e.cancelable) e.preventDefault();
      const d=dist(e.touches), c=mid(e.touches);
      if(pinchPrevD>0){
        const m=globeMetrics(cv), r=cv.getBoundingClientRect();
        const ox=(c[0]-r.left)-m.cx, oy=(c[1]-r.top)-m.cy;
        const z0=GlobeState.zoom;
        const z1=Math.max(1.0, Math.min(28, z0*(d/pinchPrevD)));
        GlobeState.zoom=z1;
        const k=z1/z0;
        if(GlobeState._applyDrag){
          if(k!==1) GlobeState._applyDrag(-(k-1)*ox, -(k-1)*oy);   // focal anchor
          GlobeState._applyDrag(c[0]-pinchPrevX, c[1]-pinchPrevY); // two-finger pan
        }
        globeMark();
      }
      pinchPrevD=d; pinchPrevX=c[0]; pinchPrevY=c[1];
    }
  }, {passive:false});
  cv.addEventListener('touchend', e=>{
    if(e.touches.length<2 && GlobeState._pinching){ GlobeState._pinching=false; pinchPrevD=0; }
  }, {passive:true});
  // v0.21.0 — a system gesture / notification fires touchcancel WITHOUT touchend,
  // which used to leave _pinching latched forever (drag + zoom felt "stuck"). Any
  // cancel, or dropping below two fingers, always clears the pinch latch now.
  cv.addEventListener('touchcancel', ()=>{ GlobeState._pinching=false; pinchPrevD=0; }, {passive:true});
  cv.addEventListener('touchstart', e=>{ if(e.touches.length<2) { GlobeState._pinching=false; pinchPrevD=0; } }, {passive:true});
}

// v1.23.0-style momentum glide, hoisted out of A-ORG-1's startGlobeLoop frame() (deviation 2).
// The render module calls this once per frame with dt (ms, already capped at 64 by the loop)
// BEFORE its dirty check. Keeps applying the released drag velocity through the same no-roll
// rotation (GlobeState._applyDrag), decaying smoothly — reusing applyDrag guarantees the glide
// can't roll the globe either. Sets GlobeState.dirty itself: the redraw law stays dirty-gated.
function globeGlideStep(dt){
  if(GlobeState._gliding && !GlobeState.dragging && !GlobeState._pinching && GlobeState._applyDrag){
    GlobeState._applyDrag((GlobeState._velDX||0)*dt, (GlobeState._velDY||0)*dt);
    const decay=Math.pow(0.94, dt/16.67);   /* was 0.78 — Apple-length settle: half-life ~187ms, ~1s glide */
    GlobeState._velDX*=decay; GlobeState._velDY*=decay;
    if(Math.hypot(GlobeState._velDX||0, GlobeState._velDY||0) < 0.005){ GlobeState._gliding=false; GlobeState._velDX=0; GlobeState._velDY=0; }
    GlobeState.dirty=true;
  }
}


/* ══════════ module: m4-camera ══════════ */
// ═══════════════════════════════════════════════════════════════════════════════
// m4-camera.js — A-ORG-2 M4 camera moves (PORTED from A-ORG-1)
//
// Ported from A-ORG-1 index.html (source of truth — flight feel is v21.1.0
// "CINEMATIC flight", controls-council approved):
//   flyToLatLon      (~L16560)  eased yaw/pitch/zoom tween to face (lat,lon):
//                               duration scales with angular distance
//                               (550+500·min(1,dist/π) ms), easeInOutQuad, and long
//                               hops (>~30°) get a van Wijk-style zoom dip so the eye
//                               keeps its bearings instead of smearing at full zoom.
//   fitGlobeToSites  (~L15784)  frame a set of sites: average their 3-D unit vectors

// ---- Camera tween generation token (deviation 1). Every tween entry point bumps it
//      and captures the new value; cameraCancel() bumps it so stale steps go inert. ----
let _camGen=0;

// Cancel any in-flight camera tween (fly, fit, zoom step). m3 calls this on
// pointerdown so a user drag always wins instantly; safe to call when idle.
function cameraCancel(){
  _camGen++;
  GlobeState._fly=false;
}

// (geoAngularSep cut at v0.8.0 with fitGlobeToSites — its only caller.)

// Generalized fly-to: rotate the globe so (lat,lon) faces the viewer and zoom in.
// onArrive (optional) runs when the animation completes (not when cancelled).
// v21.1.0 CINEMATIC flight, ported intact: duration scales with angular distance
// (short hops stay quick, cross-globe travel gets time to read), and long hops
// (>~30°) get a van Wijk-style zoom dip — the camera pulls back mid-flight then
// descends onto the target. Every camera jump in the app routes through here.
function flyToLatLon(lat, lon, zoom, onArrive){
  GlobeState.spin=false; GlobeState._gliding=false;
  const gen=++_camGen;                       // starting a fly cancels any prior tween (deviations 1–2)
  GlobeState._fly=true;
  const startYaw=GlobeState.yaw||0, startPitch=GlobeState.pitch||0, startZ=GlobeState.zoom;
  // Target yaw/pitch that centers (lon,lat) — same convention as _faceLonLatAngles.
  const lim=Math.PI/2-0.001;
  let tgtYaw=(lon-90)*Math.PI/180;
  let tgtPitch=Math.max(-lim,Math.min(lim, lat*Math.PI/180));
  const tgtZ=(zoom!=null?zoom:GlobeState.zoom);
  // take the shortest way around for yaw (wrap to ±π)
  let dYaw=tgtYaw-startYaw;
  dYaw=((dYaw+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI;
  const dist=Math.max(Math.abs(dYaw), Math.abs(tgtPitch-startPitch));
  const dur=550+500*Math.min(1, dist/Math.PI);
  const dip=(dist>0.52)?Math.min(startZ,tgtZ)*0.22:0;
  const t0=performance.now();
  function ease(p){ return p<0.5?2*p*p:1-Math.pow(-2*p+2,2)/2; }
  function step(now){
    if(gen!==_camGen) return;                                    // cancelled (deviation 1)
    if(GlobeState.dragging || GlobeState._pinching){ cameraCancel(); return; }   // user wins
    let p=Math.min(1,(now-t0)/dur); const e=ease(p);
    GlobeState.yaw   = startYaw + dYaw*e;
    GlobeState.pitch = startPitch + (tgtPitch-startPitch)*e;
    GlobeState.zoom  = Math.max(1.05, startZ + (tgtZ-startZ)*e - dip*Math.sin(e*Math.PI));
    _rebuildGlobeQ();
    globeMark();
    if(p<1) requestAnimationFrame(step);
    else{ GlobeState.zoom=tgtZ; GlobeState._fly=false; globeMark(); if(onArrive) onArrive(); }
  }
  requestAnimationFrame(step);
}

// ---- SITES index (parent pointer is the ONLY relationship) ---------------------
let _siteIdx=null, _kidIdx=null, _idxSrc=null;

function _sitesArr(){
  return (typeof SITES!=='undefined' && SITES && SITES.length!=null) ? SITES : [];
}

function _siteIndex(){
  const arr=_sitesArr();
  if(_idxSrc===arr && _siteIdx) return _siteIdx;
  _siteIdx=new Map(); _kidIdx=new Map();
  for(const s of arr){ if(s && s.id!=null) _siteIdx.set(s.id, s); }
  for(const s of arr){
    if(!s || s.parent==null || !_siteIdx.has(s.parent)) continue;
    let L=_kidIdx.get(s.parent); if(!L){ L=[]; _kidIdx.set(s.parent, L); }
    L.push(s);
  }
  _idxSrc=arr;
  return _siteIdx;
}

function siteById(id){ if(id==null) return null; return _siteIndex().get(id)||null; }

  if(m){ const h=m[1]; return parseInt(h.slice(0,2),16)+','+parseInt(h.slice(2,4),16)+','+parseInt(h.slice(4,6),16); }

  if(m) return Math.round(+m[1])+','+Math.round(+m[2])+','+Math.round(+m[3]);
  return fb;
}

function _mTok(){
  const root=(typeof document!=='undefined')?document.documentElement:null;
  const th=root?(root.getAttribute('data-app-theme')||'lumen'):'lumen';
  if(_mTokCache && _mTokTheme===th) return _mTokCache;
  let rd=function(){ return ''; };
  try{ if(root){ const cs=getComputedStyle(root); rd=function(n){ return (cs.getPropertyValue(n)||'').trim(); }; } }catch(_){}
  const T={};
  // A-ORG-1's literal palette survives as the fallback triples, so the layer still
  // reads if a token is missing (harness stubs, boot order).
  T.text   = _cssRGB(rd('--text'),   '234,248,255');   // dots + labels (ice-white family)
  T.dim    = _cssRGB(rd('--dim'),    '155,140,255');   // guard family (was #9b8cff)
  T.accent = _cssRGB(rd('--accent'), '54,182,255');    // selection + child web (doctrine blue)
  T.signal = _cssRGB(rd('--signal'), '255,217,130');   // lineage gold + oib amber family
  T.ground = _cssRGB(rd('--ground'), '9,17,16');       // glass interiors, label outlines
  T.body   = rd('--body') || '-apple-system,system-ui,sans-serif';
  // world paint (the canvas globe reads the theme too — owner directive 19 Aug:
  // the radar look is retired; glow mode survives only as a token, off by default)
  T.oceanHi = rd('--ocean-hi') || '#0f1d1a';
  T.oceanLo = rd('--ocean-lo') || '#091110';
  T.land    = _cssRGB('rgb('+(rd('--land')||'')+')', null) || (rd('--land')||'').trim() || '64,178,152';
  T.coast   = (rd('--coast')||'').trim() || T.accent;
  T.glow    = (rd('--world-glow')||'0').trim()==='1';
  _mTokCache=T; _mTokTheme=th;
  return T;
}

// ---- Selection → arc sets (PORT of _syncSelArcs, adapted per deviation 1) ------
function _syncSelArcs(selId){
  try{
    GlobeState._selUp=null; GlobeState._selDown=null;
    GlobeState._cmdSites=null; GlobeState._selKidOrg=null; GlobeState._relList=null;
    GlobeState._selSiteName=null;
    if(selId==null){
      GlobeState._hqArc=null; GlobeState._cmdLinkArcs=null;
      if(typeof globeMark==='function') globeMark();
      return;
    }
    const s=siteById(selId);
    if(!s || s.lat==null || s.lon==null){
      GlobeState._hqArc=null; GlobeState._cmdLinkArcs=null;
      if(typeof globeMark==='function') globeMark();
      return;
    }
    // v0.11.0: the A-ORG-1 ORG TREE is the structure. The selected site's org
    // (GlobeState.selOrg — its primary unless a specific org was picked) drives
    // both directions; every org hop renders at its effective site.
    const og=(GlobeState.selOrg && typeof orgOf==='function') ? orgOf(GlobeState.selOrg) : null;
    const up=[]; const upSet=new Set();
    const down=[]; const downSet=new Set();
    // v0.27.1 (owner recording: "ATEC starts showing as the HQ"): each chain site
    // is labeled with the org THE CHAIN put there — the selected org at the focus,
    // the parent org at the up-hop, the child org at each subordinate site. The
    // site's own unit string (e.g. Aberdeen's "ATEC") never speaks for a selection.
    const nameBy={}; nameBy[selId]=og?og.name:s.base;
    if(og){
      // UP (v0.18.0): ONE line to the nearest NON-category located ancestor — the
      // real parent. The full lineage lives in the details sheet; the map shows a
      // single level up so a selection never becomes a lineage tangle.
      for(const p of ogChainUp(og.id)){
        if(typeof _OG_CATS!=='undefined' && _OG_CATS[p.id]) continue;   // grouping shell — not a real parent
        const sid=ogEffSite(p.id); if(!sid) continue;
        const ps=siteById(sid); if(!ps || ps.lat==null) continue;
        upSet.add(ps.id);
        if(nameBy[ps.id]==null && ps.id!==selId) nameBy[ps.id]=p.name;
        if(sid!==s.id && !(ps.lat===s.lat && ps.lon===s.lon)){
          up.push({ from:{lon:s.lon, lat:s.lat, n:s.id}, to:{lon:ps.lon, lat:ps.lat, n:ps.id}, rel:'parent' });
        }
        break;                                            // one hop only
      }
      // DOWN (v0.18.0): DIRECT subordinate orgs — the "L2" you drill INTO. Each
      // renders at its site; _selKidOrg maps site → the exact child org so a
      // dot-tap descends one level (see tapAtScreen), never the whole subtree.
      const seenKid=new Set(); const kidOrg={}; const relList=[];
      for(const c of ogKids(og.id)){
        const sid=ogEffSite(c.id); if(!sid || seenKid.has(sid)) continue;
        seenKid.add(sid);
        const cs=siteById(sid); if(!cs || cs.lat==null) continue;
        downSet.add(cs.id);
        if(cs.id!==s.id && kidOrg[cs.id]==null) kidOrg[cs.id]=c.id;   // never map the focus onto itself
        if(nameBy[cs.id]==null && cs.id!==selId) nameBy[cs.id]=c.name;
        if(cs.lat===s.lat && cs.lon===s.lon) continue;    // co-located: dot highlights, no arc
        down.push({ from:{lon:s.lon, lat:s.lat, n:s.id}, to:{lon:cs.lon, lat:cs.lat, n:cs.id}, rel:'subordinate' });
        relList.push({ name:c.name, orgId:c.id, siteId:cs.id });   // index-aligned to the down arc, for the 1-by-1 stepper
      }
      GlobeState._selKidOrg=kidOrg; GlobeState._relList=relList;
    }
    GlobeState._hqArc = up.length?up:null;
    GlobeState._cmdLinkArcs = down.length?down:null;
    GlobeState._selUp=upSet; GlobeState._selDown=downSet;
    const all=new Set(upSet); downSet.forEach(function(id){ all.add(id); }); all.add(selId);
    GlobeState._cmdSites=all;
    GlobeState._selSiteName=nameBy;
    if(typeof globeMark==='function') globeMark();
  }catch(_){}
}
// Lazy follow (deviation 6): the selection owner just sets GlobeState.sel + dirty.
function _selSyncCheck(){
  if(GlobeState._selSynced!==GlobeState.sel || GlobeState._selSyncSrc!==_sitesArr()
     || GlobeState._selSyncOrg!==GlobeState.selOrg){
    GlobeState._selSynced=GlobeState.sel;
    GlobeState._selSyncOrg=GlobeState.selOrg;
    GlobeState._selSyncSrc=_sitesArr();
    _syncSelArcs(GlobeState.sel);
  }
}

// ---- Great-circle arcs (PORT of drawSubtleArcs — sampling verbatim) ------------
// Lightweight arc drawer: thin, semi-transparent, glow only past alpha 0.5.
function drawSubtleArcs(ctx, m, arcs, rgb, width, alpha, arrow, dash){
  function slerpPts(aLon,aLat,bLon,bLat,segs){
    const a=lonLatToVec(aLon,aLat), b=lonLatToVec(bLon,bLat);
    let dot=a[0]*b[0]+a[1]*b[1]+a[2]*b[2]; dot=Math.max(-1,Math.min(1,dot));
    const om=Math.acos(dot); const so=Math.sin(om); const pts=[];
    for(let i=0;i<=segs;i++){ const f=i/segs; let w1,w2;
      if(so<1e-6){ w1=1-f; w2=f; } else { w1=Math.sin((1-f)*om)/so; w2=Math.sin(f*om)/so; }
      const lift=1+0.08*Math.sin(Math.PI*f);
      pts.push([ (a[0]*w1+b[0]*w2)*lift, (a[1]*w1+b[1]*w2)*lift, (a[2]*w1+b[2]*w2)*lift ]); }
    return pts;
  }
  ctx.save();
  ctx.lineWidth=(width||0.7); ctx.strokeStyle='rgba('+rgb+','+(alpha!=null?alpha:0.28)+')'; ctx.lineCap='round';
  if(dash) ctx.setLineDash(dash);   // dashed = subordinate spurs; solid = chain of command
  if((alpha||0)>0.5){ ctx.shadowColor='rgba('+rgb+',0.85)'; ctx.shadowBlur=7; }
  arcs.forEach(arc=>{
    const pts=slerpPts(arc.from.lon,arc.from.lat, arc.to.lon,arc.to.lat, 40);
    let s=false; ctx.beginPath();
    let lastV=null, prevV=null;
    for(let i=0;i<pts.length;i++){ const v=_projectVec(pts[i], m); const front=v[2]>=-0.02;
      if(front){ if(!s){ ctx.moveTo(v[0],v[1]); s=true; } else ctx.lineTo(v[0],v[1]); prevV=lastV; lastV=v; } else s=false; }
    ctx.stroke();
    // directional arrowhead at the target — only when the target is front-facing.
    if(arrow && lastV && prevV){
      if(_visibleLonLat(arc.to.lon, arc.to.lat)){   // same front-hemisphere math, one projection cheaper
        const ang=Math.atan2(lastV[1]-prevV[1], lastV[0]-prevV[0]), ah=6.5;
        ctx.save(); ctx.shadowBlur=0; ctx.beginPath();
        ctx.moveTo(lastV[0], lastV[1]);
        ctx.lineTo(lastV[0]-ah*Math.cos(ang-0.45), lastV[1]-ah*Math.sin(ang-0.45));
        ctx.lineTo(lastV[0]-ah*Math.cos(ang+0.45), lastV[1]-ah*Math.sin(ang+0.45));
        ctx.closePath(); ctx.fillStyle='rgba('+rgb+',0.95)'; ctx.fill(); ctx.restore();
      }
    }
  });
  ctx.restore();
}

// ---- Arc families under the dots (PORT of drawGlobeLinks) ----------------------
function drawGlobeLinks(ctx, m){
  // v0.7.0: in brief the chain connectors ARE the link layer (A-ORG-1 law:
  // non-brief arcs are skipped entirely in brief); Lines toggle gates both rooms.
  try{ if(document.body.classList.contains('brief-mode')){ drawBriefArcs(ctx, m); return; } }catch(_){}
  const T=_mTok();
  // v0.17.0 — the two families now read as DIFFERENT things (owner: the lines
  // were illegible / meaningless). SUBORDINATES = dashed, dim, thin yellow spurs
  // fanning OUT to each direct command. REPORTS-TO = one solid, bright orange
  // line UP to the parent, with an arrowhead. The callout spells both out in words.
  // v0.21.0 — connections are OFF until the user asks (owner: don't auto-populate).

  if(GlobeState._showSubs && GlobeState._cmdLinkArcs && GlobeState._cmdLinkArcs.length){

}

// ---- Chrome exclusion zones (PORT of _gChromeZones — A-ORG-2 shell ids, dev. 4) ----
function _gChromeZones(m){
  const W=(m&&m.w)||800, H=(m&&m.h)||600;
  try{
    const cv=(typeof document!=='undefined') && document.getElementById && document.getElementById('globeCanvas');
    const cr=(cv && cv.getBoundingClientRect) ? cv.getBoundingClientRect() : null;
    if(cr && cr.width>0 && cr.height>0){
      const kx=W/cr.width, ky=H/cr.height, live=[], PAD=4;
      const sels=['#searchPill','#searchResults','#dossier','#titleBar',
                  '#clockTL','#clockTR','#navGlobe',
                  '#calloutCard','#briefStage','#navRow'];   // v0.29.0 audit: canvas text must never ghost under glass
      for(const s of sels){
        const el=document.querySelector(s); if(!el) continue;
        const cs=getComputedStyle(el); if(cs.display==='none'||cs.visibility==='hidden') continue;
        const r=el.getBoundingClientRect(); if(!r.width||!r.height) continue;
        const x0=(r.left-cr.left)*kx-PAD, y0=(r.top-cr.top)*ky-PAD;
        const x1=(r.right-cr.left)*kx+PAD, y1=(r.bottom-cr.top)*ky+PAD;
        if(x1<0||y1<0||x0>W||y0>H) continue;
        live.push({x0:x0, y0:y0, x1:x1, y1:y1});
      }
      return live;
    }
  }catch(_){}
  return [];   // stubbed-DOM runs (harness): no chrome, no zones
}

// ---- Label placement (PORT of _placeGlobeLabel — verbatim) ---------------------
function _placeGlobeLabel(ctx, sx, sy, w, m, rects, opts){
  opts=opts||{};
  const W=(m&&m.w)||800, H=(m&&m.h)||600;
  const gap=opts.gap!=null?opts.gap:8, h=opts.h!=null?opts.h:13;
  const L=6, R=W-6, T=6, B=H-6;
  const chrome=(GlobeState.__gChrome||(GlobeState.__gChrome=_gChromeZones(m)));
  let ax;
  if(opts.center){ ax=sx-w/2; } else { ax=sx+gap; if(ax+w>R) ax=sx-gap-w; }
  const ys = opts.above ? [sy, sy-16, sy-32, sy+18, sy-48, sy+34]
                        : [sy+4, sy-15, sy+19, sy-30, sy+34, sy-45];
  for(const cy of ys){
    const x=Math.max(L, Math.min(ax, R-w));
    const y=Math.max(T+h, Math.min(cy, B));
    const bx={x0:x-2, y0:y-h+2, x1:x+w+2, y1:y+3};
    // a label that cannot fit inside the canvas at either anchor — or that the edge
    // clamp dragged onto its own marker — is skipped (dot-only)
    let hit=(bx.x1>R+2 || bx.x0<L-2 || Math.abs(x-ax)>4);
    // v0.31.0 force: the stepped subordinate's name may not be collision-culled
    // (it is the one name the step exists to show) — chrome + edges still bind.
    if(!hit && !opts.force) for(const b of rects){ if(bx.x0<b.x1&&bx.x1>b.x0&&bx.y0<b.y1&&bx.y1>b.y0){ hit=true; break; } }
    if(!hit) for(const c of chrome){ if(bx.x0<c.x1&&bx.x1>c.x0&&bx.y0<c.y1&&bx.y1>c.y0){ hit=true; break; } }
    if(!hit){ rects.push(bx); return {x,y}; }
  }
  return null;
}

// ---- The dot loop (PORT of drawGlobeMarkers) ------------------------------------
function drawGlobeMarkers(ctx, m){
  const T=_mTok();
  GlobeState._screen=[];                              // hit-test cache, rebuilt per draw
  GlobeState.__gLbl=[]; GlobeState.__gChrome=null;    // shared label rects + chrome zones, per frame
  const tnow=performance.now()/1000;
  const selId=GlobeState.sel;
  const upSet=GlobeState._selUp, downSet=GlobeState._selDown;
  const cmdSites=GlobeState._cmdSites;
  const zb=Math.min(2.4, 1 + (GlobeState.zoom-1)*0.14);   // dots grow a little as you zoom in
  const rScale=Math.min(2.1, 0.85+zb*0.16);
  const bodyFont=T.body;
  // v0.7.0 REVERSAL (A-ORG-1 L17488 law): brief mode hands the full-screen globe
  // to the chain renderer — only the brief structures draw; everything else waits
  // in map mode. Dots toggle silences the map reticles (and their hit-tests).
  let briefOn=false; try{ briefOn=document.body.classList.contains('brief-mode'); }catch(_){}
  if(briefOn){ drawBriefNodes(ctx, m); return; }
  // Dots toggle: markers, badges and their hit-tests go quiet; the selection's
  // chain labels stay (Names owns text). A dot that isn't drawn can't be tapped.
  const dotsOff=!!GlobeState._dotsOff;

  for(const inst of _sitesArr()){
    if(inst.lat==null||inst.lon==null) continue;
    const p=_projectLonLat(inst.lon, inst.lat, m);
    if(p[2]<0) continue;
    const sx=p[0], sy=p[1];
    const fade=Math.max(0.3, p[2]);
    const isSel=(selId!=null && inst.id===selId);
    const isUp=!!(upSet && upSet.has(inst.id));
    const isDown=!!(downSet && downSet.has(inst.id));
    const onChain=isSel||isUp||isDown;
    const cls=clsOf(inst.id);
    const isGuard=(cls==='guard');
    // v0.24.0 ISOLATE (owner: "when an organization is selected, only populate the
    // selected organization and their connections — hide all other ones"). With an
    // ORG driving the map, everything off its chain leaves the picture entirely.
    if(GlobeState.selOrg && !onChain) continue;
    // class filter (legend): chain members stay — the picture outranks the layers
    if(!onChain && _famOffSet().has(cls)) continue;
    // CLUSTERS (A-ORG-1 §3.4, gate 1.6 · 44px grid): at world zoom, ordinary
    // sites divert into count badges; the badge pass draws after this loop.
    if(GlobeState.zoom<1.6 && !onChain){
      if(!dotsOff){
        (GlobeState._clu||(GlobeState._clu=[])).push({x:sx, y:sy, lat:inst.lat, lon:inst.lon, c:(CLS_META[cls]||CLS_META.base).c});
        GlobeState._screen.push({inst, sx, sy, depth:p[2]});
      }
      continue;
    }
    const col=(isSel||isDown) ? T.accent : (isUp ? T.signal : (CLS_META[cls]||CLS_META.base).c);
    const zb2=Math.min(2.1, 0.85+zb*0.16);
    const dotR=((isSel?3.6:(onChain?3.0:(cls==='hq'?3.4:(isGuard?2.0:2.5)))))*zb2;
    const rr=dotR*1.16;

    if(isSel && !dotsOff){
      // A-ORG-1's breathing diamond + compass spokes — the selected org owns the map
      const d=7.5+Math.sin(tnow*2.4)*0.8;
      ctx.save(); ctx.translate(sx,sy); ctx.rotate(Math.PI/4);
      ctx.strokeStyle='rgba('+T.accent+','+(0.95*fade)+')'; ctx.lineWidth=1.8;
      ctx.strokeRect(-d,-d,d*2,d*2); ctx.rotate(-Math.PI/4);
      ctx.beginPath();
      ctx.moveTo(-d-4,0); ctx.lineTo(-d+1,0); ctx.moveTo(d-1,0); ctx.lineTo(d+4,0);
      ctx.moveTo(0,-d-4); ctx.lineTo(0,-d+1); ctx.moveTo(0,d-1); ctx.lineTo(0,d+4);
      ctx.strokeStyle='rgba('+T.accent+','+(0.8*fade)+')'; ctx.lineWidth=1.3; ctx.stroke();
      ctx.restore();
    }

    // GLASS RETICLE, SHARP (A-ORG-1 recipe, halo deleted per owner: dark interior
    // disc + one thin ring + bright core; HQ adds one concentric ring; no glow,
    // no shadowBlur — ~270 markers must hold phone frames).
    if(!dotsOff){
      ctx.globalAlpha=fade*(isGuard&&!onChain?0.8:1);
      ctx.beginPath(); ctx.arc(sx, sy, rr, 0, Math.PI*2);
      ctx.fillStyle='rgba(8,7,4,.85)'; ctx.fill();
      ctx.lineWidth=onChain?1.6:1.25; ctx.strokeStyle='rgb('+col+')'; ctx.stroke();
      ctx.beginPath(); ctx.arc(sx, sy, Math.max(0.9, rr*0.34), 0, Math.PI*2);
      ctx.fillStyle='rgb('+col+')'; ctx.fill();
      if(cls==='hq' && !isSel){
        ctx.lineWidth=1.1; ctx.strokeStyle='rgb('+col+')'; ctx.globalAlpha=0.9*fade;
        ctx.beginPath(); ctx.arc(sx, sy, rr+2.8, 0, Math.PI*2); ctx.stroke();
      }
      ctx.globalAlpha=1;
    }

    // chain-member labels draw at ANY zoom AND through the Names/USACE toggles —
    // a selected command string keeps its names (v0.12.0 owner directive).
    // v0.31.0 NAMES AS SELECTED (owner recording, AMC 2/7 · TACOM), refined
    // v0.32.0 (owner: "for Show all connections you can have each name populate;
    // when you click through 1 by 1 just populate the specific name"):
    //   plain selection → only the selected site's name;
    //   Connect ALL     → every connection end names itself (the overview);
    //   stepping        → ONLY the stepped target's name, force-placed;
    //   HQ line on      → its far end names itself too.
    if(onChain){
      const _rl=GlobeState._relList;
      const _stpSite=(GlobeState._showSubs&&GlobeState._relStep!=null&&GlobeState._relStep>=0&&_rl&&_rl[GlobeState._relStep])?_rl[GlobeState._relStep].siteId:null;
      const _isStep=(_stpSite!=null&&inst.id===_stpSite);
      const _allView=(GlobeState._showSubs && _stpSite==null);
      const _named=!GlobeState.selOrg || isSel || _isStep || (_allView&&isDown) || (GlobeState._showHQ&&isUp);
      if(_named){
      // v0.27.1: the chain map names each site by the org the chain put there
      // (selected org / parent / child); a site's default unit string never
      // mislabels a selection ("ATEC" over a DEVCOM pick, the owner's recording).
      let _nm=(GlobeState._selSiteName&&GlobeState._selSiteName[inst.id])||inst.base||inst.id;
      const _fs=(m.w<560?12:11);
      ctx.save();
      ctx.textBaseline='middle';
      ctx.font='800 '+_fs+'px '+bodyFont;
      let _tw=ctx.measureText(_nm).width;
      let _pos=_placeGlobeLabel(ctx, sx, sy, _tw, m, GlobeState.__gLbl, {gap:dotR+7, h:14, force:_isStep});
      // v0.31.0: a STEPPED name may not silently vanish — when the full title
      // cannot fit beside its dot (ARL's 30-char name on a phone: neither anchor
      // clears the edges), fall back to the short form the stepper line uses.
      if(!_pos && _isStep && typeof _bfAbbr==='function'){
        const _ab=_bfAbbr(_nm);
        if(_ab && _ab!==_nm){ _nm=_ab; _tw=ctx.measureText(_nm).width;
          _pos=_placeGlobeLabel(ctx, sx, sy, _tw, m, GlobeState.__gLbl, {gap:dotR+7, h:14, force:true}); }
      }
      if(_pos){
        ctx.lineWidth=(_fs>11?3.6:3.2); ctx.strokeStyle='rgba('+T.ground+',.9)'; ctx.strokeText(_nm, _pos.x, _pos.y);
        ctx.fillStyle='rgba('+col+',1)'; ctx.fillText(_nm, _pos.x, _pos.y);
      }
      ctx.restore();
      }
    }

    if(!dotsOff) GlobeState._screen.push({inst, sx, sy, depth:p[2]});
  }

  // Tiny labels for the rest, zoom-gated (keeps world view clean).
  if(GlobeState.zoom >= 1.5 && !GlobeState._namesOff){
    ctx.save();
    try{ ctx.letterSpacing='0.35px'; }catch(_){}
    ctx.textBaseline='middle';
    // PRIORITY CULLING: placement is first-come-first-served on collision cells, so
    // iterate a priority-sorted copy — chain picture, then roots, depots, bases, guard.
    const _hostCmd=(typeof _ogBuild==='function')?(_ogBuild().hostsCmd||new Set()):new Set();
    const _lblPr=function(s){ const i=s.inst;
      if(cmdSites && cmdSites.has(i.id)) return 0;
      if(_hostCmd.has(i.id)) return 1;                     // hosts a command (lvl≤3 org)
      if(i.grp==='oib') return 2;
      if(clsOf(i.id)==='guard'||String(i.grp||'').split('|')[0]==='guardInset') return 4;
      return 3; };
    const _lblQ=Array.from(GlobeState._screen).sort(function(a,b){ return _lblPr(a)-_lblPr(b); });
    // v0.22.0 — HARD CAP on labels (owner: "flooded with names overlapping"). The
    // queue is priority-sorted (chain → hosts-command → HQ → base → guard), so the
    // cap keeps the meaningful few and drops the crowd. A selection earns a few more.
    const _lblCap=GlobeState.sel?(m.w<700?18:30):(m.w<700?13:22); let _lblN=0;
    for(const s of _lblQ){
      if(_lblN>=_lblCap) break;
      const inst=s.inst;
      if(GlobeState.selOrg && !(cmdSites && cmdSites.has(inst.id))) continue;   // v0.24.0: isolated picture, isolated names

      if(GlobeState._usaceOff && clsOf(inst.id)==='usace') continue;   // USACE names toggled off

      if(cmdSites && cmdSites.has(inst.id)) continue; // chain labels already drew in the dot loop
      // ZOOM LADDER (v0.10.0 tune — owner: COCOM labels crowded CONUS): density
      // arrives BY ECHELON as the room for it does — roots first, then HQs,
      // depots, bases, insets; phones climb 0.7 later (less room per name).
      const _mzb=(m.w<700)?0.7:0;
      const _cls=clsOf(inst.id);
      const _need=(_hostCmd.has(inst.id)?2.4:(_cls==='hq'?2.6:(_cls==='depot'?3.2:(String(inst.grp||'').split('|')[0]==='guardInset'?4.2:3.8))))+_mzb;
      if(GlobeState.zoom < _need) continue;
      if(s.sx<1||s.sx>m.w-1||s.sy<1||s.sy>m.h-1) continue;   // off-map dot — don't orphan its label
      ctx.font='600 9.5px '+bodyFont;
      const name=inst.base||inst.id;
      const tw=ctx.measureText(name).width;

      ctx.lineWidth=2.2; ctx.strokeStyle='rgba('+T.ground+',.78)'; ctx.strokeText(name, _pl.x, _pl.y);
      ctx.shadowBlur=0; ctx.shadowOffsetY=0;
      ctx.fillStyle='rgba('+(clsOf(inst.id)==='depot'?T.signal:T.text)+',.92)'; ctx.fillText(name, _pl.x, _pl.y);
      _lblN++;

}

// ---- CLUSTER BADGES (A-ORG-1 §3.4, single-pass port): 44px screen grid,
// active below zoom 1.6; badge = glass disc + accent ring + halo ring + reticle
// ticks + count. Tap eases past the gate at the badge's centroid. ------------
function drawClusters(ctx, m){
  const T=_mTok();
  if(GlobeState.zoom>=1.6 || !GlobeState._clu || !GlobeState._clu.length){ GlobeState._cluHits=null; GlobeState._clu=null; return; }
  const gm=new Map();
  for(const c of GlobeState._clu){
    const k=((c.x/44)|0)+':'+((c.y/44)|0);
    let g=gm.get(k); if(!g){ g={x:0,y:0,la:0,lo:0,n:0,mem:[]}; gm.set(k,g); }
    g.x+=c.x; g.y+=c.y; g.la+=c.lat; g.lo+=c.lon; g.n++; g.c=c.c;
    g.mem.push({lat:c.lat, lon:c.lon});
  }
  // v0.30.0 (audit #19): grid cells whose badges would overlap MERGE — one badge,
  // one honest count, instead of "2" printed over "21".
  let cells=[]; gm.forEach(function(g){ cells.push(g); });
  let merged=true, guard=0;
  while(merged && ++guard<24){
    merged=false;
    outer: for(let a2=0;a2<cells.length;a2++){
      for(let b2=a2+1;b2<cells.length;b2++){
        const A=cells[a2], B=cells[b2];
        const ra=(A.n>1)?Math.min(15,7+Math.log2(A.n)*2.6)+4:3, rb=(B.n>1)?Math.min(15,7+Math.log2(B.n)*2.6)+4:3;
        const dx=A.x/A.n-B.x/B.n, dy=A.y/A.n-B.y/B.n;
        if(dx*dx+dy*dy < (ra+rb)*(ra+rb)){
          A.x+=B.x; A.y+=B.y; A.la+=B.la; A.lo+=B.lo; A.n+=B.n;
          A.mem=(A.mem||[]).concat(B.mem||[]);
          cells.splice(b2,1); merged=true; break outer;
        }
      }
    }
  }
  GlobeState._cluHits=[];
  ctx.save(); ctx.textAlign='center'; ctx.textBaseline='middle';
  cells.forEach(function(g){
    let cx=g.x/g.n, cy=g.y/g.n;
    if(g.n===1){
      ctx.beginPath(); ctx.arc(cx,cy,2.2,0,Math.PI*2);
      ctx.fillStyle='rgb('+(g.c||T.accent)+')'; ctx.globalAlpha=.85; ctx.fill(); ctx.globalAlpha=1;
      return;
    }
    const r=Math.min(15, 7+Math.log2(g.n)*2.6);
    // v0.31.0 (re-verify): a limb badge half off the screen edge is unreadable and
    // barely tappable — clamp the whole disc inside the frame (hits use it too)
    const _bE=r+8; cx=Math.max(_bE, Math.min(m.w-_bE, cx)); cy=Math.max(_bE, Math.min(m.h-_bE, cy));
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
    ctx.fillStyle='rgba(8,7,4,.66)'; ctx.fill();
    ctx.strokeStyle='rgba('+T.accent+',.85)'; ctx.lineWidth=1.4; ctx.stroke();
    ctx.beginPath(); ctx.arc(cx,cy,r+3.5,0,Math.PI*2);
    ctx.strokeStyle='rgba('+T.accent+',.28)'; ctx.lineWidth=1; ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx-r-7,cy); ctx.lineTo(cx-r-2,cy); ctx.moveTo(cx+r+2,cy); ctx.lineTo(cx+r+7,cy);
    ctx.moveTo(cx,cy-r-7); ctx.lineTo(cx,cy-r-2); ctx.moveTo(cx,cy+r+2); ctx.lineTo(cx,cy+r+7);
    ctx.strokeStyle='rgba('+T.accent+',.5)'; ctx.lineWidth=1; ctx.stroke();
    ctx.fillStyle='rgba('+T.text+',.95)';
    ctx.font='700 9px '+T.body;
    ctx.fillText(String(g.n), cx, cy+0.5);
    GlobeState._cluHits.push({x:cx, y:cy, r:r+8, lat:g.la/g.n, lon:g.lo/g.n, mem:g.mem||null});
  });
  ctx.restore(); GlobeState._clu=null;
}

// ═══ THE BRIEF ON THE GLOBE (v0.7.0 owner reversal) — the chain is BUILT on the
// sphere: white dots wearing tier rings, tier-colored great-circle connectors,
// tier-colored labels. The chart card only supplements this picture.
// (A-ORG-1 recipe, consult 6: dot spec L17589, arcs L16849, streams L21656 —
// stream families re-keyed to the Lumen tier law: L2 cools NEVER green.) ────────
const BF_STREAMS={

  3:['255,201,92','255,150,50','255,120,80','255,190,110'],
  4:['255,143,192','230,70,160','255,120,150'],

// short label for chain nodes + chart chips: '(WSMR)' captures beat everything;
// else standard military short forms (Inf · Abn · Bde · Cmd …) beat truncation.
const _BF_SHORT={Infantry:'Inf',Armored:'Armd',Airborne:'Abn',Division:'Div',Brigade:'Bde',
  Battalion:'Bn',Command:'Cmd',Support:'Spt',Mountain:'Mtn',Military:'Mil',Theater:'Thtr',
  Mission:'Msn',Regiment:'Regt',Artillery:'Arty',Medical:'Med',Cavalry:'Cav',Intelligence:'Intel',

// v1.4.1 — an owner-named object (group or place) shows the name it was

// keep abbreviating (their official names are long by nature).
function _bfNodeLbl(nd){ return (nd && nd.t==='custom') ? String(nd.n||'') : _bfAbbr(nd?nd.n:''); }
function _bfAbbr(name){
  const s=String(name||'');
  const p=s.match(/\(([A-Za-z0-9&\- ]{2,10})\)/); if(p) return p[1];
  const cap=s.split(/\s+/).find(function(w){ return w.length>=2&&w.length<=7&&w===w.toUpperCase()&&/[A-Z]/.test(w); });
  if(cap) return cap.replace(/[.,]$/,'');
  const short=s.split(/\s+/).map(function(w){ return _BF_SHORT[w]||w; }).join(' ');
  return short.length>18 ? short.slice(0,17)+'…' : short;
}
// v1.5.2 CO-LOCATED CALLOUT (owner: two small lines pointing to the location,
// each labeled RSN / ECCSP, showing they are collocated). Labels inside one
// fan cluster shed their shared leading words — the leader line says WHERE,
// the label says WHICH. Class-wide, not Bragg-specific: any cluster whose
// labels share a word prefix shortens; a member whose remainder would be
// empty keeps its full label; unrelated labels pass through untouched. The
// v1.4.1 verbatim-name law still governs solo placement — only a cluster,
// where the spot itself carries the shared name, sheds the prefix.
function _bfFanShort(lbls){
  if(!lbls || lbls.length<2) return (lbls||[]).slice();
  const w=lbls.map(function(s){ return String(s).trim().split(/\s+/); });
  let pre=0;
  for(;;){
    const t=w[0][pre]; if(t==null) break;
    let all=true;
    for(let i=1;i<w.length;i++){ if(w[i][pre]!==t){ all=false; break; } }
    if(!all) break;
    pre++;
  }
  if(!pre) return lbls.slice();
  return lbls.map(function(s,i){ const r=w[i].slice(pre).join(' '); return r||s; });
}
// v1.6.0 ILLUMINATED STARS (owner: "use illuminated star for RSNs instead of
// dots — same for ECCSPs but a different color; all RSNs same color, all
// ECCSPs same color"). Class colors, deliberately OUTSIDE the tier streams
// and never green (brief-data law): RSN = ice, ECCSP = orchid — both read
// against the gold basemap and the black globe, and against each other.
const BF_STAR={rsn:'#6FE3FF', eccsp:'#FF7BD9'};
function _bfStarKind(n){
  if(!n || (n.kind||n.t)!=='custom') return null;
  const s=String(n.name||n.n||'');
  if(/\sRSN$/.test(s)) return 'rsn';
  if(/\sECCSP$/.test(s)) return 'eccsp';
  return null;
}
// v0.13.0 THE HAND-BUILT BRIEF (owner directive: no auto-subtrees, EVER — the
// v0.11.0 walker dumped whole A-ORG-1 commands onto the globe). The chain map
// now renders ONLY orgs the owner explicitly added (BRIEF.mem). Levels are
// DERIVED: an added org nests under its nearest added ancestor in the tree
// (L1 = no added ancestor). opts.all ignores the view filters (group eyes +
// echelon depth) — the chart and exports see everything; the globe sees the
// filtered picture.
function _bfParentOf(id){
  const c=(typeof orgById==='function')?orgById(id):null; if(c) return c.parent;
  const t=(typeof orgOf==='function')?orgOf(id):null; return t?t.parent:null;
}
// v0.24.0 — reads the STORED tree. Structure is whatever the owner built: each
// node's own p is the edge, so a node can sit anywhere regardless of the real
// Army chain. Levels/roots/colors are computed from that stored shape.
function _briefChainMap(opts){
  const out={nodes:{}, order:[]};
  if(typeof BRIEF==='undefined' || !BRIEF.nodes || !BRIEF.nodes.length) return out;
  const all=!!(opts&&opts.all);
  const hid=new Set(BRIEF.hide||[]);
  const depth=all?4:(GlobeState._bfDepth||4);
  const byK={}; BRIEF.nodes.forEach(function(n){ byK[n.k]=n; });
  const lvlOf=function(k){ let l=1,c=byK[k]?byK[k].p:null,g=0; while(c!=null&&byK[c]&&++g<60){ l++; c=byK[c].p; } return l; };
  const rootOf=function(k){ let c=k,g=0; while(byK[c]&&byK[c].p!=null&&byK[byK[c].p]&&++g<60){ c=byK[c].p; } return c; };
  const tierN={1:0,2:0,3:0,4:0};
  BRIEF.nodes.forEach(function(nd){
    const lvl=lvlOf(nd.k), root=rootOf(nd.k), tier=Math.min(4,lvl);
    if(!all && (hid.has(root) || lvl>depth)) return;
    let lat=null, lon=null;
    if(nd.t==='custom' && nd.la!=null){ lat=nd.la; lon=nd.lo; }   // v1.4.0: a PLACE pins its own spot
    else if(nd.t==='state'){
      const st=(typeof US_STATES!=='undefined')?US_STATES.find(function(s){ return s.n===nd.r; }):null;
      if(st){ lat=st.lat; lon=st.lon; }
    } else if(nd.t==='org'){

      if(c){ const b=c.base?siteById(c.base):null; if(b){ lat=b.lat; lon=b.lon; } }
      else { const hs=siteById(ogEffSite(nd.r)||''); if(hs){ lat=hs.lat; lon=hs.lon; } }
    }
    const fam=BF_STREAMS[tier];
    out.nodes[nd.k]={id:nd.k, tier:tier, lvl:lvl, shade:fam[tierN[tier]++ % fam.length],
      parent:(nd.p&&byK[nd.p])?nd.p:null, root:root, lat:lat, lon:lon, name:nd.n,
      kind:nd.t, ref:nd.r, color:nd.c||'', stripe:!!nd.sh, note:nd.tx||'', bs:nd.bs||'', pinned:(nd.la!=null),
      // "custom" stays what it always meant — NOT a stock A1ORGS record: a
      // free-text box, or an org the owner created. Chart order still favours them.
      custom:(nd.t==='custom') || (nd.t==='org' && typeof orgById==='function' && !!orgById(nd.r))};
    out.order.push(nd.k);
  });
  out.order.forEach(function(k){ const n=out.nodes[k];
    // a node with no place of its own (custom box) rides its parent's coordinates
    if(n.lat==null && n.parent && out.nodes[n.parent]){ n.lat=out.nodes[n.parent].lat; n.lon=out.nodes[n.parent].lon; }
    if(n.parent && !out.nodes[n.parent]) n.parent=null;   // filtered-out parent: no dangling arc
  });
  // v0.20.0 FOCUS: the globe/chart show only the focused branch — lineage up +
  // every descendant down; everything else drops.
  if(!all && GlobeState._bfFocus && out.nodes[GlobeState._bfFocus]){
    const f=GlobeState._bfFocus, keep=new Set(); let c=f,g=0;
    while(c!=null && g++<60){ keep.add(c); c=out.nodes[c]?out.nodes[c].parent:null; }
    const q=[f]; while(q.length){ const cur=q.shift(); out.order.forEach(function(k){ if(out.nodes[k].parent===cur && !keep.has(k)){ keep.add(k); q.push(k); } }); }
    out.order=out.order.filter(function(k){ return keep.has(k); });
    const kept={}; out.order.forEach(function(k){ kept[k]=out.nodes[k]; if(kept[k].parent && !keep.has(kept[k].parent)) kept[k].parent=null; });
    out.nodes=kept;
  }
  return out;
}
// v0.24.0 — STATE HIGHLIGHTS (ported from A-ORG-1's briefing ability). A brief
// node of kind 'state' paints its real polygon: a translucent wash + a bright
// outline, and — when the owner turns on STRIPED FILL — diagonal attention lines
// clipped to the shape. Two phases: fills go UNDER the arcs and dots, labels on
// top through the shared collision list so nothing overlaps.
function drawBriefStates(ctx, m, labels){
  if(!document.body.classList.contains('brief-mode')) return;
  if(typeof GLOBE_STATE_SHAPES==='undefined' || !GLOBE_STATE_SHAPES) return;
  const C=GlobeState.__bfC; if(!C || !C.order || !C.order.length) return;
  if(labels && (GlobeState._namesOff || GlobeState._bfNamesOff)) return;   // Names toggles (map + v1.5.1 brief Aa) silence state labels too
  const T=_mTok();
  for(const k of C.order){
    const n=C.nodes[k];
    if(!n || n.kind!=='state') continue;
    // color: the node's own pick, else its tier stream shade
    let trip=n.color?_hexTrip(n.color):null;
    if(!trip) trip=String(n.shade||'245,215,110').split(',');
    const R=+trip[0]||245, G=+trip[1]||215, B=+trip[2]||110;
    if(!labels){
      const shapes=GLOBE_STATE_SHAPES[n.ref];
      if(!shapes) continue;                            // geometry not in yet — label still shows
      ctx.save();
      for(const ring of shapes){
        if(!ring || ring.length<3) continue;
        let behind=false, bx0=1e9, by0=1e9, bx1=-1e9, by1=-1e9;
        ctx.beginPath();
        for(let i=0;i<ring.length;i++){
          const pt=_projectLonLat(ring[i][0], ring[i][1], m);
          if(pt[2] < -0.02){ behind=true; break; }     // ring crosses the limb — skip it
          if(pt[0]<bx0)bx0=pt[0]; if(pt[0]>bx1)bx1=pt[0];
          if(pt[1]<by0)by0=pt[1]; if(pt[1]>by1)by1=pt[1];
          if(i===0) ctx.moveTo(pt[0],pt[1]); else ctx.lineTo(pt[0],pt[1]);
        }
        if(behind) continue;
        ctx.closePath();
        // v1.6.0 (owner: "no need to put a dot in the state as well as
        // highlighting — just keep the border"): the translucent wash is gone,
        // a state/territory selection is its bright outline alone. Stripes
        // stay an explicit owner toggle.
        ctx.lineWidth=1.7; ctx.strokeStyle='rgba('+R+','+G+','+B+',0.95)'; ctx.stroke();
        if(n.stripe){
          ctx.save(); ctx.clip();
          ctx.lineWidth=1.2; ctx.strokeStyle='rgba('+R+','+G+','+B+',0.8)';
          const hh=by1-by0;
          ctx.beginPath();
          for(let hx=bx0-hh; hx<bx1; hx+=7){ ctx.moveTo(hx,by1+1); ctx.lineTo(hx+hh+2,by0-1); }
          ctx.stroke(); ctx.restore();
        }

      ctx.restore();
    } else {
      if(n.lat==null) continue;
      const pt=_projectLonLat(n.lon, n.lat, m); if(pt[2]<0) continue;
      const fs=(m.w<560?12:11);
      ctx.save();
      // v1.6.0: was `bodyFont` — a drawGlobeMarkers LOCAL, so this whole phase
      // threw a swallowed ReferenceError and state names never drew from here

      ctx.font='800 '+fs+'px '+T.body; ctx.textBaseline='middle';
      const tw=ctx.measureText(n.name).width;
      const pl=_placeGlobeLabel(ctx, pt[0], pt[1], tw, m, GlobeState.__gLbl, {h:14});
      if(pl){
        ctx.lineWidth=3.4; ctx.strokeStyle='rgba('+T.ground+',.9)'; ctx.strokeText(n.name, pl.x, pl.y);
        ctx.fillStyle='rgba('+R+','+G+','+B+',1)'; ctx.fillText(n.name, pl.x, pl.y);
      }
      ctx.restore();
    }
  }
}
function _hexTrip(hex){
  const m2=/^#([0-9a-fA-F]{2})([0-9a-fA-F]{2})([0-9a-fA-F]{2})$/.exec(String(hex||''));
  return m2?[parseInt(m2[1],16),parseInt(m2[2],16),parseInt(m2[3],16)]:null;
}
// Connectors: grouped by parent shade + child tier; per-level width/alpha
// (A-ORG-1 L16878), deepest first so bright trunks paint on top.
function drawBriefArcs(ctx, m){
  GlobeState.__bfC=_briefChainMap();                 // links draw first each frame — nodes reuse this
  try{ drawBriefStates(ctx, m, false); }catch(_){}   // v0.24.0: state washes sit UNDER the arcs and dots
  if(GlobeState._linesOff || GlobeState._bfLinesOff) return;   // v1.5.1: brief-only lines toggle
  const C=GlobeState.__bfC, groups={};
  for(const key of C.order){
    const n=C.nodes[key]; if(!n.parent||n.lat==null) continue;
    const pn=C.nodes[n.parent]; if(!pn||pn.lat==null) continue;
    if(Math.abs(pn.lat-n.lat)<1e-6 && Math.abs(pn.lon-n.lon)<1e-6) continue;   // same point: no zero arc
    const gk=pn.shade+'|'+n.tier;

    .sort(function(a,b){ return b.tier-a.tier; })
    .forEach(function(g){ drawSubtleArcs(ctx, m, g.arcs, g.shade, W[g.tier]||1.8, A[g.tier]||0.8); });

// Chain dots + labels (A-ORG-1 chain dot spec: solid white, tier ring, HQ halo
// ring; labels tier-colored over a dark halo, collision-placed).
function drawBriefNodes(ctx, m){
  const T=_mTok();

  const zb2=Math.min(2.1, 0.85+zb*0.16);
  const dotsOff=!!GlobeState._dotsOff, namesOff=!!(GlobeState._namesOff||GlobeState._bfNamesOff);   // v1.5.1: brief-only names toggle
  // v1.4.2 THE FAN (owner: "some selections get stuck over others") — objects
  // sharing one spot (JBLM RSN + JBLM ECCSP…) no longer pile on a single dot:
  // co-located nodes spread on a small screen-space ring around the true
  // point, deterministic by chain order, so every dot is visible, tappable,
  // and anchors its own label. Solo nodes sit exactly on their spot.
  const _fanN={}, _fanI={}, _fanM={};

    if(n0.kind==='custom' && !n0.pinned) continue;    // v1.9.0: GROUPS are chart-only — no globe presence at all

    const sh=_bfFanShort(full);

    if(n.kind==='custom' && !n.pinned) continue;

    const fade=Math.max(0.3, p[2]);
    const _fk=n.lat.toFixed(4)+','+n.lon.toFixed(4);
    let _fanned=false, _fanFirst=false;
    if(_fanN[_fk]>1){
      const _i=(_fanI[_fk]=(_fanI[_fk]||0)+1)-1, _c=_fanN[_fk];
      const _r=(_c===2?15:18), _a=-Math.PI/2 + _i*(Math.PI*2/_c);   // v1.5.2: ring widened so the leader line reads
      sx+=Math.cos(_a)*_r; sy+=Math.sin(_a)*_r;
      _fanned=true; _fanFirst=(_i===0);
    }
    const dotR=(n.tier===1?3.4:(n.tier===2?3.0:2.7))*zb2;
    if(!dotsOff){
      if(_fanned){
        // v1.5.2: each fanned dot draws a small leader line back to the true
        // spot, plus one shared tick AT the spot — co-location at a glance.
        ctx.globalAlpha=fade*0.85;
        ctx.beginPath(); ctx.moveTo(p[0], p[1]); ctx.lineTo(sx, sy);
        ctx.lineWidth=1.2; ctx.strokeStyle='rgba('+n.shade+',.85)'; ctx.stroke();
        if(_fanFirst){
          ctx.beginPath(); ctx.arc(p[0], p[1], 1.8, 0, Math.PI*2);
          ctx.fillStyle='rgba(255,255,255,.9)'; ctx.fill();
        }
        ctx.globalAlpha=1;
      }
      const _sk=_bfStarKind(n);
      if(_sk){
        // v1.6.0: RSN / ECCSP objects mark with an ILLUMINATED STAR in their
        // class color — glow + twin fill is the illumination, a dark keyline
        // keeps the points crisp over the gold basemap.
        const col=BF_STAR[_sk], sR=dotR+4.4;
        ctx.globalAlpha=fade;
        ctx.save();
        ctx.beginPath();
        for(let i2=0;i2<10;i2++){
          const rr=(i2%2===0)?sR:sR*0.44, aa=-Math.PI/2 + i2*(Math.PI/5);
          const qx=sx+Math.cos(aa)*rr, qy=sy+Math.sin(aa)*rr;
          if(i2===0) ctx.moveTo(qx,qy); else ctx.lineTo(qx,qy);
        }
        ctx.closePath();
        ctx.shadowColor=col; ctx.shadowBlur=13;
        ctx.fillStyle=col; ctx.fill(); ctx.fill();
        ctx.shadowBlur=0;
        ctx.lineWidth=1; ctx.strokeStyle='rgba(8,7,4,.9)'; ctx.stroke();
        ctx.restore();
      } else {
        ctx.globalAlpha=fade;
        ctx.beginPath(); ctx.arc(sx, sy, dotR, 0, Math.PI*2);
        ctx.fillStyle='#ffffff'; ctx.fill();
        ctx.lineWidth=1.0; ctx.strokeStyle='rgba(8,7,4,.9)'; ctx.stroke();
        ctx.beginPath(); ctx.arc(sx, sy, dotR+3.4, 0, Math.PI*2);
        ctx.lineWidth=(n.tier===1?2.2:1.6);
        ctx.strokeStyle='rgba('+n.shade+','+(n.tier===1?0.95:0.88)+')'; ctx.stroke();
        if(n.tier===1){
          ctx.beginPath(); ctx.arc(sx, sy, dotR+6.6, 0, Math.PI*2);
          ctx.lineWidth=1.1; ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.stroke();
        }
      }
      ctx.globalAlpha=1;
      GlobeState._screen.push({inst:{id:key, base:n.name, lat:n.lat, lon:n.lon, _bf:true}, sx:sx, sy:sy, depth:p[2]});
    }
    if(!namesOff){
      const nm=_fanS[key] || ((n.kind==='custom')?n.name:_bfAbbr(n.name));   // v1.5.2: cluster short label wins
      const fs=(m.w<560?12:11);
      ctx.save(); ctx.textBaseline='middle'; ctx.font='800 '+fs+'px '+T.body;
      const tw=ctx.measureText(nm).width;
      const pos=_placeGlobeLabel(ctx, sx, sy, tw, m, GlobeState.__gLbl, {gap:dotR+7, h:14});
      if(pos){
        ctx.lineWidth=(fs>11?3.6:3.2); ctx.strokeStyle='rgba('+T.ground+',.9)'; ctx.strokeText(nm, pos.x, pos.y);
        ctx.fillStyle='rgba('+n.shade+',1)'; ctx.fillText(nm, pos.x, pos.y);
      }
      ctx.restore();
    }
  }
}

// ---- m2 hook: links under, markers over (A-ORG-1 drawGlobe order, ~L16798) -----
function drawMarkersHook(ctx, m){
  _selSyncCheck();
  drawGlobeLinks(ctx, m);
  drawGlobeMarkers(ctx, m);

  try{ drawBriefStates(ctx, m, true); }catch(_){}    // v0.24.0: state names last — they share the label collision list
}

// ---- Tap hit-test for m3 (PORT of handleGlobeTap's best-dot loop) --------------
// Canvas-relative coords in (what tapAtScreen receives); nearest front-hemisphere
// site within 18px, else null. Tests LAST FRAME's _screen — exactly A-ORG-1.
function siteHitTest(x, y){
  let best=null, bestD=16*16;   // v0.30.0 audit #6: a tap clearly between dots selects nothing
  for(const s of (GlobeState._screen||[])){
    const d=(s.sx-x)*(s.sx-x)+(s.sy-y)*(s.sy-y);
    if(d<bestD){ bestD=d; best=s; }
  }
  return best?best.inst:null;
}
