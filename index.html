    // tap-away closes the panel (never over the globe's tap — canvas taps route via m3)
    const p=document.getElementById('legendPanel');
    if(p&&!p.hidden&&!e.target.closest('#legendPanel')) p.hidden=true;
  });
}

// Chain UP from a site: [parent, grandparent, …, root]. Cycle-guarded so a bad
// parent pointer can never hang the render loop.
function parentChainOf(id){
  const out=[]; const seen=new Set([id]);
  let s=siteById(id);
  while(s && s.parent!=null && !seen.has(s.parent)){
    seen.add(s.parent);
    const p=siteById(s.parent); if(!p) break;
    out.push(p); s=p;
  }
  return out;
}

// ---- Token cache: custom props read once, re-read on theme change (deviation 2) ----
let _mTokCache=null, _mTokTheme=null;

function _cssRGB(c, fb){
  c=(c||'').trim();
  let m=/^#([0-9a-f]{3})$/i.exec(c);
  if(m){ const h=m[1]; return parseInt(h[0]+h[0],16)+','+parseInt(h[1]+h[1],16)+','+parseInt(h[2]+h[2],16); }
  m=/^#([0-9a-f]{6})/i.exec(c);
  if(m){ const h=m[1]; return parseInt(h.slice(0,2),16)+','+parseInt(h.slice(2,4),16)+','+parseInt(h.slice(4,6),16); }
  m=/^rgba?\(\s*([\d.]+)[,\s]+([\d.]+)[,\s]+([\d.]+)/i.exec(c);
  if(m) return Math.round(+m[1])+','+Math.round(+m[2])+','+Math.round(+m[3]);
  return fb;
}

function _mTok(){
  const root=(typeof document!=='undefined')?document.documentElement:null;
  const th=root?(root.getAttribute('data-app-theme')||'lumen'):'lumen';
  if(_mTokCache && _mTokTheme===th) return _mTokCache;
  let rd=function(){ return ''; };
  try{ if(root){ const cs=getComputedStyle(root); rd=function(n){ return (cs.getPropertyValue(n)||'').trim(); }; } }catch(_){}
  const T={};
  // A-ORG-1's literal palette survives as the fallback triples, so the layer still
  // reads if a token is missing (harness stubs, boot order).
  T.text   = _cssRGB(rd('--text'),   '234,248,255');   // dots + labels (ice-white family)
  T.dim    = _cssRGB(rd('--dim'),    '155,140,255');   // guard family (was #9b8cff)
  T.accent = _cssRGB(rd('--accent'), '54,182,255');    // selection + child web (doctrine blue)
  T.signal = _cssRGB(rd('--signal'), '255,217,130');   // lineage gold + oib amber family
  T.ground = _cssRGB(rd('--ground'), '9,17,16');       // glass interiors, label outlines
  T.body   = rd('--body') || '-apple-system,system-ui,sans-serif';
  // world paint (the canvas globe reads the theme too — owner directive 19 Aug:
  // the radar look is retired; glow mode survives only as a token, off by default)
  T.oceanHi = rd('--ocean-hi') || '#0f1d1a';
  T.oceanLo = rd('--ocean-lo') || '#091110';
  T.land    = _cssRGB('rgb('+(rd('--land')||'')+')', null) || (rd('--land')||'').trim() || '64,178,152';
  T.coast   = (rd('--coast')||'').trim() || T.accent;
  T.glow    = (rd('--world-glow')||'0').trim()==='1';
  _mTokCache=T; _mTokTheme=th;
  return T;
}

// ---- Selection → arc sets (PORT of _syncSelArcs, adapted per deviation 1) ------
function _syncSelArcs(selId){
  try{
    GlobeState._selUp=null; GlobeState._selDown=null;
    GlobeState._cmdSites=null;
    if(selId==null){
      GlobeState._hqArc=null; GlobeState._cmdLinkArcs=null;
      if(typeof globeMark==='function') globeMark();
      return;
    }
    const s=siteById(selId);
    if(!s || s.lat==null || s.lon==null){
      GlobeState._hqArc=null; GlobeState._cmdLinkArcs=null;
      if(typeof globeMark==='function') globeMark();
      return;
    }
    // UP the parent chain — every located hop, selection → … → root (bright gold).
    const up=[]; const upSet=new Set();
    let from=s;
    for(const p of parentChainOf(selId)){
      if(p.lat==null || p.lon==null) continue;              // unlocated hop: chain continues from last located site
      if(!(p.lat===from.lat && p.lon===from.lon)){          // co-located hop draws no zero-length arc
        up.push({ from:{lon:from.lon, lat:from.lat, n:from.id}, to:{lon:p.lon, lat:p.lat, n:p.id}, rel:'parent' });
      }
      upSet.add(p.id);
      from=p;
    }
    // DOWN to DIRECT children only (dimmer blue web) — one echelon by design.
    const down=[]; const downSet=new Set();
    for(const c of childrenOf(selId)){
      if(c.lat==null || c.lon==null) continue;
      downSet.add(c.id);
      if(c.lat===s.lat && c.lon===s.lon) continue;          // co-located child: dot highlights, no arc
      down.push({ from:{lon:s.lon, lat:s.lat, n:s.id}, to:{lon:c.lon, lat:c.lat, n:c.id}, rel:'subordinate' });
    }
    GlobeState._hqArc = up.length?up:null;
    GlobeState._cmdLinkArcs = down.length?down:null;
    GlobeState._selUp=upSet; GlobeState._selDown=downSet;
    // _cmdSites (ported name): the whole selection picture — drives dot emphasis + labels.
    const all=new Set(upSet); downSet.forEach(function(id){ all.add(id); }); all.add(selId);
    GlobeState._cmdSites=all;
    if(typeof globeMark==='function') globeMark();
  }catch(_){}
}

// Lazy follow (deviation 6): the selection owner just sets GlobeState.sel + dirty.
function _selSyncCheck(){
  if(GlobeState._selSynced!==GlobeState.sel || GlobeState._selSyncSrc!==_sitesArr()){
    GlobeState._selSynced=GlobeState.sel;
    GlobeState._selSyncSrc=_sitesArr();
    _syncSelArcs(GlobeState.sel);
  }
}

// ---- Great-circle arcs (PORT of drawSubtleArcs — sampling verbatim) ------------
// Lightweight arc drawer: thin, semi-transparent, glow only past alpha 0.5.
function drawSubtleArcs(ctx, m, arcs, rgb, width, alpha, arrow){
  function slerpPts(aLon,aLat,bLon,bLat,segs){
    const a=lonLatToVec(aLon,aLat), b=lonLatToVec(bLon,bLat);
    let dot=a[0]*b[0]+a[1]*b[1]+a[2]*b[2]; dot=Math.max(-1,Math.min(1,dot));
    const om=Math.acos(dot); const so=Math.sin(om); const pts=[];
    for(let i=0;i<=segs;i++){ const f=i/segs; let w1,w2;
      if(so<1e-6){ w1=1-f; w2=f; } else { w1=Math.sin((1-f)*om)/so; w2=Math.sin(f*om)/so; }
      const lift=1+0.08*Math.sin(Math.PI*f);
      pts.push([ (a[0]*w1+b[0]*w2)*lift, (a[1]*w1+b[1]*w2)*lift, (a[2]*w1+b[2]*w2)*lift ]); }
    return pts;
  }
  ctx.save();
  ctx.lineWidth=(width||0.7); ctx.strokeStyle='rgba('+rgb+','+(alpha!=null?alpha:0.28)+')'; ctx.lineCap='round';
  if((alpha||0)>0.5){ ctx.shadowColor='rgba('+rgb+',0.85)'; ctx.shadowBlur=7; }
  arcs.forEach(arc=>{
    const pts=slerpPts(arc.from.lon,arc.from.lat, arc.to.lon,arc.to.lat, 40);
    let s=false; ctx.beginPath();
    let lastV=null, prevV=null;
    for(let i=0;i<pts.length;i++){ const v=_projectVec(pts[i], m); const front=v[2]>=-0.02;
      if(front){ if(!s){ ctx.moveTo(v[0],v[1]); s=true; } else ctx.lineTo(v[0],v[1]); prevV=lastV; lastV=v; } else s=false; }
    ctx.stroke();
    // directional arrowhead at the target — only when the target is front-facing.
    if(arrow && lastV && prevV){
      if(_visibleLonLat(arc.to.lon, arc.to.lat)){   // same front-hemisphere math, one projection cheaper
        const ang=Math.atan2(lastV[1]-prevV[1], lastV[0]-prevV[0]), ah=6.5;
        ctx.save(); ctx.shadowBlur=0; ctx.beginPath();
        ctx.moveTo(lastV[0], lastV[1]);
        ctx.lineTo(lastV[0]-ah*Math.cos(ang-0.45), lastV[1]-ah*Math.sin(ang-0.45));
        ctx.lineTo(lastV[0]-ah*Math.cos(ang+0.45), lastV[1]-ah*Math.sin(ang+0.45));
        ctx.closePath(); ctx.fillStyle='rgba('+rgb+',0.95)'; ctx.fill(); ctx.restore();
      }
    }
  });
  ctx.restore();
}

// ---- Arc families under the dots (PORT of drawGlobeLinks) ----------------------
function drawGlobeLinks(ctx, m){
  // v0.7.0: in brief the chain connectors ARE the link layer (A-ORG-1 law:
  // non-brief arcs are skipped entirely in brief); Lines toggle gates both rooms.
  try{ if(document.body.classList.contains('brief-mode')){ drawBriefArcs(ctx, m); return; } }catch(_){}
  if(GlobeState._linesOff) return;
  const T=_mTok();
  // Child web first (subtle, thin, static — hints the connection without a bright
  // tangle; the highlighted dots carry the "these belong to this site" meaning).
  if(GlobeState._cmdLinkArcs && GlobeState._cmdLinkArcs.length){
    drawSubtleArcs(ctx, m, GlobeState._cmdLinkArcs, T.accent, 1.25, 0.5);
  }
  // CHAIN TO HQ over the web — the gold lineage always reads while drilling around.
  if(GlobeState._hqArc && GlobeState._hqArc.length){
    drawSubtleArcs(ctx, m, GlobeState._hqArc, T.signal, 2.2, 0.92);
  }
}

// ---- Chrome exclusion zones (PORT of _gChromeZones — A-ORG-2 shell ids, dev. 4) ----
function _gChromeZones(m){
  const W=(m&&m.w)||800, H=(m&&m.h)||600;
  try{
    const cv=(typeof document!=='undefined') && document.getElementById && document.getElementById('globeCanvas');
    const cr=(cv && cv.getBoundingClientRect) ? cv.getBoundingClientRect() : null;
    if(cr && cr.width>0 && cr.height>0){
      const kx=W/cr.width, ky=H/cr.height, live=[], PAD=4;
      const sels=['#searchPill','#searchResults','#dossier','#titleBar',
                  '#clockTL','#clockTR','#navGlobe'];
      for(const s of sels){
        const el=document.querySelector(s); if(!el) continue;
        const cs=getComputedStyle(el); if(cs.display==='none'||cs.visibility==='hidden') continue;
        const r=el.getBoundingClientRect(); if(!r.width||!r.height) continue;
        const x0=(r.left-cr.left)*kx-PAD, y0=(r.top-cr.top)*ky-PAD;
        const x1=(r.right-cr.left)*kx+PAD, y1=(r.bottom-cr.top)*ky+PAD;
        if(x1<0||y1<0||x0>W||y0>H) continue;
        live.push({x0:x0, y0:y0, x1:x1, y1:y1});
      }
      return live;
    }
  }catch(_){}
  return [];   // stubbed-DOM runs (harness): no chrome, no zones
}

// ---- Label placement (PORT of _placeGlobeLabel — verbatim) ---------------------
function _placeGlobeLabel(ctx, sx, sy, w, m, rects, opts){
  opts=opts||{};
  const W=(m&&m.w)||800, H=(m&&m.h)||600;
  const gap=opts.gap!=null?opts.gap:8, h=opts.h!=null?opts.h:13;
  const L=6, R=W-6, T=6, B=H-6;
  const chrome=(GlobeState.__gChrome||(GlobeState.__gChrome=_gChromeZones(m)));
  let ax;
  if(opts.center){ ax=sx-w/2; } else { ax=sx+gap; if(ax+w>R) ax=sx-gap-w; }
  const ys = opts.above ? [sy, sy-16, sy-32, sy+18, sy-48, sy+34]
                        : [sy+4, sy-15, sy+19, sy-30, sy+34, sy-45];
  for(const cy of ys){
    const x=Math.max(L, Math.min(ax, R-w));
    const y=Math.max(T+h, Math.min(cy, B));
    const bx={x0:x-2, y0:y-h+2, x1:x+w+2, y1:y+3};
    // a label that cannot fit inside the canvas at either anchor — or that the edge
    // clamp dragged onto its own marker — is skipped (dot-only)
    let hit=(bx.x1>R+2 || bx.x0<L-2 || Math.abs(x-ax)>4);
    if(!hit) for(const b of rects){ if(bx.x0<b.x1&&bx.x1>b.x0&&bx.y0<b.y1&&bx.y1>b.y0){ hit=true; break; } }
    if(!hit) for(const c of chrome){ if(bx.x0<c.x1&&bx.x1>c.x0&&bx.y0<c.y1&&bx.y1>c.y0){ hit=true; break; } }
    if(!hit){ rects.push(bx); return {x,y}; }
  }
  return null;
}

// ---- The dot loop (PORT of drawGlobeMarkers) ------------------------------------
function drawGlobeMarkers(ctx, m){
  const T=_mTok();
  GlobeState._screen=[];                              // hit-test cache, rebuilt per draw
  GlobeState.__gLbl=[]; GlobeState.__gChrome=null;    // shared label rects + chrome zones, per frame
  const tnow=performance.now()/1000;
  const selId=GlobeState.sel;
  const upSet=GlobeState._selUp, downSet=GlobeState._selDown;
  const cmdSites=GlobeState._cmdSites;
  const zb=Math.min(2.4, 1 + (GlobeState.zoom-1)*0.14);   // dots grow a little as you zoom in
  const rScale=Math.min(2.1, 0.85+zb*0.16);
  const bodyFont=T.body;
  // v0.7.0 REVERSAL (A-ORG-1 L17488 law): brief mode hands the full-screen globe
  // to the chain renderer — only the brief structures draw; everything else waits
  // in map mode. Dots toggle silences the map reticles (and their hit-tests).
  let briefOn=false; try{ briefOn=document.body.classList.contains('brief-mode'); }catch(_){}
  if(briefOn){ drawBriefNodes(ctx, m); return; }
  // Dots toggle: markers, badges and their hit-tests go quiet; the selection's
  // chain labels stay (Names owns text). A dot that isn't drawn can't be tapped.
  const dotsOff=!!GlobeState._dotsOff;

  for(const inst of _sitesArr()){
    if(inst.lat==null||inst.lon==null) continue;
    const p=_projectLonLat(inst.lon, inst.lat, m);
    if(p[2]<0) continue;
    const sx=p[0], sy=p[1];
    const fade=Math.max(0.3, p[2]);
    const isSel=(selId!=null && inst.id===selId);
    const isUp=!!(upSet && upSet.has(inst.id));
    const isDown=!!(downSet && downSet.has(inst.id));
    const onChain=isSel||isUp||isDown;
    const cls=clsOf(inst.id);
    const isGuard=(cls==='guard');
    // class filter (legend): chain members stay — the picture outranks the layers
    if(!onChain && GlobeState._famOff && GlobeState._famOff.has(cls)) continue;
    // CLUSTERS (A-ORG-1 §3.4, gate 1.6 · 44px grid): at world zoom, ordinary
    // sites divert into count badges; the badge pass draws after this loop.
    if(GlobeState.zoom<1.6 && !onChain){
      if(!dotsOff){
        (GlobeState._clu||(GlobeState._clu=[])).push({x:sx, y:sy, lat:inst.lat, lon:inst.lon, c:(CLS_META[cls]||CLS_META.base).c});
        GlobeState._screen.push({inst, sx, sy, depth:p[2]});
      }
      continue;
    }
    const col=(isSel||isDown) ? T.accent : (isUp ? T.signal : (CLS_META[cls]||CLS_META.base).c);
    const zb2=Math.min(2.1, 0.85+zb*0.16);
    const dotR=((isSel?3.6:(onChain?3.0:(cls==='hq'?3.4:(isGuard?2.0:2.5)))))*zb2;
    const rr=dotR*1.16;

    if(isSel && !dotsOff){
      // A-ORG-1's breathing diamond + compass spokes — the selected org owns the map
      const d=7.5+Math.sin(tnow*2.4)*0.8;
      ctx.save(); ctx.translate(sx,sy); ctx.rotate(Math.PI/4);
      ctx.strokeStyle='rgba('+T.accent+','+(0.95*fade)+')'; ctx.lineWidth=1.8;
      ctx.strokeRect(-d,-d,d*2,d*2); ctx.rotate(-Math.PI/4);
      ctx.beginPath();
      ctx.moveTo(-d-4,0); ctx.lineTo(-d+1,0); ctx.moveTo(d-1,0); ctx.lineTo(d+4,0);
      ctx.moveTo(0,-d-4); ctx.lineTo(0,-d+1); ctx.moveTo(0,d-1); ctx.lineTo(0,d+4);
      ctx.strokeStyle='rgba('+T.accent+','+(0.8*fade)+')'; ctx.lineWidth=1.3; ctx.stroke();
      ctx.restore();
    }

    // GLASS RETICLE, SHARP (A-ORG-1 recipe, halo deleted per owner: dark interior
    // disc + one thin ring + bright core; HQ adds one concentric ring; no glow,
    // no shadowBlur — ~270 markers must hold phone frames).
    if(!dotsOff){
      ctx.globalAlpha=fade*(isGuard&&!onChain?0.8:1);
      ctx.beginPath(); ctx.arc(sx, sy, rr, 0, Math.PI*2);
      ctx.fillStyle='rgba(8,7,4,.85)'; ctx.fill();
      ctx.lineWidth=onChain?1.6:1.25; ctx.strokeStyle='rgb('+col+')'; ctx.stroke();
      ctx.beginPath(); ctx.arc(sx, sy, Math.max(0.9, rr*0.34), 0, Math.PI*2);
      ctx.fillStyle='rgb('+col+')'; ctx.fill();
      if(cls==='hq' && !isSel){
        ctx.lineWidth=1.1; ctx.strokeStyle='rgb('+col+')'; ctx.globalAlpha=0.9*fade;
        ctx.beginPath(); ctx.arc(sx, sy, rr+2.8, 0, Math.PI*2); ctx.stroke();
      }
      ctx.globalAlpha=1;
    }

    // chain-member labels draw at ANY zoom — the picture is the product (deviation 7).
    if(onChain && !GlobeState._namesOff){
      const _nm=inst.unit||inst.base||inst.id;
      const _fs=(m.w<560?12:11);
      ctx.save();
      ctx.textBaseline='middle';
      ctx.font='800 '+_fs+'px '+bodyFont;
      const _tw=ctx.measureText(_nm).width;
      const _pos=_placeGlobeLabel(ctx, sx, sy, _tw, m, GlobeState.__gLbl, {gap:dotR+7, h:14});
      if(_pos){
        ctx.lineWidth=(_fs>11?3.6:3.2); ctx.strokeStyle='rgba('+T.ground+',.9)'; ctx.strokeText(_nm, _pos.x, _pos.y);
        ctx.fillStyle='rgba('+col+',1)'; ctx.fillText(_nm, _pos.x, _pos.y);
      }
      ctx.restore();
    }

    if(!dotsOff) GlobeState._screen.push({inst, sx, sy, depth:p[2]});
  }

  // Tiny labels for the rest, zoom-gated (keeps world view clean).
  if(GlobeState.zoom >= 1.5 && !GlobeState._namesOff){
    ctx.save();
    try{ ctx.letterSpacing='0.35px'; }catch(_){}
    ctx.textBaseline='middle';
    // PRIORITY CULLING: placement is first-come-first-served on collision cells, so
    // iterate a priority-sorted copy — chain picture, then roots, depots, bases, guard.
    const _lblPr=function(s){ const i=s.inst;
      if(cmdSites && cmdSites.has(i.id)) return 0;
      if(i.parent==null) return 1;
      if(i.grp==='oib') return 2;
      if(i.grp==='guard'||i.grp==='guardInset') return 4;
      return 3; };
    const _lblQ=Array.from(GlobeState._screen).sort(function(a,b){ return _lblPr(a)-_lblPr(b); });
    for(const s of _lblQ){
      const inst=s.inst;
      if(inst.grp==='guard') continue;                // skip guard to reduce clutter
      if(s.depth<0.25) continue;
      if(cmdSites && cmdSites.has(inst.id)) continue; // chain labels already drew in the dot loop
      // ZOOM LADDER — density arrives as the room for it does; phones climb it 0.7
      // later because a narrow canvas has far less room per name.
      const _mzb=(m.w<700)?0.7:0;
      const _need=(inst.parent==null?2.0:(inst.grp==='oib'?2.8:(inst.grp==='guardInset'?3.6:3.2)))+_mzb;
      if(GlobeState.zoom < _need) continue;
      if(s.sx<1||s.sx>m.w-1||s.sy<1||s.sy>m.h-1) continue;   // off-map dot — don't orphan its label
      ctx.font='600 9.5px '+bodyFont;
      const name=inst.base||inst.id;
      const tw=ctx.measureText(name).width;
      const _pl=_placeGlobeLabel(ctx, s.sx, s.sy, tw, m, GlobeState.__gLbl, {h:12});
      if(!_pl) continue;
      ctx.shadowColor='rgba('+T.ground+',.9)'; ctx.shadowBlur=3; ctx.shadowOffsetY=1;
      ctx.lineWidth=2.2; ctx.strokeStyle='rgba('+T.ground+',.78)'; ctx.strokeText(name, _pl.x, _pl.y);
      ctx.shadowBlur=0; ctx.shadowOffsetY=0;
      ctx.fillStyle='rgba('+(inst.grp==='oib'?T.signal:T.text)+',.92)'; ctx.fillText(name, _pl.x, _pl.y);
    }
    ctx.restore();
  }
}

// ---- CLUSTER BADGES (A-ORG-1 §3.4, single-pass port): 44px screen grid,
// active below zoom 1.6; badge = glass disc + accent ring + halo ring + reticle
// ticks + count. Tap eases past the gate at the badge's centroid. ------------
function drawClusters(ctx, m){
  const T=_mTok();
  if(GlobeState.zoom>=1.6 || !GlobeState._clu || !GlobeState._clu.length){ GlobeState._cluHits=null; GlobeState._clu=null; return; }
  const gm=new Map();
  for(const c of GlobeState._clu){
    const k=((c.x/44)|0)+':'+((c.y/44)|0);
    let g=gm.get(k); if(!g){ g={x:0,y:0,la:0,lo:0,n:0}; gm.set(k,g); }
    g.x+=c.x; g.y+=c.y; g.la+=c.lat; g.lo+=c.lon; g.n++; g.c=c.c;
  }
  GlobeState._cluHits=[];
  ctx.save(); ctx.textAlign='center'; ctx.textBaseline='middle';
  gm.forEach(function(g){
    const cx=g.x/g.n, cy=g.y/g.n;
    if(g.n===1){
      ctx.beginPath(); ctx.arc(cx,cy,2.2,0,Math.PI*2);
      ctx.fillStyle='rgb('+(g.c||T.accent)+')'; ctx.globalAlpha=.85; ctx.fill(); ctx.globalAlpha=1;
      return;
    }
    const r=Math.min(15, 7+Math.log2(g.n)*2.6);
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
    ctx.fillStyle='rgba(8,7,4,.66)'; ctx.fill();
    ctx.strokeStyle='rgba('+T.accent+',.85)'; ctx.lineWidth=1.4; ctx.stroke();
    ctx.beginPath(); ctx.arc(cx,cy,r+3.5,0,Math.PI*2);
    ctx.strokeStyle='rgba('+T.accent+',.28)'; ctx.lineWidth=1; ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx-r-7,cy); ctx.lineTo(cx-r-2,cy); ctx.moveTo(cx+r+2,cy); ctx.lineTo(cx+r+7,cy);
    ctx.moveTo(cx,cy-r-7); ctx.lineTo(cx,cy-r-2); ctx.moveTo(cx,cy+r+2); ctx.lineTo(cx,cy+r+7);
    ctx.strokeStyle='rgba('+T.accent+',.5)'; ctx.lineWidth=1; ctx.stroke();
    ctx.fillStyle='rgba('+T.text+',.95)';
    ctx.font='700 9px '+T.body;
    ctx.fillText(String(g.n), cx, cy+0.5);
    GlobeState._cluHits.push({x:cx, y:cy, r:r+8, lat:g.la/g.n, lon:g.lo/g.n});
  });
  ctx.restore(); GlobeState._clu=null;
}

// ═══ THE BRIEF ON THE GLOBE (v0.7.0 owner reversal) — the chain is BUILT on the
// sphere: white dots wearing tier rings, tier-colored great-circle connectors,
// tier-colored labels. The chart card only supplements this picture.
// (A-ORG-1 recipe, consult 6: dot spec L17589, arcs L16849, streams L21656 —
// stream families re-keyed to the Lumen tier law: L2 cools NEVER green.) ────────
const BF_STREAMS={
  1:['255,255,255','232,238,255'],
  2:['111,199,232','178,102,255','70,120,255','0,205,255','150,160,255'],
  3:['255,201,92','255,150,50','255,120,80','255,190,110'],
  4:['255,143,192','230,70,160','255,120,150'],

// short label for chain nodes + chart chips: '(WSMR)' captures beat everything;
// else standard military short forms (Inf · Abn · Bde · Cmd …) beat truncation.
const _BF_SHORT={Infantry:'Inf',Armored:'Armd',Airborne:'Abn',Division:'Div',Brigade:'Bde',
  Battalion:'Bn',Command:'Cmd',Support:'Spt',Mountain:'Mtn',Military:'Mil',Theater:'Thtr',
  Mission:'Msn',Regiment:'Regt',Artillery:'Arty',Medical:'Med',Cavalry:'Cav',Intelligence:'Intel',
  Ammunition:'Ammo',Depot:'Dep',Arsenal:'Ars',Training:'Trng',Readiness:'Rdns',General:'Gen'};
function _bfAbbr(name){
  const s=String(name||'');
  const p=s.match(/\(([A-Za-z0-9&\- ]{2,10})\)/); if(p) return p[1];
  const cap=s.split(/\s+/).find(function(w){ return w.length>=2&&w.length<=7&&w===w.toUpperCase()&&/[A-Z]/.test(w); });
  if(cap) return cap.replace(/[.,]$/,'');
  const short=s.split(/\s+/).map(function(w){ return _BF_SHORT[w]||w; }).join(' ');
  return short.length>18 ? short.slice(0,17)+'…' : short;
}
// The chain map: every node reachable from the brief HQs, four echelons deep,
// sites AND custom orgs. A custom without its own base rides its parent's point.
function _briefChainMap(){
  const out={nodes:{}, order:[]};
  if(typeof BRIEF==='undefined' || !BRIEF.hqs || !BRIEF.hqs.length) return out;
  const kidIx={};
  for(const st of _sitesArr()){ if(st.parent!=null) (kidIx[st.parent]||(kidIx[st.parent]=[])).push(st); }
  const orgIx={};
  if(typeof ORGS!=='undefined') for(const o of ORGS) (orgIx[o.parent]||(orgIx[o.parent]=[])).push(o);
  const tierN={1:0,2:0,3:0,4:0};
  const seen=new Set();
  BRIEF.hqs.forEach(function(hid){
    const hq=siteById(hid); if(!hq) return;
    const q=[{n:hq, custom:false, tier:1, pk:null}];
    while(q.length){
      const c=q.shift(); const key=c.n.id;
      if(seen.has(key)) continue; seen.add(key);
      const fam=BF_STREAMS[c.tier];
      const shade=fam[tierN[c.tier]++ % fam.length];
      let lat=null, lon=null;
      if(c.custom){
        const b=c.n.base?siteById(c.n.base):null;
        if(b){ lat=b.lat; lon=b.lon; }
        else { const p=out.nodes[c.pk]; if(p){ lat=p.lat; lon=p.lon; } }
      } else { lat=c.n.lat; lon=c.n.lon; }
      out.nodes[key]={id:key, tier:c.tier, shade:shade, parent:c.pk, root:hid, lat:lat, lon:lon,
        name:(c.custom?c.n.name:(c.n.unit||c.n.base)), custom:!!c.custom};
      out.order.push(key);
      if(c.tier>=4) continue;
      (kidIx[key]||[]).forEach(function(k){ q.push({n:k, custom:false, tier:c.tier+1, pk:key}); });
      (orgIx[key]||[]).forEach(function(o){ q.push({n:o, custom:true, tier:c.tier+1, pk:key}); });
    }
  });

}
// Connectors: grouped by parent shade + child tier; per-level width/alpha
// (A-ORG-1 L16878), deepest first so bright trunks paint on top.
function drawBriefArcs(ctx, m){
  GlobeState.__bfC=_briefChainMap();                 // links draw first each frame — nodes reuse this
  if(GlobeState._linesOff) return;
  const C=GlobeState.__bfC, groups={};
  for(const key of C.order){
    const n=C.nodes[key]; if(!n.parent||n.lat==null) continue;
    const pn=C.nodes[n.parent]; if(!pn||pn.lat==null) continue;
    if(Math.abs(pn.lat-n.lat)<1e-6 && Math.abs(pn.lon-n.lon)<1e-6) continue;   // same point: no zero arc
    const gk=pn.shade+'|'+n.tier;
    (groups[gk]||(groups[gk]={shade:pn.shade, tier:n.tier, arcs:[]}))
      .arcs.push({from:{lon:pn.lon,lat:pn.lat}, to:{lon:n.lon,lat:n.lat}});
  }
  const W={2:2.8,3:2.1,4:1.8}, A={2:.9,3:.85,4:.8};
  Object.keys(groups).map(function(k){ return groups[k]; })
    .sort(function(a,b){ return b.tier-a.tier; })
    .forEach(function(g){ drawSubtleArcs(ctx, m, g.arcs, g.shade, W[g.tier]||1.8, A[g.tier]||0.8); });
}
// Chain dots + labels (A-ORG-1 chain dot spec: solid white, tier ring, HQ halo
// ring; labels tier-colored over a dark halo, collision-placed).
function drawBriefNodes(ctx, m){
  const T=_mTok();
  const C=GlobeState.__bfC||(GlobeState.__bfC=_briefChainMap());
  const zb=Math.min(2.4, 1 + (GlobeState.zoom-1)*0.14);
  const zb2=Math.min(2.1, 0.85+zb*0.16);
  const dotsOff=!!GlobeState._dotsOff, namesOff=!!GlobeState._namesOff;
  for(const key of C.order){
    const n=C.nodes[key];

    if(p[2]<0) continue;

      ctx.beginPath(); ctx.arc(sx, sy, dotR+3.4, 0, Math.PI*2);
      ctx.lineWidth=(n.tier===1?2.2:1.6);
      ctx.strokeStyle='rgba('+n.shade+','+(n.tier===1?0.95:0.88)+')'; ctx.stroke();
      if(n.tier===1){
        ctx.beginPath(); ctx.arc(sx, sy, dotR+6.6, 0, Math.PI*2);
        ctx.lineWidth=1.1; ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.stroke();
      }
      ctx.globalAlpha=1;
      GlobeState._screen.push({inst:{id:key, base:n.name, lat:n.lat, lon:n.lon, _bf:true}, sx:sx, sy:sy, depth:p[2]});

      const nm=_bfAbbr(n.name);

// ---- Tap hit-test for m3 (PORT of handleGlobeTap's best-dot loop) --------------
// Canvas-relative coords in (what tapAtScreen receives); nearest front-hemisphere
// site within 18px, else null. Tests LAST FRAME's _screen — exactly A-ORG-1.
function siteHitTest(x, y){
  let best=null, bestD=18*18;
  for(const s of (GlobeState._screen||[])){
    const d=(s.sx-x)*(s.sx-x)+(s.sy-y)*(s.sy-y);
    if(d<bestD){ bestD=d; best=s; }
  }
  return best?best.inst:null;
}

async function loadGlobeCoastlinesHi(){
  if(_globeLoadedHi) return;
  // A-ORG-1 v8.9.1 lineage: the real coastlines ship WITH the app (data/,
  // same-origin, SW-precached). A-ORG-2 ladder (deviations 1–2): 110m first
  // for a fast first paint, then 50m upgrades the same GLOBE_RINGS in place.
  const SOURCES=[
    'data/land-110m.json',
    'data/land-50m.json'
  ];
  for(const SRC of SOURCES){
    try{
      const r=await fetch(SRC); if(!r.ok) continue;
      const topo=await r.json();
      const rings=decodeTopoLand(topo);
      if(rings && rings.length>20){
        GLOBE_RINGS=rings; _globeLoadedHi=true;
        if(window.GlobeState){ GlobeState.dirty=true; }   // redraw with real coastlines
      }
    }catch(e){ /* rung failed → keep current rings, try the next rung */ }
  }
  /* both rungs failed → keep embedded fallback */
}

// Load US state borders and decode to lon/lat rings for the globe. Same-origin
// data/ only (deviation 1). The us-atlas states file MAY be in Albers USA
// projection, so the projected case inverts that projection back to lon/lat.
async function loadStateBorders(){
  if(_statesLoaded) return;
  const SOURCES=[
    'data/states-10m.json'
  ];
  for(const SRC of SOURCES){
    try{
      const r=await fetch(SRC); if(!r.ok) continue;
      const topo=await r.json();
      // us-atlas ships two variants: states-10m.json is UNPROJECTED lon/lat, while the -albers-
      // file is pre-projected to a 975x610 canvas. Auto-detect: decode raw first — if the
      // coordinates are already geographic, use them directly (this also keeps REAL Alaska &
      // Hawaii outlines); only run the Albers inverse when the data is actually projected.
      let rings=_decodeTopoLonLat(topo,'states');
      const _geo=_ringsLookGeographic(rings);
      if(!_geo) rings=decodeStatesTopo(topo);
      if(rings && rings.length>=40){
        GLOBE_STATE_RINGS=rings; _statesLoaded=true;
        try{ GLOBE_STATE_SHAPES=_namedStateShapes(topo, _geo); }catch(_){ GLOBE_STATE_SHAPES=null; }
        if(window.GlobeState){ GlobeState.dirty=true; }
        return;
      }
    }catch(e){ /* try next */ }
  }
}

// Invert the d3 Albers-USA projection (approx) to recover lon/lat from projected x/y.
// us-atlas states-10m.json is pre-projected to a 975x610 viewport in Albers USA.
function _albersUsaInvert(x, y){
  // Inverse of d3.geoAlbersUsa as used by us-atlas v3 (975x610 viewport): scale 1300,
  // translate [487.5, 305], screen y-down. Verified: US center → canvas center, coasts span
  // the full width, and it round-trips exactly.
  const scale=1300, tx=487.5, ty=305;
  const phi0=37.5*Math.PI/180, lam0=-96*Math.PI/180;
  const p1=29.5*Math.PI/180, p2=45.5*Math.PI/180;
  const n=(Math.sin(p1)+Math.sin(p2))/2;
  const C=Math.cos(p1)*Math.cos(p1)+2*n*Math.sin(p1);
  const rho0=Math.sqrt(C-2*n*Math.sin(phi0))/n;
  const px=(x - tx)/scale, py=-(y - ty)/scale;   // negated: screen-up = north (matches on-device result)
  const rho0my=rho0 - py;
  const rho=Math.sqrt(px*px + rho0my*rho0my);
  const theta=Math.atan2(px, rho0my);
  const phi=Math.asin(Math.max(-1,Math.min(1,(C - rho*rho*n*n)/(2*n))));
  const lam=lam0 + theta/n;
  return [lam*180/Math.PI, phi*180/Math.PI];
}

function _ringsLookGeographic(rings){
  if(!rings || !rings.length) return false;
  let n=0, okc=0, minLon=999;
  for(const ring of rings){
    for(const p of ring){ n++; if(p[0]>=-180&&p[0]<=180&&p[1]>=-90&&p[1]<=90) okc++; if(p[0]<minLon) minLon=p[0]; if(n>400) break; }
    if(n>400) break;
  }
  return okc>n*0.98 && minLon<-60;   // US longitudes are negative; projected pixels sit in 0..975
}

function decodeStatesTopo(topo){
  const tr=topo.transform;
  const arcs=topo.arcs;
  const obj=topo.objects && (topo.objects.states || topo.objects.states_10m || topo.objects['states-10m']);
  if(!obj) return [];
  function decodeArc(arc){
    let x=0,y=0; const out=[];
    for(const d of arc){
      if(tr){ x+=d[0]; y+=d[1]; out.push([x*tr.scale[0]+tr.translate[0], y*tr.scale[1]+tr.translate[1]]); }
      else { out.push([d[0], d[1]]); }
    }
    return out;
  }
  const decoded=arcs.map(decodeArc);
  function ringFor(arcIdxs){
    let pts=[];
    for(let k=0;k<arcIdxs.length;k++){
      let idx=arcIdxs[k], arc;
      if(idx<0){ arc=decoded[~idx].slice().reverse(); } else { arc=decoded[idx]; }
      if(k>0) arc=arc.slice(1);
      pts=pts.concat(arc);
    }
    // convert projected x/y → lon/lat
    return pts.map(p=>_albersUsaInvert(p[0], p[1]));
  }
  const out=[]; const geoms=obj.geometries||[];
  for(const g of geoms){
    // Skip Alaska (FIPS 02) & Hawaii (15): the Albers-USA layout fakes them into INSETS whose
    // inverse lands over Mexico/Texas. Their true outlines come from the global country layer.
    if(g.id==='02'||g.id==='15'||g.id===2||g.id===15) continue;
    if(g.type==='Polygon'){ for(const r of g.arcs) out.push(ringFor(r)); }
    else if(g.type==='MultiPolygon'){ for(const poly of g.arcs) for(const r of poly) out.push(ringFor(r)); }
  }
  return out;
}

// Load WORLD country borders (lon/lat TopoJSON — no projection inversion needed) from the
// same-origin data/ file (deviation 1). Drawn as a thin global context layer.
async function loadCountryBorders(){
  if(_countriesLoaded) return;
  const SOURCES=[
    'data/countries-110m.json'
  ];

    try{
      const r=await fetch(SRC); if(!r.ok) continue;

// Generic TopoJSON→lon/lat ring decoder (delta-decoded arcs + transform; data already geographic).
function _decodeTopoLonLat(topo, objName){
  const tr=topo.transform, arcs=topo.arcs;
  const obj=topo.objects && topo.objects[objName]; if(!obj) return [];
  function dec(a){ let x=0,y=0; const o=[]; for(const d of a){ if(tr){ x+=d[0]; y+=d[1]; o.push([x*tr.scale[0]+tr.translate[0], y*tr.scale[1]+tr.translate[1]]); } else o.push([d[0],d[1]]); } return o; }
  const D=arcs.map(dec);
  function ringFor(ix){ let p=[]; for(let k=0;k<ix.length;k++){ let i=ix[k],a; if(i<0){a=D[~i].slice().reverse();} else {a=D[i];} if(k>0) a=a.slice(1); p=p.concat(a); } return p; }
  const out=[];
  for(const g of (obj.geometries||[])){
    if(g.type==='Polygon'){ for(const r of g.arcs) out.push(ringFor(r)); }
    else if(g.type==='MultiPolygon'){ for(const poly of g.arcs) for(const r of poly) out.push(ringFor(r)); }
  }
  return out;
}

function decodeTopoLand(topo){
  const tr=topo.transform, arcs=topo.arcs;
  const sx=tr.scale[0], sy=tr.scale[1], tx=tr.translate[0], ty=tr.translate[1];
  function decodeArc(arc){ let x=0,y=0; const out=[]; for(const d of arc){ x+=d[0]; y+=d[1]; out.push([x*sx+tx, y*sy+ty]); } return out; }
  const decoded=arcs.map(decodeArc);
  function ringFor(arcIdxs){
    let pts=[];
    for(let k=0;k<arcIdxs.length;k++){
      let idx=arcIdxs[k], arc;
      if(idx<0){ arc=decoded[~idx].slice().reverse(); } else { arc=decoded[idx]; }
      if(k>0) arc=arc.slice(1);
      pts=pts.concat(arc);
    }
    return pts;
  }
  const out=[]; const geoms=topo.objects.land.geometries;
  for(const g of geoms){
    if(g.type==='Polygon'){ for(const r of g.arcs) out.push(ringFor(r)); }
    else if(g.type==='MultiPolygon'){ for(const poly of g.arcs) for(const r of poly) out.push(ringFor(r)); }
  }
  return out;
}

// Decode the states topojson KEEPING per-state identity (the border layer flattens it).
// Ported from A-ORG-1's brief-states section (deviation 4): it is pure topo→rings decode,
// so it lives with the other decoders; GLOBE_STATE_SHAPES fills the moment states load.
function _namedStateShapes(topo, geographic){
  const obj=topo.objects && (topo.objects.states || topo.objects['states-10m']); if(!obj) return null;
  const tr=topo.transform, arcs=topo.arcs;
  function dec(a){ let x=0,y=0; const o=[]; for(const d of a){ if(tr){ x+=d[0]; y+=d[1]; o.push([x*tr.scale[0]+tr.translate[0], y*tr.scale[1]+tr.translate[1]]); } else o.push([d[0],d[1]]); } return o; }
  const D=arcs.map(dec);
  function ringFor(ix){ let p=[]; for(let k=0;k<ix.length;k++){ let i=ix[k],a; if(i<0){a=D[~i].slice().reverse();} else {a=D[i];} if(k>0) a=a.slice(1); p=p.concat(a); } return p; }
  const out={};
  for(const g of (obj.geometries||[])){
    const nm=g.properties && g.properties.name; if(!nm) continue;
    const rings=[];
    if(g.type==='Polygon'){ for(const r of g.arcs) rings.push(ringFor(r)); }
    else if(g.type==='MultiPolygon'){ for(const poly of g.arcs) for(const r of poly) rings.push(ringFor(r)); }
    out[nm]=geographic? rings : rings.map(function(r){ return r.map(function(pt){ const v=_albersUsaInvert(pt[0],pt[1]); return (v&&v.length===2)?v:null; }).filter(Boolean); });
  }
  return out;
}

//                                  (^|[\s(\-\/]) + regex-escaped query) · expansion

//                                  gap 6px; rows = borderless radius cards, bold

// NEW (A-ORG-2 contracts, no direct A-ORG-1 counterpart):
//   buildSearchIndex()   boot index over SITES: {base, unit(+unitFull), st} folded
//                        once (m5's _siteIndex identity-cache idiom, so a SITES
//                        swap re-indexes lazily and boot order can't break it).
//   searchSelect(id)     THE select: GlobeState.sel = site id + dirty (m5 deviation
//                        6 lazy-follow picks up the arcs), flyToLatLon(site), then

//
// DEVIATIONS (everything changed vs. A-ORG-1, and why):
//   1. ONE search, not three. A-ORG-1 grew a stage pill (sfs*), a universal overlay
//      (_usRun/openUSearch) and a workspace filter; the sfs zero-result row escaped
//      into universal search. A-ORG-2's single-brain law collapses them: sfsResults
//      carries _usRun's ranking directly, and the zero-result state is a plain
//      "No matches" card (there is no second search to escape to).
//   2. sfsResults(q) searches SITES (flat array, parent pointer only) instead of
//      walking ARMY_DATA's tree, and returns {list, total, q} instead of an array

//      keeps the source rungs (exact 100 · prefix 80 · word-start 60, +8 whole
//      word); unit rungs sit strictly below the lowest base rung (exact 50 ·

//      st exact 26 / word-start 22 (st is a searchable field per mission — "NC"
//      must find North Carolina posts), bare substring floor 10. Length tiebreak

//      (dead-lint expects one style block) and the injector no-ops via its

//      sits inside @media(min-width:1100px); no position:fixed, no transforms
//      (the results stack can scroll — transform-free per the reliability
//      contract). Pill/dropdown GEOMETRY (where the search sits on the stage) is

// OWNERSHIP (concatenation law — no duplicate top-level declarations):
//   - DECLARED HERE: buildSearchIndex, sfsResults, sfsRender, searchSelect,

// ---- Escaping (PORT of esc ~L14030 / _escA ~L14129 — renamed, deviation 8) -----
function _srEsc(s){ return String(s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }
function _srEscA(v){ return String(v).replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

// ---- Diacritic/case fold (NEW — mission-mandated; deviation in header) ---------
function _srFold(s){
  s=String(s==null?'':s).toLowerCase();
  try{ s=s.normalize('NFD').replace(/[\u0300-\u036f]/g,''); }catch(_){}
  return s;
}

// ---- The index: SITES folded once, rebuilt only when SITES identity changes ----
// (m5 _siteIndex idiom — boot builds it, a data swap re-indexes lazily.)
let _srEntries=null, _srSrc=null;

function _searchEntries(){
  const arr=(typeof SITES!=='undefined' && SITES && SITES.length!=null) ? SITES : [];
  if(_srSrc===arr && _srEntries) return _srEntries;
  _srEntries=[];
  for(const s of arr){
    if(!s || s.id==null) continue;
    const base=String(s.base||s.id), unit=String(s.unit||''), st=String(s.st||'');
    _srEntries.push({
      id:s.id, base:base,
      sub:(unit?unit:'')+((unit&&st)?' · ':'')+st,          // "III Armored Corps · TX"
      baseF:_srFold(base), unitF:_srFold(unit), stF:_srFold(st),
      allF:_srFold(base+' '+unit+' '+st)
    });
  }
  _srSrc=arr;
  return _srEntries;
}

function buildSearchIndex(){ _srSrc=null; return _searchEntries(); }

// ---- Results (PORT of sfsResults + _usRun's v22.3.1 ranking; deviations 2-3) ---
// Returns {list:[entry,entry], total:N, q:foldedQuery}. list is the TOP TWO.
function sfsResults(q){
  q=_srFold((q||'').trim());
  if(q.length<2) return {list:[], total:0, q:q};
  // v22.3.1 ranking (ported): rank word-starts above mid-word noise — 'bragg'
  // finds Fort Bragg before anything that merely CONTAINS the letters; base-name
  // matches beat unit matches; shorter names win ties.
  const tk=new RegExp('(^|[\\s(\\-\\/])'+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  const hits=[];
  for(const e of _searchEntries()){
    let s2=0;
    if(e.baseF===q) s2=100;
    else if(e.baseF.indexOf(q)===0) s2=80;
    else if(tk.test(e.baseF)) s2=60;
    else if(e.unitF && e.unitF===q) s2=50;
    else if(e.unitF && e.unitF.indexOf(q)===0) s2=44;
    else if(e.unitF && tk.test(e.unitF)) s2=38;
    else if(e.stF && e.stF===q) s2=26;
    else if(e.stF && tk.test(e.stF)) s2=22;
    else if(e.allF.indexOf(q)>=0) s2=10;
    if(!s2) continue;
    if(e.baseF.split(/[\s()\-\/,]+/).indexOf(q)>=0) s2+=8;   // whole-word bonus (ported)
    hits.push({e:e, _s:s2 - Math.min(10, e.baseF.length/12)});
  }
  hits.sort(function(a,b){
    return (b._s-a._s) || (a.e.baseF.length-b.e.baseF.length) || (a.e.baseF<b.e.baseF?-1:1);
  });
  return {list:hits.slice(0,2).map(function(h){ return h.e; }), total:hits.length, q:q};
}

// ---- Render (PORT of sfsRender — rows via innerHTML <button data-sfs>) ---------
// res = {list,total,q} from sfsResults, or null/'' query → dropdown folds shut.
let _sfsHi=0;   // keyboard highlight over the (at most two) rows — deviation 5

function _srFuse(){
  const dd=document.getElementById('searchResults');
  const p=document.getElementById('searchPill');
  const open=!!(dd && dd.innerHTML);
  if(dd) dd.classList.toggle('sr-open', open);
  if(p)  p.classList.toggle('sr-open', open);
}
function sfsRender(res){
  _sfsPaint(res);
  _srFuse();                                   // pill + results fuse into one surface when open
}
function _sfsPaint(res){
  const dd=document.getElementById('searchResults'); if(!dd) return;
  _sfsHi=0;
  if(!res || !res.q || res.q.length<2){ dd.innerHTML=''; return; }
  // v21.5.1 flow law (ported): zero results never dead-end SILENTLY. There is no
  // second search to escape to (deviation 1) — say so, plainly.
  if(!res.list.length){
    dd.innerHTML='<div class="sr-none">No matches for “'+_srEsc(res.q)+'”.</div>';
    return;
  }
  const count = res.total===1 ? '1 site'
    : res.total<=2 ? res.total+' sites'
    : res.total+' sites — top 2 shown';
  dd.innerHTML=res.list.map(function(e,i){
    return '<button type="button" class="sr-row'+(i===_sfsHi?' hi':'')+'" role="option"'
      +' aria-selected="'+(i===_sfsHi?'true':'false')+'" data-sfs="'+_srEscA(e.id)+'">'
      +'<b>'+_srEsc(e.base)+'</b><span class="sr-sub">'+_srEsc(e.sub)+'</span></button>';
  }).join('')+'<div class="sr-count">'+_srEsc(count)+'</div>';
}

// ---- THE select (mission contract; deviation 6 — m5 lazy-follows sel) ----------
// v0.6.0: delegates to the canonical selectSite (s4) so a search pick rides the
// SAME rails as every other pick — trail crumb, SELECT-clock auto-fill, brief
// re-render. The inline body below is only the boot-order fallback (s4 absent).
function searchSelect(id){
  if(typeof selectSite==='function'){ selectSite(id); return; }
  const s=(typeof siteById==='function') ? siteById(id) : null;
  if(!s) return;
  GlobeState.sel=s.id;
  if(typeof globeMark==='function') globeMark(); else GlobeState.dirty=true;
  if(typeof flyToLatLon==='function' && s.lat!=null && s.lon!=null){
    // the base-dossier fly (~L15089): never zoom OUT to meet a selection
    try{ flyToLatLon(s.lat, s.lon, Math.max(GlobeState.zoom||1, 2.6)); }catch(_){}
  }
  try{ if(typeof showDossier==='function') showDossier(s.id); }catch(_){}
}

// ---- Field lookup (shell contract names the PILL; the input lives inside) ------
function _sfsField(){
  const p=document.getElementById('searchPill'); if(!p) return null;
  return (p.tagName==='INPUT') ? p : p.querySelector('input');
}
function _isSearchField(t){
  return !!(t && t.tagName==='INPUT' && t.closest && t.closest('#searchPill'));
}

// ---- Delegated wiring (A-ORG-1's document-level pattern, ~L22802 — deviation 7) -
document.addEventListener('input', function(e){
  if(e.target && _isSearchField(e.target)) sfsRender(sfsResults(e.target.value));
});

document.addEventListener('keydown', function(e){
  const t=e.target;
  if(!t || !_isSearchField(t)) return;
  if(e.key==='Enter'){                                   // ported (~L22805): Enter = pick
    const rows=document.querySelectorAll('#searchResults [data-sfs]');
    const b=rows[_sfsHi]||rows[0]; if(b) b.click();
    e.preventDefault(); return;
  }
  if(e.key==='ArrowDown' || e.key==='ArrowUp'){          // deviation 5: move the highlight
    const rows=document.querySelectorAll('#searchResults [data-sfs]');
    if(!rows.length) return;
    _sfsHi=Math.max(0, Math.min(rows.length-1, _sfsHi+(e.key==='ArrowDown'?1:-1)));
    for(let i=0;i<rows.length;i++){
      rows[i].classList.toggle('hi', i===_sfsHi);
      rows[i].setAttribute('aria-selected', i===_sfsHi?'true':'false');
    }
    e.preventDefault(); return;
  }
  if(e.key==='Escape'){                                  // ported (~L22772): Esc clears
    if(t.value){ t.value=''; sfsRender(null); }
    else{ try{ t.blur(); }catch(_){} }
    return;
  }
});

document.addEventListener('click', function(e){
  if(!e.target.closest) return;
  const sb=e.target.closest('#searchResults [data-sfs]');
  if(sb){                                                // ported (~L22845): tap = pick
    searchSelect(sb.getAttribute('data-sfs'));
    const i=_sfsField(); if(i){ i.value=''; try{ i.blur(); }catch(_){} }
    sfsRender(null);
    return;
  }
});

// ---- Boot (A-ORG-1 load+setTimeout idiom ~L23544; __mdWired-style once-guard) --
let _srBooted=false;

function initSearch(){
  if(_srBooted) return;
  _srBooted=true;
  buildSearchIndex();
  _srInjectCSS();
  const dd=document.getElementById('searchResults');
  if(dd){ dd.setAttribute('role','listbox'); dd.setAttribute('aria-label','Search results'); }
  const i=_sfsField();
  if(i && !i.__srWired){
    i.__srWired=1;
    // blur collapse (ported ~L23570): an emptied field folds its results after 150ms
    // (the delay lets a row tap land before the dropdown disappears under it).
    i.addEventListener('blur', function(){
      setTimeout(function(){ if(!(i.value||'').trim()) sfsRender(null); }, 150);
    });
  }
}

addEventListener('load', function(){ setTimeout(function(){ try{ initSearch(); }catch(_){} }, 0); });

// ---- CSS (deviation 9 — construction-phase injection; tokens only; phone-first;
//      row grammar ported from .sfs-dd ~L5365 + .us-row ~L1856) -------------------
function _srInjectCSS(){
  if(document.getElementById('s3SearchCSS')) return;     // the final-assembly no-op guard
  // (M1 verify: the construction-phase injected CSS was removed — s1-tokens.css
  //  owns the #searchResults/.sr-row recipe; dual ownership was fighting it.)
}

// CONTRACTS HONORED:
//   - Reads GlobeState/SITES-derived indexes at call time only — concatenation-
//     order safe; the delegate + load boot need no DOM at install time.
//   - Redraw law: selection marks GlobeState.dirty once per select/clear (an
//     event, never per-frame); nothing here touches the render loop.
//   - Reliability: no position:fixed, no pointer capture, no transforms on
//     scroll containers. No frameworks, no webfonts, sloppy-mode top-level
//     function declarations only.
//   - Brief tier tokens (--t1..--t4) untouched; no green on or near data.
// ═══════════════════════════════════════════════════════════════════════════════

// ---- Escaping (PORT of esc ~L14030 / _escA ~L14129 — renamed, s3 dev-8 rule) ---
function _odEsc(s){ return String(s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }
function _odEscA(v){ return String(v).replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

// ---- THE SINGLE BRAIN (mission contract) ---------------------------------------
// Every selection path lands here: m3 tap → tapAtScreen → selectSite; search rows
// → searchSelect (sets sel + flies, then the showDossier hook — same net effect,
// same order); dossier crumb/child rows + ✕ + Clear pill → the delegate below.
function selectSite(id, o){
  if(id==null){
    GlobeState.sel=null;
    if(typeof globeMark==='function') globeMark(); else GlobeState.dirty=true;
    // arcs drop NOW (deviation 6); m5's lazy follow re-confirms next frame.
    try{ if(typeof _syncSelArcs==='function') _syncSelArcs(null); }catch(_){}
    try{ _trailClear(); }catch(_){}
    try{ if(typeof autoFillSelect==='function') autoFillSelect(null); }catch(_){}   // an auto zone dies with its selection
    hideDossier();
    return;
  }
  const s=(typeof siteById==='function') ? siteById(id) : null;
  if(!s) return;                       // stale id (old DOM, bad deep link): keep the current picture
  GlobeState.sel=s.id;
  if(typeof globeMark==='function') globeMark(); else GlobeState.dirty=true;
  const _inBrief=(function(){ try{ return document.body.classList.contains('brief-mode'); }catch(_){ return false; } })();
  if(!(o&&o.keepCam) && !_inBrief && typeof flyToLatLon==='function' && s.lat!=null && s.lon!=null){
    // the base-dossier fly (~L15089): never zoom OUT to meet a selection
    // (keepCam: saved-view recall owns the camera — the fly must not eat it)
    try{ flyToLatLon(s.lat, s.lon, Math.max(GlobeState.zoom||1, 2.6)); }catch(_){}
  }
  try{ _trailPush(s.id); }catch(_){}
  try{ if(typeof autoFillSelect==='function') autoFillSelect(s); }catch(_){}   // SELECT clock follows the selection (manual pick wins)
  showDossier(s.id);
  if(_inBrief){ try{ renderBrief(); }catch(_){} }
}

// ---- MODE (v0.3.0 control law): MAP ⇄ BRIEF — one seg, unmistakable shift ----
function setMode(m){
  const brief=(m==='brief');
  document.body.classList.toggle('brief-mode', brief);
  // the globe picture is the hero (owner law): the chart supplement arrives
  // MINIMIZED every time brief opens — one tap on ⌗ CHART expands it
  if(brief) document.body.classList.add('chart-min');
  if(brief) renderBrief();
  try{                                            // the sheet follows the mode
    const host=document.getElementById('dossier');
    // v0.7.0: brief opens on the GLOBE picture — no sheet until an object is
    // tapped (chain dot or chart chip); map restores the selection card.
    if(host){ if(brief){ hideDossier(); } else if(GlobeState.sel) showDossier(GlobeState.sel); else hideDossier(); }
  }catch(_){}
  try{ GlobeState.__bfC=null; }catch(_){}
  try{ if(typeof globeMark==='function') globeMark(); }catch(_){}
}
try{ window.setMode=setMode; }catch(_){}

// BRIEF 2.0 (v0.5.0): the user-assembled chain — every HQ in the brief set
// renders as its own tier-law block, four echelons deep. Connectors are
// borders: exact lines, never hand-drawn. L1 white spine · L2 cools · L3
// warms · L4 roses; green never touches brief data. Boxes carry the org's
// record count; annotations (≤80 chars) ride under their box in the signal
// voice (chrome, not tier data).
// v0.7.0: the CHART CARD — the tree SUPPLEMENTS the globe picture. Compact chips
// only (owner law: minimal on the object, everything in the popup); minimize (⌗)
// collapses the card to its tab. Chips open the object popup.
function renderBrief(){
  const el=document.getElementById('briefStage'); if(!el) return;
  const esc=_odEsc, escA=_odEscA;
  let h='<button type="button" class="ch-head" data-chmin="1" aria-label="Minimize or expand the chart">⌗ CHART'
    +'<span class="ch-n">'+(BRIEF.hqs.length?(BRIEF.hqs.length+' HQ'+(BRIEF.hqs.length===1?'':'s')):'')+'</span>'
    +'<span class="od-ico" id="exportBtn" role="button" aria-label="Export"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4"></path><path d="M7 9l5-5 5 5"></path><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"></path></svg></span>'
    +'</button>';
  if(!BRIEF.hqs.length){
    const sel=GlobeState.sel?siteById(GlobeState.sel):null;
    h+='<div class="bf-empty"><b>The brief is empty</b>'
      +(sel?('<button type="button" class="bf-addsel" data-bfadd="'+escA(sel.id)+'">Add '+esc(sel.base)+'</button>')
            :'<span>Pick an organization on the map, then add it here.</span>')
      +'</div>';
    el.innerHTML=h; return;
  }
  const C=_briefChainMap();
  const CAP={1:4,2:8,3:10,4:12};
  BRIEF.hqs.forEach(function(hid){
    const sub={1:[],2:[],3:[],4:[]};
    C.order.forEach(function(k){ const n=C.nodes[k]; if(n.root===hid) sub[n.tier].push(n); });
    if(!sub[1].length) return;
    // user-built orgs never fall off the cap — they lead their tier row
    [2,3,4].forEach(function(t){ sub[t].sort(function(a,b){ return (b.custom?1:0)-(a.custom?1:0); }); });
    h+='<div class="ch-col">';
    [1,2,3,4].forEach(function(t){
      if(!sub[t].length) return;
      const ind=(t-1)*10;
      h+='<div class="ch-row" style="--ch-ind:'+ind+'px">'
        +sub[t].slice(0,CAP[t]).map(function(n){
          const tcls='ch-t'+t;                             // quote-adjacent for dead-lint's dynamic guard
          return '<button type="button" class="ch-chip '+tcls+(GlobeState.sel===n.id?' on':'')+'" data-bfobj="'+escA(n.id)+'" title="'+escA(n.name)+'">'+esc(_bfAbbr(n.name))+'</button>';
        }).join('')
        +'</div>';
      if(sub[t].length>CAP[t]) h+='<div class="ch-more" style="--ch-ind:'+ind+'px">+'+(sub[t].length-CAP[t])+' more</div>';
    });
    h+='</div>';
  });
  el.innerHTML=h;
}
try{ window.renderBrief=renderBrief; }catch(_){}

// ---- BREADCRUMB TRAIL (v0.2.0) — the globe stroll's memory. Session-only (the
// no-localStorage-at-boot law holds); ‹ Back walks it, chips jump anywhere in it.
function _trailPush(id){
  const t=GlobeState._trail||(GlobeState._trail=[]);
  if(t[t.length-1]===id) { _trailRender(); return; }
  const i=t.indexOf(id); if(i>=0) t.splice(i,1);   // revisits move to the tip, no dupes
  t.push(id); if(t.length>12) t.shift();
  _trailRender();
}
// (back = tapping a crumb; the dedicated _trailBack retired with the Back pill)
function _trailClear(){ GlobeState._trail=[]; _trailRender(); }
function _trailRender(){
  // crumbs render inside the sheet header (_odRender reads GlobeState._trail);
  // the standalone trail bar retired with the control law.
}
try{ window.selectSite=selectSite; }catch(_){}   // mission: expose the brain globally

// ---- m3's tap hook (m3-input deviation 4 boundary — DECLARED HERE) -------------
function tapAtScreen(x, y){
  if(GlobeState._navSwallow){ GlobeState._navSwallow=false; return; }   // that tap only closed the nav ring
  if(document.body && document.body.classList.contains('brief-mode')){
    // v0.7.0: the brief globe is the destination — a chain dot opens its popup;
    // empty sphere does nothing (hold the globe button 3s to return to map).
    const bs=(typeof siteHitTest==='function') ? siteHitTest(x, y) : null;
    if(bs && bs.id!=null){ _bfAnnEdit=null; _orgForm=null; try{ _bfObjSheet(bs.id); }catch(_){} }
    return;
  }
  const hits=GlobeState._cluHits;
  if(hits){ for(const h of hits){ const dx=x-h.x, dy=y-h.y;
    if(dx*dx+dy*dy<=h.r*h.r){ try{ flyToLatLon(h.lat, h.lon, 2.4); }catch(_){} return; } } }
  const s=(typeof siteHitTest==='function') ? siteHitTest(x, y) : null;
  if(s && s.id!=null) selectSite(s.id);
  // no-hit: selection survives (A-ORG-1 ~L17929 only hid the tip) — clearing is
  // a deliberate act (✕ on the card, or the nav ring's Clear).
}

// ---- The card (PORT of renderBaseDossier's grammar — render only, no state) ----
function showDossier(id){
  const host=document.getElementById('dossier'); if(!host) return;
  if(document.body && document.body.classList && document.body.classList.contains('brief-mode')){
    _bfObjSheet(id); return;                       // brief mode: the sheet is the object popup
  }
  const s=(typeof siteById==='function') ? siteById(id) : null;
  if(!s){ hideDossier(); return; }
  _odInjectCSS();                                  // order-safe if a select lands before 'load'
  const _kept=(host.className.match(/dz-(peek|half|full)/)||[])[1]||'peek';
  host.innerHTML=_odRender(s);
  host.classList.remove('dz-peek','dz-half','dz-full');
  host.classList.add('dz-'+_kept);                 // selection keeps the current detent; first open peeks
  host.hidden=false;
  try{ host.setAttribute('aria-label', s.base+' — dossier'); }catch(_){}
  host.scrollTop=0;                                // deviation 7: whole card into view
  _odStageClearSync(true);
}

function hideDossier(){
  const host=document.getElementById('dossier'); if(!host) return;
  host.hidden=true;
  host.innerHTML='';
  try{ host.setAttribute('aria-label','Dossier'); }catch(_){}
  _odStageClearSync(false);
}

// sheet tab + inline-form state (v0.4.0 datastore). Tab sticks across
// selections — adding people to many orgs in a row is the workflow.
let _odTab='ov';
let _rcForm=null;                                   // {kind, idx|null} — one open form at a time
const RC_KINDS={
  people:{ n:'People', f1:'Name', f2:'Role / section', k1:'name', k2:'role' },
  specs:{  n:'Specs',  f1:'Label', f2:'Value',          k1:'label', k2:'value' },
  notes:{  n:'Notes',  f1:'Note',  f2:null,             k1:'text',  k2:null },
  links:{  n:'Links',  f1:'Label', f2:'URL',            k1:'label', k2:'url' },
};
function _odSetTab(t){ _odTab=t; _rcForm=null; if(GlobeState.sel) showDossier(GlobeState.sel); }
try{ window._odSetTab=_odSetTab; }catch(_){}

function _odRender(s){
  const chain=(typeof parentChainOf==='function') ? parentChainOf(s.id) : [];
  const kids=((typeof childrenOf==='function') ? childrenOf(s.id) : [])
    .sort(function(a,b){ return String(a.base).localeCompare(String(b.base)); });

  // sheet header (control law): grip · trail crumbs · export · close. The grip
  // steps the detent; crumbs ARE back-navigation; nothing here needs a caption.
  let h='<button class="sh-grip" type="button" data-dzstep="1" aria-label="Expand or collapse"><span></span></button>';
  const _tr=(GlobeState._trail||[]);
  if(_tr.length>1){
    h+='<div class="sh-crumbs">';
    for(const tid of _tr.slice(-3)){
      const ts=siteById(tid); if(!ts) continue;
      const tip=(tid===_tr[_tr.length-1]);
      h+='<button type="button" class="sh-crumb'+(tip?' tip':'')+'" data-odsel="'+_odEscA(tid)+'">'+_odEsc(ts.base)+'</button>';
    }
    h+='</div>';
  }
  h+='<div class="od-head od-head-slim">'
    +'<div class="od-name">'+_odEsc(s.base)+'</div>'
    +(s.st?'<span class="bd-state">'+_odEsc(s.st)+'</span>':'')
    +'<span class="od-sp"></span>'
    +'<button class="od-ico" id="exportBtn" type="button" aria-label="Export"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4"></path><path d="M7 9l5-5 5 5"></path><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"></path></svg></button>'
    +'<button class="od-ico od-ico-x" type="button" data-odclose="1" aria-label="Clear selection">✕</button>'
    +'</div>';

  // owning unit + its expansion sub-line
  if(s.unit)     h+='<div class="od-unit">'+_odEsc(s.unit)+'</div>';

  // stats line (bd-stats grammar ~L15087)
  const recN=(typeof recCount==='function')?recCount(s.id):0;
  h+='<div class="bd-stats">'
    +(chain.length?('<span>'+chain.length+(chain.length===1?' hop':' hops')+' up the chain</span>'):'')
    +'<span>'+kids.length+' subordinate '+(kids.length===1?'site':'sites')+'</span>'
    +(recN?('<span>'+recN+' record'+(recN===1?'':'s')+'</span>'):'')
    +'</div>';

  // ── tabs (v0.4.0): Overview + the four record kinds; body renders one tab ──
  const rec=(typeof recordOf==='function')?recordOf(s.id):null;
  const cnt=function(k){ return rec?rec[k].length:0; };
  if(_odTab!=='ov' && !RC_KINDS[_odTab]) _odTab='ov';
  h+=bfHas(s.id)
    ?'<button class="bf-act in" type="button" data-bfrm="'+_odEscA(s.id)+'">In the brief · remove</button>'
    :'<button class="bf-act" type="button" data-bfadd="'+_odEscA(s.id)+'">Add to brief</button>';
  // v0.7.0: subordinates can be added at the MAP level too (owner directive)
  h+='<button class="bf-act in" type="button" data-orgadd="'+_odEscA(s.id)+'">+ Subordinate</button>';
  h+='<div class="od-tabs">'
    +'<button type="button" class="od-tab'+(_odTab==='ov'?' on':'')+'" data-odtab="ov">Overview</button>'
    +Object.keys(RC_KINDS).map(function(k){
      const c=cnt(k);
      return '<button type="button" class="od-tab'+(_odTab===k?' on':'')+'" data-odtab="'+k+'">'+RC_KINDS[k].n+(c?(' · '+c):'')+'</button>';
    }).join('')
    +'</div>';
  if(_odTab!=='ov') return h+_rcRender(s.id, _odTab);

  // UP — the command line as crumb ROWS, direct parent first → root last
  // (deviations 3-4; gold voice = m5's parent-chain arcs).
  if(chain.length){
    h+='<div class="od-sec od-sec-up">Command line <b>'+chain.length+'</b></div>';
    for(let i=0;i<chain.length;i++){
      const p=chain[i];
      const label=p.unit||'';                      // lightweight law: the hop's own headline unit
      const sub=label+(p.st?((label?' · ':'')+p.st):'');
      h+='<button class="od-crumb" type="button" data-odsel="'+_odEscA(p.id)+'">'
        +'<i class="od-hop">↑</i>'
        +'<span class="bd-nm"><b>'+_odEsc(p.base)+'</b>'+(sub?'<span>'+_odEsc(sub)+'</span>':'')+'</span>'
        +'<span class="od-sp"></span>'
        +(p.parent==null?'<span class="od-crumb-tag">HQ</span>':'')
        +'</button>';
    }
  }else{
    h+='<div class="od-sec od-sec-up">Command line</div>'
      +'<div class="od-note">Top of the chain — this site reports to no one.</div>';
  }

  // DOWN — direct children as rows with counts (deviation 5; blue voice = m5's
  // child web). One echelon by design: each row is one tap deeper.
  if(kids.length){
    h+='<div class="od-sec od-sec-down">Subordinate sites <b>'+kids.length+'</b></div>'
      +kids.map(function(c){
        const n=(typeof childrenOf==='function') ? childrenOf(c.id).length : 0;
        const sub=(c.unit||'')+(c.st?((c.unit?' · ':'')+c.st):'');
        return '<button class="bd-tile" type="button" data-odsel="'+_odEscA(c.id)+'">'
          +'<i class="od-hop od-hop-dn">↓</i>'
          +'<span class="bd-nm"><b>'+_odEsc(c.base)+'</b>'+(sub?'<span>'+_odEsc(sub)+'</span>':'')+'</span>'
          +'<span class="od-sp"></span>'
          +(n?('<span class="bd-st">'+n+' sub'+(n===1?'':'s')+'</span>'):'')
          +'</button>';
      }).join('');
  }else{
    h+='<div class="od-sec od-sec-down">Subordinate sites</div>'
      +'<div class="od-note">No subordinate sites on file.</div>';
  }
  return h;
}

// ---- THE OBJECT POPUP (v0.7.0 owner law: hierarchy objects are compact — the
// object shows almost nothing; the popup shows everything). One sheet for chain
// dots, chart chips, and custom orgs, in either room. ---------------------------
let _bfAnnEdit=null;                                 // id with the annotation form open
let _orgForm=null;                                   // {parent} when add-subordinate is open
function _bfObjSheet(id){
  const host=document.getElementById('dossier'); if(!host) return;
  _odInjectCSS();
  const esc=_odEsc, escA=_odEscA;
  const o=(typeof orgById==='function')?orgById(id):null;
  const s=o?null:siteById(id);
  if(!o && !s) return;
  const name=o?o.name:(s.unit||s.base);
  const nrec=(s && typeof recCount==='function')?recCount(id):0;
  let h='<button class="sh-grip" type="button" data-dzstep="1" aria-label="Expand or collapse"><span></span></button>';
  h+='<div class="od-head od-head-slim"><div class="od-name">'+esc(name)+'</div><span class="od-sp"></span>'
    +'<button class="od-ico od-ico-x" type="button" data-objx="1" aria-label="Close">✕</button></div>';
  h+='<div class="rc-row"><span class="rc-sub">'
    +(o ? ('Custom org'+(o.base&&siteById(o.base)?(' · '+esc(siteById(o.base).base)):''))
        : esc(s.base+(s.st?(' · '+s.st):'')))
    +(nrec?(' · '+nrec+' record'+(nrec===1?'':'s')):'')
    +'</span></div>';
  // annotation (sites in the brief wear callouts on their blocks + exports)
  if(s){
    if(_bfAnnEdit===id){
      h+='<div class="rc-form">'
        +'<input class="rc-in" id="rcF1" type="text" maxlength="80" placeholder="Callout (80 max)" value="'+escA(BRIEF.ann[id]||'')+'">'
        +'<div class="rc-btns"><span class="od-sp"></span>'
        +'<button class="rc-cancel" type="button" data-bfanncancel="1">Cancel</button>'
        +'<button class="rc-save" type="button" data-bfannsave="'+escA(id)+'">Save</button>'
        +'</div></div>';
    } else if(BRIEF.ann[id]){
      h+='<div class="rc-row"><i class="bf-ann">'+esc(BRIEF.ann[id])+'</i>'
        +'<button class="od-ico rc-dots" type="button" data-bfannedit="'+escA(id)+'" aria-label="Edit callout"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></button>'
        +'</div>';
    }
  }
  // add-subordinate: the inline two-field form (name · base), datalist-backed
  if(_orgForm && _orgForm.parent===id){
    h+='<div class="rc-form">'
      +'<input class="rc-in" id="ogF1" type="text" maxlength="60" placeholder="Organization name">'
      +'<input class="rc-in" id="ogF2" type="text" list="orgBaseList" placeholder="Base (optional — else rides '+escA(_bfAbbr(name))+')">'
      +'<datalist id="orgBaseList">'+_sitesArr().map(function(b){ return '<option value="'+escA(b.base)+'"></option>'; }).join('')+'</datalist>'
      +'<div class="rc-btns"><span class="od-sp"></span>'
      +'<button class="rc-cancel" type="button" data-orgcancel="'+escA(id)+'">Cancel</button>'
      +'<button class="rc-save" type="button" data-orgsave="'+escA(id)+'">Add</button>'
      +'</div></div>';
  } else {
    h+='<button class="rc-add" type="button" data-orgadd="'+escA(id)+'"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg> Add subordinate</button>';
  }
  // action rail: annotate (sites w/o callout yet) · map jump · remove
  h+='<div class="rc-row rc-acts">';
  if(s && !BRIEF.ann[id] && _bfAnnEdit!==id) h+='<button class="bf-act in" type="button" data-bfannedit="'+escA(id)+'">Annotate</button>';
  if(s) h+='<button class="bf-act in" type="button" data-govmap="'+escA(id)+'">Show on map</button>';
  if(s && bfHas(id)) h+='<button class="bf-act in" type="button" data-bfrm="'+escA(id)+'">Remove HQ</button>';
  if(o) h+='<button class="bf-act in" type="button" data-orgrm="'+escA(id)+'">Delete org</button>';
  h+='</div>';
  h+='<div class="ob-sp" aria-hidden="true"></div>';   // the globe button floats over this band, never over a control
  const _kept=(host.className.match(/dz-(peek|half|full)/)||[])[1];
  host.innerHTML=h;
  host.classList.remove('dz-peek','dz-half','dz-full');
  host.classList.add(_kept==='dz-full'?'dz-full':'dz-half');
  host.hidden=false;
  try{ host.setAttribute('aria-label', name); }catch(_){}
}

// ---- record tab body (v0.4.0): rows · one add/edit form · delete ------------
function _rcRender(id, kind){
  const K=RC_KINDS[kind]; const rec=recordOf(id); const items=rec?rec[kind]:[];
  let h='';
  items.forEach(function(it, i){
    if(_rcForm && _rcForm.kind===kind && _rcForm.idx===i){ h+=_rcFormHTML(kind, it, i); return; }
    let top='', sub='';
    if(kind==='people'){ top=it.name||''; sub=it.role||''; }
    else if(kind==='specs'){ top=it.label||''; sub=it.value||''; }
    else if(kind==='notes'){ top=it.text||''; sub=it.ts?new Date(it.ts).toLocaleDateString():''; }
    else { top=it.label||''; sub=it.url||''; }
    h+='<div class="rc-row">'
      +(kind==='links'&&it.url?('<a class="rc-top" href="'+_odEscA(it.url)+'" target="_blank" rel="noopener">'+_odEsc(top)+'</a>'):('<span class="rc-top">'+_odEsc(top)+'</span>'))
      +(sub?('<span class="rc-sub">'+_odEsc(sub)+'</span>'):'')
      +'<button class="od-ico rc-dots" type="button" data-rcedit="'+i+'" aria-label="Edit"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></button>'
      +'</div>';
  });
  if(_rcForm && _rcForm.kind===kind && _rcForm.idx==null) h+=_rcFormHTML(kind, null, null);
  else h+='<button class="rc-add" type="button" data-rcadd="'+kind+'"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg> Add</button>';
  return h;
}
function _rcFormHTML(kind, it, idx){
  const K=RC_KINDS[kind];
  return '<div class="rc-form">'
    +'<input class="rc-in" id="rcF1" type="text" placeholder="'+_odEscA(K.f1)+'" value="'+_odEscA(it?(it[K.k1]||''):'')+'">'
    +(K.f2?('<input class="rc-in" id="rcF2" type="text" placeholder="'+_odEscA(K.f2)+'" value="'+_odEscA(it?(it[K.k2]||''):'')+'">'):'')
    +'<div class="rc-btns">'
    +(idx!=null?('<button class="rc-del" type="button" data-rcdel="'+idx+'">Delete</button>'):'')
    +'<span class="od-sp"></span>'
    +'<button class="rc-cancel" type="button" data-rccancel="1">Cancel</button>'
    +'<button class="rc-save" type="button" data-rcsave="'+(idx==null?'':idx)+'">Save</button>'
    +'</div></div>';
}
function _rcCommit(idx){
  const id=GlobeState.sel; if(!id||!_rcForm) return;
  const K=RC_KINDS[_rcForm.kind];
  const f1=document.getElementById('rcF1'), f2=document.getElementById('rcF2');
  const v1=(f1&&f1.value||'').trim(), v2=(f2&&f2.value||'').trim();
  if(!v1){ _rcForm=null; showDossier(id); return; }   // empty first field = never save a blank row
  const item={}; item[K.k1]=v1; if(K.k2) item[K.k2]=v2;
  if(idx==null||idx==='') recAdd(id,_rcForm.kind,item); else recUpdate(id,_rcForm.kind,parseInt(idx,10),item);
  _rcForm=null; showDossier(id);
}

/* ══════════ module: s7-records ══════════ */
/* ============================================================================
   s7-records (NEW at v0.4.0) — THE DATASTORE. One record per org, keyed to its
   map site: people · specs · notes · links. Memory map is the source of truth
   at runtime; IndexedDB ('aorg2'/'records') is write-through persistence and
   loads once at boot. No accounts, no network, nothing read at boot from
   localStorage (the boot law holds — IndexedDB opens async after first paint).
   Records ride every export through Snapshot.extras.records — the spine built
   for exactly this. Backup/restore = one JSON file, in the ⋯ menu.
   ========================================================================= */
let RECORDS=Object.create(null);
let _rdb=null;

function _recBlank(id){ return {v:1, id:id, people:[], specs:[], notes:[], links:[], mod:0}; }
function recordOf(id){ return RECORDS[id]||null; }
function recCount(id){
  const r=RECORDS[id]; if(!r) return 0;
  return (r.people.length+r.specs.length+r.notes.length+r.links.length);
}
function _recSave(id){
  const r=RECORDS[id]; if(!r) return;
  r.mod=Date.now();
  try{ if(_rdb){ const tx=_rdb.transaction('records','readwrite'); tx.objectStore('records').put(r); } }catch(_){}
}
function recAdd(id, kind, item){
  if(!RECORDS[id]) RECORDS[id]=_recBlank(id);
  if(kind==='notes' && item && !item.ts) item.ts=Date.now();
  RECORDS[id][kind].push(item); _recSave(id);
}
function recUpdate(id, kind, idx, item){
  const r=RECORDS[id]; if(!r||!r[kind]||!r[kind][idx]) return;
  if(kind==='notes' && r[kind][idx].ts && !item.ts) item.ts=r[kind][idx].ts;
  r[kind][idx]=item; _recSave(id);
}
function recRemove(id, kind, idx){
  const r=RECORDS[id]; if(!r||!r[kind]) return;
  r[kind].splice(idx,1); _recSave(id);
}
function _rdbOpen(){
  try{
    if(typeof indexedDB==='undefined') return;         // stubs/old engines: memory-only, everything still works
    const rq=indexedDB.open('aorg2', 2);               // v2 (v0.5.0): + 'kv' for the brief
    rq.onupgradeneeded=function(e){
      const db=e.target.result;
      if(!db.objectStoreNames.contains('records')) db.createObjectStore('records',{keyPath:'id'});
      if(!db.objectStoreNames.contains('kv')) db.createObjectStore('kv',{keyPath:'k'});
    };
    rq.onsuccess=function(e){
      _rdb=e.target.result;
      try{
        const tx=_rdb.transaction('records','readonly');
        const all=tx.objectStore('records').getAll();
        all.onsuccess=function(){
          (all.result||[]).forEach(function(r){ if(r&&r.id) RECORDS[r.id]=r; });
          // a selection made before the load finished re-renders with its records
          try{ if(GlobeState.sel) showDossier(GlobeState.sel); }catch(_){}
        };
      }catch(_){}
      try{
        const tv=_rdb.transaction('kv','readonly');
        const gv=tv.objectStore('kv').get('views');
        gv.onsuccess=function(){ const v=gv.result&&gv.result.v; if(Array.isArray(v)) SAVEDV=v; };
      }catch(_){}
      try{
        const to=_rdb.transaction('kv','readonly');
        const go=to.objectStore('kv').get('orgs');
        go.onsuccess=function(){
          const v=go.result&&go.result.v;
          if(Array.isArray(v)){ ORGS=v.filter(function(o){ return o&&o.id&&o.name&&o.parent; }); }
          try{ if(document.body.classList.contains('brief-mode')){ renderBrief(); globeMark(); } }catch(_){}
        };
      }catch(_){}
      try{
        const tzx=_rdb.transaction('kv','readonly');
        const gz=tzx.objectStore('kv').get('selZone');
        gz.onsuccess=function(){
          const v=gz.result&&gz.result.v;
          // manual picks only ever land here; a zone set before the load finished wins
          if(v && v.tz && !window._selZone){
            window._selZone={tz:v.tz, label:v.label};
            try{ const b=document.getElementById('clockTR'); if(b) b.__k=null; tickClocks(); }catch(_){}
          }
        };
      }catch(_){}
      try{
        const tk=_rdb.transaction('kv','readonly');
        const gb=tk.objectStore('kv').get('brief');
        gb.onsuccess=function(){
          const v=gb.result&&gb.result.v;
          if(v && Array.isArray(v.hqs)){ BRIEF.hqs=v.hqs.filter(function(id){ return siteById(id); }); BRIEF.ann=v.ann||{}; }
          try{ if(document.body.classList.contains('brief-mode')) renderBrief(); }catch(_){}
        };
      }catch(_){}
    };
  }catch(_){}
}

// ---- THE BRIEF SET (v0.5.0) — the user-assembled chain of HQs + annotations ----
const BRIEF={ hqs:[], ann:{} };                        // ann: site id → ≤80-char callout
function _bfSave(){
  try{ if(_rdb){ const tx=_rdb.transaction('kv','readwrite'); tx.objectStore('kv').put({k:'brief', v:{hqs:BRIEF.hqs, ann:BRIEF.ann}}); } }catch(_){}
}
function bfHas(id){ return BRIEF.hqs.indexOf(id)>=0; }
function bfAdd(id){
  if(!siteById(id) || bfHas(id)) return;
  BRIEF.hqs.push(id); _bfSave();
  try{ renderBrief(); }catch(_){}
  try{ globeMark(); }catch(_){}
  try{ if(GlobeState.sel && !document.body.classList.contains('brief-mode')) showDossier(GlobeState.sel); }catch(_){}
}
function bfRemove(id){
  const i=BRIEF.hqs.indexOf(id); if(i<0) return;
  BRIEF.hqs.splice(i,1); delete BRIEF.ann[id]; _bfSave();
  try{ renderBrief(); }catch(_){}
  try{ globeMark(); }catch(_){}
  try{ if(GlobeState.sel && !document.body.classList.contains('brief-mode')) showDossier(GlobeState.sel); }catch(_){}
}
function bfNote(id, text){
  text=String(text||'').slice(0,80).trim();
  if(text) BRIEF.ann[id]=text; else delete BRIEF.ann[id];
  _bfSave();
  try{ renderBrief(); }catch(_){}
}
try{ window.Brief={ add:bfAdd, remove:bfRemove, note:bfNote, has:bfHas, list:function(){ return BRIEF.hqs.slice(); } }; }catch(_){}

// ---- CUSTOM SUBORDINATE ORGS (v0.7.0 owner directive) — user-built children on
// any parent (site or custom org), added from the tree popup or the map card.
// {id:'org-…', name, parent, base|null} — base names the site whose coordinates
// the node LIVES at on the globe; no base → it rides its nearest located
// ancestor. Persisted in kv 'orgs'; rides Snapshot.extras.orgs.
let ORGS=[];
function _orgSave(){ try{ if(_rdb){ const tx=_rdb.transaction('kv','readwrite'); tx.objectStore('kv').put({k:'orgs', v:ORGS}); } }catch(_){} }
function orgById(id){ for(let i=0;i<ORGS.length;i++) if(ORGS[i].id===id) return ORGS[i]; return null; }
function orgKidsOf(pid){ return ORGS.filter(function(o){ return o.parent===pid; }); }
function orgAdd(name, parent, base){
  name=String(name||'').trim().slice(0,60); if(!name) return null;
  if(!siteById(parent) && !orgById(parent)) return null;
  const id='org-'+Date.now().toString(36)+'-'+(ORGS.length+1);
  const o={id:id, name:name, parent:parent, base:(base&&siteById(base))?base:null};
  ORGS.push(o); _orgSave();
  try{ renderBrief(); }catch(_){}
  try{ globeMark(); }catch(_){}
  return o;
}
function orgRemove(id){
  const i=ORGS.findIndex(function(o){ return o.id===id; }); if(i<0) return;
  const dead=ORGS[i]; ORGS.splice(i,1);
  // children of the removed node climb to its parent — a delete never strands a branch
  ORGS.forEach(function(o){ if(o.parent===id) o.parent=dead.parent; });
  _orgSave();
  try{ renderBrief(); }catch(_){}
  try{ globeMark(); }catch(_){}
}
try{ window.Orgs={ add:orgAdd, remove:orgRemove, of:orgKidsOf, byId:orgById, list:function(){ return ORGS.slice(); } }; }catch(_){}

// ---- SAVED VIEWS (v0.6.0) — camera + selection + mode, recalled in one tap ----
let SAVEDV=[];
function _svSave(){ try{ if(_rdb){ const tx=_rdb.transaction('kv','readwrite'); tx.objectStore('kv').put({k:'views', v:SAVEDV}); } }catch(_){} }
function svCapture(){
  const sel=GlobeState.sel?siteById(GlobeState.sel):null;
  SAVEDV.unshift({
    n: sel ? sel.base : ('View '+(SAVEDV.length+1)),
    yaw:GlobeState.yaw, pitch:GlobeState.pitch, zoom:GlobeState.zoom,
    sel:GlobeState.sel, brief:document.body.classList.contains('brief-mode'),

/* ============================================================================
   s6-export (NEW at v0.2.0) — THE SNAPSHOT SPINE. The flagship export contract:
   buildSnapshot(scope) is the ONE producer every exporter consumes — take what
   the map shows AND the data beneath it, in one serializable object. Future
   layers (M2 datastore people/notes/equipment, M3 brief chains) ATTACH to
   Snapshot.sites rows / Snapshot.extras — renderers never learn app internals,
   so export never has to be rebuilt. Renderers today: PNG · PDF (print) ·
   HTML dossier (self-contained file) · JSON.
   ========================================================================= */

// scope: 'auto' (selection family if selected, else everything visible-eligible)
function buildSnapshot(scope){
  scope=scope||'auto';
  const sel=GlobeState.sel?siteById(GlobeState.sel):null;
  const off=GlobeState._famOff||new Set();
  const chain=sel?parentChainOf(sel.id):[];
  const kids=sel?childrenOf(sel.id):[];
  let rows;
  if(sel && scope!=='all'){
    rows=[sel].concat(chain, kids);
  } else {
    rows=_sitesArr().filter(function(st){ return !off.has(clsOf(st.id)); });
  }
  const seen=new Set(); rows=rows.filter(function(r){ if(!r||seen.has(r.id)) return false; seen.add(r.id); return true; });
  const famCounts={}; rows.forEach(function(r){ const k=clsOf(r.id); famCounts[k]=(famCounts[k]||0)+1; });
  let img=null;
  try{ const cv=document.getElementById('globeCanvas'); if(cv&&cv.toDataURL) img=cv.toDataURL('image/png'); }catch(_){}
  const cam=(function(){ try{ return {zoom:GlobeState.zoom, yaw:GlobeState.yaw, pitch:GlobeState.pitch}; }catch(_){ return {}; } })();
  return {
    meta:{ app:'A-ORG-2', version:(typeof APP_VERSION!=='undefined'?APP_VERSION:''),
           generated:new Date().toISOString(),
           title: (function(){ try{ if(document.body.classList.contains('brief-mode')&&BRIEF.hqs.length){ const h0=siteById(BRIEF.hqs[0]); return 'Brief — '+(h0?(h0.unit||h0.base):'')+(BRIEF.hqs.length>1?(' +'+(BRIEF.hqs.length-1)):''); } }catch(_){} return sel ? (sel.base+' — '+(sel.unit||'')) : 'U.S. Army — global laydown'; })(),
           scope: sel&&scope!=='all' ? 'selection-family' : 'all-visible' },
    camera:cam,
    selection: sel ? { id:sel.id, chainUp:chain.map(function(c){return c.id;}), children:kids.map(function(k){return k.id;}) } : null,
    filters:{ classesOff:Array.from(off) },
    classes:famCounts,
    sites:rows.map(function(r){ return { id:r.id, base:r.base, st:r.st, unit:r.unit,
      lat:r.lat, lon:r.lon, grp:r.grp, parent:r.parent, cls:clsOf(r.id) }; }),
    extras:{ brief:(BRIEF.hqs.length?{hqs:BRIEF.hqs.slice(), ann:JSON.parse(JSON.stringify(BRIEF.ann))}:null),
      orgs:((typeof ORGS!=='undefined'&&ORGS.length)?JSON.parse(JSON.stringify(ORGS)):null),   // custom subordinates ride too (v0.7.0)
      records:(function(){                     // the datastore rides every export
      const out={}; if(typeof recordOf==='function') rows.forEach(function(r){ const rec=recordOf(r.id); if(rec && recCount(r.id)) out[r.id]=rec; });
      return out; })() },
    image:img,
  };
}

function _xpDownload(name, mime, data){

    const blob=(data instanceof Blob)?data:new Blob([data],{type:mime});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download=name;
    document.body.appendChild(a); a.click();

  }catch(e){ try{ window._errToast&&_errToast('export failed: '+e.message); }catch(_){} }

function exportPNG(){

// ---- seg7 engine (PORTED verbatim; geometry from ada3f5d~1 L982-988) ----------
const SEG7_MAP={'0':'abcdef','1':'bc','2':'abged','3':'abgcd','4':'fgbc','5':'afgcd','6':'afgedc','7':'abc','8':'abcdefg','9':'abcfgd','-':'g',' ':''};
function seg7Digit(ch){
  const on=SEG7_MAP[ch]!==undefined?SEG7_MAP[ch]:'';
  let s='<span class="seg7-d">';
  ['a','b','c','d','e','f','g'].forEach(function(g){ s+='<i class="sg sg-'+g+(on.indexOf(g)>=0?' on':'')+'"></i>'; });
  return s+'</span>';
}
function seg7HTML(str){
  let s='<span class="seg7">';
  for(const ch of String(str)) s+= ch===':' ? '<span class="seg7-colon"><i></i><i></i></span>' : seg7Digit(ch);
  return s+'</span>';
}

// 12h civilian face for an IANA zone (PORTED ~L18780: leading-zero hours — the
// LCD always shows 2+2 digits; '--:--' failure face maps to segment g / blank).
function civilianTime(tz, d){
  d=d||new Date();
  try{
    const p=new Intl.DateTimeFormat('en-US',{timeZone:tz,hour:'numeric',minute:'2-digit',hour12:true}).formatToParts(d);
    let hh='12',mm='00',ap='AM';
    p.forEach(function(x){ if(x.type==='hour')hh=x.value; if(x.type==='minute')mm=x.value; if(x.type==='dayPeriod')ap=x.value.toUpperCase(); });
    return {time:hh.padStart(2,'0')+':'+mm, ap:ap};
  }catch(_){ return {time:'--:--', ap:''}; }
}

// nearest theater region (PORTED exact: dlon wrapped ±180, lon scaled by
// cos(mean lat) — dateline-safe; min squared-degrees wins)
function nearRegion(lat, lon){
  let best=null, bs=1e9;
  CLOCK_REGIONS.forEach(function(r){
    const dlat=lat-r.ll[0], dlon=((lon-r.ll[1]+540)%360)-180;
    const s=dlat*dlat + Math.pow(dlon*Math.cos(((lat+r.ll[0])/2)*Math.PI/180), 2);
    if(s<bs){ bs=s; best=r; }
  });
  return best;
}

// called from every selection: manual pick wins (early return); clearing the
// selection clears an auto zone (PORTED precedence law)
function autoFillSelect(site){
  if(window._selZone && !window._selZone.auto) return;
  if(!site || site.lat==null){ if(window._selZone && window._selZone.auto) window._setSelZone(null, {ephemeral:true}); return; }
  const r=nearRegion(site.lat, site.lon);
  if(r) window._setSelZone({tz:r.tz, label:r.name.toUpperCase().slice(0,12), auto:true}, {ephemeral:true});
}

    const L=window.__errLog||[];
    const txt=L.length? L.map(function(e){ return '['+e.k+'] '+e.m+'\n  @ '+(e.s||'inline')+':'+e.l+':'+e.c+(e.st?('\n  '+e.st.split('\n').slice(0,3).join(' | ')):''); }).join('\n\n') : 'No errors captured this session.';
    try{ prompt('Diagnostics — last '+L.length+' error(s). Copy below:', txt.slice(0,900)); }
    catch(_){ alert(txt.slice(0,900)); }
  };

  // Sandbox banner (PORT of A-ORG-1 ~L22198): preview hosts announce themselves
  // so host console noise is never mistaken for an A-ORG-2 defect.
  try{
    if(window.__SANDBOX && !document.getElementById('sbxNote')){
      const nb=document.createElement('div'); nb.id='sbxNote';
      nb.innerHTML='⧉ <b>Preview sandbox</b> — host console noise is expected here and does not come from A-ORG-2. Test the deployed app for real signals. <button aria-label="Dismiss">✕</button>';
      nb.querySelector('button').addEventListener('click', function(){ nb.remove(); });
      document.body.appendChild(nb);
    }
  }catch(_){}
}
bootShell();
</script>
</body>
</html>
