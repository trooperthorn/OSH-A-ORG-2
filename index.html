async function loadGlobeCoastlinesHi(){
  if(_globeLoadedHi) return;
  // A-ORG-1 v8.9.1 lineage: the real coastlines ship WITH the app (data/,
  // same-origin, SW-precached). A-ORG-2 ladder (deviations 1–2): 110m first
  // for a fast first paint, then 50m upgrades the same GLOBE_RINGS in place.
  const SOURCES=[
    'data/land-110m.json',
    'data/land-50m.json'
  ];
  for(const SRC of SOURCES){
    try{
      const r=await fetch(SRC); if(!r.ok) continue;
      const topo=await r.json();
      const rings=decodeTopoLand(topo);
      if(rings && rings.length>20){
        GLOBE_RINGS=rings; _globeLoadedHi=true;
        try{ _shoreHarvest(); }catch(_){}   // v0.33.0: US-edge classification keys off THIS coast — re-run per rung
        if(window.GlobeState){ GlobeState.dirty=true; }   // redraw with real coastlines
      }
    }catch(e){ /* rung failed → keep current rings, try the next rung */ }
  }
  /* both rungs failed → keep embedded fallback */
}

// Load US state borders and decode to lon/lat rings for the globe. Same-origin
// data/ only (deviation 1). The us-atlas states file MAY be in Albers USA
// projection, so the projected case inverts that projection back to lon/lat.
async function loadStateBorders(){
  if(_statesLoaded) return;
  const SOURCES=[
    'data/states-10m.json'
  ];
  for(const SRC of SOURCES){
    try{
      const r=await fetch(SRC); if(!r.ok) continue;
      const topo=await r.json();
      // us-atlas ships two variants: states-10m.json is UNPROJECTED lon/lat, while the -albers-
      // file is pre-projected to a 975x610 canvas. Auto-detect: decode raw first — if the
      // coordinates are already geographic, use them directly (this also keeps REAL Alaska &
      // Hawaii outlines); only run the Albers inverse when the data is actually projected.
      // detect projection off the polygon decode, then take the INTERIOR MESH
      // (shared borders only — the coast is the land layer's, drawn once)
      const _probe=_decodeTopoLonLat(topo,'states');
      const _geo=_ringsLookGeographic(_probe);
      const rings=_topoInteriorMesh(topo,'states', _geo?null:_albersUsaInvert);
      if(rings && rings.length>=30){
        GLOBE_STATE_RINGS=rings; _statesLoaded=true;
        try{ _US_EDGE_CAND=_topoSingleUse(topo,'states', _geo?null:_albersUsaInvert); _shoreHarvest(); }catch(_){ _US_EDGE_CAND=null; GLOBE_SHORE_RINGS=[]; }
        try{ GLOBE_STATE_SHAPES=_namedStateShapes(topo, _geo); }catch(_){ GLOBE_STATE_SHAPES=null; }
        if(window.GlobeState){ GlobeState.dirty=true; }
        return;
      }
    }catch(e){ /* try next */ }
  }
}

// Invert the d3 Albers-USA projection (approx) to recover lon/lat from projected x/y.
// us-atlas states-10m.json is pre-projected to a 975x610 viewport in Albers USA.
function _albersUsaInvert(x, y){
  // Inverse of d3.geoAlbersUsa as used by us-atlas v3 (975x610 viewport): scale 1300,
  // translate [487.5, 305], screen y-down. Verified: US center → canvas center, coasts span
  // the full width, and it round-trips exactly.
  const scale=1300, tx=487.5, ty=305;
  const phi0=37.5*Math.PI/180, lam0=-96*Math.PI/180;
  const p1=29.5*Math.PI/180, p2=45.5*Math.PI/180;
  const n=(Math.sin(p1)+Math.sin(p2))/2;
  const C=Math.cos(p1)*Math.cos(p1)+2*n*Math.sin(p1);
  const rho0=Math.sqrt(C-2*n*Math.sin(phi0))/n;
  const px=(x - tx)/scale, py=-(y - ty)/scale;   // negated: screen-up = north (matches on-device result)
  const rho0my=rho0 - py;
  const rho=Math.sqrt(px*px + rho0my*rho0my);
  const theta=Math.atan2(px, rho0my);
  const phi=Math.asin(Math.max(-1,Math.min(1,(C - rho*rho*n*n)/(2*n))));
  const lam=lam0 + theta/n;
  return [lam*180/Math.PI, phi*180/Math.PI];
}

function _ringsLookGeographic(rings){
  if(!rings || !rings.length) return false;
  let n=0, okc=0, minLon=999;
  for(const ring of rings){
    for(const p of ring){ n++; if(p[0]>=-180&&p[0]<=180&&p[1]>=-90&&p[1]<=90) okc++; if(p[0]<minLon) minLon=p[0]; if(n>400) break; }
    if(n>400) break;
  }
  return okc>n*0.98 && minLon<-60;   // US longitudes are negative; projected pixels sit in 0..975
}

// (decodeStatesTopo cut at v0.11.0 — the states layer now takes the interior
// mesh; _albersUsaInvert survives as the mesh's projection inverse. Recover
// from git history if a full-polygon states decode ever returns.)

// Load WORLD country borders (lon/lat TopoJSON — no projection inversion needed) from the
// same-origin data/ file (deviation 1). Drawn as a thin global context layer.

// v0.11.0 (owner: "map looks double traced — sharpen and fix"): border layers
// were decoding FULL polygons, so every coastline got re-stroked by the state
// and country rings on top of the land layer, and every shared border drew
// twice. This decoder emits the INTERIOR MESH instead — each TopoJSON arc once,
// and only arcs shared by two geometries (a real border). Coastal arcs belong
// to exactly one polygon and are skipped: the land layer owns the coast.
function _topoInteriorMesh(topo, objName, projInvert, exclGeom){
  const tr=topo.transform, arcs=topo.arcs;
  const obj=topo.objects && topo.objects[objName]; if(!obj) return [];
  const use=new Array(arcs.length).fill(0);
  const drop=new Set();                        // arcs of excluded geometries (v0.33.0: the USA's — 10m owns them)
  function tally(ix, ex){ for(const i of ix){ const a=i<0?~i:i; use[a]++; if(ex) drop.add(a); } }
  for(const g of (obj.geometries||[])){
    const ex=!!(exclGeom && exclGeom(g));
    if(g.type==='Polygon'){ for(const r of g.arcs) tally(r, ex); }
    else if(g.type==='MultiPolygon'){ for(const poly of g.arcs) for(const r of poly) tally(r, ex); }
  }
  const out=[];
  for(let i=0;i<arcs.length;i++){
    if(use[i]<2 || drop.has(i)) continue;      // coastline / unused / excluded — not this layer's border
    let x=0,y=0; const line=[];
    for(const d of arcs[i]){
      let px,py;
      if(tr){ x+=d[0]; y+=d[1]; px=x*tr.scale[0]+tr.translate[0]; py=y*tr.scale[1]+tr.translate[1]; }
      else { px=d[0]; py=d[1]; }
      line.push(projInvert ? projInvert(px,py) : [px,py]);
    }
    if(line.length>1) out.push(line);
  }
  return out;
}

// ── ONE SOURCE PER EDGE (v0.33.0, owner: "globe looks traced unevenly 3 times —
// resolve in its entirety"). The v0.31.1 lakes fix stacked a THIRD dataset onto
// the basemap, and three resolutions of the same US perimeter drew as offset
// parallel wobbles (10m lakeshore beside the 110m mid-lake border; the coarse
// 110m US-Canada/US-Mexico lines beside crisp 10m state edges). The law now:
// every edge draws ONCE, from the best source that has it —
//   · ocean coast            → land-50m (world layer), nobody retraces it
//   · US inland edges        → states-10m single-use arcs (Great Lakes shores,
//     US-Canada, US-Mexico, AK-Canada), classified per POINT by distance from
//     the live 50m coast and split into inland segments — coast-hugging points
//     drop out, so nothing doubles the land layer anywhere (Maine's single arc
//     is half coast, half border: segment splitting handles it; arc-level
//     rules cannot)
//   · other countries' borders → countries-110m mesh, with every arc the USA
//     polygon touches REMOVED (see loadCountryBorders) — the coarse offset
//     US border is the "third trace" and it is gone
// _shoreHarvest re-runs when land-110m upgrades to land-50m (the classifier
// keys off whichever coast is live), so the load race is harmless.
let _US_EDGE_CAND=null;                       // decoded single-use states-10m lines
function _topoSingleUse(topo, objName, projInvert){
  const tr=topo.transform, arcs=topo.arcs;
  const obj=topo.objects && topo.objects[objName]; if(!obj) return [];
  const use=new Array(arcs.length).fill(0);
  function tally(ix){ for(const i of ix) use[i<0?~i:i]++; }
  for(const g of (obj.geometries||[])){
    if(g.type==='Polygon'){ for(const r of g.arcs) tally(r); }
    else if(g.type==='MultiPolygon'){ for(const poly of g.arcs) for(const r of poly) tally(r); }
  }
  const out=[];
  for(let i=0;i<arcs.length;i++){
    if(use[i]!==1) continue;                   // shared border → the mesh owns it
    let x=0,y=0; const line=[];
    for(const d of arcs[i]){
      let px,py;
      if(tr){ x+=d[0]; y+=d[1]; px=x*tr.scale[0]+tr.translate[0]; py=y*tr.scale[1]+tr.translate[1]; }
      else { px=d[0]; py=d[1]; }
      const pt=projInvert ? projInvert(px,py) : [px,py];
      if(pt) line.push(pt);
    }
    if(line.length>1) out.push(line);
  }
  return out;
}
function _shoreHarvest(){
  if(!_US_EDGE_CAND || !_US_EDGE_CAND.length) return;
  try{
    // grid-hash the live coast's points over greater North America (0.3° cells;
    // own + 8 neighbors ≈ within ~0.6° counts as "on the coast")
    const cell=0.3, seen=new Set();
    for(const ring of GLOBE_RINGS){
      for(const pt of ring){
        const lo=pt[0], la=pt[1];
        if(lo<-172||lo>-48||la<15||la>75) continue;
        seen.add(Math.floor(lo/cell)+':'+Math.floor(la/cell));
      }
    }
    if(!seen.size) return;
    const nearCoast=function(lo,la){
      const cx=Math.floor(lo/cell), cy=Math.floor(la/cell);
      for(let dx=-1;dx<=1;dx++) for(let dy=-1;dy<=1;dy++) if(seen.has((cx+dx)+':'+(cy+dy))) return true;
      return false;
    };
    const out=[];
    for(const line of _US_EDGE_CAND){
      let seg=null, prevNear=null;
      for(const pt of line){
        if(!nearCoast(pt[0], pt[1])){
          if(!seg){ seg=[]; if(prevNear) seg.push(prevNear); }   // reach one point INTO the coast zone — border meets coast without a gap
          seg.push(pt); prevNear=null;
        } else {
          if(seg){ seg.push(pt); if(seg.length>2) out.push(seg); seg=null; }
          prevNear=pt;
        }
      }
      if(seg && seg.length>2) out.push(seg);
    }
    GLOBE_SHORE_RINGS=out;
    if(window.GlobeState){ GlobeState.dirty=true; }
  }catch(_){}
}

async function loadCountryBorders(){
  if(_countriesLoaded) return;
  const SOURCES=[
    'data/countries-110m.json'
  ];
  for(const SRC of SOURCES){
    try{
      const r=await fetch(SRC); if(!r.ok) continue;
      const topo=await r.json();
      // interior borders ONLY (no coast retrace). v0.33.0: every arc the USA
      // polygon touches is dropped — its coarse US-Canada/US-Mexico lines drew
      // OFFSET beside the crisp 10m edges (the owner's "traced 3 times").
      const rings=_topoInteriorMesh(topo,'countries', null,
        function(g){ return /United States/.test((g.properties&&g.properties.name)||''); });
      if(rings && rings.length>50){
        GLOBE_COUNTRY_RINGS=rings; _countriesLoaded=true;
        if(window.GlobeState){ GlobeState.dirty=true; }
        return;
      }
    }catch(e){ /* try next */ }
  }
}

// Generic TopoJSON→lon/lat ring decoder (delta-decoded arcs + transform; data already geographic).
function _decodeTopoLonLat(topo, objName){
  const tr=topo.transform, arcs=topo.arcs;
  const obj=topo.objects && topo.objects[objName]; if(!obj) return [];
  function dec(a){ let x=0,y=0; const o=[]; for(const d of a){ if(tr){ x+=d[0]; y+=d[1]; o.push([x*tr.scale[0]+tr.translate[0], y*tr.scale[1]+tr.translate[1]]); } else o.push([d[0],d[1]]); } return o; }
  const D=arcs.map(dec);
  function ringFor(ix){ let p=[]; for(let k=0;k<ix.length;k++){ let i=ix[k],a; if(i<0){a=D[~i].slice().reverse();} else {a=D[i];} if(k>0) a=a.slice(1); p=p.concat(a); } return p; }
  const out=[];
  for(const g of (obj.geometries||[])){
    if(g.type==='Polygon'){ for(const r of g.arcs) out.push(ringFor(r)); }
    else if(g.type==='MultiPolygon'){ for(const poly of g.arcs) for(const r of poly) out.push(ringFor(r)); }
  }
  return out;
}

function decodeTopoLand(topo){
  const tr=topo.transform, arcs=topo.arcs;
  const sx=tr.scale[0], sy=tr.scale[1], tx=tr.translate[0], ty=tr.translate[1];
  function decodeArc(arc){ let x=0,y=0; const out=[]; for(const d of arc){ x+=d[0]; y+=d[1]; out.push([x*sx+tx, y*sy+ty]); } return out; }
  const decoded=arcs.map(decodeArc);
  function ringFor(arcIdxs){
    let pts=[];
    for(let k=0;k<arcIdxs.length;k++){
      let idx=arcIdxs[k], arc;
      if(idx<0){ arc=decoded[~idx].slice().reverse(); } else { arc=decoded[idx]; }
      if(k>0) arc=arc.slice(1);
      pts=pts.concat(arc);
    }
    return pts;
  }
  const out=[]; const geoms=topo.objects.land.geometries;
  for(const g of geoms){
    if(g.type==='Polygon'){ for(const r of g.arcs) out.push(ringFor(r)); }
    else if(g.type==='MultiPolygon'){ for(const poly of g.arcs) for(const r of poly) out.push(ringFor(r)); }
  }
  return out;
}

// Decode the states topojson KEEPING per-state identity (the border layer flattens it).
// Ported from A-ORG-1's brief-states section (deviation 4): it is pure topo→rings decode,
// so it lives with the other decoders; GLOBE_STATE_SHAPES fills the moment states load.
function _namedStateShapes(topo, geographic){
  const obj=topo.objects && (topo.objects.states || topo.objects['states-10m']); if(!obj) return null;
  const tr=topo.transform, arcs=topo.arcs;
  function dec(a){ let x=0,y=0; const o=[]; for(const d of a){ if(tr){ x+=d[0]; y+=d[1]; o.push([x*tr.scale[0]+tr.translate[0], y*tr.scale[1]+tr.translate[1]]); } else o.push([d[0],d[1]]); } return o; }
  const D=arcs.map(dec);
  function ringFor(ix){ let p=[]; for(let k=0;k<ix.length;k++){ let i=ix[k],a; if(i<0){a=D[~i].slice().reverse();} else {a=D[i];} if(k>0) a=a.slice(1); p=p.concat(a); } return p; }
  const out={};
  for(const g of (obj.geometries||[])){
    const nm=g.properties && g.properties.name; if(!nm) continue;
    const rings=[];
    if(g.type==='Polygon'){ for(const r of g.arcs) rings.push(ringFor(r)); }
    else if(g.type==='MultiPolygon'){ for(const poly of g.arcs) for(const r of poly) rings.push(ringFor(r)); }
    out[nm]=geographic? rings : rings.map(function(r){ return r.map(function(pt){ const v=_albersUsaInvert(pt[0],pt[1]); return (v&&v.length===2)?v:null; }).filter(Boolean); });
  }
  // v1.6.0: the roster names territories the owner's way — alias the file's
  // long-form key so 'Virgin Islands' finds its rings.
  if(out['United States Virgin Islands'] && !out['Virgin Islands']) out['Virgin Islands']=out['United States Virgin Islands'];
  return out;
}


/* ══════════ module: s3-search ══════════ */
// ═══════════════════════════════════════════════════════════════════════════════
// s3-search.js — A-ORG-2 shell: THE ONE SEARCH (charter law: one selection model,
// one search). Index over sites (base + unit + st) at boot; #searchPill input
// filters as-you-type; #searchResults shows the top TWO results as large rows
// (MAP-FIRST grammar) + an honest count line; Enter/tap selects.
// (PORTED from A-ORG-1 index.html — the source is truth; names kept where ported.)
//
// Ported from A-ORG-1 (function/state names kept where the code came across):
//   sfsResults          (~L22779)  the stage-search results law: trim, <2 chars → no
//                                  results, TOP TWO ONLY (owner v18.4.0: "only allow
//                                  for 2 organizations to drop down based off what's
//                                  input"), prefix-beats-substring, shorter wins ties.
//   sfsRender           (~L22788)  dropdown rows via innerHTML of <button data-sfs>
//                                  rows with attribute/body escaping; the v21.5.1
//                                  zero-result state that never dead-ends silently.
//   _usRun ranking      (~L22141)  the v22.3.1 word-start scoring ladder: exact 100 ·
//                                  prefix 80 · word-start 60 (token regex
//                                  (^|[\s(\-\/]) + regex-escaped query) · expansion
//                                  word-start · bare substring floor; +8 whole-word
//                                  bonus; −min(10, len/12) shorter-name tiebreak.
//   Enter-selects       (~L22805)  Enter clicks a '#searchResults [data-sfs]' row.
//   Esc clears          (~L22772)  Esc with text: clear value + empty the dropdown
//                                  (and ONLY that — the event stops there).
//   tap-select cleanup  (~L22845)  after a row tap: i.value=''; i.blur(); render([]).
//   blur collapse       (~L23570)  blur + 150ms: an empty field folds its results.
//   esc / _escA         (~L14030/14129)  HTML body / attribute escaping (renamed
//                                  _srEsc/_srEscA here — see deviation 8).
//   boot idiom          (~L23544)  addEventListener('load', setTimeout(try{}catch))
//                                  + the __mdWired-style once-guard.
//   row grammar (CSS)   (~L5365 .sfs-dd, ~L1856 .us-row)  dropdown = flex column,
//                                  gap 6px; rows = borderless radius cards, bold
//                                  name + dim sub, hairline ring, accent ring on
//                                  hover/highlight. Colors → A-ORG-2 tokens.
//
// NEW (A-ORG-2 contracts, no direct A-ORG-1 counterpart):
//   buildSearchIndex()   boot index over SITES: {base, unit(+unitFull), st} folded
//                        once (m5's _siteIndex identity-cache idiom, so a SITES
//                        swap re-indexes lazily and boot order can't break it).
//   searchSelect(id)     THE select: GlobeState.sel = site id + dirty (m5 deviation
//                        6 lazy-follow picks up the arcs), flyToLatLon(site), then
//                        the showDossier(id) hook — all guarded typeof, order-safe.
//   initSearch()         shell boot hook: build index + inject the search CSS. Also
//                        self-arms on 'load' (once-guarded) so the search works
//                        even if the shell forgets to call it.
//   _srFold()            diacritic/case folding (NFD strip) — mission-mandated;
//                        A-ORG-1 never folded ("Chièvres" was unfindable as
//                        "chievres"; 276-site A-ORG-2 is international by charter).
//
// DEVIATIONS (everything changed vs. A-ORG-1, and why):
//   1. ONE search, not three. A-ORG-1 grew a stage pill (sfs*), a universal overlay
//      (_usRun/openUSearch) and a workspace filter; the sfs zero-result row escaped
//      into universal search. A-ORG-2's single-brain law collapses them: sfsResults
//      carries _usRun's ranking directly, and the zero-result state is a plain
//      "No matches" card (there is no second search to escape to).
//   2. sfsResults(q) searches SITES (flat array, parent pointer only) instead of
//      walking ARMY_DATA's tree, and returns {list, total, q} instead of an array
//      of names: the count line needs the TRUE match count, so the source's
//      40-hit walk cap is gone (276 sites, one O(n) pass — no cap needed).
//   3. Scoring ladder extended per mission: BASE-NAME HITS BEAT UNIT HITS. Base
//      keeps the source rungs (exact 100 · prefix 80 · word-start 60, +8 whole
//      word); unit rungs sit strictly below the lowest base rung (exact 50 ·
//      prefix 44 · word-start 38), unitFull word-start 30 (the source's fl rung),
//      st exact 26 / word-start 22 (st is a searchable field per mission — "NC"
//      must find North Carolina posts), bare substring floor 10. Length tiebreak
//      ported unchanged, on the base name.
//   4. Rows carry data-sfs="<site id>" (A-ORG-1 carried the org NAME because
//      selectOrgNode took names). A-ORG-2's selection model is GlobeState.sel =
//      site id (shell contract), and ids are machine-safe slugs.
//   5. Arrow-key highlight is NEW (mission): _sfsHi moves over the rows,
//      re-rendering classes only; Enter clicks the highlighted row where A-ORG-1
//      always clicked the first. With no arrows pressed _sfsHi is 0 — identical
//      behavior to the source.
//   6. searchSelect does NOT call _syncSelArcs: m5's lazy follow (_selSyncCheck,
//      its deviation 6) rebuilds arcs from GlobeState.sel on the next dirty frame.
//      Setting sel + globeMark() is the entire selection contract.
//   7. Input/keydown/click land as document-level DELEGATED listeners installed at
//      script eval (A-ORG-1's own pattern for sfsInput, ~L22802-22808) — they need
//      no DOM at install time, so concatenation order and shell build order can't
//      race them. The field is matched by 'input inside #searchPill' instead of
//      id==='sfsInput' (shell contract names the pill, not the input).
//   8. esc/_escA are renamed _srEsc/_srEscA: the canonical names are app-wide
//      utilities that belong to the shell core at concatenation; a second
//      top-level `function esc(` would collide. Bodies are the source's, verbatim.
//   9. CSS ships as a JS-injected <style id="s3SearchCSS"> — construction-phase
//      only. m-modules are canvas-side and own no CSS; this module builds DOM. At
//      final assembly the block moves verbatim into index.html's single <style>
//      (dead-lint expects one style block) and the injector no-ops via its
//      already-present guard. Tokens only; phone-first; the sole desktop tweak
//      sits inside @media(min-width:1100px); no position:fixed, no transforms
//      (the results stack can scroll — transform-free per the reliability
//      contract). Pill/dropdown GEOMETRY (where the search sits on the stage) is
//      the shell owner's; this block styles only what this module renders.
//  10. tenants are NOT indexed — mission scopes the index to base + unit + st
//      (unitFull rides along as the unit's expansion, exactly like _usRun's
//      n.full). Tenant search is a backlog item for the dossier owner.
//
// OWNERSHIP (concatenation law — no duplicate top-level declarations):
//   - DECLARED HERE: buildSearchIndex, sfsResults, sfsRender, searchSelect,
//     initSearch, _searchEntries, _srFold, _srEsc, _srEscA, _sfsField,
//     _isSearchField, _srInjectCSS, _srEntries, _srSrc, _sfsHi, _srBooted.
//   - USED, declared elsewhere (ALL guarded typeof at call time): GlobeState
//     (shell), SITES (shell data loader), siteById (m5), globeMark (m2),
//     flyToLatLon (m4), showDossier (dossier owner's hook — optional).
//
// CONTRACTS HONORED:
//   - Reads SITES / GlobeState at call time only — concatenation-order safe.
//   - Redraw law: selection marks GlobeState.dirty once per select (an event,
//     never per-frame); nothing here touches the render loop.
//   - No frameworks, no webfonts, sloppy-mode top-level function declarations.
//   - Brief tier tokens (--t1..--t4) untouched; no green near data.
// ═══════════════════════════════════════════════════════════════════════════════

// A-ORG-1's four grouping shells — structure, not commands. They stay OUT of
// search and OUT of the brief's subordinates picker (their children surface
// directly); the map-room tree shows them faithfully.
const _OG_CATS={acoms:1, asccs:1, drus:1, 'acquisition-paes-cpes':1};

// ---- Escaping (PORT of esc ~L14030 / _escA ~L14129 — renamed, deviation 8) -----
function _srEsc(s){ return String(s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }
function _srEscA(v){ return String(v).replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

// ---- Diacritic/case fold (NEW — mission-mandated; deviation in header) ---------
function _srFold(s){
  s=String(s==null?'':s).toLowerCase();
  try{ s=s.normalize('NFD').replace(/[\u0300-\u036f]/g,''); }catch(_){}
  return s;
}

// ---- The index: SITES folded once, rebuilt only when SITES identity changes ----
// (m5 _siteIndex idiom — boot builds it, a data swap re-indexes lazily.)
let _srEntries=null, _srSrc=null;

function _searchEntries(){
  const arr=(typeof SITES!=='undefined' && SITES && SITES.length!=null) ? SITES : [];
  if(_srSrc===arr && _srEntries) return _srEntries;
  _srEntries=[];
  for(const s of arr){
    if(!s || s.id==null) continue;
    // the site's unit voice = its PRIMARY org from the A-ORG-1 tree (v0.11.0:
    // the tree is the ONE structure — the old site.unit field no longer speaks)
    const base=String(s.base||s.id), st=String(s.st||'');
    const po=(typeof ogPrimary==='function')?ogPrimary(s.id):null;
    const unit=po?String(po.name):'';
    _srEntries.push({
      id:s.id, base:base,
      sub:(unit?unit:'')+((unit&&st)?' · ':'')+st,          // "III Armored Corps · TX"
      baseF:_srFold(base), unitF:_srFold(unit), stF:_srFold(st),
      allF:_srFold(base+' '+unit+' '+st)
    });
  }
  // ORGANIZATIONS (A-ORG-1 law: units are searchable) — picking one selects its
  // effective site with that org driving the chain picture
  if(typeof A1ORGS!=='undefined'){
    for(const og of A1ORGS){
      if(_OG_CATS[og.id]) continue;                        // grouping shells aren't destinations
      // (v0.13.0: HQDA and NGB — real commands at lvl 1-2 — ARE searchable now)
      const sid=(typeof ogEffSite==='function')?ogEffSite(og.id):null;
      const hs=sid?siteById(sid):null;
      _srEntries.push({
        id:'og:'+og.id, base:og.name,
        sub:(hs?hs.base:'')+((hs&&hs.st)?(' · '+hs.st):''),
        baseF:_srFold(og.name), unitF:'', stF:_srFold(hs?(hs.st||''):''),
        allF:_srFold(og.name+' '+(hs?(hs.base+' '+(hs.st||'')):''))
      });
    }
  }
  // v0.24.0 — US STATES are searchable subjects: adding one to the brief paints
  // its real polygon on the globe (highlight, and stripes on demand).
  if(typeof US_STATES!=='undefined'){
    for(const st of US_STATES){
      _srEntries.push({
        id:_bfStateKey(st.n), base:st.n, sub:'US state / territory',
        baseF:_srFold(st.n), unitF:'', stF:_srFold(st.n),
        allF:_srFold(st.n+' us state territory')
      });
    }
  }
  _srSrc=arr;
  return _srEntries;
}

function buildSearchIndex(){ _srSrc=null; return _searchEntries(); }

// ---- Results (PORT of sfsResults + _usRun's v22.3.1 ranking; deviations 2-3) ---
// Returns {list:[entry,entry], total:N, q:foldedQuery}. list is the TOP TWO.
function sfsResults(q){
  q=_srFold((q||'').trim());
  if(q.length<2) return {list:[], total:0, q:q};
  // v22.3.1 ranking (ported): rank word-starts above mid-word noise — 'bragg'
  // finds Fort Bragg before anything that merely CONTAINS the letters; base-name
  // matches beat unit matches; shorter names win ties.
  const tk=new RegExp('(^|[\\s(\\-\\/])'+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  const hits=[];
  for(const e of _searchEntries()){
    let s2=0;
    if(e.baseF===q) s2=100;
    else if(e.baseF.indexOf(q)===0) s2=80;
    else if(tk.test(e.baseF)) s2=60;
    else if(e.unitF && e.unitF===q) s2=50;
    else if(e.unitF && e.unitF.indexOf(q)===0) s2=44;
    else if(e.unitF && tk.test(e.unitF)) s2=38;
    else if(e.stF && e.stF===q) s2=26;
    else if(e.stF && tk.test(e.stF)) s2=22;
    else if(e.allF.indexOf(q)>=0) s2=10;
    if(!s2) continue;
    if(e.baseF.split(/[\s()\-\/,]+/).indexOf(q)>=0) s2+=8;   // whole-word bonus (ported)
    hits.push({e:e, _s:s2 - Math.min(10, e.baseF.length/12)});
  }
  hits.sort(function(a,b){
    return (b._s-a._s) || (a.e.baseF.length-b.e.baseF.length) || (a.e.baseF<b.e.baseF?-1:1);
  });
  // v0.23.0 — show up to 6 (was 2). Org search is now a primary way to build the
  // brief (owner: "a search of organizations"); a top-2 cap buried real matches.
  return {list:hits.slice(0,6).map(function(h){ return h.e; }), total:hits.length,
    strong:hits.filter(function(h){ return h._s>=38; }).length, q:q};   // name/word-start tier only
}

// ---- Render (PORT of sfsRender — rows via innerHTML <button data-sfs>) ---------
// res = {list,total,q} from sfsResults, or null/'' query → dropdown folds shut.
let _sfsHi=0;   // keyboard highlight over the (at most two) rows — deviation 5

function _srFuse(){
  const dd=document.getElementById('searchResults');
  const p=document.getElementById('searchPill');
  const open=!!(dd && dd.innerHTML);
  if(dd) dd.classList.toggle('sr-open', open);
  if(p)  p.classList.toggle('sr-open', open);
}
function sfsRender(res){
  _sfsPaint(res);
  _srFuse();                                   // pill + results fuse into one surface when open
}
function _sfsPaint(res){
  const dd=document.getElementById('searchResults'); if(!dd) return;
  _sfsHi=0;
  if(!res || !res.q || res.q.length<2){ dd.innerHTML=''; return; }
  // v21.5.1 flow law (ported): zero results never dead-end SILENTLY. There is no
  // second search to escape to (deviation 1) — say so, plainly.
  if(!res.list.length){
    dd.innerHTML='<div class="sr-none">No matches for “'+_srEsc(res.q)+'”.</div>';
    return;
  }
  // v0.23.0 — honest count (was always "sites" even for org hits) + an ORG/SITE
  // badge so a search-to-add pick is unambiguous.
  const shown=res.list.length;
  // v0.31.0 (re-verify): the headline counts the ROWS ON SCREEN — "5 matches"
  // over 6 visible rows read as a miscount. Never prints the inflated fuzzy
  // total (audit #21 stands); when more exist beyond the cap it says "closest".
  const count = shown===1 ? '1 match'
    : (res.total>shown ? 'closest '+shown+' shown' : shown+' matches');
  dd.innerHTML=res.list.map(function(e,i){
    const isOrg=String(e.id).slice(0,3)==='og:';
    const isSt=!!bfStateName(e.id);
    const tag=isSt?'<span class="sr-tag sr-tag-state">STATE</span>'
      :(isOrg?'<span class="sr-tag sr-tag-org">ORG</span>':'<span class="sr-tag sr-tag-site">SITE</span>');   // full literals for dead-lint
    return '<button type="button" class="sr-row'+(i===_sfsHi?' hi':'')+'" role="option"'
      +' aria-selected="'+(i===_sfsHi?'true':'false')+'" data-sfs="'+_srEscA(e.id)+'">'
      +tag
      +'<b>'+_srEsc(e.base)+'</b><span class="sr-sub">'+_srEsc(e.sub)+'</span></button>';
  }).join('')+'<div class="sr-count">'+_srEsc(count)+'</div>';
}

// ---- THE select (mission contract; deviation 6 — m5 lazy-follows sel) ----------
// v0.6.0: delegates to the canonical selectSite (s4) so a search pick rides the
// SAME rails as every other pick — trail crumb, SELECT-clock auto-fill, brief
// re-render. The inline body below is only the boot-order fallback (s4 absent).
function searchSelect(id){
  // v0.24.0 — a US STATE pick. In the brief room it becomes a highlighted node;
  // on the map it is only a place to look at (the rooms never cross-write).
  const _stn=bfStateName(id);
  if(_stn){
    const st=US_STATES.find(function(s){ return s.n===_stn; });
    if(st) try{ flyToLatLon(st.lat, st.lon, Math.max(GlobeState.zoom||1, 2.2)); }catch(_){}
    if(document.body.classList.contains('brief-mode')){
      if(!bfNode(id)) bfAddState(_stn, GlobeState._bfFocus||null);
      try{ _bfToast(_stn+' added to the brief'); }catch(_){}
    } else {
      // v0.29.0 (audit #4): a map-room state pick must not be a silent dead end —
      // fly there, fold the stale card, and say where highlighting lives.
      try{ calloutHide(); }catch(_){}
      try{ _bfToast(_stn+' \u2014 highlight it from the Brief room'); }catch(_){}
    }
    return;
  }
  // v0.13.0: in the BRIEF room a search pick opens the org's popup (fly to its
  // base first) — from there one tap adds it. The map room keeps map selection.
  const inBrief=!!(document.body && document.body.classList && document.body.classList.contains('brief-mode'));
  if(String(id).slice(0,3)==='og:'){                       // an ORGANIZATION pick
    const oid=String(id).slice(3);
    const sid=(typeof ogEffSite==='function')?ogEffSite(oid):null;
    if(inBrief){
      const hs=sid?siteById(sid):null;
      if(hs && hs.lat!=null) try{ flyToLatLon(hs.lat, hs.lon, Math.max(GlobeState.zoom||1, 2.4)); }catch(_){}
      // v0.25.0 — a brief-room pick PLACES the organization: under the armed parent
      // when "Add a subordinate under X" armed one, else nested naturally. One tap.
      // v0.29.0 (audit #12): NO sheet slam after the add — the chart updating IS
      // the payoff; a toast confirms. The ✎ on the new box opens its sheet.
      try{
        const was=bfHas(oid);
        if(!was){ bfAdd(oid);
          const nd=bfNode(oid);
          if(nd) _bfToast((nd.n||'Added')+(nd.p?(' \u2014 under '+_bfNodeLbl(bfNode(nd.p))):' added'));
        } else { _bfObjSheet(oid); }               // picking an existing member = open it
      }catch(_){}
      return;
    }
    if(sid && typeof selectSite==='function'){ selectSite(sid, {orgId:oid}); return; }
  }
  if(inBrief && siteById(id)){
    const s0=siteById(id);
    if(s0.lat!=null) try{ flyToLatLon(s0.lat, s0.lon, Math.max(GlobeState.zoom||1, 2.4)); }catch(_){}
    try{ _bfObjSheet(id); }catch(_){}
    return;
  }
  if(typeof selectSite==='function'){ selectSite(id); return; }
  const s=(typeof siteById==='function') ? siteById(id) : null;
  if(!s) return;
  GlobeState.sel=s.id;
  if(typeof globeMark==='function') globeMark(); else GlobeState.dirty=true;
  if(typeof flyToLatLon==='function' && s.lat!=null && s.lon!=null){
    // the base-dossier fly (~L15089): never zoom OUT to meet a selection
    try{ flyToLatLon(s.lat, s.lon, Math.max(GlobeState.zoom||1, 2.6)); }catch(_){}
  }
  try{ if(typeof showDossier==='function') showDossier(s.id); }catch(_){}
}

// v0.29.0 (audit #15): the moment the user starts a NEW search, the old card
// folds — the next pick draws its own. Selection state survives; only the glass goes.
if(!window.__coSearchFold){ window.__coSearchFold=true;
  document.addEventListener('focusin', function(e){
    if(!e.target || e.target.id!=='searchInput') return;
    if(document.body.classList.contains('brief-mode')) return;
    try{ if(_coId!=null) calloutHide(); }catch(_){}
  });
}
// ---- bottom search vs the phone keyboard (v0.14.0) ----------------------------
if(!window.__sbKbWired){ window.__sbKbWired=true;
  try{
    const vv=window.visualViewport;
    const _sbLift=function(){
      const p=document.getElementById('searchPill'), r=document.getElementById('searchResults');
      if(!p) return;
      const kb=vv?Math.max(0, window.innerHeight - vv.height - vv.offsetTop):0;
      const on=document.activeElement && document.activeElement.id==='searchInput' && kb>40;
      p.style.bottom=on?((kb+12)+'px'):'';
      if(r) r.style.bottom=on?((kb+60)+'px'):'';
    };
    if(vv){ vv.addEventListener('resize', _sbLift); vv.addEventListener('scroll', _sbLift); }
    document.addEventListener('focusin', function(){ setTimeout(_sbLift, 80); });
    document.addEventListener('focusout', function(){ setTimeout(_sbLift, 120); });
  }catch(_){}
}

// ---- Field lookup (shell contract names the PILL; the input lives inside) ------
function _sfsField(){
  const p=document.getElementById('searchPill'); if(!p) return null;
  return (p.tagName==='INPUT') ? p : p.querySelector('input');
}
function _isSearchField(t){
  return !!(t && t.tagName==='INPUT' && t.closest && t.closest('#searchPill'));
}

// ---- Delegated wiring (A-ORG-1's document-level pattern, ~L22802 — deviation 7) -
document.addEventListener('input', function(e){
  if(e.target && _isSearchField(e.target)) sfsRender(sfsResults(e.target.value));
});

document.addEventListener('keydown', function(e){
  const t=e.target;
  if(!t || !_isSearchField(t)) return;
  if(e.key==='Enter'){                                   // ported (~L22805): Enter = pick
    const rows=document.querySelectorAll('#searchResults [data-sfs]');
    const b=rows[_sfsHi]||rows[0]; if(b) b.click();
    e.preventDefault(); return;
  }
  if(e.key==='ArrowDown' || e.key==='ArrowUp'){          // deviation 5: move the highlight
    const rows=document.querySelectorAll('#searchResults [data-sfs]');
    if(!rows.length) return;
    _sfsHi=Math.max(0, Math.min(rows.length-1, _sfsHi+(e.key==='ArrowDown'?1:-1)));
    for(let i=0;i<rows.length;i++){
      rows[i].classList.toggle('hi', i===_sfsHi);
      rows[i].setAttribute('aria-selected', i===_sfsHi?'true':'false');
    }
    e.preventDefault(); return;
  }
  if(e.key==='Escape'){                                  // ported (~L22772): Esc clears
    if(t.value){ t.value=''; sfsRender(null); }
    else{ try{ t.blur(); }catch(_){} }
    return;
  }
});

document.addEventListener('click', function(e){
  if(!e.target.closest) return;
  const sb=e.target.closest('#searchResults [data-sfs]');
  if(sb){                                                // ported (~L22845): tap = pick
    searchSelect(sb.getAttribute('data-sfs'));
    const i=_sfsField(); if(i){ i.value=''; try{ i.blur(); }catch(_){} }
    sfsRender(null);
    return;
  }
});

// ---- Boot (A-ORG-1 load+setTimeout idiom ~L23544; __mdWired-style once-guard) --
let _srBooted=false;

function initSearch(){
  if(_srBooted) return;
  _srBooted=true;
  buildSearchIndex();
  _srInjectCSS();
  const dd=document.getElementById('searchResults');
  if(dd){ dd.setAttribute('role','listbox'); dd.setAttribute('aria-label','Search results'); }
  const i=_sfsField();
  if(i && !i.__srWired){
    i.__srWired=1;
    // blur collapse (ported ~L23570): an emptied field folds its results after 150ms
    // (the delay lets a row tap land before the dropdown disappears under it).
    i.addEventListener('blur', function(){
      setTimeout(function(){ if(!(i.value||'').trim()) sfsRender(null); }, 150);
    });
  }
}

// ---- Escaping (PORT of esc ~L14030 / _escA ~L14129 — renamed, s3 dev-8 rule) ---
function _odEsc(s){ return String(s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }
function _odEscA(v){ return String(v).replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

// ---- THE SINGLE BRAIN (mission contract) ---------------------------------------
// Every selection path lands here: m3 tap → tapAtScreen → selectSite; search rows
// → searchSelect (sets sel + flies, then the showDossier hook — same net effect,
// same order); dossier crumb/child rows + ✕ + Clear pill → the delegate below.
// UNDO SPINE (v0.8.0 owner: back = undo one step). Every discrete navigation
// act — a pick, a clear, a double-tap dive, a cluster fly, a recall — pushes
// the camera+selection it is about to replace. The ring's back pops one.
function _undoPush(){
  try{
    const u=GlobeState._undo||(GlobeState._undo=[]);
    const last=u[u.length-1];
    const cur={yaw:GlobeState.yaw, pitch:GlobeState.pitch, zoom:GlobeState.zoom,
      sel:GlobeState.sel, brief:document.body.classList.contains('brief-mode'),
      ts:performance.now()};
    if(last && last.sel===cur.sel && Math.abs(last.yaw-cur.yaw)<1e-4
       && Math.abs(last.pitch-cur.pitch)<1e-4 && Math.abs(last.zoom-cur.zoom)<1e-3) return;
    u.push(cur); if(u.length>24) u.shift();
  }catch(_){}
}
function selectSite(id, o){
  if(!(o&&o.noUndo)) _undoPush();
  if(id==null){
    GlobeState.sel=null;
    GlobeState.selOrg=null;
    if(typeof globeMark==='function') globeMark(); else GlobeState.dirty=true;
    // arcs drop NOW (deviation 6); m5's lazy follow re-confirms next frame.
    try{ if(typeof _syncSelArcs==='function') _syncSelArcs(null); }catch(_){}
    try{ _trailClear(); }catch(_){}
    try{ if(typeof autoFillSelect==='function') autoFillSelect(null); }catch(_){}   // an auto zone dies with its selection
    try{ calloutHide(); }catch(_){}
    hideDossier();
    return;
  }
  const s=(typeof siteById==='function') ? siteById(id) : null;
  if(!s) return;                       // stale id (old DOM, bad deep link): keep the current picture
  GlobeState.sel=s.id;
  // v0.11.0: the org tree drives the chain — a specific org pick (search/org
  // row) wins; otherwise the site's primary org speaks for it
  GlobeState.selOrg=(o && o.orgId && typeof orgOf==='function' && orgOf(o.orgId)) ? o.orgId : null;
  // v0.27.0 (owner: the compact card): NOTHING draws until the Connections icon
  // asks — a selection is just the card. The base→Connections hop pre-arms the
  // section via _coSecNext so that one flow lands with arcs already on.
  window._coSec=GlobeState._coSecNext||null;
  GlobeState._showSubs=(GlobeState._coSecNext==='conx'); GlobeState._showHQ=false; GlobeState._relStep=-1;
  GlobeState._coSecNext=null;
  // build the arc/relation stores NOW so the callout's connection toggles + stepper
  // read the current selection's counts (the draw loop's own sync is a frame late).
  try{ if(typeof _syncSelArcs==='function') _syncSelArcs(s.id); }catch(_){}
  if(typeof globeMark==='function') globeMark(); else GlobeState.dirty=true;
  const _inBrief=(function(){ try{ return document.body.classList.contains('brief-mode'); }catch(_){ return false; } })();
  if(window._coSec==='conx' && !_inBrief){
    try{ _flyFitChain(); }catch(_){}                         // v0.28.0: landing IN connections view — frame the whole web
  } else if(!(o&&o.keepCam) && !_inBrief && typeof flyToLatLon==='function' && s.lat!=null && s.lon!=null){
    // the base-dossier fly (~L15089): never zoom OUT to meet a selection
    // (keepCam: saved-view recall owns the camera — the fly must not eat it)
    try{ flyToLatLon(s.lat, s.lon, Math.max(GlobeState.zoom||1, 2.6)); }catch(_){}
  }
  try{ _trailPush(s.id); }catch(_){}
  try{ if(document.body.classList.contains('nav-open')) window._nvSet(true); }catch(_){}
  try{ if(typeof autoFillSelect==='function') autoFillSelect(s); }catch(_){}   // SELECT clock follows the selection (manual pick wins)
  // v0.9.0 (owner references): identity arrives AT the dot — the sheet only on ▤
  try{ hideDossier(); }catch(_){}
  try{ calloutShow(s.id); }catch(_){ showDossier(s.id); }
  if(_inBrief){ try{ renderBrief(); }catch(_){} }
}

// ---- MODE (v0.3.0 control law): MAP ⇄ BRIEF — one seg, unmistakable shift ----
function setMode(m){
  const brief=(m==='brief');
  document.body.classList.toggle('brief-mode', brief);
  // the globe picture is the hero (owner law): the chart supplement arrives
  // MINIMIZED every time brief opens — one tap on ⌗ CHART expands it
  if(brief) document.body.classList.add('chart-min');
  if(brief) renderBrief();

    const host=document.getElementById('dossier');

    if(host){ if(brief){ hideDossier(); } else if(GlobeState.sel) showDossier(GlobeState.sel); else hideDossier(); }
  }catch(_){}
  try{ GlobeState.__bfC=null; GlobeState._bfFocus=null; }catch(_){}

// BRIEF 2.0 (v0.5.0): the user-assembled chain — every HQ in the brief set

      +'<span class="od-ico bf-vw'+(GlobeState._bfLinesOff?' off':'')+'"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 18c4.5-1 4.5-6.5 8.5-8.5C16 8.2 17.8 8 19 8"></path><circle cx="5" cy="18" r="1.9" fill="currentColor" stroke="none"></circle><circle cx="19" cy="8" r="1.9" fill="currentColor" stroke="none"></circle></svg></span><span class="ch-lbl">Lines</span></span>'

// Aim so (midLat,midLon) sits at the clear window's CENTER and an angular
// spread of sepDeg fits inside it (north-up small-offset approximation —
// exact enough for fits well inside the disc). Null when no live DOM/band.
function _bandAim(midLat, midLon, sepDeg, zMin, zMax){

  const chain=selOg ? ogChainUp(selOg.id).filter(function(p){
    return !(typeof _OG_CATS!=='undefined' && _OG_CATS[p.id]);   // v0.29.0 audit #27: grouping shells aren't commands
  }) : [];
  const kids=selOg ? ogKids(selOg.id) : [];
  const hosted=(typeof ogAtSite==='function') ? ogAtSite(s.id) : [];

  // sheet header (control law): grip · trail crumbs · export · close. The grip
  // steps the detent; crumbs ARE back-navigation; nothing here needs a caption.
  let h='<button class="sh-grip" type="button" data-dzstep="1" aria-label="Expand or collapse"><span></span></button>';
  const _tr=(GlobeState._trail||[]);
  if(_tr.length>1){
    h+='<div class="sh-crumbs">';
    for(const tid of _tr.slice(-3)){
      const ts=siteById(tid); if(!ts) continue;
      const tip=(tid===_tr[_tr.length-1]);
      h+='<button type="button" class="sh-crumb'+(tip?' tip':'')+'" data-odsel="'+_odEscA(tid)+'">'+_odEsc(ts.base)+'</button>';
    }
    h+='</div>';
  }
  // v0.8.0 COMPACT CARD (owner law: a fraction of the size, information hidden
  // — nested pop-outs like the nav ring). One row: name · state · ⊕ · export · ✕.
  // ⊕ fans out the actions (brief ★ · subordinate ⌥ · records ▤); ▤ expands the
  // tabbed detail in place. No stat lines, no sub-lines, no standing buttons.
  // the pop-out rail RIDES ABOVE the name row (it springs upward from ⊕ like
  // the nav ring) — audit law: the bottom band belongs to the globe button on
  // narrow phones, so nothing tappable may render beneath the head row.
  // v0.24.0 — the map card carries NO brief door (owner: the jumping between rooms
  // is clunky). The map explains what is there; the brief is built in the brief.

  h+='<div class="od-head od-head-slim">'
    +'<div class="od-name">'+_odEsc((selOg&&selOg.name)||s.base)+'</div>'
    +(s.st?'<span class="bd-state">'+_odEsc(s.st)+'</span>':'')
    +'<span class="od-sp"></span>'
    +'<button class="od-ico'+(_odShowRec?' on':'')+'" type="button" data-odrec="1" aria-label="Details and records"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"></path></svg></button>'
    +'<button class="od-ico" id="exportBtn" type="button" aria-label="Export"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4"></path><path d="M7 9l5-5 5 5"></path><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"></path></svg></button>'
    +'<button class="od-ico od-ico-x" type="button" data-odclose="1" aria-label="Clear selection">✕</button>'
    +'</div>';

  if(!_odShowRec) return h;

  // ── the hidden detail (▤): Overview + the four record kinds ──
  const rec=(typeof recordOf==='function')?recordOf(s.id):null;
  const cnt=function(k){ return rec?rec[k].length:0; };
  if(_odTab!=='ov' && _odTab!=='xid' && !RC_KINDS[_odTab]) _odTab='ov';
  // v1.1.0 — ID between Overview and People (owner: "this will be used to tag
  // all the People, Specs, Notes and Links")
  const idsN=(rec&&rec.ids)?rec.ids.length:0;
  h+='<div class="od-tabs">'
    +'<button type="button" class="od-tab'+(_odTab==='ov'?' on':'')+'" data-odtab="ov">Overview</button>'
    +'<button type="button" class="od-tab'+(_odTab==='xid'?' on':'')+'" data-odtab="xid">ID'+(idsN?(' · '+idsN):'')+'</button>'
    +Object.keys(RC_KINDS).map(function(k){
      const c=cnt(k);
      return '<button type="button" class="od-tab'+(_odTab===k?' on':'')+'" data-odtab="'+k+'">'+RC_KINDS[k].n+(c?(' · '+c):'')+'</button>';
    }).join('')
    +'</div>';
  if(_odTab==='xid') return h+_rcIdPane(s.id);
  if(_odTab!=='ov') return h+_rcRender(s.id, _odTab);

  // STATIONED HERE — every org the A-ORG-1 tree puts at this site. v0.29.0
  // (audit #3): when an ORG drives the sheet, the chain of command leads and this
  // roster folds into an accordion — nobody scrolls 72 tenants to find "Reports
  // to". On the base's own sheet the roster still leads.
  const hostedRows=(hosted.length>1)?hosted.map(function(og){
        const on=selOg && selOg.id===og.id;
        return '<button class="od-crumb'+(on?' od-crumb-on':'')+'" type="button" data-ogsel="'+_odEscA(og.id)+'">'
          +'<span class="bd-nm"><b>'+_odEsc(og.name)+'</b></span>'
          +'<span class="od-sp"></span>'
          +(on?'<span class="od-crumb-tag">CHAIN</span>':'')
          +'</button>';
      }).join(''):'';
  if(hostedRows && !selOg){
    h+='<div class="od-sec od-sec-up">At '+_odEsc(s.base)+' <b>'+hosted.length+'</b></div>'+hostedRows;
  }

  // UP — the reporting line as crumb ROWS, direct parent first → HQDA last
  // (A-ORG-1 law: every hop renders at its effective site; gold voice = arcs).
  if(chain.length){
    h+='<div class="od-sec od-sec-up">Reports to <b>'+chain.length+'</b></div>';
    for(let i=0;i<chain.length;i++){
      const p=chain[i];
      const sid=(typeof ogEffSite==='function')?ogEffSite(p.id):null;
      const hs=sid?siteById(sid):null;
      h+='<button class="od-crumb" type="button" data-ogo="'+_odEscA(p.id)+'">'
        +'<i class="od-hop">↑</i>'
        +'<span class="bd-nm"><b>'+_odEsc(p.name)+'</b>'+(hs?'<span>'+_odEsc(hs.base+(hs.st?(' · '+hs.st):''))+'</span>':'')+'</span>'
        +'<span class="od-sp"></span>'
        +(p.parent==null?'<span class="od-crumb-tag">HQDA</span>':'')
        +'</button>';
    }
  }else if(selOg){
    h+='<div class="od-sec od-sec-up">Reports to</div>'
      +'<div class="od-note">Top of the chain.</div>';
  }else{
    h+='<div class="od-sec od-sec-up">Reports to</div>'
      +'<div class="od-note">No organization stationed here — coordinate anchor only.</div>';
  }

  // DOWN — direct subordinate ORGS with their stations. One echelon by design.
  if(kids.length){
    h+='<div class="od-sec od-sec-down">Subordinate orgs <b>'+kids.length+'</b></div>'
      +kids.map(function(c){
        const n=(typeof ogKids==='function') ? ogKids(c.id).length : 0;
        const sid=(typeof ogEffSite==='function')?ogEffSite(c.id):null;
        const hs=sid?siteById(sid):null;
        return '<button class="bd-tile" type="button" data-ogo="'+_odEscA(c.id)+'">'
          +'<i class="od-hop od-hop-dn">↓</i>'
          +'<span class="bd-nm"><b>'+_odEsc(c.name)+'</b>'+(hs?'<span>'+_odEsc(hs.base+(hs.st?(' · '+hs.st):''))+'</span>':'')+'</span>'
          +'<span class="od-sp"></span>'
          +(n?('<span class="bd-st">'+n+' sub'+(n===1?'':'s')+'</span>'):'')
          +'</button>';
      }).join('');
  }else if(selOg){
    h+='<div class="od-sec od-sec-down">Subordinate orgs</div>'
      +'<div class="od-note">No subordinates on file.</div>';
  }
  // v0.29.0 (audit #3): the tenant roster rides BEHIND the chain on an org sheet
  if(hostedRows && selOg){
    h+=_disc('od-hosted','At '+_odEsc(s.base), hostedRows, {count:hosted.length, def:false});
  }
  return h;
}


// ═══ THE ANCHORED CALLOUT (v0.9.0 owner references): the popup lives AT the
// dot. Identity + nested action circles beside the marker; a caret tail points
// at it; it tracks the dot on every dirty frame and hides on the far side.
// Depth (tabs/records/forms) stays in the sheet — summoned by ▤ only. ─────────
let _coId=null;            // the anchored org (site or custom) — null = hidden
let _coAt=null;            // fixed screen anchor (chart chips); null = track the dot
function calloutShow(id, at){
  // v0.22.0 — one floating surface at a time (owner: "pop ups get stuck"). The
  // anchored callout and the bottom sheet are mutually exclusive; showing one
  // dismisses the other so they can never strand each other on screen.
  try{ hideDossier(); }catch(_){}
  _coId=id; _coAt=at||null;
  _coRender();
  _coPlace();
}
function calloutHide(){
  _coId=null; _coAt=null;
  try{ window._coDrillFor=null; window._coDrillQ=''; }catch(_){}   // v0.22.0: no stale filter on reopen
  const c=document.getElementById('calloutCard'); if(c) c.hidden=true;
}
function _coRefresh(){ if(_coId!=null){ _coRender(); _coPlace(); } }
function _coRender(){
  const c=document.getElementById('calloutCard'); if(!c) return;
  const o=(typeof orgById==='function')?orgById(_coId):null;            // user-built custom
  const ag=(!o && typeof orgOf==='function')?orgOf(_coId):null;          // A-ORG-1 org node
  const s=(!o && !ag)?siteById(_coId):null;                              // installation dot
  if(!o && !ag && !s){ calloutHide(); return; }
  const esc=_odEsc, escA=_odEscA;
  const agHost=ag?siteById(ogEffSite(ag.id)||''):null;
  const selOg=(s && GlobeState.selOrg && typeof orgOf==='function')?orgOf(GlobeState.selOrg):null;
  const sOg=(s && GlobeState.sel===s.id && selOg) ? selOg : null;       // v0.21.0: a base tap has NO org — the base speaks (units picker)
  const name=o?o.name:(ag?ag.name:((sOg&&sOg.name)||s.base));
  const sub=o?('Custom org'+(o.base&&siteById(o.base)?(' · '+siteById(o.base).base):''))
            :(ag?((agHost?agHost.base:'')+((agHost&&agHost.st)?(' · '+agHost.st):''))
                 :(sOg?(s.base+(s.st?(' \u00b7 '+s.st):''))    // an ORG card says WHERE it sits (audit #18)
                      :(s.st||'')));               // the base card's title IS the base — the sub adds only the state
  const nrec=(s&&typeof recCount==='function')?recCount(_coId):0;
  const brief=document.body.classList.contains('brief-mode');
  let h='<div class="co-head"><div class="co-name">'+esc(name)+'</div>'
    +'<button class="co-x" type="button" data-cox="1" aria-label="Clear selection">✕</button></div>'
    +'<div class="co-sub">'+esc(sub)+'</div>';
  const briefSubj = ag ? ag.id : (sOg ? sOg.id : null);   // the ORG the card speaks for (null = the base itself)
  // ═══ v0.27.0 THE COMPACT CARD (owner: "only the base name and location with
  // these icons should be shown initially — everything else expands"). Map mode
  // renders the name, the location, and THREE icons: Units (with the tenant
  // count), Connections (arcs + the 1-by-1 stepper), Details. Each icon opens
  // its section IN the card; nothing else renders until asked.
  if(!brief && (s || ag)){
    const isBase=!!(s && !briefSubj);
    const hostSite=s || agHost;
    // v0.30.0 (audit #10 — the Fort Meade pile): when several installations sit
    // on the same point, the card SAYS so and offers the switch — no more
    // "the app opened something I didn't choose" with no way out.
    if(isBase){
      let pile=[];
      try{ pile=_sitesArr().filter(function(o2){
        return o2.id!==s.id && Math.abs(o2.lat-s.lat)<0.22 && Math.abs(o2.lon-s.lon)<0.28;
      }).slice(0,4); }catch(_){}
      if(pile.length){
        h+='<div class="co-pile"><span class="co-pilelbl">Also here</span>'
          +pile.map(function(o2){
            // the RAW base name — the abbreviator collapses "USCYBERCOM (Fort
            // Meade)" and "NSA/CSS (Fort Meade)" into two identical chips
            var lbl=String(o2.base).replace(/\s*\(([^)]*)\)\s*$/, '');   // drop a trailing "(Fort X)" qualifier
            return '<button type="button" class="co-pilechip" data-odsel="'+escA(o2.id)+'" title="'+escA(o2.base)+'">'+esc(lbl)+'</button>'; }).join('')
          +'</div>';
      }
    }
    let unitsN=0, kids=[];
    if(isBase){ try{ unitsN=(ogAtSite(s.id)||[]).length; }catch(_){} }
    else if(briefSubj){ try{ kids=ogKids(briefSubj)||[]; unitsN=kids.length; }catch(_){} }
    const subN=(GlobeState._cmdLinkArcs&&GlobeState._cmdLinkArcs.length)?GlobeState._cmdLinkArcs.length:0;
    const canConx=isBase ? unitsN>0 : (subN>0 || true);   // an org always has at least its HQ line
    const sec=window._coSec||null;
    // ── the icon row (mini tabs while a section is open — the section is the content)
    h+='<div class="co-icrow'+(sec?' mini':'')+'">';
    if(unitsN) h+='<button type="button" class="co-ic'+(sec==='units'?' on':'')+'" data-coic="units" aria-label="'+(isBase?'Units on this base':'Subordinate units')+'">'
      +'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.6"></rect><rect x="13.5" y="3.5" width="7" height="7" rx="1.6"></rect><rect x="3.5" y="13.5" width="7" height="7" rx="1.6"></rect><rect x="13.5" y="13.5" width="7" height="7" rx="1.6"></rect></svg>'
      +'<b>'+unitsN+'</b><span>Units</span></button>';
    if(canConx) h+='<button type="button" class="co-ic'+(sec==='conx'?' on':'')+'" data-coic="conx" aria-label="Show connections">'
      +'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="19" r="2.2"></circle><circle cx="12" cy="6" r="2.2"></circle><circle cx="19" cy="19" r="2.2"></circle><path d="M6.5 17L10.5 8M13.5 8l4 9"></path></svg>'
      +'<b>&nbsp;</b><span>Connect</span></button>';
    if(hostSite) h+='<button type="button" class="co-ic" data-codetail="'+escA(hostSite.id)+'"'+(ag?(' data-codeorg="'+escA(ag.id)+'"'):'')+' aria-label="Details and records">'
      +'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"></path></svg>'
      +'<b>&nbsp;</b><span>Details</span></button>';
    h+='</div>';
    // ── UNITS — the picker (base) / the drill navigator with crumbs (org)
    if(sec==='units' && unitsN){
      if(isBase){
        if(window._coDrillFor!==s.id){ window._coDrillFor=s.id; window._coDrillQ=''; }
        const q=_srFold(window._coDrillQ||'');
        let units=[]; try{ units=ogAtSite(s.id)||[]; }catch(_){}
        h+='<div class="co-drillhead">Units here <b>'+units.length+'</b> \u00b7 tap to open</div>';
        if(units.length>8) h+='<input class="co-drillq" id="coDrillQ" type="text" placeholder="Filter '+units.length+'" value="'+escA(window._coDrillQ||'')+'" autocomplete="off" autocapitalize="off" spellcheck="false">';
        h+='<div class="co-drill">';
        units.forEach(function(u){
          const kn=(typeof ogKids==='function')?ogKids(u.id).length:0;
          const fold=_srFold(u.name);
          h+='<button class="co-drow" type="button" data-counit="'+escA(u.id)+'" data-cofold="'+escA(fold)+'"'+((q&&fold.indexOf(q)<0)?' hidden':'')+'>'
            +'<span class="co-dname">'+esc(u.name)+'</span>'
            +(kn?('<span class="co-dcount">'+kn+' \u25b8</span>'):'')
            +'</button>';
        });
        h+='</div>';
      } else {
        const anc=[]; try{ for(const a of ogChainUp(briefSubj)){ if(typeof _OG_CATS!=='undefined'&&_OG_CATS[a.id]) continue; anc.push(a); if(anc.length>=3) break; } }catch(_){}
        if(anc.length){
          h+='<div class="co-crumbs">'+anc.reverse().map(function(a){
            return '<button class="co-crumb" type="button" data-codrill="'+escA(a.id)+'" title="'+escA(a.name)+'">'+esc(_bfAbbr(a.name))+'</button>';
          }).join('<span class="co-crsep">\u203a</span>')
            +'<span class="co-crsep">\u203a</span><span class="co-crumb co-crumb-here" aria-current="true">'+esc(_bfAbbr(name))+'</span></div>';
        }
        if(window._coDrillFor!==briefSubj){ window._coDrillFor=briefSubj; window._coDrillQ=''; }
        const q=_srFold(window._coDrillQ||'');
        h+='<div class="co-drillhead">Subordinates <b>'+kids.length+'</b> \u00b7 tap to drill</div>';
        if(kids.length>8) h+='<input class="co-drillq" id="coDrillQ" type="text" placeholder="Filter '+kids.length+'" value="'+escA(window._coDrillQ||'')+'" autocomplete="off" autocapitalize="off" spellcheck="false">';
        h+='<div class="co-drill">';
        kids.forEach(function(k2){
          const hs=siteById(ogEffSite(k2.id)||''); const kn=ogKids(k2.id).length;
          const fold=_srFold(k2.name+' '+(hs?hs.base:''));
          h+='<button class="co-drow" type="button" data-codrill="'+escA(k2.id)+'" data-cofold="'+escA(fold)+'"'+((q&&fold.indexOf(q)<0)?' hidden':'')+'>'
            +'<span class="co-dname">'+esc(k2.name)+'</span>'
            +(hs?('<span class="co-dsub">'+esc(hs.base)+'</span>'):'')
            +(kn?('<span class="co-dcount">'+kn+' \u25b8</span>'):'')
            +'</button>';
        });
        h+='</div>';
      }
    }
    // ── CONNECTIONS — the arcs are live while this section is open; the stepper
    // clicks through them 1 by 1; the HQ line is one more tap.
    if(sec==='conx' && briefSubj){
      // v0.29.0 (audit #5): the numbers must AGREE on screen. subN = arcs that can
      // draw; hereN = subordinates co-located on this very base (no arc to draw).
      let parent=null;
      try{ for(const anc of ogChainUp(briefSubj)){ if(!(typeof _OG_CATS!=='undefined'&&_OG_CATS[anc.id])){ parent=anc; break; } } }catch(_){}
      const rl=GlobeState._relList||[];
      const hereN=Math.max(0, unitsN-subN);
      // v0.32.0 THE LEDGER (owner: "'all shown + addition on base' is confusing \u2014
      // the on-base comes across as fine print"). Three PARALLEL rows with mono
      // keys \u2014 MAP (owns the stepper) \u00b7 BASE \u00b7 HQ \u2014 same visual weight, the real
      // base name instead of "this base", nothing footnoted. Honest-copy law
      // holds: MAP subN + BASE hereN = the card's UNITS count, each said in place.
      const bs0=GlobeState.sel?siteById(GlobeState.sel):null;
      const bn=(bs0&&bs0.base)||'this base';
      h+='<div class="co-cxled">';
      if(subN){
        const st=GlobeState._relStep; const stepping=(st!=null&&st>=0&&st<rl.length);
        // v1.0.0: the stepped name rides RAW (the row ellipsizes) \u2014 _bfAbbr turned
        // "3rd Mobile BCT, 10th Mountain Division" into a misleading "10th Mtn"
        const label=stepping?((st+1)+' / '+subN+' \u00b7 '+(rl[st]?rl[st].name:''))
                            :('All '+subN+' on the map');
        h+='<div class="co-cxrow">'
          +'<span class="co-cxk">Map</span>'
          +'<button class="co-stepb" type="button" data-costep="prev" aria-label="Previous subordinate">\u2039</button>'
          +'<span class="co-stepn">'+esc(label)+'</span>'
          +'<button class="co-stepb" type="button" data-costep="next" aria-label="Next subordinate">\u203a</button>'
          +'<button class="co-stepall'+(stepping?'':' on')+'" type="button" data-costep="all">All</button>'
          +'</div>';
        if(hereN) h+='<div class="co-cxrow"><span class="co-cxk">Base</span><span class="co-cxv">'+hereN+' subordinate'+(hereN===1?'':'s')+' here on '+esc(bn)+'</span></div>';
      } else if(unitsN){
        h+='<div class="co-cxrow"><span class="co-cxk">Base</span><span class="co-cxv">All '+unitsN+' subordinate'+(unitsN===1?'':'s')+' are here on '+esc(bn)+' \u2014 nothing to draw</span></div>';
      } else {
        h+='<div class="co-cxrow"><span class="co-cxk">Map</span><span class="co-cxv">No mapped subordinate connections</span></div>';
      }
      if(parent){
        const pSid=(typeof ogEffSite==='function')?ogEffSite(parent.id):null;
        if(pSid && GlobeState.sel && pSid===GlobeState.sel){
          h+='<div class="co-cxrow"><span class="co-cxk">HQ</span><span class="co-cxv">'+esc(_bfAbbr(parent.name))+' \u2014 here on '+esc(bn)+'</span></div>';
        } else {
          h+='<div class="co-cxrow"><span class="co-cxk">HQ</span><button class="co-tgl'+(GlobeState._showHQ?' on':'')+'" type="button" data-cotgl="hq">'
            +'<span class="co-up">\u2191</span> '+(GlobeState._showHQ?'Hide line':'Show line')+' \u00b7 '+esc(_bfAbbr(parent.name))+'</button></div>';
        }
      }
      h+='</div>';
    }
  }
  if(brief || o){
  h+='<div class="co-acts">';
  if(brief && briefSubj){
    h+=bfHas(briefSubj)
      ?'<button class="co-pop on" type="button" data-bfrm="'+escA(briefSubj)+'" aria-label="Remove from brief"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.3.9-4.5 4.4 1 6.1-5.5-2.9-5.5 2.9 1-6.1L3 9.5l6.3-.9L12 3z"></path></svg><span class="co-poplbl">In brief</span></button>'
      :'<button class="co-pop" type="button" data-bfadd="'+escA(briefSubj)+'" aria-label="Add to brief"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.3.9-4.5 4.4 1 6.1-5.5-2.9-5.5 2.9 1-6.1L3 9.5l6.3-.9L12 3z"></path></svg><span class="co-poplbl">Brief</span></button>';
  }

function _coAnchor(){

  let lat=null, lon=null;
  if(o){
    const C=GlobeState.__bfC, n=C&&C.nodes?C.nodes[_coId]:null;
    if(n){ lat=n.lat; lon=n.lon; }
    else if(o.base){ const b=siteById(o.base); if(b){ lat=b.lat; lon=b.lon; } }
  } else {
    const s=siteById(_coId); if(s){ lat=s.lat; lon=s.lon; }
  }
  if(lat==null||lon==null) return null;
  const m=GlobeState.__mCss; if(!m) return null;
  try{
    const p=_projectLonLat(lon, lat, m);
    if(p[2]<0) return {back:true};

  }catch(_){ return null; }

function _coPlace(){
  const c=document.getElementById('calloutCard');
  if(!c || _coId==null || c.hidden) return;
  try{
    const brief=document.body.classList.contains('brief-mode');
    if(!brief){
      // v0.29.0 (audit #1 — every journey hit it): the map card DOCKS to the top
      // band instead of parking over the subject. The globe below stays clear;
      // the selected dot keeps its diamond + label as the pointer.
      c.classList.add('co-docked'); c.classList.remove('co-below','co-clamped');
      c.style.left=''; c.style.top=''; c.style.opacity=''; c.style.pointerEvents='auto';
      const drill=c.querySelector('.co-drill'); if(drill) drill.style.maxHeight='';
      return;
    }
    c.classList.remove('co-docked');
    const a=_coAnchor();
    if(!a || a.back){ c.style.opacity='0'; c.style.pointerEvents='none'; return; }  // far hemisphere: hide, returns on rotate (a dead id self-hides in _coRender)
    c.style.opacity=''; c.style.pointerEvents='auto';
    const vw=window.innerWidth||390, vh=window.innerHeight||844;
    const topSafe=112, botSafe=vh-168;
    const drill=c.querySelector('.co-drill');
    if(drill) drill.style.maxHeight='';
    let w=c.offsetWidth||236, hgt=c.offsetHeight||110;
    if(drill && hgt>(botSafe-topSafe)){
      const dh=Math.max(84, drill.offsetHeight-(hgt-(botSafe-topSafe)));
      drill.style.maxHeight=dh+'px'; hgt=c.offsetHeight;
    }
    const x=Math.max(8, Math.min(a.x-w/2, vw-w-8));
    let above=(a.y-hgt-18)>=topSafe;
    let y=above ? a.y-hgt-18 : a.y+18;
    let clamped=false;
    if(!above && (y+hgt)>botSafe){
      y=Math.max(topSafe, botSafe-hgt); clamped=true;
    }
    c.style.left=x+'px'; c.style.top=y+'px';
    c.classList.toggle('co-below', !above && !clamped);
    c.classList.toggle('co-clamped', clamped);
  }catch(_){}
}

  }, true);
  document.addEventListener('pointermove', function(e){
    if(!drag) return;

function _rcCommit(idx){
  const id=GlobeState.sel; if(!id||!_rcForm) return;
  const K=RC_KINDS[_rcForm.kind];
  const f1=document.getElementById('rcF1'), f2=document.getElementById('rcF2');
  const v1=(f1&&f1.value||'').trim(), v2=(f2&&f2.value||'').trim();
  if(!v1){ _rcForm=null; showDossier(id); return; }   // empty first field = never save a blank row
  const item={}; item[K.k1]=v1; if(K.k2) item[K.k2]=v2;
  // v1.1.0 — the ID association (existing · NEW · none); a typed-new value
  // funnels through recAddId so the registry always knows every tag in use
  const fid=document.getElementById('rcFid');

}

      try{ renderBrief(); }catch(_){} return; }
    // v0.25.0 — chart zoom: fit / smaller / bigger

      if(d==='0') GlobeState._bfZoom=null;

    const bsr=e.target.closest('[data-bfsearch]');

    const gp=e.target.closest('[data-dzstep]');
    const dz=e.target.closest('#dossier');
    if(dz && dz.__swallowStep && (performance.now()-dz.__swallowStep)<400){ dz.__swallowStep=0; if(gp) return; }
    if(dz && (gp || !e.target.closest('button'))){
      const order=['dz-peek','dz-half','dz-full'];

    // paper (stage ground, tree gaps, page ground) releases the room — sheet,
    // popup, forms, armed add, branch focus. One tap, gone (the v0.22.0 law).
    // #globeCanvas is excluded: the globe runs its own tap law (tapAtScreen),
    // and the click that trails a dot-tap must not undo the selection it made.
    if(document.body.classList.contains('brief-mode')){
      const ctrl=e.target.closest('button,input,select,textarea,label,a,[role="button"],.bf-box,#globeCanvas,#dossier,#calloutCard,#searchPill,#searchResults,#navRow,#navDock,#legendPanel,#exportSheet,#appMenu,#titleBar,#clockTL,#clockTR,#bfArmBar,#errToast,#sbxNote');

          try{ hideDossier(); }catch(_){}
          try{ renderBrief(); }catch(_){} try{ globeMark(); }catch(_){}
        }
      }
    }
  });
}

/* ══════════ module: s7-records ══════════ */
/* ============================================================================
   s7-records (NEW at v0.4.0) — THE DATASTORE. One record per org, keyed to its
   map site: people · specs · notes · links. Memory map is the source of truth
   at runtime; IndexedDB ('aorg2'/'records') is write-through persistence and
   loads once at boot. No accounts, no network, nothing read at boot from
   localStorage (the boot law holds — IndexedDB opens async after first paint).
   Records ride every export through Snapshot.extras.records — the spine built
   for exactly this. Backup/restore = one JSON file, in the ⋯ menu.
   ========================================================================= */
let RECORDS=Object.create(null);
let _rdb=null;

function _recBlank(id){ return {v:1, id:id, people:[], specs:[], notes:[], links:[], ids:[], mod:0}; }
function recordOf(id){ return RECORDS[id]||null; }
function recCount(id){
  const r=RECORDS[id]; if(!r) return 0;
  return (r.people.length+r.specs.length+r.notes.length+r.links.length);
}
function _recSave(id){
  const r=RECORDS[id]; if(!r) return;
  r.mod=Date.now();
  try{ if(_rdb){ const tx=_rdb.transaction('records','readwrite'); tx.objectStore('records').put(r); } }catch(_){}
  try{ dbPush(); }catch(_){}                          // v1.1.0: the database is the source of truth when connected
}
function recAdd(id, kind, item){
  if(!RECORDS[id]) RECORDS[id]=_recBlank(id);
  if(kind==='notes' && item && !item.ts) item.ts=Date.now();
  RECORDS[id][kind].push(item); _recSave(id);
}
function recUpdate(id, kind, idx, item){
  const r=RECORDS[id]; if(!r||!r[kind]||!r[kind][idx]) return;
  if(kind==='notes' && r[kind][idx].ts && !item.ts) item.ts=r[kind][idx].ts;
  r[kind][idx]=item; _recSave(id);
}
function recRemove(id, kind, idx){
  const r=RECORDS[id]; if(!r||!r[kind]) return;
  r[kind].splice(idx,1); _recSave(id);
}
// ---- v1.1.0 THE ID REGISTRY — owner law: every person, spec, note and link
// files under a tracking ID ("enter the ID or type NEW"). IDs live on the
// record (r.ids) so they ride _recSave, the database push, every backup and
// every export with zero extra plumbing. Items carry item.xid.
function recIds(id){ const r=RECORDS[id]; return (r&&r.ids)||[]; }
function _recNextId(id){
  let mx=0;
  recIds(id).forEach(function(x){ const m=/^ID-(\d+)$/.exec(x); if(m) mx=Math.max(mx,parseInt(m[1],10)); });
  return 'ID-'+String(mx+1).padStart(3,'0');
}
function recAddId(id, label){
  if(!RECORDS[id]) RECORDS[id]=_recBlank(id);
  const r=RECORDS[id]; if(!r.ids) r.ids=[];
  label=String(label||'').trim().slice(0,24);
  if(!label || /^new$/i.test(label)) label=_recNextId(id);
  const hit=r.ids.find(function(x){ return x.toLowerCase()===label.toLowerCase(); });
  if(hit) return hit;                                    // entering an existing ID associates, never duplicates
  r.ids.push(label); _recSave(id);
  return label;
}
function recDelId(id, label){
  const r=RECORDS[id]; if(!r||!r.ids) return;
  const i=r.ids.indexOf(label); if(i<0) return;
  r.ids.splice(i,1);
  // items survive — they just lose the tag (deleting an ID never deletes data)
  ['people','specs','notes','links'].forEach(function(k){ (r[k]||[]).forEach(function(it){ if(it.xid===label) it.xid=''; }); });
  _recSave(id);
}
function recIdCount(id, label){
  const r=RECORDS[id]; if(!r) return 0;
  let n=0;
  ['people','specs','notes','links'].forEach(function(k){ (r[k]||[]).forEach(function(it){ if(it.xid===label) n++; }); });
  return n;
}
function _rdbOpen(){
  try{
    if(typeof indexedDB==='undefined') return;         // stubs/old engines: memory-only, everything still works
    const rq=indexedDB.open('aorg2', 2);               // v2 (v0.5.0): + 'kv' for the brief
    rq.onupgradeneeded=function(e){
      const db=e.target.result;
      if(!db.objectStoreNames.contains('records')) db.createObjectStore('records',{keyPath:'id'});
      if(!db.objectStoreNames.contains('kv')) db.createObjectStore('kv',{keyPath:'k'});
    };
    rq.onsuccess=function(e){
      _rdb=e.target.result;
      try{
        const tx=_rdb.transaction('records','readonly');

          (all.result||[]).forEach(function(r){ if(r&&r.id){ if(!r.ids) r.ids=[]; RECORDS[r.id]=r; } });   // v1.1.0: pre-ID records gain the registry
          // a selection made before the load finished re-renders with its records

        };
      }catch(_){}

          if(Array.isArray(v)) SAVEDV=v;                                         // legacy bare array
          else if(v && Array.isArray(v.list)){ SAVEDV=v.list; _svMod=v.mod||0; } // v1.2.0 wrapped shape
        };
      }catch(_){}

        gs2.onsuccess=function(){
          const v=gs2.result&&gs2.result.v;
          // restore only an untouched boot — never fight a hand already on the globe
          if(!v || GlobeState._touched || GlobeState.sel!=null) return;
          try{
            // v0.22.0 (owner: "open the app and it's flooded with names"): a reopen
            // with NO saved selection returns to the calm cluster world — restoring a
            // deep zoom is what dropped the owner back into a wall of labels. A saved
            // selection keeps its camera (the zoom is justified by the pick).

              GlobeState.zoom=_hasSel?Math.max(1, Math.min(28, v.zoom||1.5)):Math.min(v.zoom||1.5, 1.5);

      }catch(_){}

          const v=go.result&&go.result.v;
          if(Array.isArray(v)){
            ORGS=v.filter(function(o){ return o&&o.id&&o.name&&o.parent; });
            // v0.11.0 MIGRATION: custom parents stored as SITE ids climb onto
            // the org tree (primary org), once, written back.

              if(typeof orgOf==='function' && !orgOf(o.parent) && !orgById(o.parent) && siteById(o.parent)){

        // no client loads, nothing connects, until the owner taps Connect.

        const gdb=tdb.objectStore('kv').get('dbcfg');
        gdb.onsuccess=function(){ const v=gdb.result&&gdb.result.v; if(v&&v.url){ _dbCfg=v;
          // v1.2.0 — the reconnect chip waits out the boot title, then offers one tap

        } };
      }catch(_){}
      try{
        const tzx=_rdb.transaction('kv','readonly');

      }catch(_){}

          if(v){
            _bfMod=v.mod||0;                       // v1.2.0: board merge baseline
            BRIEF.hide=Array.isArray(v.hide)?v.hide.slice():[];
            BRIEF.vert=Array.isArray(v.vert)?v.vert.slice():[];   // v1.5.0: per-level stacking
            if(Array.isArray(v.nodes)){

                if(!n || typeof n.k!=='string' || seen[n.k]) return false;
                if(n.t==='org' && !((typeof orgOf==='function'&&orgOf(n.r))||(typeof orgById==='function'&&orgById(n.r)))) return false;
