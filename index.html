// ---- SITES index (parent pointer is the ONLY relationship) ---------------------
let _siteIdx=null, _kidIdx=null, _idxSrc=null;

function _sitesArr(){
  return (typeof SITES!=='undefined' && SITES && SITES.length!=null) ? SITES : [];
}

function _siteIndex(){
  const arr=_sitesArr();
  if(_idxSrc===arr && _siteIdx) return _siteIdx;
  _siteIdx=new Map(); _kidIdx=new Map();
  for(const s of arr){ if(s && s.id!=null) _siteIdx.set(s.id, s); }
  for(const s of arr){
    if(!s || s.parent==null || !_siteIdx.has(s.parent)) continue;
    let L=_kidIdx.get(s.parent); if(!L){ L=[]; _kidIdx.set(s.parent, L); }
    L.push(s);
  }
  _idxSrc=arr;
  return _siteIdx;
}

function siteById(id){ if(id==null) return null; return _siteIndex().get(id)||null; }

// Direct children of a site (fresh array — callers may sort/splice for their UI).
function childrenOf(id){ _siteIndex(); return (_kidIdx.get(id)||[]).slice(); }

// Chain UP from a site: [parent, grandparent, …, root]. Cycle-guarded so a bad
// parent pointer can never hang the render loop.
function parentChainOf(id){
  const out=[]; const seen=new Set([id]);
  let s=siteById(id);
  while(s && s.parent!=null && !seen.has(s.parent)){
    seen.add(s.parent);
    const p=siteById(s.parent); if(!p) break;
    out.push(p); s=p;
  }
  return out;
}

// ---- Token cache: custom props read once, re-read on theme change (deviation 2) ----
let _mTokCache=null, _mTokTheme=null;

function _cssRGB(c, fb){
  c=(c||'').trim();
  let m=/^#([0-9a-f]{3})$/i.exec(c);
  if(m){ const h=m[1]; return parseInt(h[0]+h[0],16)+','+parseInt(h[1]+h[1],16)+','+parseInt(h[2]+h[2],16); }
  m=/^#([0-9a-f]{6})/i.exec(c);
  if(m){ const h=m[1]; return parseInt(h.slice(0,2),16)+','+parseInt(h.slice(2,4),16)+','+parseInt(h.slice(4,6),16); }
  m=/^rgba?\(\s*([\d.]+)[,\s]+([\d.]+)[,\s]+([\d.]+)/i.exec(c);
  if(m) return Math.round(+m[1])+','+Math.round(+m[2])+','+Math.round(+m[3]);
  return fb;
}

function _mTok(){
  const root=(typeof document!=='undefined')?document.documentElement:null;
  const th=root?(root.getAttribute('data-app-theme')||'arctic'):'arctic';
  if(_mTokCache && _mTokTheme===th) return _mTokCache;
  let rd=function(){ return ''; };
  try{ if(root){ const cs=getComputedStyle(root); rd=function(n){ return (cs.getPropertyValue(n)||'').trim(); }; } }catch(_){}
  const T={};
  // A-ORG-1's literal palette survives as the fallback triples, so the layer still
  // reads if a token is missing (harness stubs, boot order).
  T.text   = _cssRGB(rd('--text'),   '234,248,255');   // dots + labels (ice-white family)
  T.dim    = _cssRGB(rd('--dim'),    '155,140,255');   // guard family (was #9b8cff)
  T.accent = _cssRGB(rd('--accent'), '54,182,255');    // selection + child web (doctrine blue)
  T.signal = _cssRGB(rd('--signal'), '255,217,130');   // lineage gold + oib amber family
  T.ground = _cssRGB(rd('--ground'), '9,17,16');       // glass interiors, label outlines
  T.body   = rd('--body') || '-apple-system,system-ui,sans-serif';
  _mTokCache=T; _mTokTheme=th;
  return T;
}

// ---- Selection → arc sets (PORT of _syncSelArcs, adapted per deviation 1) ------
function _syncSelArcs(selId){
  try{
    GlobeState._selUp=null; GlobeState._selDown=null;
    GlobeState._cmdSites=null;
    if(selId==null){
      GlobeState._hqArc=null; GlobeState._cmdLinkArcs=null;
      if(typeof globeMark==='function') globeMark();
      return;
    }
    const s=siteById(selId);
    if(!s || s.lat==null || s.lon==null){
      GlobeState._hqArc=null; GlobeState._cmdLinkArcs=null;
      if(typeof globeMark==='function') globeMark();
      return;
    }
    // UP the parent chain — every located hop, selection → … → root (bright gold).
    const up=[]; const upSet=new Set();
    let from=s;
    for(const p of parentChainOf(selId)){
      if(p.lat==null || p.lon==null) continue;              // unlocated hop: chain continues from last located site
      if(!(p.lat===from.lat && p.lon===from.lon)){          // co-located hop draws no zero-length arc
        up.push({ from:{lon:from.lon, lat:from.lat, n:from.id}, to:{lon:p.lon, lat:p.lat, n:p.id}, rel:'parent' });
      }
      upSet.add(p.id);
      from=p;
    }
    // DOWN to DIRECT children only (dimmer blue web) — one echelon by design.
    const down=[]; const downSet=new Set();
    for(const c of childrenOf(selId)){
      if(c.lat==null || c.lon==null) continue;
      downSet.add(c.id);
      if(c.lat===s.lat && c.lon===s.lon) continue;          // co-located child: dot highlights, no arc
      down.push({ from:{lon:s.lon, lat:s.lat, n:s.id}, to:{lon:c.lon, lat:c.lat, n:c.id}, rel:'subordinate' });
    }
    GlobeState._hqArc = up.length?up:null;
    GlobeState._cmdLinkArcs = down.length?down:null;
    GlobeState._selUp=upSet; GlobeState._selDown=downSet;
    // _cmdSites (ported name): the whole selection picture — drives dot emphasis + labels.
    const all=new Set(upSet); downSet.forEach(function(id){ all.add(id); }); all.add(selId);
    GlobeState._cmdSites=all;
    if(typeof globeMark==='function') globeMark();
  }catch(_){}
}

// Lazy follow (deviation 6): the selection owner just sets GlobeState.sel + dirty.
function _selSyncCheck(){
  if(GlobeState._selSynced!==GlobeState.sel || GlobeState._selSyncSrc!==_sitesArr()){
    GlobeState._selSynced=GlobeState.sel;
    GlobeState._selSyncSrc=_sitesArr();
    _syncSelArcs(GlobeState.sel);
  }
}

// ---- Great-circle arcs (PORT of drawSubtleArcs — sampling verbatim) ------------
// Lightweight arc drawer: thin, semi-transparent, glow only past alpha 0.5.
function drawSubtleArcs(ctx, m, arcs, rgb, width, alpha, arrow){
  function slerpPts(aLon,aLat,bLon,bLat,segs){
    const a=lonLatToVec(aLon,aLat), b=lonLatToVec(bLon,bLat);
    let dot=a[0]*b[0]+a[1]*b[1]+a[2]*b[2]; dot=Math.max(-1,Math.min(1,dot));
    const om=Math.acos(dot); const so=Math.sin(om); const pts=[];
    for(let i=0;i<=segs;i++){ const f=i/segs; let w1,w2;
      if(so<1e-6){ w1=1-f; w2=f; } else { w1=Math.sin((1-f)*om)/so; w2=Math.sin(f*om)/so; }
      const lift=1+0.08*Math.sin(Math.PI*f);
      pts.push([ (a[0]*w1+b[0]*w2)*lift, (a[1]*w1+b[1]*w2)*lift, (a[2]*w1+b[2]*w2)*lift ]); }
    return pts;
  }
  ctx.save();
  ctx.lineWidth=(width||0.7); ctx.strokeStyle='rgba('+rgb+','+(alpha!=null?alpha:0.28)+')'; ctx.lineCap='round';
  if((alpha||0)>0.5){ ctx.shadowColor='rgba('+rgb+',0.85)'; ctx.shadowBlur=7; }
  arcs.forEach(arc=>{
    const pts=slerpPts(arc.from.lon,arc.from.lat, arc.to.lon,arc.to.lat, 40);
    let s=false; ctx.beginPath();
    let lastV=null, prevV=null;
    for(let i=0;i<pts.length;i++){ const v=_projectVec(pts[i], m); const front=v[2]>=-0.02;
      if(front){ if(!s){ ctx.moveTo(v[0],v[1]); s=true; } else ctx.lineTo(v[0],v[1]); prevV=lastV; lastV=v; } else s=false; }
    ctx.stroke();
    // directional arrowhead at the target — only when the target is front-facing.
    if(arrow && lastV && prevV){
      if(_visibleLonLat(arc.to.lon, arc.to.lat)){   // same front-hemisphere math, one projection cheaper
        const ang=Math.atan2(lastV[1]-prevV[1], lastV[0]-prevV[0]), ah=6.5;
        ctx.save(); ctx.shadowBlur=0; ctx.beginPath();
        ctx.moveTo(lastV[0], lastV[1]);
        ctx.lineTo(lastV[0]-ah*Math.cos(ang-0.45), lastV[1]-ah*Math.sin(ang-0.45));
        ctx.lineTo(lastV[0]-ah*Math.cos(ang+0.45), lastV[1]-ah*Math.sin(ang+0.45));
        ctx.closePath(); ctx.fillStyle='rgba('+rgb+',0.95)'; ctx.fill(); ctx.restore();
      }
    }
  });
  ctx.restore();
}

// ---- Arc families under the dots (PORT of drawGlobeLinks) ----------------------
function drawGlobeLinks(ctx, m){
  const T=_mTok();
  // Child web first (subtle, thin, static — hints the connection without a bright
  // tangle; the highlighted dots carry the "these belong to this site" meaning).
  if(GlobeState._cmdLinkArcs && GlobeState._cmdLinkArcs.length){
    drawSubtleArcs(ctx, m, GlobeState._cmdLinkArcs, T.accent, 1.25, 0.5);
  }
  // CHAIN TO HQ over the web — the gold lineage always reads while drilling around.
  if(GlobeState._hqArc && GlobeState._hqArc.length){
    drawSubtleArcs(ctx, m, GlobeState._hqArc, T.signal, 2.2, 0.92);
  }
}

// ---- Chrome exclusion zones (PORT of _gChromeZones — A-ORG-2 shell ids, dev. 4) ----
function _gChromeZones(m){
  const W=(m&&m.w)||800, H=(m&&m.h)||600;
  try{
    const cv=(typeof document!=='undefined') && document.getElementById && document.getElementById('globeCanvas');
    const cr=(cv && cv.getBoundingClientRect) ? cv.getBoundingClientRect() : null;
    if(cr && cr.width>0 && cr.height>0){
      const kx=W/cr.width, ky=H/cr.height, live=[], PAD=4;
      const sels=['#searchPill','#searchResults','#dossier','#stageBar',
                  '#clockTL','#clockTR','#clockBL','#clockBR','#themeSwitch','#verChip'];
      for(const s of sels){
        const el=document.querySelector(s); if(!el) continue;
        const cs=getComputedStyle(el); if(cs.display==='none'||cs.visibility==='hidden') continue;
        const r=el.getBoundingClientRect(); if(!r.width||!r.height) continue;
        const x0=(r.left-cr.left)*kx-PAD, y0=(r.top-cr.top)*ky-PAD;
        const x1=(r.right-cr.left)*kx+PAD, y1=(r.bottom-cr.top)*ky+PAD;
        if(x1<0||y1<0||x0>W||y0>H) continue;
        live.push({x0:x0, y0:y0, x1:x1, y1:y1});
      }
      return live;
    }
  }catch(_){}
  return [];   // stubbed-DOM runs (harness): no chrome, no zones
}

// ---- Label placement (PORT of _placeGlobeLabel — verbatim) ---------------------
function _placeGlobeLabel(ctx, sx, sy, w, m, rects, opts){
  opts=opts||{};
  const W=(m&&m.w)||800, H=(m&&m.h)||600;
  const gap=opts.gap!=null?opts.gap:8, h=opts.h!=null?opts.h:13;
  const L=6, R=W-6, T=6, B=H-6;
  const chrome=(GlobeState.__gChrome||(GlobeState.__gChrome=_gChromeZones(m)));
  let ax;
  if(opts.center){ ax=sx-w/2; } else { ax=sx+gap; if(ax+w>R) ax=sx-gap-w; }
  const ys = opts.above ? [sy, sy-16, sy-32, sy+18, sy-48, sy+34]
                        : [sy+4, sy-15, sy+19, sy-30, sy+34, sy-45];
  for(const cy of ys){
    const x=Math.max(L, Math.min(ax, R-w));
    const y=Math.max(T+h, Math.min(cy, B));
    const bx={x0:x-2, y0:y-h+2, x1:x+w+2, y1:y+3};
    // a label that cannot fit inside the canvas at either anchor — or that the edge
    // clamp dragged onto its own marker — is skipped (dot-only)
    let hit=(bx.x1>R+2 || bx.x0<L-2 || Math.abs(x-ax)>4);
    if(!hit) for(const b of rects){ if(bx.x0<b.x1&&bx.x1>b.x0&&bx.y0<b.y1&&bx.y1>b.y0){ hit=true; break; } }
    if(!hit) for(const c of chrome){ if(bx.x0<c.x1&&bx.x1>c.x0&&bx.y0<c.y1&&bx.y1>c.y0){ hit=true; break; } }
    if(!hit){ rects.push(bx); return {x,y}; }
  }
  return null;
}

// ---- The dot loop (PORT of drawGlobeMarkers) ------------------------------------
function drawGlobeMarkers(ctx, m){
  const T=_mTok();
  GlobeState._screen=[];                              // hit-test cache, rebuilt per draw
  GlobeState.__gLbl=[]; GlobeState.__gChrome=null;    // shared label rects + chrome zones, per frame
  const tnow=performance.now()/1000;
  const selId=GlobeState.sel;
  const upSet=GlobeState._selUp, downSet=GlobeState._selDown;
  const cmdSites=GlobeState._cmdSites;
  const zb=Math.min(2.4, 1 + (GlobeState.zoom-1)*0.14);   // dots grow a little as you zoom in
  const rScale=Math.min(2.1, 0.85+zb*0.16);
  const bodyFont=T.body;

  for(const inst of _sitesArr()){
    if(inst.lat==null||inst.lon==null) continue;
    const p=_projectLonLat(inst.lon, inst.lat, m);
    if(p[2]<0) continue;
    const sx=p[0], sy=p[1];
    const fade=Math.max(0.3, p[2]);
    const isSel=(selId!=null && inst.id===selId);
    const isUp=!!(upSet && upSet.has(inst.id));
    const isDown=!!(downSet && downSet.has(inst.id));
    const onChain=isSel||isUp||isDown;
    const isGuard=(inst.grp==='guard'||inst.grp==='guardInset');
    const isOib=(inst.grp==='oib');
    // class hue via tokens (deviation 2): lineage gold up, doctrine blue down/selected,
    // amber industrial base, dim guard, ice-white default.
    const col = isSel||isDown ? T.accent : (isUp ? T.signal : (isOib ? T.signal : (isGuard ? T.dim : T.text)));
    const dotR=(isSel?3.4:(onChain?2.9:(isGuard?2.1:2.5)))*rScale;

    // selection pulse rings — the ring pair breathes on m2's sel-keyed throttle
    // (deviation 3: no dirty-marking here).
    if(isSel){
      const pr=5.0 + Math.sin(tnow*2.4 + sx*0.05)*0.9;
      ctx.beginPath(); ctx.arc(sx,sy, pr+dotR, 0, Math.PI*2);
      ctx.strokeStyle='rgba('+T.accent+','+(0.7*fade)+')'; ctx.lineWidth=1.6; ctx.stroke();
      ctx.beginPath(); ctx.arc(sx,sy, pr+dotR+3, 0, Math.PI*2);
      ctx.strokeStyle='rgba('+T.accent+','+(0.25*fade)+')'; ctx.lineWidth=1.2; ctx.stroke();
    }

    // GLASS RETICLE — halo, dark glass interior, thin neon stroke, bright core.
    // The halo is a low-alpha oversized fill, deliberately NOT ctx.shadowBlur: a real
    // shadow on ~276 markers costs a blur pass each and drops frames on a phone.
    const rr=dotR*1.16;                               // stroke shapes read smaller than fills
    ctx.globalAlpha=(onChain?0.22:0.10)*fade;
    ctx.fillStyle='rgb('+col+')';
    ctx.beginPath(); ctx.arc(sx, sy, rr*1.7, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha=fade*(isGuard&&!onChain?0.85:1);
    ctx.beginPath(); ctx.arc(sx, sy, rr, 0, Math.PI*2);
    ctx.fillStyle='rgba('+T.ground+',0.78)'; ctx.fill();      // dark glass interior
    ctx.lineWidth=onChain?1.8:1.5; ctx.strokeStyle='rgb('+col+')'; ctx.stroke();   // thin neon frame
    ctx.beginPath(); ctx.arc(sx, sy, Math.max(0.9, rr*0.34), 0, Math.PI*2);
    ctx.fillStyle='rgb('+col+')'; ctx.fill();                 // bright core
    ctx.globalAlpha=1;

    // chain-member labels draw at ANY zoom — the picture is the product (deviation 7).
    if(onChain && !GlobeState._namesOff){
      const _nm=inst.unit||inst.base||inst.id;
      const _fs=(m.w<560?12:11);
      ctx.save();
      ctx.textBaseline='middle';
      ctx.font='800 '+_fs+'px '+bodyFont;
      const _tw=ctx.measureText(_nm).width;
      const _pos=_placeGlobeLabel(ctx, sx, sy, _tw, m, GlobeState.__gLbl, {gap:dotR+7, h:14});
      if(_pos){
        ctx.lineWidth=(_fs>11?3.6:3.2); ctx.strokeStyle='rgba('+T.ground+',.9)'; ctx.strokeText(_nm, _pos.x, _pos.y);
        ctx.fillStyle='rgba('+col+',1)'; ctx.fillText(_nm, _pos.x, _pos.y);
      }
      ctx.restore();
    }

    GlobeState._screen.push({inst, sx, sy, depth:p[2]});
  }

  // Tiny labels for the rest, zoom-gated (keeps world view clean).
  if(GlobeState.zoom >= 1.5 && !GlobeState._namesOff){
    ctx.save();
    try{ ctx.letterSpacing='0.35px'; }catch(_){}
    ctx.textBaseline='middle';
    // PRIORITY CULLING: placement is first-come-first-served on collision cells, so
    // iterate a priority-sorted copy — chain picture, then roots, depots, bases, guard.
    const _lblPr=function(s){ const i=s.inst;
      if(cmdSites && cmdSites.has(i.id)) return 0;
      if(i.parent==null) return 1;
      if(i.grp==='oib') return 2;
      if(i.grp==='guard'||i.grp==='guardInset') return 4;
      return 3; };
    const _lblQ=Array.from(GlobeState._screen).sort(function(a,b){ return _lblPr(a)-_lblPr(b); });
    for(const s of _lblQ){
      const inst=s.inst;
      if(inst.grp==='guard') continue;                // skip guard to reduce clutter
      if(s.depth<0.25) continue;
      if(cmdSites && cmdSites.has(inst.id)) continue; // chain labels already drew in the dot loop
      // ZOOM LADDER — density arrives as the room for it does; phones climb it 0.7
      // later because a narrow canvas has far less room per name.
      const _mzb=(m.w<700)?0.7:0;
      const _need=(inst.parent==null?2.0:(inst.grp==='oib'?2.8:(inst.grp==='guardInset'?3.6:3.2)))+_mzb;
      if(GlobeState.zoom < _need) continue;
      if(s.sx<1||s.sx>m.w-1||s.sy<1||s.sy>m.h-1) continue;   // off-map dot — don't orphan its label
      ctx.font='600 9.5px '+bodyFont;
      const name=inst.base||inst.id;
      const tw=ctx.measureText(name).width;
      const _pl=_placeGlobeLabel(ctx, s.sx, s.sy, tw, m, GlobeState.__gLbl, {h:12});
      if(!_pl) continue;
      ctx.shadowColor='rgba('+T.ground+',.9)'; ctx.shadowBlur=3; ctx.shadowOffsetY=1;
      ctx.lineWidth=2.2; ctx.strokeStyle='rgba('+T.ground+',.78)'; ctx.strokeText(name, _pl.x, _pl.y);
      ctx.shadowBlur=0; ctx.shadowOffsetY=0;
      ctx.fillStyle='rgba('+(inst.grp==='oib'?T.signal:T.text)+',.92)'; ctx.fillText(name, _pl.x, _pl.y);
    }
    ctx.restore();
  }
}

// ---- m2 hook: links under, markers over (A-ORG-1 drawGlobe order, ~L16798) -----
function drawMarkersHook(ctx, m){
  _selSyncCheck();
  drawGlobeLinks(ctx, m);
  drawGlobeMarkers(ctx, m);
}

// ---- Tap hit-test for m3 (PORT of handleGlobeTap's best-dot loop) --------------
// Canvas-relative coords in (what tapAtScreen receives); nearest front-hemisphere
// site within 18px, else null. Tests LAST FRAME's _screen — exactly A-ORG-1.
function siteHitTest(x, y){
  let best=null, bestD=18*18;
  for(const s of (GlobeState._screen||[])){
    const d=(s.sx-x)*(s.sx-x)+(s.sy-y)*(s.sy-y);
    if(d<bestD){ bestD=d; best=s; }
  }
  return best?best.inst:null;
}

async function loadGlobeCoastlinesHi(){
  if(_globeLoadedHi) return;
  // A-ORG-1 v8.9.1 lineage: the real coastlines ship WITH the app (data/,
  // same-origin, SW-precached). A-ORG-2 ladder (deviations 1–2): 110m first
  // for a fast first paint, then 50m upgrades the same GLOBE_RINGS in place.
  const SOURCES=[
    'data/land-110m.json',
    'data/land-50m.json'
  ];
  for(const SRC of SOURCES){
    try{
      const r=await fetch(SRC); if(!r.ok) continue;
      const topo=await r.json();
      const rings=decodeTopoLand(topo);
      if(rings && rings.length>20){
        GLOBE_RINGS=rings; _globeLoadedHi=true;
        if(window.GlobeState){ GlobeState.dirty=true; }   // redraw with real coastlines
      }
    }catch(e){ /* rung failed → keep current rings, try the next rung */ }
  }
  /* both rungs failed → keep embedded fallback */
}

// Load US state borders and decode to lon/lat rings for the globe. Same-origin
// data/ only (deviation 1). The us-atlas states file MAY be in Albers USA
// projection, so the projected case inverts that projection back to lon/lat.
async function loadStateBorders(){
  if(_statesLoaded) return;
  const SOURCES=[
    'data/states-10m.json'
  ];
  for(const SRC of SOURCES){
    try{
      const r=await fetch(SRC); if(!r.ok) continue;
      const topo=await r.json();
      // us-atlas ships two variants: states-10m.json is UNPROJECTED lon/lat, while the -albers-
      // file is pre-projected to a 975x610 canvas. Auto-detect: decode raw first — if the
      // coordinates are already geographic, use them directly (this also keeps REAL Alaska &
      // Hawaii outlines); only run the Albers inverse when the data is actually projected.
      let rings=_decodeTopoLonLat(topo,'states');
      const _geo=_ringsLookGeographic(rings);
      if(!_geo) rings=decodeStatesTopo(topo);
      if(rings && rings.length>=40){
        GLOBE_STATE_RINGS=rings; _statesLoaded=true;
        try{ GLOBE_STATE_SHAPES=_namedStateShapes(topo, _geo); }catch(_){ GLOBE_STATE_SHAPES=null; }
        if(window.GlobeState){ GlobeState.dirty=true; }
        return;
      }
    }catch(e){ /* try next */ }
  }
}

// Invert the d3 Albers-USA projection (approx) to recover lon/lat from projected x/y.
// us-atlas states-10m.json is pre-projected to a 975x610 viewport in Albers USA.
function _albersUsaInvert(x, y){
  // Inverse of d3.geoAlbersUsa as used by us-atlas v3 (975x610 viewport): scale 1300,
  // translate [487.5, 305], screen y-down. Verified: US center → canvas center, coasts span
  // the full width, and it round-trips exactly.
  const scale=1300, tx=487.5, ty=305;
  const phi0=37.5*Math.PI/180, lam0=-96*Math.PI/180;
  const p1=29.5*Math.PI/180, p2=45.5*Math.PI/180;
  const n=(Math.sin(p1)+Math.sin(p2))/2;
  const C=Math.cos(p1)*Math.cos(p1)+2*n*Math.sin(p1);
  const rho0=Math.sqrt(C-2*n*Math.sin(phi0))/n;
  const px=(x - tx)/scale, py=-(y - ty)/scale;   // negated: screen-up = north (matches on-device result)
  const rho0my=rho0 - py;
  const rho=Math.sqrt(px*px + rho0my*rho0my);
  const theta=Math.atan2(px, rho0my);
  const phi=Math.asin(Math.max(-1,Math.min(1,(C - rho*rho*n*n)/(2*n))));
  const lam=lam0 + theta/n;
  return [lam*180/Math.PI, phi*180/Math.PI];
}

function _ringsLookGeographic(rings){
  if(!rings || !rings.length) return false;
  let n=0, okc=0, minLon=999;
  for(const ring of rings){
    for(const p of ring){ n++; if(p[0]>=-180&&p[0]<=180&&p[1]>=-90&&p[1]<=90) okc++; if(p[0]<minLon) minLon=p[0]; if(n>400) break; }
    if(n>400) break;
  }
  return okc>n*0.98 && minLon<-60;   // US longitudes are negative; projected pixels sit in 0..975
}

function decodeStatesTopo(topo){
  const tr=topo.transform;
  const arcs=topo.arcs;
  const obj=topo.objects && (topo.objects.states || topo.objects.states_10m || topo.objects['states-10m']);
  if(!obj) return [];
  function decodeArc(arc){
    let x=0,y=0; const out=[];
    for(const d of arc){
      if(tr){ x+=d[0]; y+=d[1]; out.push([x*tr.scale[0]+tr.translate[0], y*tr.scale[1]+tr.translate[1]]); }
      else { out.push([d[0], d[1]]); }
    }
    return out;
  }
  const decoded=arcs.map(decodeArc);
  function ringFor(arcIdxs){
    let pts=[];
    for(let k=0;k<arcIdxs.length;k++){
      let idx=arcIdxs[k], arc;
      if(idx<0){ arc=decoded[~idx].slice().reverse(); } else { arc=decoded[idx]; }
      if(k>0) arc=arc.slice(1);
      pts=pts.concat(arc);
    }
    // convert projected x/y → lon/lat
    return pts.map(p=>_albersUsaInvert(p[0], p[1]));
  }
  const out=[]; const geoms=obj.geometries||[];
  for(const g of geoms){
    // Skip Alaska (FIPS 02) & Hawaii (15): the Albers-USA layout fakes them into INSETS whose
    // inverse lands over Mexico/Texas. Their true outlines come from the global country layer.
    if(g.id==='02'||g.id==='15'||g.id===2||g.id===15) continue;
    if(g.type==='Polygon'){ for(const r of g.arcs) out.push(ringFor(r)); }
    else if(g.type==='MultiPolygon'){ for(const poly of g.arcs) for(const r of poly) out.push(ringFor(r)); }
  }
  return out;
}

// Load WORLD country borders (lon/lat TopoJSON — no projection inversion needed) from the
// same-origin data/ file (deviation 1). Drawn as a thin global context layer.
async function loadCountryBorders(){
  if(_countriesLoaded) return;

}

// Generic TopoJSON→lon/lat ring decoder (delta-decoded arcs + transform; data already geographic).
function _decodeTopoLonLat(topo, objName){
  const tr=topo.transform, arcs=topo.arcs;
  const obj=topo.objects && topo.objects[objName]; if(!obj) return [];
  function dec(a){ let x=0,y=0; const o=[]; for(const d of a){ if(tr){ x+=d[0]; y+=d[1]; o.push([x*tr.scale[0]+tr.translate[0], y*tr.scale[1]+tr.translate[1]]); } else o.push([d[0],d[1]]); } return o; }
  const D=arcs.map(dec);
  function ringFor(ix){ let p=[]; for(let k=0;k<ix.length;k++){ let i=ix[k],a; if(i<0){a=D[~i].slice().reverse();} else {a=D[i];} if(k>0) a=a.slice(1); p=p.concat(a); } return p; }
  const out=[];
  for(const g of (obj.geometries||[])){
    if(g.type==='Polygon'){ for(const r of g.arcs) out.push(ringFor(r)); }
    else if(g.type==='MultiPolygon'){ for(const poly of g.arcs) for(const r of poly) out.push(ringFor(r)); }
  }
  return out;
}

function decodeTopoLand(topo){
  const tr=topo.transform, arcs=topo.arcs;
  const sx=tr.scale[0], sy=tr.scale[1], tx=tr.translate[0], ty=tr.translate[1];
  function decodeArc(arc){ let x=0,y=0; const out=[]; for(const d of arc){ x+=d[0]; y+=d[1]; out.push([x*sx+tx, y*sy+ty]); } return out; }
  const decoded=arcs.map(decodeArc);
  function ringFor(arcIdxs){
    let pts=[];
    for(let k=0;k<arcIdxs.length;k++){
      let idx=arcIdxs[k], arc;
      if(idx<0){ arc=decoded[~idx].slice().reverse(); } else { arc=decoded[idx]; }
      if(k>0) arc=arc.slice(1);
      pts=pts.concat(arc);
    }
    return pts;
  }
  const out=[]; const geoms=topo.objects.land.geometries;
  for(const g of geoms){
    if(g.type==='Polygon'){ for(const r of g.arcs) out.push(ringFor(r)); }
    else if(g.type==='MultiPolygon'){ for(const poly of g.arcs) for(const r of poly) out.push(ringFor(r)); }
  }
  return out;
}

// Decode the states topojson KEEPING per-state identity (the border layer flattens it).
// Ported from A-ORG-1's brief-states section (deviation 4): it is pure topo→rings decode,
// so it lives with the other decoders; GLOBE_STATE_SHAPES fills the moment states load.
function _namedStateShapes(topo, geographic){
  const obj=topo.objects && (topo.objects.states || topo.objects['states-10m']); if(!obj) return null;
  const tr=topo.transform, arcs=topo.arcs;
  function dec(a){ let x=0,y=0; const o=[]; for(const d of a){ if(tr){ x+=d[0]; y+=d[1]; o.push([x*tr.scale[0]+tr.translate[0], y*tr.scale[1]+tr.translate[1]]); } else o.push([d[0],d[1]]); } return o; }
  const D=arcs.map(dec);
  function ringFor(ix){ let p=[]; for(let k=0;k<ix.length;k++){ let i=ix[k],a; if(i<0){a=D[~i].slice().reverse();} else {a=D[i];} if(k>0) a=a.slice(1); p=p.concat(a); } return p; }
  const out={};
  for(const g of (obj.geometries||[])){
    const nm=g.properties && g.properties.name; if(!nm) continue;
    const rings=[];
    if(g.type==='Polygon'){ for(const r of g.arcs) rings.push(ringFor(r)); }
    else if(g.type==='MultiPolygon'){ for(const poly of g.arcs) for(const r of poly) rings.push(ringFor(r)); }
    out[nm]=geographic? rings : rings.map(function(r){ return r.map(function(pt){ const v=_albersUsaInvert(pt[0],pt[1]); return (v&&v.length===2)?v:null; }).filter(Boolean); });
  }
  return out;
}

//   esc / _escA         (~L14030/14129)  HTML body / attribute escaping (renamed
//                                  _srEsc/_srEscA here — see deviation 8).
//   boot idiom          (~L23544)  addEventListener('load', setTimeout(try{}catch))
//                                  + the __mdWired-style once-guard.
//   row grammar (CSS)   (~L5365 .sfs-dd, ~L1856 .us-row)  dropdown = flex column,
//                                  gap 6px; rows = borderless radius cards, bold
//                                  name + dim sub, hairline ring, accent ring on

//
// NEW (A-ORG-2 contracts, no direct A-ORG-1 counterpart):
//   buildSearchIndex()   boot index over SITES: {base, unit(+unitFull), st} folded
//                        once (m5's _siteIndex identity-cache idiom, so a SITES
//                        swap re-indexes lazily and boot order can't break it).
//   searchSelect(id)     THE select: GlobeState.sel = site id + dirty (m5 deviation
//                        6 lazy-follow picks up the arcs), flyToLatLon(site), then
//                        the showDossier(id) hook — all guarded typeof, order-safe.
//   initSearch()         shell boot hook: build index + inject the search CSS. Also
//                        self-arms on 'load' (once-guarded) so the search works
//                        even if the shell forgets to call it.
//   _srFold()            diacritic/case folding (NFD strip) — mission-mandated;
//                        A-ORG-1 never folded ("Chièvres" was unfindable as
//                        "chievres"; 276-site A-ORG-2 is international by charter).
//
// DEVIATIONS (everything changed vs. A-ORG-1, and why):
//   1. ONE search, not three. A-ORG-1 grew a stage pill (sfs*), a universal overlay
//      (_usRun/openUSearch) and a workspace filter; the sfs zero-result row escaped
//      into universal search. A-ORG-2's single-brain law collapses them: sfsResults
//      carries _usRun's ranking directly, and the zero-result state is a plain
//      "No matches" card (there is no second search to escape to).
//   2. sfsResults(q) searches SITES (flat array, parent pointer only) instead of
//      walking ARMY_DATA's tree, and returns {list, total, q} instead of an array
//      of names: the count line needs the TRUE match count, so the source's
//      40-hit walk cap is gone (276 sites, one O(n) pass — no cap needed).
//   3. Scoring ladder extended per mission: BASE-NAME HITS BEAT UNIT HITS. Base
//      keeps the source rungs (exact 100 · prefix 80 · word-start 60, +8 whole
//      word); unit rungs sit strictly below the lowest base rung (exact 50 ·
//      prefix 44 · word-start 38), unitFull word-start 30 (the source's fl rung),
//      st exact 26 / word-start 22 (st is a searchable field per mission — "NC"
//      must find North Carolina posts), bare substring floor 10. Length tiebreak
//      ported unchanged, on the base name.
//   4. Rows carry data-sfs="<site id>" (A-ORG-1 carried the org NAME because
//      selectOrgNode took names). A-ORG-2's selection model is GlobeState.sel =
//      site id (shell contract), and ids are machine-safe slugs.
//   5. Arrow-key highlight is NEW (mission): _sfsHi moves over the rows,
//      re-rendering classes only; Enter clicks the highlighted row where A-ORG-1
//      always clicked the first. With no arrows pressed _sfsHi is 0 — identical
//      behavior to the source.
//   6. searchSelect does NOT call _syncSelArcs: m5's lazy follow (_selSyncCheck,
//      its deviation 6) rebuilds arcs from GlobeState.sel on the next dirty frame.
//      Setting sel + globeMark() is the entire selection contract.
//   7. Input/keydown/click land as document-level DELEGATED listeners installed at
//      script eval (A-ORG-1's own pattern for sfsInput, ~L22802-22808) — they need
//      no DOM at install time, so concatenation order and shell build order can't
//      race them. The field is matched by 'input inside #searchPill' instead of
//      id==='sfsInput' (shell contract names the pill, not the input).
//   8. esc/_escA are renamed _srEsc/_srEscA: the canonical names are app-wide
//      utilities that belong to the shell core at concatenation; a second
//      top-level `function esc(` would collide. Bodies are the source's, verbatim.
//   9. CSS ships as a JS-injected <style id="s3SearchCSS"> — construction-phase
//      only. m-modules are canvas-side and own no CSS; this module builds DOM. At
//      final assembly the block moves verbatim into index.html's single <style>
//      (dead-lint expects one style block) and the injector no-ops via its
//      already-present guard. Tokens only; phone-first; the sole desktop tweak
//      sits inside @media(min-width:1100px); no position:fixed, no transforms
//      (the results stack can scroll — transform-free per the reliability
//      contract). Pill/dropdown GEOMETRY (where the search sits on the stage) is
//      the shell owner's; this block styles only what this module renders.
//  10. tenants are NOT indexed — mission scopes the index to base + unit + st
//      (unitFull rides along as the unit's expansion, exactly like _usRun's
//      n.full). Tenant search is a backlog item for the dossier owner.

// OWNERSHIP (concatenation law — no duplicate top-level declarations):
//   - DECLARED HERE: buildSearchIndex, sfsResults, sfsRender, searchSelect,
//     initSearch, _searchEntries, _srFold, _srEsc, _srEscA, _sfsField,
//     _isSearchField, _srInjectCSS, _srEntries, _srSrc, _sfsHi, _srBooted.
//   - USED, declared elsewhere (ALL guarded typeof at call time): GlobeState
//     (shell), SITES (shell data loader), siteById (m5), globeMark (m2),
//     flyToLatLon (m4), showDossier (dossier owner's hook — optional).

// CONTRACTS HONORED:
//   - Reads SITES / GlobeState at call time only — concatenation-order safe.
//   - Redraw law: selection marks GlobeState.dirty once per select (an event,
//     never per-frame); nothing here touches the render loop.
//   - No frameworks, no webfonts, sloppy-mode top-level function declarations.

// ---- Escaping (PORT of esc ~L14030 / _escA ~L14129 — renamed, deviation 8) -----
function _srEsc(s){ return String(s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }
function _srEscA(v){ return String(v).replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

// ---- Diacritic/case fold (NEW — mission-mandated; deviation in header) ---------
function _srFold(s){
  s=String(s==null?'':s).toLowerCase();
  try{ s=s.normalize('NFD').replace(/[\u0300-\u036f]/g,''); }catch(_){}
  return s;
}

// ---- The index: SITES folded once, rebuilt only when SITES identity changes ----
// (m5 _siteIndex idiom — boot builds it, a data swap re-indexes lazily.)
let _srEntries=null, _srSrc=null;

function _searchEntries(){
  const arr=(typeof SITES!=='undefined' && SITES && SITES.length!=null) ? SITES : [];
  if(_srSrc===arr && _srEntries) return _srEntries;
  _srEntries=[];
  for(const s of arr){
    if(!s || s.id==null) continue;
    const base=String(s.base||s.id), unit=String(s.unit||''), full=String(s.unitFull||''), st=String(s.st||'');
    _srEntries.push({
      id:s.id, base:base,
      sub:(unit?unit:'')+((unit&&st)?' · ':'')+st,          // "III Armored Corps · TX"
      baseF:_srFold(base), unitF:_srFold(unit), fullF:_srFold(full), stF:_srFold(st),
      allF:_srFold(base+' '+unit+' '+full+' '+st)
    });
  }
  _srSrc=arr;
  return _srEntries;
}

function buildSearchIndex(){ _srSrc=null; return _searchEntries(); }

// ---- Results (PORT of sfsResults + _usRun's v22.3.1 ranking; deviations 2-3) ---
// Returns {list:[entry,entry], total:N, q:foldedQuery}. list is the TOP TWO.
function sfsResults(q){
  q=_srFold((q||'').trim());
  if(q.length<2) return {list:[], total:0, q:q};
  // v22.3.1 ranking (ported): rank word-starts above mid-word noise — 'bragg'
  // finds Fort Bragg before anything that merely CONTAINS the letters; base-name
  // matches beat unit matches; shorter names win ties.
  const tk=new RegExp('(^|[\\s(\\-\\/])'+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  const hits=[];
  for(const e of _searchEntries()){
    let s2=0;
    if(e.baseF===q) s2=100;
    else if(e.baseF.indexOf(q)===0) s2=80;
    else if(tk.test(e.baseF)) s2=60;
    else if(e.unitF && e.unitF===q) s2=50;
    else if(e.unitF && e.unitF.indexOf(q)===0) s2=44;
    else if(e.unitF && tk.test(e.unitF)) s2=38;
    else if(e.fullF && tk.test(e.fullF)) s2=30;
    else if(e.stF && e.stF===q) s2=26;
    else if(e.stF && tk.test(e.stF)) s2=22;
    else if(e.allF.indexOf(q)>=0) s2=10;
    if(!s2) continue;
    if(e.baseF.split(/[\s()\-\/,]+/).indexOf(q)>=0) s2+=8;   // whole-word bonus (ported)
    hits.push({e:e, _s:s2 - Math.min(10, e.baseF.length/12)});
  }
  hits.sort(function(a,b){
    return (b._s-a._s) || (a.e.baseF.length-b.e.baseF.length) || (a.e.baseF<b.e.baseF?-1:1);
  });
  return {list:hits.slice(0,2).map(function(h){ return h.e; }), total:hits.length, q:q};
}

// ---- Render (PORT of sfsRender — rows via innerHTML <button data-sfs>) ---------
// res = {list,total,q} from sfsResults, or null/'' query → dropdown folds shut.
let _sfsHi=0;   // keyboard highlight over the (at most two) rows — deviation 5

function sfsRender(res){
  const dd=document.getElementById('searchResults'); if(!dd) return;
  _sfsHi=0;
  if(!res || !res.q || res.q.length<2){ dd.innerHTML=''; return; }
  // v21.5.1 flow law (ported): zero results never dead-end SILENTLY. There is no
  // second search to escape to (deviation 1) — say so, plainly.
  if(!res.list.length){
    dd.innerHTML='<div class="sr-none">No matches for “'+_srEsc(res.q)+'”.</div>';
    return;
  }
  const count = res.total===1 ? '1 site'
    : res.total<=2 ? res.total+' sites'
    : res.total+' sites — top 2 shown';
  dd.innerHTML=res.list.map(function(e,i){
    return '<button type="button" class="sr-row'+(i===_sfsHi?' hi':'')+'" role="option"'
      +' aria-selected="'+(i===_sfsHi?'true':'false')+'" data-sfs="'+_srEscA(e.id)+'">'
      +'<b>'+_srEsc(e.base)+'</b><span class="sr-sub">'+_srEsc(e.sub)+'</span></button>';
  }).join('')+'<div class="sr-count">'+_srEsc(count)+'</div>';
}

// ---- THE select (mission contract; deviation 6 — m5 lazy-follows sel) ----------
function searchSelect(id){
  const s=(typeof siteById==='function') ? siteById(id) : null;
  if(!s) return;
  GlobeState.sel=s.id;
  if(typeof globeMark==='function') globeMark(); else GlobeState.dirty=true;
  if(typeof flyToLatLon==='function' && s.lat!=null && s.lon!=null){
    // the base-dossier fly (~L15089): never zoom OUT to meet a selection
    try{ flyToLatLon(s.lat, s.lon, Math.max(GlobeState.zoom||1, 2.6)); }catch(_){}
  }
  try{ if(typeof showDossier==='function') showDossier(s.id); }catch(_){}
}

// ---- Field lookup (shell contract names the PILL; the input lives inside) ------
function _sfsField(){
  const p=document.getElementById('searchPill'); if(!p) return null;
  return (p.tagName==='INPUT') ? p : p.querySelector('input');
}
function _isSearchField(t){
  return !!(t && t.tagName==='INPUT' && t.closest && t.closest('#searchPill'));
}

// ---- Delegated wiring (A-ORG-1's document-level pattern, ~L22802 — deviation 7) -
document.addEventListener('input', function(e){
  if(e.target && _isSearchField(e.target)) sfsRender(sfsResults(e.target.value));
});

document.addEventListener('keydown', function(e){
  const t=e.target;
  if(!t || !_isSearchField(t)) return;
  if(e.key==='Enter'){                                   // ported (~L22805): Enter = pick
    const rows=document.querySelectorAll('#searchResults [data-sfs]');
    const b=rows[_sfsHi]||rows[0]; if(b) b.click();
    e.preventDefault(); return;
  }
  if(e.key==='ArrowDown' || e.key==='ArrowUp'){          // deviation 5: move the highlight
    const rows=document.querySelectorAll('#searchResults [data-sfs]');
    if(!rows.length) return;
    _sfsHi=Math.max(0, Math.min(rows.length-1, _sfsHi+(e.key==='ArrowDown'?1:-1)));
    for(let i=0;i<rows.length;i++){
      rows[i].classList.toggle('hi', i===_sfsHi);
      rows[i].setAttribute('aria-selected', i===_sfsHi?'true':'false');
    }
    e.preventDefault(); return;
  }
  if(e.key==='Escape'){                                  // ported (~L22772): Esc clears
    if(t.value){ t.value=''; sfsRender(null); }
    else{ try{ t.blur(); }catch(_){} }
    return;
  }
});

document.addEventListener('click', function(e){
  if(!e.target.closest) return;
  const sb=e.target.closest('#searchResults [data-sfs]');
  if(sb){                                                // ported (~L22845): tap = pick
    searchSelect(sb.getAttribute('data-sfs'));
    const i=_sfsField(); if(i){ i.value=''; try{ i.blur(); }catch(_){} }
    sfsRender(null);
    return;
  }
});

// ---- Boot (A-ORG-1 load+setTimeout idiom ~L23544; __mdWired-style once-guard) --
let _srBooted=false;

function initSearch(){
  if(_srBooted) return;
  _srBooted=true;
  buildSearchIndex();
  _srInjectCSS();
  const dd=document.getElementById('searchResults');
  if(dd){ dd.setAttribute('role','listbox'); dd.setAttribute('aria-label','Search results'); }
  const i=_sfsField();
  if(i && !i.__srWired){
    i.__srWired=1;
    // blur collapse (ported ~L23570): an emptied field folds its results after 150ms
    // (the delay lets a row tap land before the dropdown disappears under it).
    i.addEventListener('blur', function(){
      setTimeout(function(){ if(!(i.value||'').trim()) sfsRender(null); }, 150);
    });
  }
}

addEventListener('load', function(){ setTimeout(function(){ try{ initSearch(); }catch(_){} }, 0); });

// ---- CSS (deviation 9 — construction-phase injection; tokens only; phone-first;
//      row grammar ported from .sfs-dd ~L5365 + .us-row ~L1856) -------------------
function _srInjectCSS(){
  if(document.getElementById('s3SearchCSS')) return;     // the final-assembly no-op guard
  // (M1 verify: the construction-phase injected CSS was removed — s1-tokens.css
  //  owns the #searchResults/.sr-row recipe; dual ownership was fighting it.)
}

// ---- THE SINGLE BRAIN (mission contract) ---------------------------------------
// Every selection path lands here: m3 tap → tapAtScreen → selectSite; search rows
// → searchSelect (sets sel + flies, then the showDossier hook — same net effect,
// same order); dossier crumb/child rows + ✕ + Clear pill → the delegate below.
function selectSite(id){
  if(id==null){
    GlobeState.sel=null;
    if(typeof globeMark==='function') globeMark(); else GlobeState.dirty=true;
    // arcs drop NOW (deviation 6); m5's lazy follow re-confirms next frame.
    try{ if(typeof _syncSelArcs==='function') _syncSelArcs(null); }catch(_){}
    hideDossier();
    return;
  }
  const s=(typeof siteById==='function') ? siteById(id) : null;
  if(!s) return;                       // stale id (old DOM, bad deep link): keep the current picture
  GlobeState.sel=s.id;
  if(typeof globeMark==='function') globeMark(); else GlobeState.dirty=true;
  if(typeof flyToLatLon==='function' && s.lat!=null && s.lon!=null){
    // the base-dossier fly (~L15089): never zoom OUT to meet a selection
    try{ flyToLatLon(s.lat, s.lon, Math.max(GlobeState.zoom||1, 2.6)); }catch(_){}
  }
  showDossier(s.id);
}
try{ window.selectSite=selectSite; }catch(_){}   // mission: expose the brain globally

// ---- m3's tap hook (m3-input deviation 4 boundary — DECLARED HERE) -------------
function tapAtScreen(x, y){
  const s=(typeof siteHitTest==='function') ? siteHitTest(x, y) : null;
  if(s && s.id!=null) selectSite(s.id);
  // no-hit: selection survives (A-ORG-1 ~L17929 only hid the tip) — clearing is
  // a deliberate act (✕ on the card, or the stage bar's Clear pill).
}

// ---- The card (PORT of renderBaseDossier's grammar — render only, no state) ----
function showDossier(id){
  const host=document.getElementById('dossier'); if(!host) return;
  const s=(typeof siteById==='function') ? siteById(id) : null;
  if(!s){ hideDossier(); return; }
  _odInjectCSS();                                  // order-safe if a select lands before 'load'
  host.innerHTML=_odRender(s);
  host.hidden=false;
  try{ host.setAttribute('aria-label', s.base+' — dossier'); }catch(_){}
  host.scrollTop=0;                                // deviation 7: whole card into view
  _odStageClearSync(true);
}

function hideDossier(){
  const host=document.getElementById('dossier'); if(!host) return;
  host.hidden=true;
  host.innerHTML='';
  try{ host.setAttribute('aria-label','Dossier'); }catch(_){}
  _odStageClearSync(false);
}

function _odRender(s){
  const chain=(typeof parentChainOf==='function') ? parentChainOf(s.id) : [];
  const kids=((typeof childrenOf==='function') ? childrenOf(s.id) : [])
    .sort(function(a,b){ return String(a.base).localeCompare(String(b.base)); });

  // header — od-head-slim (~L15083): name · st chip · spacer · ✕ (data-odclose)
  let h='<div class="od-head od-head-slim">'
    +'<div class="od-name">'+_odEsc(s.base)+'</div>'
    +(s.st?'<span class="bd-state">'+_odEsc(s.st)+'</span>':'')
    +'<span class="od-sp"></span>'
    +'<button class="od-ico od-ico-x" type="button" data-odclose="1" aria-label="Clear selection">✕</button>'
    +'</div>';

  // owning unit + its expansion sub-line
  if(s.unit)     h+='<div class="od-unit">'+_odEsc(s.unit)+'</div>';
  if(s.unitFull) h+='<div class="od-unit-full">'+_odEsc(s.unitFull)+'</div>';

  // stats line (bd-stats grammar ~L15087)
  h+='<div class="bd-stats">'
    +(chain.length?('<span>'+chain.length+(chain.length===1?' hop':' hops')+' up the chain</span>'):'')
    +'<span>'+kids.length+' subordinate '+(kids.length===1?'site':'sites')+'</span>'
    +((chain.length||kids.length)?'<span class="bd-hint">tap any to open</span>':'')
    +'</div>';

  // UP — the command line as crumb ROWS, direct parent first → root last
  // (deviations 3-4; gold voice = m5's parent-chain arcs).
  if(chain.length){
    h+='<div class="od-sec od-sec-up">Command line <b>'+chain.length+'</b></div>';
    let owner=s.parentUnit;                        // the unit at hop 0 that owns THIS site
    for(let i=0;i<chain.length;i++){
      const p=chain[i];
      const label=owner||p.unit||'';
      const sub=label+(p.st?((label?' · ':'')+p.st):'');
      h+='<button class="od-crumb" type="button" data-odsel="'+_odEscA(p.id)+'">'
        +'<i class="od-hop">↑</i>'
        +'<span class="bd-nm"><b>'+_odEsc(p.base)+'</b>'+(sub?'<span>'+_odEsc(sub)+'</span>':'')+'</span>'
        +'<span class="od-sp"></span>'
        +(p.parent==null?'<span class="od-crumb-tag">HQ</span>':'')
        +'</button>';
      owner=p.parentUnit;                          // hop N+1 owns hop N via ITS parentUnit
    }
  }else{
    h+='<div class="od-sec od-sec-up">Command line</div>'
      +'<div class="od-note">Top of the chain — this site reports to no one.</div>';
  }

  // DOWN — direct children as rows with counts (deviation 5; blue voice = m5's
  // child web). One echelon by design: each row is one tap deeper.
  if(kids.length){
    h+='<div class="od-sec od-sec-down">Subordinate sites <b>'+kids.length+'</b></div>'
      +kids.map(function(c){
        const n=(typeof childrenOf==='function') ? childrenOf(c.id).length : 0;
        const sub=(c.unit||'')+(c.st?((c.unit?' · ':'')+c.st):'');
        return '<button class="bd-tile" type="button" data-odsel="'+_odEscA(c.id)+'">'
          +'<i class="od-hop od-hop-dn">↓</i>'
          +'<span class="bd-nm"><b>'+_odEsc(c.base)+'</b>'+(sub?'<span>'+_odEsc(sub)+'</span>':'')+'</span>'
          +'<span class="od-sp"></span>'
          +(n?('<span class="bd-st">'+n+' sub'+(n===1?'':'s')+'</span>'):'')
          +'</button>';
      }).join('');
  }else{
    h+='<div class="od-sec od-sec-down">Subordinate sites</div>'
      +'<div class="od-note">No subordinate sites on file.</div>';
  }
  return h;
}

// ---- Clear pill sync (shell: the selection owner wires + shows #stageClear) ----
function _odStageClearSync(on){
  const b=document.getElementById('stageClear');
  if(b) b.hidden=!on;
  const f=document.getElementById('stageFit');   // ⊡ Fit frames the family — only meaningful with a selection
  if(f) f.hidden=!on;
}

// ---- ONE delegate (PORT of the _odWired idiom ~L12480; guard name kept) --------
if(!window._odWired){
  window._odWired=true;
  document.addEventListener('click', function(e){
    if(!e.target || !e.target.closest) return;
    const x=e.target.closest('[data-odclose]');
    if(x){ selectSite(null); return; }
    if(e.target.closest('#stageClear')){ selectSite(null); return; }
    const t=e.target.closest('[data-odsel]');
    if(t){ selectSite(t.getAttribute('data-odsel')); return; }
  });
}

// ---- Boot (A-ORG-1 load+setTimeout idiom ~L23544; s3's once-guard shape) -------
let _odBooted=false;

function initDossier(){
  if(_odBooted) return;
  _odBooted=true;
  _odInjectCSS();
  // agree with any selection that already exists (harness boots, early selects)
  try{
    if(typeof GlobeState!=='undefined' && GlobeState && GlobeState.sel!=null) showDossier(GlobeState.sel);
  }catch(_){}
}

addEventListener('load', function(){ setTimeout(function(){ try{ initDossier(); }catch(_){} }, 0); });

/* ══════════ module: s5-clocks ══════════ */
// ═══════════════════════════════════════════════════════════════════════════════
// s5-clocks.js — A-ORG-2 shell: FOUR CORNER ZONE CLOCKS (charter D4: corner clocks
// only, the time console is retired). #clockTL local · #clockTR Zulu/UTC ·
// #clockBL Europe/Berlin · #clockBR Asia/Seoul, each a tiny mono HH:MM over its
// zone label. Repaint happens exactly on minute boundaries (setTimeout armed to
// the next :00), instantly on visibility/focus wake, and never while the user is
// typing in an input.
// (PORTED from A-ORG-1 index.html — the source is truth; names kept where ported.)
//
// Ported from A-ORG-1 (function/state names kept where the code came across):
//   militaryTime        (~L14070)  24h "HH:MM" via Intl.DateTimeFormat formatToParts
//                                  ('en-GB', hour12:false), the '24'→'00' hour fix,
//                                  padStart, and the '--:--' failure face. Verbatim.
//   tickClocks + __k    (~L18799)  the clock repaint brain and its per-element
//                                  write-dedupe: key the rendered string on el.__k
//                                  and touch innerHTML ONLY when the face changed
//                                  (a no-op minute costs zero DOM writes).
//   __tzLbl label law   (~L18829, v12.3 owner)  the LOCAL cell shows the zone's
//                                  short NAME when the platform has one (EDT/CST…),
//                                  else the zone's own city — NEVER a Zulu/UTC
//                                  offset. Cached once on window.__tzLbl.
//   __lastMin latch     (~L22216)  minute-boundary refresh: repaint only when
//                                  getMinutes() rolled over; the latch is set even
//                                  when the paint is skipped (typing), so a skipped
//                                  minute stays skipped until the NEXT boundary.
//   typing guard        (~L22220)  ae=document.activeElement; tagName INPUT or
//                                  TEXTAREA → skip the repaint. Verbatim.
//   wake idiom + __visT (~L22186)  visibilitychange(!hidden)/focus → reset
//                                  __lastMin=-1 and repaint IMMEDIATELY (throttled
//                                  background tabs snap current the moment you
//                                  return); __visT is the wiring once-guard. The
//                                  source wake bypasses the typing guard (it only
//                                  ever protected panels that CONTAINED inputs);
//                                  kept — these chips hold no inputs.
//   time-over-label     (~L5160 .stage-clock .bar-time, ~L4293 .bt-t/.bt-z)  the
//                                  stage-corner clock grammar: digits stacked over
//                                  a micro uppercase zone label → .ck-t/.ck-z.
//   boot idiom          (~L23544)  addEventListener('load', setTimeout(try{}catch))
//                                  + once-guard (s3-search _srBooted precedent).
//
// NEW (A-ORG-2 contracts, no direct A-ORG-1 counterpart):
//   CLOCK_ZONES          the four fixed corner cells (mission contract). A-ORG-1's
//                        corners were LOCAL + a selection-driven SELECT cell backed
//                        by CLOCK_REGIONS; D4 fixes them to local/Zulu/Berlin/Seoul.
//   initClocks()         shell boot hook: resolve local tz + label, inject CSS,
//                        first paint, arm the boundary timer, wire wake. Self-arms
//                        on 'load' (once-guarded) like every s-module.
//   _ckArm()/_ckBeat()   the setTimeout-to-boundary pair (see deviation 1).
//
// DEVIATIONS (everything changed vs. A-ORG-1, and why):
//   1. setTimeout-TO-BOUNDARY replaces the source's 1s __secT interval (mission
//      contract). A-ORG-1 ticked every second because seconds were on display
//      (.ts-ss); these faces show minutes only, so the timer sleeps until the next
//      wall-clock :00 (60000 − Date.now()%60000, +40ms landing guard) and re-arms
//      after each beat. The ported __lastMin latch makes an early fire a no-op and
//      the fresh re-arm computes the corrected remainder — self-healing drift.
//   2. Plain tabular HH:MM text instead of seg7HTML LCD markup — the seg7 engine
//      is not ported to A-ORG-2 and tiny glass chips want plain mono digits.
//   3. esc() renamed _ckEsc (single-script concat law: s3 already renamed its copy
//      _srEsc; duplicate top-level declarations would silently override).
//   4. The LOCAL label falls back to the literal 'LOCAL' when __tzLbl computes
//      empty (the source banner just omitted the label; a corner chip with no
//      label would read as a mystery number).
//   5. tickClocks walks the fixed 4-cell table, not the source's [data-tz] scan +
//      barLocal/barTimeSel/tbLive branches — those surfaces are retired (D4).
//   6. No GlobeState.dirty anywhere — clocks are DOM chrome, not canvas; the
//      render loop is never touched (doctrine).
//
// Exports (top-level — the final assembly concatenates into ONE <script>):
//   CLOCK_ZONES, militaryTime, tickClocks, initClocks,
//   _ckArm, _ckBeat, _ckWake, _ckEsc, _ckInjectCSS
//   window state: __lastMin (boundary latch) · __ckT (armed timeout) ·
//                 __visT (wake wiring once-guard) · __tzLbl (local label cache)
// ═══════════════════════════════════════════════════════════════════════════════

// ---- The four corner cells (mission contract: TL local · TR Zulu · BL Berlin ·
//      BR Seoul). TL's tz stays undefined until initClocks resolves it — an
//      undefined timeZone means "platform local" to Intl, so even a failed
//      resolve renders the right time under the fallback label. ----------------
const CLOCK_ZONES = [
  { id:'clockTL', tz:undefined,        label:'LOCAL'  },
  { id:'clockTR', tz:'UTC',            label:'ZULU'   },
  { id:'clockBL', tz:'Europe/Berlin',  label:'BERLIN' },
  { id:'clockBR', tz:'Asia/Seoul',     label:'SEOUL'  },
];

// Current military (24h) time string "HHMM" for an IANA zone.
// (PORTED verbatim ~L14070 — including the '24'→'00' fix and the failure faces.)
function militaryTime(tz, date, colon){
  date = date || new Date();
  try{
    const f=new Intl.DateTimeFormat('en-GB',{timeZone:tz, hour:'2-digit', minute:'2-digit', hour12:false});
    const parts=f.formatToParts(date); let hh='00',mm='00';
    parts.forEach(p=>{ if(p.type==='hour')hh=p.value; if(p.type==='minute')mm=p.value; });
    if(hh==='24') hh='00';
    hh=hh.padStart(2,'0'); mm=mm.padStart(2,'0');
    return colon ? hh+':'+mm : hh+mm;
  }catch(e){ return colon?'--:--':'----'; }
}

// text-body escape (A-ORG-1 esc ~L14030, renamed — deviation 3)
function _ckEsc(v){ return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ---- The repaint brain (PORTED name + __k write-dedupe ~L18799) ---------------
// One Date() per beat feeds all four faces; a cell whose rendered string did not
// change costs nothing (el.__k key check — the source's exact idiom).
function tickClocks(){
  const now=new Date();
  for(let i=0;i<CLOCK_ZONES.length;i++){
    const z=CLOCK_ZONES[i];
    const el=document.getElementById(z.id); if(!el) continue;
    const t=militaryTime(z.tz, now, true);
    const key=t+'|'+z.label;
    if(el.__k!==key){ el.__k=key;
      el.innerHTML='<span class="ck-t">'+t+'</span><span class="ck-z">'+_ckEsc(z.label)+'</span>';
    }
  }
}

// ---- Minute-boundary beat (latch + typing guard PORTED ~L22216-22225) ---------
function _ckBeat(){
  try{
    const d=new Date();
    const mm=d.getMinutes();
    if(window.__lastMin!==mm){
      window.__lastMin=mm;
      const ae=document.activeElement;
      const typing=ae && (ae.tagName==='INPUT'||ae.tagName==='TEXTAREA');
      if(!typing) tickClocks();
    }
  }catch(_){}
  _ckArm();
}

// setTimeout-to-boundary (deviation 1): sleep until just past the next :00.
// +40ms landing guard — timers can fire a few ms early; landing past the boundary
// guarantees getMinutes() has rolled over (and if one still lands early, the
// __lastMin latch no-ops it and the re-arm computes the tiny corrected remainder).
function _ckArm(){
  try{ clearTimeout(window.__ckT); }catch(_){}
  window.__ckT=setTimeout(_ckBeat, 60000-(Date.now()%60000)+40);
}

// ---- Wake (PORTED ~L22186): throttled background tabs snap current on return.
// Resets the latch, repaints immediately (source wake bypasses the typing guard —
// these chips contain no inputs, so a repaint can never eat a keystroke), and
// re-arms: a hidden tab's timer can be minutes late, so re-anchor to the clock.
function _ckWake(){
  try{ window.__lastMin=-1; tickClocks(); }catch(_){}
  _ckArm();
}

// ---- Boot (A-ORG-1 load+setTimeout idiom ~L23544; s3 _srBooted once-guard) ----
let _ckBooted=false;

function initClocks(){
  if(_ckBooted) return;
  _ckBooted=true;
  // LOCAL cell: resolve the platform zone + the v12.3 label law (~L18829) —
  // the zone's short NAME (EDT/CST…) else its city; NEVER a Zulu/UTC offset.
  try{
    const ltz=Intl.DateTimeFormat().resolvedOptions().timeZone;
    CLOCK_ZONES[0].tz=ltz;
    if(window.__tzLbl===undefined){
      let z=''; try{ z=(new Intl.DateTimeFormat([], {timeZoneName:'short'}).formatToParts(new Date()).find(function(p){ return p.type==='timeZoneName'; })||{}).value||''; }catch(_){}
      if(!z || /GMT|UTC/i.test(z)) z=(String(ltz).split('/').pop()||'').replace(/_/g,' ');
      if(/GMT|UTC|^Etc\b/i.test(z)) z='';   // a zone NAME or nothing — never an offset marker
      window.__tzLbl=z;
    }
    if(window.__tzLbl) CLOCK_ZONES[0].label=window.__tzLbl;   // empty → 'LOCAL' (deviation 4)
  }catch(_){}
  _ckInjectCSS();
  window.__lastMin=new Date().getMinutes();   // first paint owns the current minute
  tickClocks();
  _ckArm();
  try{ if(!window.__visT){ window.__visT=1;
    document.addEventListener('visibilitychange', function(){ if(!document.hidden) _ckWake(); });
    window.addEventListener('focus', _ckWake);
  } }catch(_){}
}

addEventListener('load', function(){ setTimeout(function(){ try{ initClocks(); }catch(_){} }, 0); });

// ---- CSS (construction-phase injection, s3 precedent; tokens only; phone-first;
//      grammar ported from .stage-clock .bar-time ~L5160 + .bt-t/.bt-z ~L4293).
//      .clock stays a CLASS selector so s1's .clock:empty{display:none} law still
//      out-specifies it — pre-boot empty chips show no dead chrome. No fixed
//      positioning, no transforms — the chips sit where s1-tokens.css put them. --
function _ckInjectCSS(){
  if(document.getElementById('s5ClockCSS')) return;      // the final-assembly no-op guard
  const st=document.createElement('style'); st.id='s5ClockCSS';
  st.textContent=
    '.clock{display:flex;flex-direction:column;align-items:center;gap:3px}'+
    /* tiny mono digits — brighter than the chip's dim base so time reads first */
    '.ck-t{font:700 12px/1 var(--mono,ui-monospace,Menlo,monospace);'+
      'font-variant-numeric:tabular-nums;letter-spacing:.06em;color:var(--text,#e7edf2)}'+
    /* micro zone label — the .bt-z voice: uppercase, tracked wide, faint */
    '.ck-z{font:700 7.5px/1 var(--mono,ui-monospace,Menlo,monospace);'+
      'letter-spacing:.16em;color:var(--faint,#5c6b76)}'+
    /* desktop layer ONLY — a touch more presence in the true corners */
    '@media(min-width:1100px){.ck-t{font-size:13px}.ck-z{font-size:8px}}';
  document.head.appendChild(st);
}


// ─── Shell boot spine — everything below survives with zero modules present ────
function bootShell(){
  // Desktop radius factor (PORT of A-ORG-1 ~L22187; re-checked on resize below).
  try{ if(window.matchMedia && matchMedia('(min-width:1100px)').matches){ GlobeState.baseK=0.88; } }catch(_){}

  // Initial orientation (PORT of A-ORG-1 ~L15810 — Atlantic overview).
  try{
    if(!GlobeState._qInit && typeof _faceLonLatAngles==='function'){
      _faceLonLatAngles(-40, 20); GlobeState._qInit=true;
    }
  }catch(_){}

  // Module boot (owner: shell — per m2-render's boot-integration note). Every
  // call is guarded: during construction a module may not be concatenated yet.
  var cv=document.getElementById('globeCanvas');
  if(cv){
    try{ if(typeof setupGlobeInteraction==='function') setupGlobeInteraction(cv); }catch(_){}
    try{ if(typeof smoothFallbackOnce==='function') smoothFallbackOnce(); }catch(_){}
    try{ if(typeof startGlobeLoop==='function') startGlobeLoop(cv); }catch(_){}
    try{ if(typeof loadGlobeCoastlinesHi==='function') loadGlobeCoastlinesHi(); }catch(_){}
    try{ if(typeof loadStateBorders==='function') loadStateBorders(); }catch(_){}
    try{ if(typeof loadCountryBorders==='function') loadCountryBorders(); }catch(_){}
    try{ if(typeof globeMark==='function') globeMark(); else GlobeState.dirty=true; }catch(_){}
  }

  // Resize keeps the radius law honest (dirty-flag only — never a forced redraw).
  window.addEventListener('resize', function(){
    try{ GlobeState.baseK=(window.matchMedia && matchMedia('(min-width:1100px)').matches)?0.88:0.72; }catch(_){}
    try{ if(typeof globeMark==='function') globeMark(); else GlobeState.dirty=true; }catch(_){}
  });

  // Stage bar: reset pill → m4's resetGlobeView (its named consumer). back/clear
  // stay hidden and unwired here — the selection/search owner binds and shows them.
  try{
    var rb=document.getElementById('stageReset');
    if(rb) rb.addEventListener('click', function(){
      try{ if(typeof resetGlobeView==='function') resetGlobeView(); }catch(_){}
    });
  }catch(_){}

  // Zoom pills → m4 (_wireZoomHold: tap steps, hold repeats).
  try{
    if(typeof _wireZoomHold==='function'){
      _wireZoomHold(document.getElementById('zoomInBtn'), 1.35);
      _wireZoomHold(document.getElementById('zoomOutBtn'), 1/1.35);
    }
  }catch(_){}

  // ⊡ Fit → frame the selected family: the site, its chain up, its children.
  // (s4 shows/hides the pill alongside #stageClear.)
  try{
    var fb=document.getElementById('stageFit');
    if(fb) fb.addEventListener('click', function(){
      try{
        if(!GlobeState.sel || typeof fitGlobeToSites!=='function') return;
        var fam=[GlobeState.sel];
        if(typeof parentChainOf==='function') fam=fam.concat(parentChainOf(GlobeState.sel));
        if(typeof childrenOf==='function') fam=fam.concat(childrenOf(GlobeState.sel));
        fitGlobeToSites(fam);
      }catch(_){}
    });
  }catch(_){}

  // M1 THEME MOCKUP SWITCHER (D3): cycle the three candidates on the live
  // instrument; the owner picks at the M1 gate. Deliberately no persistence —
  // A-ORG-2 reads no localStorage at boot; the winning theme ships as :root.
  try{
    var THEME_CYCLE=['arctic','night','paper'];
    var tsb=document.querySelector('#themeSwitch button');
    var setTheme=function(t){
      document.documentElement.setAttribute('data-app-theme', t);
      if(tsb) tsb.textContent=t.charAt(0).toUpperCase()+t.slice(1);
      try{ if(typeof globeMark==='function') globeMark(); else GlobeState.dirty=true; }catch(_){}
    };
    document.addEventListener('click', function(e){
      if(!e.target || !e.target.closest || !e.target.closest('#themeSwitch')) return;
      var cur=document.documentElement.getAttribute('data-app-theme')||'arctic';
      setTheme(THEME_CYCLE[(THEME_CYCLE.indexOf(cur)+1)%THEME_CYCLE.length]);
    });
    setTheme('arctic');
  }catch(_){}

  // Version chip.
  try{
    var vc=document.getElementById('verChip');
    if(vc) vc.textContent='A-ORG-2 '+APP_VERSION;
  }catch(_){}

  // DIAGNOSTICS TOAST (PORT of A-ORG-1 ~L13977): uncaught errors + rejections
  // self-report with real details; capture lives in the first-byte head script.
  try{
    window._errToast=function(msg){
      try{
        let t=document.getElementById('errToast');
        if(!t){ t=document.createElement('div'); t.id='errToast';
          t.addEventListener('click',function(){ t.classList.remove('show'); });
          document.body.appendChild(t); }
        t.textContent='⚠ '+String(msg).slice(0,220);
        t.classList.add('show');
        clearTimeout(window.__errT); window.__errT=setTimeout(function(){ t.classList.remove('show'); }, 9000);
      }catch(_){}
    };
    // replay anything the first-byte layer logged before the toast attached
    try{ (window.__errLog||[]).slice(-1).forEach(function(e){ window._errToast(e.m+((e.s||e.l)?(' @ '+((e.s||'').split('/').pop()||'inline')+(e.l?(':'+e.l):'')):'')); }); }catch(_){}
  }catch(e){}

  // long-press the VERSION chip → diagnostics dump (PORT of A-ORG-1 ~L19509,
  // retargeted from #footerVersion to #verChip — the ring buffer of errors).
  (function(){
    const hv=document.getElementById('verChip');
    if(!hv) return;
    let vt=null;
    const dump=function(){
      const L=window.__errLog||[];
      const txt=L.length? L.map(function(e){ return '['+e.k+'] '+e.m+'\n  @ '+(e.s||'inline')+':'+e.l+':'+e.c+(e.st?('\n  '+e.st.split('\n').slice(0,3).join(' | ')):''); }).join('\n\n') : 'No errors captured this session.';
      try{ prompt('Diagnostics — last '+L.length+' error(s). Copy below:', txt.slice(0,900)); }
      catch(_){ alert(txt.slice(0,900)); }
    };
    hv.style.pointerEvents='auto';
    hv.addEventListener('pointerdown', function(){ clearTimeout(vt); vt=setTimeout(dump, 700); });
    hv.addEventListener('pointerup', function(){ clearTimeout(vt); });
    hv.addEventListener('pointercancel', function(){ clearTimeout(vt); });
  })();

  // Sandbox banner (PORT of A-ORG-1 ~L22198): preview hosts announce themselves
  // so host console noise is never mistaken for an A-ORG-2 defect.
  try{
    if(window.__SANDBOX && !document.getElementById('sbxNote')){
      const nb=document.createElement('div'); nb.id='sbxNote';
      nb.innerHTML='⧉ <b>Preview sandbox</b> — host console noise is expected here and does not come from A-ORG-2. Test the deployed app for real signals. <button aria-label="Dismiss">✕</button>';
      nb.querySelector('button').addEventListener('click', function(){ nb.remove(); });
      document.body.appendChild(nb);
    }
  }catch(_){}
}
bootShell();
</script>
