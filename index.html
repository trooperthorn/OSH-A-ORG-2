  } else {
    h+='<button class="rc-add" type="button" data-svsave="1"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg> Save this view</button>';
  }
  if(A.length){
    const pinned=[], rest=[];
    A.forEach(function(r,i){ (r&&r.pin?pinned:rest).push([r,i]); });
    if(pinned.length){
      h+='<div class="rc-sublab">Pinned</div>';
      pinned.forEach(function(pr){ h+=_shRow(kind,pr[0],P,pr[1]); });
      if(rest.length) h+='<div class="rc-sublab">Recent</div>';
    }
    rest.forEach(function(pr){ h+=_shRow(kind,pr[0],P,pr[1]); });
    // an invisible cap is data loss the user attributes to a bug
    if(A.length>=20) h+='<div class="rc-note">'+A.length+' of 24 saved · the oldest unpinned record drops next.</div>';
  } else {
    h+='<div class="rc-note">'+(brief
      ? 'No saved briefs yet — save the current diagram and open it on any connected device. The brief room opens blank; your saves live here.'
      : 'No saved views yet — frame the globe the way you want it, then Save this view. A view remembers the camera, the selection and the layers you had on.')+'</div>';
  }
  h+='<div class="rc-note">'+(((typeof _dbState!=='undefined')&&_dbState==='live')
    ?'Database LIVE — saved '+(brief?'briefs':'views')+' mirror your other devices.'
    :'Connect the database (hold the A-ORG-2 mark → Database) to open saved '+(brief?'briefs':'views')+' on other devices.')+'</div>';
  return h;
}
// ONE DRAWER, TWO PANES. The map room's doors open LAYERS|VIEWS; the brief
// room's ▤ opens its own single pane — the rooms stay severed (v0.24.0).
// v1.22.0: the shelves render inside the Repository now. _shOpen survives as
// the repaint door every rung already calls — it re-renders the open section

function _shOpen(tab){

    _ldTab=(tab==='bf')?'briefs':'views';
    try{ _ledgerPaint(); }catch(_){}

      if(l && !l.classList.contains('on')) Repo.open(); }catch(_){}
    return;
  }
  const host=document.getElementById('dossier'); if(!host) return;
  try{ _odInjectCSS(); }catch(_){}
  try{ calloutHide(); }catch(_){}                  // the surface budget: one at a time
  const brief=document.body.classList.contains('brief-mode');
  tab = tab || (brief?'bf':'lay');
  const kind=(tab==='bf')?'bf':'sv', P=(tab==='bf')?'sb':'sv';
  if(tab!=='lay') _shList(kind).forEach(function(r){ if(r) _shId(r, kind==='bf'?_sbSave:_svSave); });
  const name=(tab==='lay')?'Layers':(tab==='bf'?'Briefs':'Saved views');
  let h='<button class="sh-grip" type="button" data-dzstep="1" aria-label="Expand or collapse"><span></span></button>';
  h+='<div class="od-head od-head-slim"><div class="od-name">'+name+'</div><span class="od-sp"></span>'
    +'<button class="od-ico od-ico-x" type="button" data-'+((tab==='lay')?'lyclose':(P+'close'))+'="1" aria-label="Close">✕</button></div>';
  if(!brief){
    h+='<div class="od-tabs" role="tablist">'
      +'<button class="od-tab'+(tab==='lay'?' on':'')+'" type="button" role="tab" aria-selected="'+(tab==='lay')+'" data-shtab="lay">LAYERS</button>'
      +'<button class="od-tab'+(tab==='sv'?' on':'')+'" type="button" role="tab" aria-selected="'+(tab==='sv')+'" data-shtab="sv">VIEWS</button></div>';
  }
  h+=(tab==='lay')?_shPaneLay():_shPaneShelf(kind,P);
  const kept=(host.className.match(/dz-(peek|half|full)/)||[])[1];
  host.innerHTML=h; host.dataset.shTab=tab;
  host.classList.remove('dz-peek','dz-half','dz-full');
  host.classList.add(kept==='full'?'dz-full':'dz-half');
  host.hidden=false; host.scrollTop=0;
  try{ _sheetFlag(); }catch(_){}                   // _svOpenSheet did NEITHER of these
  try{ const dr=document.getElementById('lyChip'), sv=document.querySelector('.sp-star');
    if(dr) dr.setAttribute('aria-expanded', tab==='lay'?'true':'false');
    if(sv){ sv.setAttribute('aria-expanded', tab==='sv'?'true':'false'); sv.classList.toggle('on', tab==='sv'); } }catch(_){}
}

function svPin(id){ const i=_shFind('sv',id); if(i<0) return; SAVEDV[i].pin=!SAVEDV[i].pin; _svSave(); }

// ── v1.7.0 SAVED BRIEFS (owner: "need a save brief function that saves it to
// be accessed across multiple devices"). Named snapshots of the whole diagram
// (nodes + hide + vert — inventories ride inside the nodes), stored in kv
// 'briefs' and riding the database board as ONE newest-wins blob — exactly
// the views law. Loading REPLACES the working brief through _bfSave, so the
// replacement itself syncs to the other devices too.
let SAVEDB=[];
let _sbMod=0;
function _sbSave(){
  _sbMod=Date.now();
  try{ if(_rdb){ const tx=_rdb.transaction('kv','readwrite'); tx.objectStore('kv').put({k:'briefs', v:{v:1, list:SAVEDB, mod:_sbMod}}); } }catch(_){}
  try{ dbPush(); }catch(_){}                      // saved briefs ride the board
}
function sbCapture(name){
  const roots=BRIEF.nodes.filter(function(n){ return !n.p; });
  const nm=String(name||'').trim().slice(0,60)
    || ((roots[0]?(roots[0].n+' · '):'')+new Date().toLocaleDateString());
  // v1.12.0 — every record carries a stable id; saving makes it the WORKING
  // COPY, so later saves update THIS record instead of minting siblings.
  const rec={ id:Date.now().toString(36)+Math.random().toString(36).slice(2,7), n:nm, ts:Date.now(),
    nodes:JSON.parse(JSON.stringify(BRIEF.nodes)),
    hide:(BRIEF.hide||[]).slice(), vert:(BRIEF.vert||[]).slice() };
  SAVEDB.unshift(rec);
  _shTrim(SAVEDB);                                // v1.19.0: a pin is a real guarantee
  GlobeState._sbActive=rec.id;
  _sbSave();
  return nm;
}
// v1.12.0 (owner: "1 saved brief record that you save the progress to, not a
// new record each time") — update the working copy IN PLACE. Returns its
// name, or false when no working copy is active (caller falls back to
// save-as-new).
function sbUpdate(){
  const id=GlobeState._sbActive; if(!id) return false;
  const rec=SAVEDB.find(function(b){ return b && b.id===id; });
  if(!rec) { GlobeState._sbActive=null; return false; }
  rec.nodes=JSON.parse(JSON.stringify(BRIEF.nodes));
  rec.hide=(BRIEF.hide||[]).slice(); rec.vert=(BRIEF.vert||[]).slice();
  rec.ts=Date.now();
  _sbSave();
  return rec.n;
}
function sbLoad(i){
  const b=SAVEDB[i]; if(!b || !Array.isArray(b.nodes)) return false;
  const seen={};
  BRIEF.nodes=JSON.parse(JSON.stringify(b.nodes)).filter(function(n){
    if(!n || typeof n.k!=='string' || seen[n.k]) return false;
    if(n.t==='org' && !((typeof orgOf==='function'&&orgOf(n.r))||(typeof orgById==='function'&&orgById(n.r)))) return false;
    seen[n.k]=1; return true;
  }).map(function(n){ if(n.inv) n.inv=_bfInvClean(n.inv); return n; });
  BRIEF.nodes.forEach(function(n){ if(n.p && !BRIEF.nodes.some(function(x){ return x.k===n.p; })) n.p=null; });
  BRIEF.hide=(b.hide||[]).slice(); BRIEF.vert=(b.vert||[]).slice();
  if(!b.id){ b.id=Date.now().toString(36)+Math.random().toString(36).slice(2,7); _sbSave(); }   // legacy records earn an id on first load
  GlobeState._sbActive=b.id;                       // v1.12.0: loading makes it the working copy
  _bfSave();
  try{ setMode('brief'); renderBrief(); globeMark(); _bfFrame(); }catch(_){}
  return true;
}
function sbRename(id,n){
  const i=_shFind('bf',id); if(i<0) return;
  SAVEDB[i].n=String(n||'').trim().slice(0,60)||SAVEDB[i].n; _sbSave();
}
function sbPin(id){ const i=_shFind('bf',id); if(i<0) return; SAVEDB[i].pin=!SAVEDB[i].pin; _sbSave(); }
function sbRemove(i){
  const rec=SAVEDB[i];
  if(rec && rec.id && GlobeState._sbActive===rec.id) GlobeState._sbActive=null;
  SAVEDB.splice(i,1); _sbSave();
}

function _ledgerHTML(){
  const esc=_odEsc, escA=_odEscA;

    +'<button class="od-ico od-ico-x" type="button" data-ldclose="1" aria-label="Close">✕</button></div>';

  h+='<div class="ld-sub ld-pad">Everything entered on the map — every ID and the People, Specs, Notes and Links filed under it. Tap an ID to read its items; tap an installation to open it on the map.</div>';
  let any=false;
  Object.keys(RECORDS).sort(function(a,b){ return _lgSiteName(a).localeCompare(_lgSiteName(b)); }).forEach(function(id){
    const r=RECORDS[id]; if(!r) return;

    h+='<div class="ld-org"><button class="ld-orgbtn" type="button" data-ldgo="'+escA(id)+'">'+esc(_lgSiteName(id))+'</button><span class="ld-tot">'+tot+' item'+(tot===1?'':'s')+'</span></div>';
    const KINDS=['people','specs','notes','links'];
    const rowsFor=function(match){                 // match=null → untagged items
      let out='';
      KINDS.forEach(function(kk){ (r[kk]||[]).forEach(function(it){
        const keep=(match==null)?(!it.xid):(it.xid===match);
        if(keep) out+=_ldItem(kk, it);

      return out;

/* ═══ v1.1.0 THE DATABASE DOOR — the inception concept, finally built.
   Records (People · Specs · Notes · Links · the ID registry) live in the
   owner's own database (Supabase), not on the device. The A-ORG-1 contract
   holds verbatim: ZERO foreign code at boot — the client library is injected
   by ensureSupabase() only when the owner taps Connect; Connect is manual
   each session. One board row carries the whole records map (jsonb), a
   realtime channel mirrors other devices, updated_by kills echo loops.
   IndexedDB stays as the offline cache under it (a PWA must open in a dead
   zone); the database is the source of truth whenever connected. ═══ */
let _db=null, _dbCh=null, _dbCfg=null, _dbState='off', _dbMsg='Not connected';
let _dbPushT=null;
const _dbClientId=Math.random().toString(36).slice(2)+Date.now().toString(36);
const DB_TABLE='a2_records';
function _dbSetState(st, msg){
  _dbState=st; _dbMsg=msg||'';
  try{ const el=document.getElementById('dbStatus');
    if(el){ el.textContent=_dbMsg;
      el.className='db-status '+(st==='live'?'db-live':(st==='error'?'db-error':(st==='connecting'?'db-connecting':'db-off'))); } }catch(_){}
  try{ const ch=document.querySelector('.am-dbchip');
    if(ch){ ch.textContent=(st==='live')?'LIVE':(st==='connecting'?'…':(st==='error'?'ERR':'OFF'));
      ch.className='am-dbchip '+(st==='live'?'am-db-live':(st==='error'?'am-db-error':'am-db-off')); } }catch(_){}
}
function _dbCfgSave(cfg){
  _dbCfg=cfg;
  try{ if(_rdb){ const tx=_rdb.transaction('kv','readwrite'); tx.objectStore('kv').put({k:'dbcfg', v:cfg}); } }catch(_){}
}
function ensureSupabase(){
  return new Promise(function(res){
    if(window.supabase && window.supabase.createClient) return res(true);
    var ex=document.getElementById('sbLib');
    if(ex){
      ex.addEventListener('load', function(){ res(!!(window.supabase&&window.supabase.createClient)); }, {once:true});
      ex.addEventListener('error', function(){ res(false); }, {once:true});
      return;
    }
    var sc=document.createElement('script');
    sc.id='sbLib'; sc.crossOrigin='anonymous';
    sc.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7';   // dead-lint allowlisted: injected on MANUAL Connect only
    sc.onload=function(){ res(!!(window.supabase&&window.supabase.createClient)); };
    sc.onerror=function(){ _dbSetState('error','Database library failed to load (offline or CDN blocked) — the app is unaffected.'); res(false); };
    document.head.appendChild(sc);
  });
}
function _dbSnapshot(){
  // v1.2.0 — the board carries the whole working set: records, the brief
  // diagram (groups included) and saved views. Each part merges newest-wins.
  // v1.12.0 — the WORKING diagram left the board (blank-slate law); the
  // saved-brief records are the cross-device carrier now.
  return {v:3, records:RECORDS,
    views:{list:SAVEDV, mod:_svMod},
    briefs:{list:SAVEDB, mod:_sbMod}};
}
function _dbApply(data){
  if(!data) return;
  let took=0;
  Object.keys(data.records||{}).forEach(function(k){
    const r2=data.records[k]; if(!r2||!r2.id) return;
    if(!r2.ids) r2.ids=[];
    const loc=RECORDS[k];
    if(!loc || (r2.mod||0)>=(loc.mod||0)){       // newest record wins, per record
      RECORDS[k]=r2; took++;
      try{ if(_rdb){ const tx=_rdb.transaction('records','readwrite'); tx.objectStore('records').put(r2); } }catch(_){}
    }
  });
  // v1.12.0 — an incoming WORKING-brief blob (older app versions still send
  // one) is deliberately IGNORED: the working diagram is session-scoped, and
  // only the saved-brief records travel.
  // v1.2.0 — saved views: same law
  if(data.views && Array.isArray(data.views.list) && (data.views.mod||0)>(_svMod||0)){
    SAVEDV=data.views.list.slice(); _svMod=data.views.mod;
    try{ if(_rdb){ const tx=_rdb.transaction('kv','readwrite');
      tx.objectStore('kv').put({k:'views', v:{v:1, list:SAVEDV, mod:_svMod}}); } }catch(_){}
    took++;
  }
  // v1.7.0 — saved briefs: same law (write kv directly — never via _sbSave, echo law)
  if(data.briefs && Array.isArray(data.briefs.list) && (data.briefs.mod||0)>(_sbMod||0)){
    SAVEDB=data.briefs.list.slice(); _sbMod=data.briefs.mod;
    try{ if(_rdb){ const tx=_rdb.transaction('kv','readwrite');
      tx.objectStore('kv').put({k:'briefs', v:{v:1, list:SAVEDB, mod:_sbMod}}); } }catch(_){}
    took++;
  }
  if(took){
    try{ const dz=document.getElementById('dossier');
      if(dz && !dz.hidden && dz.dataset.shTab) _shOpen(dz.dataset.shTab);   // v1.19.0: keep the open pane
      else if(dz && !dz.hidden && GlobeState.sel) showDossier(GlobeState.sel); }catch(_){}
    // v1.8.0: an open repository re-reads whatever the merge brought in
    try{ const lp=document.getElementById('ledger'); if(lp && lp.classList.contains('on')) _ledgerRender(); }catch(_){}
  }
}
// ── v1.2.0 THE RECONNECT CHIP — settings exist but this session is offline:
// one tap goes live. The law holds — NOTHING foreign loads until the tap.
function _dbChipShow(){
  try{
    if(!_dbCfg || !_dbCfg.url || _db) return;
    if(!document.body || !document.createElement) return;
    if(document.getElementById('dbChip')) return;
    const el=document.createElement('button');

    el.addEventListener('click', function(ev){
      if(ev.target && ev.target.closest && ev.target.closest('[data-dbchipx]')){ el.remove(); return; }

        if(ok){ try{ _bfToast('Database live — records save off-device'); }catch(_){} }
        else { try{ _dbSheet(); }catch(_){} }      // trouble → the full sheet says why
      });
    });

    setTimeout(function(){ try{ if(!el.disabled) el.remove(); }catch(_){} }, 25000);   // quiet exit; it returns next boot
  }catch(_){}
}
function dbPush(){
  if(!_db || !_dbCfg) return;                     // not connected: IndexedDB cache only
  clearTimeout(_dbPushT);
  _dbPushT=setTimeout(async function(){
    try{
      const { error }=await _db.from(DB_TABLE).upsert({ id:_dbCfg.board, data:_dbSnapshot(),
        updated_at:new Date().toISOString(), updated_by:_dbClientId });
      if(error) _dbSetState('error','Save to database failed: '+error.message);
      else _dbSetState('live','Database live — saved '+new Date().toLocaleTimeString());
    }catch(e){ _dbSetState('error','Save error: '+(e&&e.message||e)); }
  }, 700);
}
async function dbPullOnce(){
  try{
    const { data, error }=await _db.from(DB_TABLE).select('data,updated_by').eq('id',_dbCfg.board).maybeSingle();
    if(error){ _dbSetState('error','Load failed: '+error.message+' — is the '+DB_TABLE+' table created?'); return false; }
    if(data && data.data) _dbApply(data.data);
    else await _db.from(DB_TABLE).upsert({ id:_dbCfg.board, data:_dbSnapshot(),
      updated_at:new Date().toISOString(), updated_by:_dbClientId });   // first device seeds the board
    return true;
  }catch(e){ _dbSetState('error','Load error: '+(e&&e.message||e)); return false; }
}
async function dbConnect(){
  const cfg=_dbCfg;
  if(!cfg || !cfg.url || !cfg.key){ _dbSetState('off','Not configured — enter the project URL and key.'); return false; }
  _dbSetState('connecting','Connecting…');
  const ok=await ensureSupabase();
  if(!ok) return false;
  try{
    dbDisconnect(true);
    _db=window.supabase.createClient(cfg.url, cfg.key, { realtime:{ params:{ eventsPerSecond:5 } } });
    const pulled=await dbPullOnce();
    if(!pulled){ _db=null; return false; }
    _dbCh=_db.channel('a2-'+cfg.board)
      .on('postgres_changes', { event:'*', schema:'public', table:DB_TABLE, filter:'id=eq.'+cfg.board }, function(payload){
        const row=payload.new||{};
        if(row.updated_by===_dbClientId) return;   // our own write echoing back
        if(row.data) _dbApply(row.data);
      })
      .subscribe(function(status){
        if(status==='SUBSCRIBED') _dbSetState('live','Database live — records save off-device and mirror your other devices.');
        else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT') _dbSetState('error','Realtime channel error — saves still reach the database; live mirroring may lag.');
      });
    _dbSetState('live','Connected — records now live in your database.');
    // v1.11.0 (owner: "don't want to connect every time") — the FIRST
    // successful connect turns auto-reconnect on; the sheet toggle can turn
    // it off, and that explicit choice is never overridden here.
    if(_dbCfg && _dbCfg.auto==null){ _dbCfg.auto=1; _dbCfgSave(_dbCfg); }
    return true;
  }catch(e){ _dbSetState('error','Connect failed: '+(e&&e.message||e)); _db=null; return false; }
}
// v1.11.0 AUTO-RECONNECT — the boot-inert law, amended by its owner: the app
// still boots with zero foreign code, but once a board has connected and the
// stored auto flag stays on, the next open brings it live by itself. Quiet
// on success; on failure it degrades to the one-tap chip, never a boot error.
function _dbAutoBoot(){
  try{
    if(_db || !_dbCfg || !_dbCfg.url || !_dbCfg.auto) return false;

      if(ok){ try{ _bfToast('Database live — everything saves off-device'); }catch(_){} }
      else { try{ _dbChipShow(); }catch(_){} }
    }).catch(function(){ try{ _dbChipShow(); }catch(_){} });   // any failure degrades to the one-tap chip
    return true;
  }catch(_){ return false; }
}
function dbDisconnect(silent){
  try{ if(_dbCh && _db) _db.removeChannel(_dbCh); }catch(_){}
  _dbCh=null; _db=null;
  if(!silent) _dbSetState('off','Disconnected — new records stay on this device until you reconnect.');
}
try{ window.DB={ connect:dbConnect, disconnect:dbDisconnect, push:dbPush, state:function(){ return _dbState; },

/* ══════════ module: s6-export ══════════ */
/* ============================================================================
   s6-export (NEW at v0.2.0) — THE SNAPSHOT SPINE. The flagship export contract:
   buildSnapshot(scope) is the ONE producer every exporter consumes — take what
   the map shows AND the data beneath it, in one serializable object. Future
   layers (M2 datastore people/notes/equipment, M3 brief chains) ATTACH to
   Snapshot.sites rows / Snapshot.extras — renderers never learn app internals,
   so export never has to be rebuilt. Renderers today: PNG · PDF (print) ·
   HTML dossier (self-contained file) · JSON.
   ========================================================================= */

// scope: 'auto' (selection family if selected, else everything visible-eligible)
function buildSnapshot(scope){
  scope=scope||'auto';
  const sel=GlobeState.sel?siteById(GlobeState.sel):null;
  const off=_famOffSet();
  // v0.11.0: the selection family = the selected ORG's chain, at their sites
  const og=(GlobeState.selOrg&&typeof orgOf==='function')?orgOf(GlobeState.selOrg):null;
  const chain=og?ogChainUp(og.id).map(function(p){ return siteById(ogEffSite(p.id)||''); }).filter(Boolean):[];
  const kids=og?ogKids(og.id).map(function(k){ return siteById(ogEffSite(k.id)||''); }).filter(Boolean):[];
  let rows;
  if(sel && scope!=='all'){
    rows=[sel].concat(chain, kids);
  } else {
    rows=_sitesArr().filter(function(st){ return !off.has(clsOf(st.id)); });
  }
  const seen=new Set(); rows=rows.filter(function(r){ if(!r||seen.has(r.id)) return false; seen.add(r.id); return true; });
  const famCounts={}; rows.forEach(function(r){ const k=clsOf(r.id); famCounts[k]=(famCounts[k]||0)+1; });
  let img=null;
  try{ const cv=document.getElementById('globeCanvas'); if(cv&&cv.toDataURL) img=cv.toDataURL('image/png'); }catch(_){}
  const cam=(function(){ try{ return {zoom:GlobeState.zoom, yaw:GlobeState.yaw, pitch:GlobeState.pitch}; }catch(_){ return {}; } })();
  return {
    meta:{ app:'A-ORG-2', version:(typeof APP_VERSION!=='undefined'?APP_VERSION:''),
           generated:new Date().toISOString(),
           title: (function(){ try{ if(document.body.classList.contains('brief-mode')&&BRIEF.mem.length){ const Ct=_briefChainMap({all:true}); const r0=Ct.order.filter(function(k){ return Ct.nodes[k].lvl===1; }); const h0=r0.length?Ct.nodes[r0[0]]:null; return 'Brief — '+(h0?h0.name:'')+(r0.length>1?(' +'+(r0.length-1)):''); } }catch(_){} const _po=(GlobeState.selOrg&&typeof orgOf==='function')?orgOf(GlobeState.selOrg):null; return sel ? (sel.base+(_po?(' — '+_po.name):'')) : 'U.S. Army — global laydown'; })(),
           scope: sel&&scope!=='all' ? 'selection-family' : 'all-visible' },
    camera:cam,
    selection: sel ? { id:sel.id, chainUp:chain.map(function(c){return c.id;}), children:kids.map(function(k){return k.id;}) } : null,
    filters:{ classesOff:Array.from(off) },
    classes:famCounts,
    sites:rows.map(function(r){ return { id:r.id, base:r.base, st:r.st, unit:r.unit,
      lat:r.lat, lon:r.lon, grp:r.grp, parent:r.parent, cls:clsOf(r.id) }; }),
    extras:{ brief:(BRIEF.mem.length?(function(){
      const Cb=_briefChainMap({all:true});
      return { mem:BRIEF.mem.slice(), hide:(BRIEF.hide||[]).slice(),
        hqs:Cb.order.filter(function(k){ return Cb.nodes[k].lvl===1; }),
        ann:JSON.parse(JSON.stringify(BRIEF.ann)),
        rows:Cb.order.map(function(k){ const n=Cb.nodes[k];
          let siteName='';
          if(n.custom){ const c=orgById(n.id); const b=(c&&c.base)?siteById(c.base):null; siteName=b?b.base:''; }
          else { const s2=siteById(ogEffSite(n.id)||''); siteName=s2?s2.base:''; }
          return {id:n.id, name:n.name, lvl:n.lvl, root:n.root, custom:n.custom,
            site:siteName, note:BRIEF.ann[n.id]||''};
        }) };
    })():null),
      orgs:((typeof ORGS!=='undefined'&&ORGS.length)?JSON.parse(JSON.stringify(ORGS)):null),   // custom subordinates ride too (v0.7.0)
      records:(function(){                     // the datastore rides every export
      const out={}; if(typeof recordOf==='function') rows.forEach(function(r){ const rec=recordOf(r.id); if(rec && recCount(r.id)) out[r.id]=rec; });
      return out; })() },
    image:img,
  };
}

// ---- shared download helper (app context — a real user gesture each time) -----
function _xpDownload(name, mime, data){
  try{
    const blob=(data instanceof Blob)?data:new Blob([data],{type:mime});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download=name;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ try{ URL.revokeObjectURL(a.href); a.remove(); }catch(_){} }, 800);
  }catch(e){ try{ window._errToast&&_errToast('export failed: '+e.message); }catch(_){} }
}
function _xpStamp(){ const d=new Date(); const p=function(n){return (n<10?'0':'')+n;};
  return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes()); }

function exportPNG(){

// ---- ledger faces: 24h mono digits + a short zone name (EDT/CET…) ------------
function _tzAbbr(tz, d){
  try{
    const o={timeZoneName:'short'}; if(tz) o.timeZone=tz;
    const p=new Intl.DateTimeFormat('en-US',o).formatToParts(d||new Date());
    const z=(p.find(function(x){ return x.type==='timeZoneName'; })||{}).value||'';
    return /GMT|UTC/i.test(z)?'':z;
  }catch(_){ return ''; }
}
function _ledTime(tz, d, secs){
  try{
    const o={hour:'2-digit',minute:'2-digit',hour12:false};
    if(secs) o.second='2-digit';
    if(tz) o.timeZone=tz;
    return new Intl.DateTimeFormat('en-GB',o).format(d||new Date());
  }catch(_){ return secs?'--:--:--':'--:--'; }
}

// 12h civilian face for an IANA zone (zone-sheet rows still speak civilian).
function civilianTime(tz, d){
  d=d||new Date();
  try{
    const p=new Intl.DateTimeFormat('en-US',{timeZone:tz,hour:'numeric',minute:'2-digit',hour12:true}).formatToParts(d);
    let hh='12',mm='00',ap='AM';
    p.forEach(function(x){ if(x.type==='hour')hh=x.value; if(x.type==='minute')mm=x.value; if(x.type==='dayPeriod')ap=x.value.toUpperCase(); });
    return {time:hh.padStart(2,'0')+':'+mm, ap:ap};
  }catch(_){ return {time:'--:--', ap:''}; }
}

// nearest theater region (PORTED exact: dlon wrapped ±180, lon scaled by
// cos(mean lat) — dateline-safe; min squared-degrees wins)
function nearRegion(lat, lon){
  let best=null, bs=1e9;
  CLOCK_REGIONS.forEach(function(r){
    const dlat=lat-r.ll[0], dlon=((lon-r.ll[1]+540)%360)-180;
    const s=dlat*dlat + Math.pow(dlon*Math.cos(((lat+r.ll[0])/2)*Math.PI/180), 2);
    if(s<bs){ bs=s; best=r; }
  });
  return best;
}

// ---- The repaint brain (v1.14.0: ONE ledger \u2014 the __k write-dedupe survives) --
// LOCAL row shows hh:mm:ss and ticks every second; BASE shows hh:mm in the
// picked zone (idle face until a zone exists). One innerHTML swap per change.
function tickClocks(){

    const el=document.getElementById('timeLedger'); if(!el) return;
    const now=new Date();

    // stubbed matchMedia falls through to seconds so the harness sees them)
    let secs=true; try{ if(window.matchMedia && matchMedia('(max-width:1099px)').matches) secs=false; }catch(_){}
    const lt=_ledTime(null, now, secs);
    const lz=String(window.__tzLbl||_tzAbbr(null, now)||'').slice(0,8);
    const z=window._selZone;
    let bt='\u2014:\u2014', bz='SET', idle=' tl-idle';
    if(z && z.tz){ bt=_ledTime(z.tz, now, false); bz=(_tzAbbr(z.tz, now)||String(z.label||'')).slice(0,8); idle=''; }
    const key=lt+'|'+lz+'|'+bt+'|'+bz;
    if(el.__k===key) return;

  // v1.16.2 — the IGNITED DOTS (mock: soft glowing points, not reticles):
  // every lit site paints via _glowDot (halo · corona · hot core). As of
  // v1.17.0 the resting WORLD VIEW shares the same recipe — the boot's look
  // persists below zoom 1.6; the no-glow reticle law now governs the
  // operational zoom (≥ 1.6) only.
  try{
    var bl=GlobeState._bootLit;
    if(bl){
      var all=bl.has('*');
      for(var si=0; si<SITES.length; si++){
        var st2=SITES[si];
        if(st2.lat==null || st2.lon==null) continue;
        if(!all && !bl.has(String(st2.grp||'').split('|')[0])) continue;
        var pp2=_projectLonLat(st2.lon, st2.lat, m);
        if(pp2[2]<0) continue;
        _glowDot(ctx, pp2[0], pp2[1], Math.max(0.45, pp2[2]));   // v1.17.0: shared recipe
      }
    }
  }catch(_){}
  // the lineage line — lifted great-circle segments, drawn up to the beat's
  // progress (slerp copied from drawSubtleArcs; partial-stroke is boot-only)
  var seg=B.seg;
  var drawHop=function(a,b,f){
    var av=lonLatToVec(a.lon,a.lat), bv=lonLatToVec(b.lon,b.lat);
    var dot=Math.max(-1,Math.min(1,av[0]*bv[0]+av[1]*bv[1]+av[2]*bv[2]));
    var om=Math.acos(dot), so=Math.sin(om);
    ctx.beginPath(); var started=false;
    var SEG=40, lim=Math.max(1,Math.round(SEG*Math.max(0,Math.min(1,f))));
    for(var i=0;i<=lim;i++){ var t2=i/SEG, w1,w2;
      if(so<1e-6){ w1=1-t2; w2=t2; } else { w1=Math.sin((1-t2)*om)/so; w2=Math.sin(t2*om)/so; }
      var lift=1+0.08*Math.sin(Math.PI*t2);
      var pt=_projectVec([(av[0]*w1+bv[0]*w2)*lift,(av[1]*w1+bv[1]*w2)*lift,(av[2]*w1+bv[2]*w2)*lift], m);
      if(pt[2]<-0.02){ started=false; continue; }
      if(!started){ ctx.moveTo(pt[0],pt[1]); started=true; } else ctx.lineTo(pt[0],pt[1]);
    }
    ctx.strokeStyle='rgba(255,179,92,.9)'; ctx.lineWidth=2.2; ctx.lineCap='round'; ctx.stroke();
  };
  for(var k=1;k<=seg && k<B.hops.length;k++) drawHop(B.hops[k-1], B.hops[k], (k===seg)?B.segP:1);
  // the opening pulse at hops[0] (v1.16.5: Fort Shafter — the Pacific start):
  // bright dot + two expanding rings
  if(seg===0){
    var hp=B.hops[0], p0=_projectLonLat(hp.lon,hp.lat,m);
    if(p0[2]>=0){
      ctx.fillStyle='#FFD98C'; ctx.beginPath(); ctx.arc(p0[0],p0[1],3.2,0,Math.PI*2); ctx.fill();
      [0,0.45].forEach(function(off){
        var q=(B.segP+off)%1;
        ctx.strokeStyle='rgba(245,215,110,'+(0.7*(1-q)).toFixed(3)+')'; ctx.lineWidth=1.6;
        ctx.beginPath(); ctx.arc(p0[0],p0[1],4+q*16,0,Math.PI*2); ctx.stroke();
      });
    }
  }
  // arrival flash at each hop landing: #FFD98C dot + 12px ring, ~450ms
  (B.flash||[]).forEach(function(fl){
    var age=(now-fl.t)/450; if(age<0||age>1) return;
    var hp2=B.hops[fl.i]; if(!hp2) return;
    var pp=_projectLonLat(hp2.lon,hp2.lat,m); if(pp[2]<0) return;
    ctx.fillStyle='#FFD98C'; ctx.beginPath(); ctx.arc(pp[0],pp[1],3,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='rgba(255,217,140,'+(1-age).toFixed(3)+')'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(pp[0],pp[1],4+age*12,0,Math.PI*2); ctx.stroke();
  });
  // the finale bloom over CONUS — swells through the US beat and hands into
  // the veil's own fade (v1.16.5: the flood beat is seg 4)
  if(seg===4){
    var c0=_projectLonLat(-98,39,m);
    if(c0[2]>=0){
      var bp=Math.min(1,B.segP*1.3);
      var R2=Math.max(1,(m.R||200)*0.55*bp);
      var al=0.26*(1-0.4*bp);
      if(al>0.008){
        var gr=ctx.createRadialGradient(c0[0],c0[1],0,c0[0],c0[1],R2);
        gr.addColorStop(0,'rgba(245,215,110,'+al.toFixed(3)+')');
        gr.addColorStop(1,'rgba(245,215,110,0)');
        ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(c0[0],c0[1],R2,0,Math.PI*2); ctx.fill();
      }
    }
  }
  ctx.restore();
}
(function(){
  try{
    var veil=document.getElementById('introVeil');
    if(!veil || !veil.classList || typeof requestAnimationFrame!=='function') return;   // stub DOM (harness) → no intro
    var rm=false; try{ rm=window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(_){}
    if(rm || window.__SANDBOX){ try{ veil.remove(); }catch(_){} return; }
    var vv=veil.querySelector('.in-ver'); if(vv) vv.textContent=APP_VERSION;
    var mark=veil.querySelector('.in-mark');
    document.body.classList.add('intro');
    veil.hidden=false;
    // v1.16.5 (owner: "for the intro hops, go Pacific → Korea → SWA → Europe →
    // US"): FIVE beats over ~3.9s, one hop per theater. The run opens in the
    // PACIFIC (Fort Shafter pulses, Hawaii/Guam ignite), the line leaps to
    // Korea, SW Asia, Europe, and lands on the Pentagon for the US finale —
    // full flood, CONUS bloom, and the A-ORG-2 flash (v1.16.4's closer).
    var T=3900, t0=performance.now(), n=0, done=false;
    var HOPS=[ {lat:21.35, lon:-157.9},   // Fort Shafter / Schofield — PACIFIC
               {lat:36.97, lon:127.03},   // Camp Humphreys — KOREA
               {lat:28.86, lon:48.15},    // Camp Arifjan — SW ASIA
               {lat:50.08, lon:8.24},     // Wiesbaden — EUROPE
               {lat:38.87, lon:-77.06} ]; // The Pentagon — US
    var GRPS=[ ['pi','gu'], ['kj'], ['swa'], ['eur'], null ];   // null = flood everything
    // camera waypoints at beat boundaries (lon, westward; Hawaii sits at 202°E)
    var CAM=[205, 150, 90, 25, -40, -78];
    var startZoom=GlobeState.zoom||1.8;
    GlobeState._bootMode=true;
    GlobeState._bootLit=new Set();
    GlobeState._boot={hops:HOPS, seg:0, segP:0, flash:[], t:t0};
    var ease=function(p){ return p<0.5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2; };
    var fin=function(){
      if(done) return; done=true;
      GlobeState._bootMode=false; GlobeState._bootLit=null; GlobeState._boot=null;
      try{ if(mark){ mark.style.letterSpacing=''; mark.style.textIndent=''; mark.style.opacity='';
        mark.style.transform=''; mark.style.filter=''; } }catch(_){}
      document.body.classList.remove('intro');
      veil.style.opacity='0'; veil.style.pointerEvents='none';
      setTimeout(function(){ try{ veil.remove(); }catch(_){} }, 500);
      // ease down onto the resting frame (the boot pose the shell set)
      try{ if(typeof flyToLatLon==='function') flyToLatLon(33, -78, startZoom);
           else { _faceLonLatAngles(-78, 33); GlobeState.zoom=startZoom; } }catch(_){}
      try{ GlobeState.dirty=true; globeMark(); }catch(_){}
    };
    veil.addEventListener('pointerdown', fin);
    var litSeg=-1;
    var step=function(now){
      if(done) return;
      if(++n>900){ fin(); return; }                       // hard cap — no environment may loop this
      var p=Math.min(1,(now-t0)/T);
      var seg=Math.min(4, Math.floor(p*5)), segP=p*5-seg;
      try{
        // one continuous westward pan through the theater waypoints (Hawaii →
        // Korea → SWA → Europe → CONUS); the final beat also eases the pitch
        // onto the resting frame so fin()'s landing fly is a settle.
        var lon=CAM[seg]+(CAM[seg+1]-CAM[seg])*segP;
        var pit=(seg===4)?(28+5*segP):28;
        GlobeState.yaw=(lon-90)*Math.PI/180;
        GlobeState.pitch=pit*Math.PI/180;
        GlobeState.zoom=1.05+0.25*ease(p);
        _rebuildGlobeQ();
        if(seg!==litSeg){
          litSeg=seg;
          var g=GRPS[seg];
          if(g) g.forEach(function(x){ GlobeState._bootLit.add(x); });
          else GlobeState._bootLit.add('*');
        }
        // v1.16.5: the arrival flash fires when the line actually LANDS (the
        // tail of each hop beat) — not at departure, which ringed the target
        // before the line reached it.
        if(seg>0 && segP>0.94 && !GlobeState._boot.flash.some(function(f){ return f.i===seg; })){
          GlobeState._boot.flash.push({i:seg, t:now});
        }
        GlobeState._boot.seg=seg; GlobeState._boot.segP=segP; GlobeState._boot.p=p; GlobeState._boot.t=now;
        // the wordmark condenses in from the Europe beat, then FLASHES in the finale
        if(mark){
          if(p>0.55){
            var wp=Math.min(1,(p-0.55)/0.31);
            mark.style.letterSpacing=(0.5-0.16*wp)+'em';
            mark.style.textIndent=(0.5-0.16*wp)+'em';
            mark.style.opacity=String(0.22+0.78*wp);
          } else {
            mark.style.letterSpacing='0.5em'; mark.style.textIndent='0.5em'; mark.style.opacity='0.12';
          }
          if(p>0.86){
            var fl=Math.sin(Math.min(1,(p-0.86)/0.14)*Math.PI);
            mark.style.transform='translateY(-16vh) scale('+(1+fl*0.06).toFixed(4)+')';
            mark.style.filter='drop-shadow(0 1px 0 rgba(0,0,0,.65)) drop-shadow(0 0 '+(18+fl*30).toFixed(1)+'px rgba(245,215,110,'+(0.35+fl*0.55).toFixed(3)+'))';
          }
        }
        GlobeState.dirty=true; globeMark();
      }catch(_){}
      if(p>=1){ fin(); return; }
      requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }catch(_){}
})();
</script>
