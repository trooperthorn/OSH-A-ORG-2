<html lang="en" data-app-theme="lumen">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>A-ORG-2</title>
<!-- PWA / installable-app support -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#060504">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="A-ORG-2">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<script>
/* A-ORG-2 first-byte diagnostics (PORTED from A-ORG-1, its first <script> — the
   diagnostics stack is load-bearing, never remove): captures every error/rejection
   from byte one, ring-buffered at window.__errLog; the styled toast attaches later
   and replays. __SANDBOX detects preview/iframe hosts so their boundary noise is
   logged but not toasted, and the service worker stays unregistered there. */
(function(){
  window.__SANDBOX=(function(){
    try{ if(window.top!==window) return true; }catch(_){ return true; }
    try{ if(window.origin==='null' || location.protocol==='blob:' || location.protocol==='data:' || location.protocol==='file:') return true; }catch(_){}
    return false;
  })();
  window.__errLog=[];
  function log(kind, msg, src, line, col, stack){
    try{
      const hostNoise = window.__SANDBOX && kind==='err' && /^Script error\.?$/.test(String(msg||'')) && !src && !line;
      window.__errLog.push({t:Date.now(), k:hostNoise?'host':kind, m:String(msg||'').slice(0,300), s:String(src||'').slice(0,200), l:line||0, c:col||0, st:String(stack||'').slice(0,500)});
      if(window.__errLog.length>10) window.__errLog.shift();
      if(hostNoise) return;   // preview-host boundary noise: logged, not toasted
      if(window._errToast){
        // v1.2.1 — a failed sw.js fetch is an UPDATE-CHECK failure, not an app
        // error: say what it means (the raw line stays in __errLog for diagnostics)
        if(/sw\.js/.test(String(msg||'')+String(src||'')) && /load|fetch|failed/i.test(String(msg||''))){
          window._errToast('Update check failed — running the installed version; will retry shortly.');
          return;
        }
        var at=(src?String(src).split('/').pop():'')||'';
        window._errToast(msg+((at||line)?(' @ '+(at||'inline')+(line?(':'+line):'')):''));
      }
    }catch(_){}
  }
  window.addEventListener('error', function(ev){
    var e=ev.error||{};
    log('err', ev.message, ev.filename||e.sourceURL||'', ev.lineno||e.line||0, ev.colno||e.column||0, e.stack||'');
  }, true);
  window.addEventListener('unhandledrejection', function(ev){
    var r=ev.reason||{};
    log('rej', r.message||r, r.sourceURL||'', r.line||0, r.column||0, r.stack||'');
  });
})();
</script>
<script>
  // Service worker registration (PORTED from A-ORG-1's v13.13.0 auto-update
  // contract): register on load — never in a sandbox — then check for a new
  // sw.js on load, on every return to the app, and every 20 minutes; when a new
  // version takes control (sw.js already skipWaiting+claims) the page reloads
  // itself once. If the user is mid-typing, the reload waits until they leave
  // the field or background the app.
  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      if(window.__SANDBOX) return;
      // v1.2.1 — REGISTRATION RETRIES (the owner's stranded session, 25 Aug: ONE
      // transient sw.js fetch failure left the whole session with no update path
      // and a raw red script error). register() now retries with backoff and on
      // every return to the app; the raw error toast for sw.js is translated
      // into what it means (see the first-byte capture below the shell).
      var _swTries=0;
      var _swGo=function(){
        navigator.serviceWorker.register('sw.js').then(function(reg){
          var kick=function(){ try{ reg.update(); }catch(_){ } };
          setTimeout(kick, 6000);
          setInterval(kick, 20*60*1000);
          document.addEventListener('visibilitychange', function(){
            if(document.visibilityState==='visible') kick();
          });
        }).catch(function(){
          // v1.2.2 — SELF-DIAGNOSIS (owner's dump showed 5 straight failures on
          // ONE origin file): probe sw.js ourselves once and put the HTTP status
          // + content-type in __errLog, so the next diagnostics dump names the
          // cause (404 = not deployed · text/html = rewrite ate it · TypeError =
          // blocked by a content filter / Lockdown Mode) instead of the symptom.
          if(_swTries===0){
            try{
              fetch('sw.js', {cache:'no-store'}).then(function(r){
                var ct=(r.headers && r.headers.get('content-type'))||'?';
                window.__errLog.push({t:Date.now(), k:'swp', m:'sw.js probe: HTTP '+r.status+' · '+String(ct).slice(0,60), s:'', l:0, c:0, st:''});
              }).catch(function(e2){
                window.__errLog.push({t:Date.now(), k:'swp', m:'sw.js probe: fetch blocked ('+String(e2&&e2.message||e2).slice(0,80)+') — likely a content blocker, VPN filter, or Lockdown Mode', s:'', l:0, c:0, st:''});
              });
            }catch(_){}
          }
          if(++_swTries<=5) setTimeout(_swGo, Math.min(120000, 15000*_swTries));   // 15s → 2min ladder
        });
      };
      _swGo();
      document.addEventListener('visibilitychange', function(){
        if(document.visibilityState==='visible' && !navigator.serviceWorker.controller && _swTries>0) _swGo();
      });
      var hadCtrl=!!navigator.serviceWorker.controller;
      navigator.serviceWorker.addEventListener('controllerchange', function(){
        if(!hadCtrl){ hadCtrl=true; return; }          // first install claiming — not an update
        if(window.__updReloading) return; window.__updReloading=true;
        var go=function(){ try{ location.reload(); }catch(_){ } };
        try{ if(typeof window.toast==='function') window.toast('Updating to the latest version…'); }catch(_){}
        var ae=document.activeElement;
        var typing=!!(ae && (ae.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)));
        if(typing){
          var done=false, fin=function(){ if(done) return; done=true; go(); };
          document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') fin(); }, {once:true});
          ae.addEventListener('blur', function(){ setTimeout(fin, 400); }, {once:true});
        } else setTimeout(go, 650);
      });
    });
  }
</script>
<style>
/* Integration inlines the RAW CONTENTS of modules/s1-tokens.css over the marker
   line below — this <style> element is the wrapper; do not add another. */
/* ═══════════════════════════════════════════════════════════════════════════════
   modules/s1-tokens.css — A-ORG-2 S1: canonical tokens (ARCTIC :root defaults)
   + the base component layer (glass recipes, chrome placement, focus, desktop).

   CONTRACT (canonical token names — themes swap VALUES only, never names):
     --ground --panel --panel-2 --line --text --dim --faint
     --accent --accent-deep --accent-wash --signal --signal-wash --danger --ok
     --t1 --t2 --t3 --t4          (brief tier law — see LOCKED SEMANTICS below)
     --r-card --r-chip --r-pill   (radii, ported from A-ORG-1 P1 tokens ~L92)
     --disp --body --mono         (system font stacks only — no webfonts at boot)
   The identity layer below :root holds no overrides — ORBIT is the one look.
   overrides. Default theme is arctic; these :root values ARE arctic, so
   (ATLAS is also the :root default; its block is inlined anyway — one source of truth.)

   LOCKED SEMANTICS (brief tier law, inherited from A-ORG-1 non-negotiable #6):
     --t1 white-family · --t2 cool (NEVER green) · --t3 warm · --t4 rose.
     No green on brief data. --ok exists for status affordances only.

   PORTED IDIOMS (A-ORG-1 index.html is source of truth):
     radii --r-pill/999 --r-chip/11 --r-card/16       (~L92-95)
     box reset + overscroll discipline                 (~L113-120)
     liquid-glass material (gradient + hairline ring + specular top edge + deep
     soft drop + accent under-glow), DESIGN-DOCTRINE "Material standard v13.7"
     #errToast / #errToast.show                        (~L2108-2109, ~L2139)
     focus-visible outline idiom                       (~L4890)
     phone-first: desktop ONLY inside @media(min-width:1100px); hovers are
     desktop-only; mobile gets springy :active presses; motion dies under
     prefers-reduced-motion                            (DESIGN-DOCTRINE)

   RELIABILITY CONTRACT HONORED:
     - NO position:fixed anywhere. body is the 100dvh non-scrolling anchor and
       all chrome floats position:absolute inside it (deviation from A-ORG-1,
       whose #errToast/#appTabs were fixed — equivalent here because the globe
       IS the page and body never scrolls).
     - NO transforms on scroll containers: #searchResults and #dossier (the two
       overflow:auto surfaces) are positioned with inset math only. The only
       transforms below are on non-scrolling buttons (:active spring) and the
       toast — never on anything that scrolls.
   ═══════════════════════════════════════════════════════════════════════════════ */

/* ─── 1 · TOKENS — ARCTIC is the :root default ─────────────────────────────── */
:root{
  /* ═══ LUMEN — the committed identity (owner, 20 Aug: "illuminated light
     yellow with black background"). A black world lit from within: warm-lit
     continents, bright gold coasts, luminous yellow voice. Not radar — no
     green, no scope; light does the work. ═══ */
  --ground:#060504;                       /* true black, warm hint               */
  --panel:#14110A;                        /* raised glass                        */
  --panel-2:#1C1810;                      /* second step                         */
  --line:rgba(240,220,140,.16);           /* warm hairline                       */
  --text:#F5F1E4;                         /* warm white ink                      */
  --dim:#C4BBA4;
  --faint:#9C947E;                        /* 5.85:1 worst case                   */
  --safe-l:calc(env(safe-area-inset-left,0px) + 12px);
  --safe-r:calc(env(safe-area-inset-right,0px) + 12px);
  /* v1.19.0 THE COLUMN: one token set owns the right control column, so
     "left is content, right is control" is a value the layout enforces
     instead of a hand-tuned inset per surface. */
  --rail-w:42px;
  --rail-r:var(--safe-r);
  --gut:calc(var(--rail-r) + var(--rail-w) + 12px);
  --accent:#F5D76E;                       /* the illuminated yellow — selection/live */
  --accent-rgb:245,215,110;               /* the same light, for rgba() glows (LCD) */
  --accent-deep:#D4B54A;
  --accent-wash:rgba(245,215,110,.13);
  --signal:#FFB35C;                       /* lineage/attention — warmer, orange lean */
  --signal-wash:rgba(255,179,92,.14);
  --danger:#FF7A66;
  --ok:#58C08A;                           /* status only — NEVER on brief data   */
  /* brief tiers (LOCKED: t1 white · t2 cool NEVER green · t3 warm · t4 rose) */
  --t1:#FFFFFF; --t2:#6FC7E8; --t3:#FFC95C; --t4:#FF8FC0;
  --r-card:16px; --r-chip:11px; --r-pill:999px;
  --disp:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  --body:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  --mono:ui-monospace,'SF Mono','Cascadia Mono','Segoe UI Mono',Menlo,Consolas,monospace;
  --glass-hi:rgba(26,22,14,.9);
  --glass-lo:rgba(8,7,4,.95);
  --spec:rgba(255,240,200,.09);
  --drop:0 10px 26px -10px rgba(0,0,0,.7);
  /* world paint (v0.8.0 owner: NO overcast — the wash and the limb halo were
     A-ORG-1 carryovers and are gone). True-black space, near-black land a
     whisper above the ocean, bright gold linework carries the whole map. */
  --ocean-hi:#080706;
  --ocean-lo:#030302;
  --land:11,9,6;         /* v1.17.3: backfill dimmed a step (was 17,14,9) */
  --coast:240,220,140;
  --world-glow:0;
  --line-tree:rgba(245,215,110,.34);
}

/* ─── 2 · RESET + THE STAGE (the globe IS the page) ────────────────────────── */
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%; background:var(--ground)}
html,body{margin:0; padding:0; overscroll-behavior:none; -webkit-text-size-adjust:100%}
body{
  position:relative;                       /* the ONLY positioning anchor — all
                                              chrome is absolute in here; nothing
                                              is position:fixed (reliability)    */
  width:100%; height:100vh; height:100dvh;
  overflow:hidden;                         /* the page never scrolls — full-bleed */
  background:var(--ground); color:var(--text);
  font-family:var(--body);
  -webkit-tap-highlight-color:transparent;
}
::selection{background:var(--accent-wash); color:var(--text)}

/* full-bleed stage: #globeCanvas fills the viewport between a minimal top edge
   (the search pill floats over it) and nothing. Radius law lives in globeMetrics:
   R = min(w,h)/2 * GlobeState.zoom * GlobeState.baseK (0.72 phone / 0.88 desktop). */
#globeCanvas{
  position:absolute; inset:0; z-index:0;
  width:100%; height:100%; display:block;
  touch-action:none;                       /* canvas owns its gestures (A-ORG-1
                                              v1.27.3 lesson — never page-scroll
                                              mid-drag)                          */
  background:transparent;                  /* --ground shows through             */
}

/* ─── 3 · LIQUID GLASS RECIPES (pill / chip / card / seg) ──────────────────── */
/* Material standard: gradient + hairline ring + specular top edge + deep soft
   drop. Search, dossier, stage bar, clocks and the theme switch all compose
   from these three recipes — restyle the tokens, never fork the recipe. */
.glass{
  background:linear-gradient(180deg,var(--glass-hi),var(--glass-lo));
  box-shadow:0 0 0 1px var(--line), inset 0 1px 0 var(--spec), var(--drop);
  -webkit-backdrop-filter:blur(14px) saturate(1.3);
  backdrop-filter:blur(14px) saturate(1.3);
}
.pill,.chip{
  appearance:none; -webkit-appearance:none; border:0; margin:0;
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  color:var(--text); text-transform:uppercase;
  user-select:none; -webkit-user-select:none; cursor:pointer;
  transition:transform .12s ease, box-shadow .15s ease, background-color .15s ease;
}
.pill{
  min-height:44px; padding:0 16px; border-radius:var(--r-pill);
  font:700 12px/1 var(--body); letter-spacing:.08em;
}
.chip{
  min-height:38px; padding:0 12px; border-radius:var(--r-chip);
  font:700 11px/1 var(--body); letter-spacing:.06em; color:var(--dim);
}
/* mobile press feel: springy :active (hovers are desktop-only, see §7) */
.pill:active,.chip:active{transform:scale(.96)}
.pill.on,.chip.on{
  color:var(--text);
  background:linear-gradient(180deg,var(--glass-hi),var(--glass-lo)),var(--accent-wash);
  box-shadow:0 0 0 1px var(--accent), inset 0 1px 0 var(--spec), var(--drop);
}
.card{
  border-radius:var(--r-card); padding:14px 16px; color:var(--text);
}
/* segmented control (Globe ⇄ Brief placeholder on #stageBar) */
/* (.seg retired v0.3.0; #modeSeg retired v0.6.0 — mode flips on the nav globe hold) */
/* uppercase micro-label (doctrine: letterspaced, tabular numerals on readouts) */

/* ─── 4 · CHROME PLACEMENT (all absolute — no fixed layers) ────────────────── */
/* z ladder: stage 0 · clocks 10 · stage bar 25 · top edge 20 · results 30 ·
   dossier 40 · errToast 120 · sbxNote 130 (A-ORG-1's toast z, kept). */

/* TITLE BAND — the wordmark alone, top center (v0.8.0: tiles retired; long-press = maintenance) */
#titleBar{
  position:absolute; z-index:22;
  top:calc(env(safe-area-inset-top,0px) + 6px);
  left:var(--safe-l); right:var(--safe-r);
  height:44px; display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:0 2px;
}
#wordmark{
  /* the A-ORG-1 engraved-wordmark voice (900/.34em, consult 2), gold-lit for Lumen */
  margin:0; font:900 17px/1 var(--disp); letter-spacing:.34em; text-indent:.34em;
  color:var(--text); text-align:center; flex:1; white-space:nowrap;
  background:linear-gradient(180deg,#FFFDF2 0%,#FFF6D8 30%,#F5D76E 58%,#B9973E 92%,#D4B54A 100%);
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 1px 0 rgba(0,0,0,.65)) drop-shadow(0 0 12px rgba(var(--accent-rgb),.30));
}
@media(min-width:1100px){ #wordmark{font-size:21px} }
#wordmark{ -webkit-user-select:none; user-select:none; -webkit-touch-callout:none }
/* v0.33.2 — THE BUILD STAMP (owner: "how can we track current build through the
   app?"): the running version sits under the wordmark, always on screen, so
   every screenshot and recording self-documents which build it shows. Quiet by
   design (faint mono); it rides the title bar's gesture fade. Not a control —
   the wordmark long-press door stays the interactive path to diagnostics. */
#verTag{position:absolute; left:50%; transform:translateX(-50%); top:37px;
  font:600 8.5px/1 var(--mono); letter-spacing:.14em; color:var(--faint);
  opacity:.9; pointer-events:none; -webkit-user-select:none; user-select:none}

/* v1.14.0 — THE MODE SEG (design 3a): glass pill, two cells, centered under the
   wordmark + build stamp. The active cell is solid accent with dark ink — pure
   CSS off body.brief-mode. Literal gold/ink pair (dock-material law) so the
   pill reads the same in both rooms. */
#modeSeg{position:absolute; z-index:22; left:50%; transform:translateX(-50%);
  top:calc(env(safe-area-inset-top,0px) + 48px);   /* v1.16.3: 4px up — brief space */
  display:flex; gap:2px; padding:3px; border-radius:var(--r-pill)}
.ms-cell{appearance:none; -webkit-appearance:none; border:0; margin:0; cursor:pointer;
  padding:6px 14px; border-radius:999px; background:none; color:var(--dim);
  font:800 9.5px/1 var(--body); letter-spacing:.12em; -webkit-tap-highlight-color:transparent}
body:not(.brief-mode) .ms-cell[data-mode="map"],
body.brief-mode .ms-cell[data-mode="brief"]{background:#F5D76E; color:#141006}
.ms-cell:active{transform:scale(.96)}
@media(min-width:1100px){
  #modeSeg{top:calc(env(safe-area-inset-top,0px) + 50px)}
  .ms-cell{padding:6px 16px; font-size:10px}
}

/* v0.34.0 — BOOT TITLE. The veil is transparent glass over the REAL spinning
   globe; only the big mark + version sit on it. body.intro parks the chrome;
   body.intro-invert flips the canvas to the paper look for one beat
   (invert+hue-rotate keeps the gold a gold — never blue; Lumen law). */
#introVeil{position:absolute; inset:0; z-index:200; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:12px; opacity:1; transition:opacity .45s ease}
#introVeil .in-mark{font:900 clamp(30px,9vw,54px)/1 var(--disp); letter-spacing:.34em; text-indent:.34em;
  white-space:nowrap; text-align:center; transform:translateY(-16vh);
  background:linear-gradient(180deg,#FFFDF2 0%,#FFF6D8 30%,#F5D76E 58%,#B9973E 92%,#D4B54A 100%);
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 1px 0 rgba(0,0,0,.65)) drop-shadow(0 0 18px rgba(var(--accent-rgb),.35));
  -webkit-user-select:none; user-select:none}
#introVeil .in-ver{font:600 10px/1 var(--mono); letter-spacing:.18em; color:var(--faint);
  transform:translateY(-16vh)}
body.intro #titleBar, body.intro #searchPill, body.intro #timeLedger, body.intro #modeSeg,
body.intro #navDock, body.intro #navPod{opacity:0 !important; pointer-events:none !important}

/* CHROME YIELDS (v0.8.0 automation): while a gesture is moving the globe, every
   floating surface steps back so the world owns the screen; it breathes back in
   the moment the hand lifts. Pure CSS response to one body flag. */
body.gesturing #titleBar, body.gesturing #searchPill, body.gesturing #timeLedger, body.gesturing #modeSeg,
body.gesturing #briefStage, body.gesturing #navPod,
body.gesturing #calloutCard{opacity:.22; transition:opacity .2s ease}
#titleBar, #searchPill, #timeLedger, #modeSeg, #briefStage{transition:opacity .3s ease}

/* SEARCH — standalone, one job, search-engine calm */
#searchPill{
  position:absolute; z-index:20;
  bottom:calc(env(safe-area-inset-bottom,0px) + 96px);   /* v0.14.0: thumb reach — clear of the globe button */
  left:max(var(--safe-l), calc(50% - 300px)); right:max(var(--safe-r), calc(50% - 300px));
  display:flex; align-items:center; gap:10px;
  min-height:48px; padding:0 18px; border-radius:var(--r-pill);
}
#searchPill .sp-ico{color:var(--faint); line-height:0; flex:none}
#searchPill input{
  flex:1; min-width:0; background:none; border:0; outline:none; padding:0;
  color:var(--text); font:600 16px/1.2 var(--body);   /* 16px kills the iOS focus-zoom (A-ORG-1 usInput law) */
}
#searchPill input::placeholder{color:var(--faint)}
#searchPill:focus-within{box-shadow:0 0 0 1.5px var(--accent), inset 0 1px 0 var(--spec), var(--drop)}
/* v1.14.0 — the ⌘K hint chip (desktop only; ⌘K and / already focus the field) */
.sp-kbd{display:none}
@media(min-width:1100px){
  .sp-kbd{display:inline-flex; flex:none; padding:5px 8px; border-radius:8px;
    background:rgba(0,0,0,.35); box-shadow:inset 0 0 0 1px var(--line);
    font:700 10px/1 var(--mono); color:var(--faint); pointer-events:none}
}
#appMenu{
  position:absolute; z-index:45; right:var(--safe-r);
  top:calc(env(safe-area-inset-top,0px) + 54px);
  width:min(78vw,260px); padding:6px; border-radius:var(--r-card);
}
.am-row{
  display:block; width:100%; border:0; background:none; margin:0; cursor:pointer; text-align:left;
  padding:13px 12px; border-radius:9px; color:var(--text); font:600 12.5px/1.3 var(--body);
}
.am-row:active{background:var(--accent-wash)}
.am-row.am-ver{color:var(--faint); font:600 10.5px/1.4 var(--mono); letter-spacing:.08em; text-transform:uppercase; cursor:default}
.am-about{padding:9px 12px 4px; color:var(--dim); font:500 11px/1.55 var(--body);
  box-shadow:0 -1px 0 var(--line)}

/* v1.0.0 — FIRST-RUN COACH: three quiet hints above the search pill, once ever,
   gone at the first touch. Base styles ARE the final state so the reduced-motion
   law (animation:none) shows them instantly instead of never. */
#coachRow{position:absolute; z-index:34; left:var(--safe-l); right:var(--safe-r);
  bottom:calc(env(safe-area-inset-bottom,0px) + 152px);
  display:flex; flex-direction:column; align-items:center; gap:7px;
  pointer-events:none; transition:opacity .4s ease}
.coach-chip{padding:8px 14px; border-radius:14px; background:rgba(22,17,9,.9);
  color:var(--text); font:600 12px/1.35 var(--body);
  box-shadow:0 0 0 1px rgba(var(--accent-rgb),.38), 0 6px 18px rgba(0,0,0,.45);
  animation:coachIn .5s ease backwards}
.coach-chip b{color:var(--accent)}
.coach-chip:nth-child(2){animation-delay:.55s}
.coach-chip:nth-child(3){animation-delay:1.1s}
@keyframes coachIn{from{opacity:0; transform:translateY(6px)}}

/* search results — SCROLL CONTAINER: inset math only, never transformed */
#searchResults{
  position:absolute; z-index:30;
  bottom:calc(env(safe-area-inset-bottom,0px) + 144px);   /* opens UPWARD, flush on the pill */
  left:max(var(--safe-l), calc(50% - 300px)); right:max(var(--safe-r), calc(50% - 300px));
  /* v1.0.4 THREE-ROW LAW (owner): a floating list shows ~3 rows and scrolls —
     a taller stack of pop-up rows starts burying the room behind it */
  max-height:172px;
  overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
  border-radius:var(--r-card); padding:4px;
}
#searchResults:empty{display:none}
/* row recipe for the search owner (module fills; shell only styles) */
#searchResults .sr-row{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  width:100%; min-height:44px; padding:10px 12px;
  appearance:none; -webkit-appearance:none; border:0; background:none; margin:0;
  border-radius:var(--r-chip); text-align:left; cursor:pointer;
  color:var(--text); font:600 13px/1.3 var(--body);
}
#searchResults .sr-row + .sr-row{box-shadow:0 -1px 0 var(--line)}
#searchResults .sr-row:active{background:var(--accent-wash)}
#searchResults .sr-row b{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
#searchResults .sr-tag{flex:none; font:800 8.5px/1 var(--mono); letter-spacing:.05em; padding:3px 5px; border-radius:5px}
#searchResults .sr-tag-org{color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent)}
#searchResults .sr-tag-site{color:var(--dim); box-shadow:inset 0 0 0 1px var(--line)}
#searchResults .sr-tag-state{color:var(--t3); box-shadow:inset 0 0 0 1px var(--t3)}
#searchResults .sr-sub{flex:none; color:var(--dim); font:500 11px/1.3 var(--body)}
#searchResults .sr-none{padding:12px 14px; color:var(--dim); font:500 13px/1.5 var(--body)}
#searchResults .sr-count{padding:6px 14px 8px; color:var(--faint); font:600 10.5px/1 var(--mono); letter-spacing:.08em; text-transform:uppercase}

/* DOCK 3 · context sheet — one card, three detents. SCROLL CONTAINER:
   inset math only, never transformed. */
#dossier{
  position:absolute; z-index:40;
  left:calc(var(--safe-l) - 4px); right:calc(var(--safe-r) - 4px);
  bottom:calc(env(safe-area-inset-bottom,0px) + 8px);
  overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
  border-radius:var(--r-card); padding:6px 16px 14px;
}
#dossier::after{content:''; display:block; height:96px}  /* rows rest above the globe button */
#dossier.dz-peek{max-height:112px; overflow:hidden}
/* v0.31.0 (re-verify): at peek only grip + name show — the bottom band belongs
   to the globe FAB, so no tappable row (the Specs tab was) may sit under it */
#dossier.dz-peek .od-tabs, #dossier.dz-peek .od-tabs~*{display:none}
#dossier.dz-peek.fan-open{max-height:208px}   /* the ⊕ rail needs its spring room */
/* fan out = card UP: while the rail is sprung, the whole card lifts clear of
   the globe button's circle — no pop-out can hide under the FAB at ANY width
   (audit: ▤ was unreachable at ≤360px when the card sat in the FAB band) */
#dossier.fan-open{bottom:calc(env(safe-area-inset-bottom,0px) + 122px)}
#dossier.dz-peek::after{content:''; position:absolute; left:0; right:0; bottom:0; height:26px;
  background:linear-gradient(180deg, rgba(0,0,0,0), var(--glass-lo)); pointer-events:none;
  border-radius:0 0 var(--r-card) var(--r-card)}
#dossier.dz-half{max-height:46vh; max-height:46dvh}
#dossier.dz-full{top:calc(env(safe-area-inset-top,0px) + 8px); max-height:none}
.sh-grip{
  appearance:none; -webkit-appearance:none; border:0; background:none; margin:0; cursor:pointer;
  display:block; width:100%; height:26px; padding:0;
}
.sh-grip span{display:block; width:38px; height:4px; border-radius:2px; background:rgba(240,220,140,.35); margin:0 auto}
.sh-crumbs{display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; padding-bottom:8px}
.sh-crumbs::-webkit-scrollbar{display:none}
.sh-crumb{
  appearance:none; -webkit-appearance:none; border:0; margin:0; cursor:pointer;
  flex:none; max-width:44vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  padding:12px 13px; border-radius:var(--r-pill); background:var(--panel-2);
  font:700 11px/1 var(--body); color:var(--dim);
}
.sh-crumb.tip{color:var(--text); box-shadow:0 0 0 1.5px var(--accent)}
.sh-crumb:active{background:var(--accent-wash)}

/* NAV DOCK — the centerpiece globe button; the ring hides inside it.
   Satellites pop as small symmetric circles on an arc above the button. */
#navDock{
  position:absolute; z-index:44; left:50%; transform:translateX(-50%);
  bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
  width:0; height:0;                                  /* children position from this point */
}
#navGlobe{
  appearance:none; -webkit-appearance:none; border:0; margin:0; cursor:pointer;
  position:absolute; left:-34px; bottom:0; width:68px; height:68px; border-radius:50%;
  background:linear-gradient(180deg,var(--glass-hi),var(--glass-lo));
  box-shadow:0 0 0 1.5px var(--accent), inset 0 1px 0 var(--spec), var(--drop);
  color:var(--accent); display:flex; align-items:center; justify-content:center;
  touch-action:none; user-select:none; -webkit-user-select:none;
}
#nvMark{pointer-events:none; display:block; -webkit-user-drag:none}
#nvRing{position:absolute; inset:1px; pointer-events:none; transform:rotate(-90deg)}
#nvRing circle{stroke:var(--signal); stroke-width:3; stroke-linecap:round; transition:none}
/* v1.14.0 (design 3a) — LABELED SATELLITES. Every control wears its name as a
   permanent micro-label (never a tooltip). Calm state = quiet glass circle with
   an accent glyph; the bright gold illumination is reserved for :active. */
/* v1.20.0: .nv-cell and .nv-lbl retired with #navRow — the pod's glyphs are
   universal and the captions were the only thing forcing its width. */
.nv-sat{
  appearance:none; -webkit-appearance:none; border:0; margin:0; cursor:pointer;
  position:relative; width:40px; height:40px; border-radius:50%; padding:0; flex:0 0 auto;
  display:flex; align-items:center; justify-content:center; color:var(--accent);
  background:none; box-shadow:none;
}
.nv-sat:disabled{opacity:.35; cursor:default; pointer-events:none}
.nv-sat:active{ background:var(--accent-wash); box-shadow:0 0 0 2px var(--accent), 0 0 20px rgba(245,215,110,.5) }
/* v1.19.0 THE COLUMN (owner: "zoom in/zoom out & 'undo'/'x' should be their
   own navigation buttons … easily accessible and discrete for use but out of
   the way"). ONE right-edge column, TWO objects in frequency order: the
   transport POD owns the bottom thumb band (94-261px from the thumb, down
   from 449-630 on the v1.18.0 rail), the two DOORS sit above it. Same width,
   same inset, same glass — the rooms read as one product. "Discrete" is
   opacity on a plate, never a plateless glyph and never a timer: gold over a
   lit coastline is 1.03:1, so the plate never dims; the column rests at .55
   (4.71:1, clears WCAG 1.4.11) and lifts to 1 on any pointerdown. */
#navPod{
  position:absolute; z-index:43;
  right:var(--rail-r); left:auto; top:auto; transform:none;
  display:flex; flex-direction:column; align-items:center;
  border-radius:20px;
  background:linear-gradient(180deg,var(--glass-hi),var(--glass-lo));
  box-shadow:0 0 0 1px var(--line), inset 0 1px 0 var(--spec), var(--drop);
  opacity:.55; pointer-events:auto;
  transition:opacity .18s ease, transform .18s ease;
}
#navPod{gap:8px; padding:7px 4px; bottom:calc(env(safe-area-inset-bottom,0px) + 14px)}
body.tp-live #navPod{opacity:1}
/* v1.21.0 (owner: "keep navigation controls bottom right and they can still
   be available, no tap needed"): the pod no longer collapses. The FAB's tap
   belongs to the layers now, and nothing hides the transport. */
body.brief-mode #navPod{display:none}   /* v1.22.0: the brief dock IS the pod there */
/* v1.20.0: 34px of ink, still 48px of thumb — the glyphs carry the meaning */
#navPod .nv-sat{width:34px; height:34px}
#navPod .nv-sat svg{width:19px; height:19px}
#navPod .ch-div{width:18px; height:1px; margin:2px 0; background:var(--line); align-self:center}
/* 40px of ink, 48px of thumb — the .co-x::after idiom. Smallest pod pitch is
   59.5px, so no two hit rects touch. */
.nv-sat{touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none}
.nv-sat::after{content:''; position:absolute; left:50%; top:50%;
  width:48px; height:48px; transform:translate(-50%,-50%)}
/* THE ROCKER — one object, two ends, a hairline seam, never a gap: three
   near-identical circles are indistinguishable to a thumb that isn't looking,
   and a miss lands on the other half of the same control. */
.tp-rock{display:flex; flex-direction:column; width:34px; height:72px; border-radius:17px;
  overflow:hidden; background:rgba(0,0,0,.30); box-shadow:inset 0 0 0 1px var(--line)}
.tp-half{appearance:none; -webkit-appearance:none; border:0; margin:0; padding:0; cursor:pointer;
  position:relative; flex:0 0 36px; width:34px; display:flex; align-items:center;
  justify-content:center; background:none; color:var(--accent);
  touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  transition:background-color .12s ease}
.tp-half + .tp-half{box-shadow:inset 0 1px 0 var(--line)}
.tp-half::after{content:''; position:absolute; left:50%; top:50%;
  width:50px; height:40px; transform:translate(-50%,-50%)}
.tp-half:active{background:var(--accent-wash)}
.tp-half:disabled{opacity:.35; pointer-events:none}
/* THE SAVED STAR — "go back to somewhere" belongs where "go somewhere" lives */
.sp-star{appearance:none; -webkit-appearance:none; border:0; margin:0; padding:0; cursor:pointer;
  position:relative; flex:none; width:30px; height:30px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  background:none; color:var(--faint); -webkit-tap-highlight-color:transparent}
.sp-star::after{content:''; position:absolute; left:50%; top:50%;
  width:48px; height:48px; transform:translate(-50%,-50%)}
.sp-star:active, .sp-star.on{color:var(--accent)}
/* THE GUTTER LAW — content never enters the column. Replaces every hand-tuned
   right inset, and closes the v1.18.0 defect where the z43 rail painted over
   the z40 #dossier's right edge (the Saved sheet's delete ✕ was unreachable). */
#calloutCard.co-docked{right:var(--gut)}
#dossier{right:calc(var(--gut) - 4px)}
#searchPill{right:max(var(--gut), calc(50% - 300px))}
#searchResults{right:max(var(--gut), calc(50% - 300px))}
#coachRow{right:var(--gut)}
#errToast{right:var(--gut)}
body.brief-mode #briefStage{right:var(--gut)}
@media(min-width:1100px){
  :root{--rail-w:78px; --rail-r:18px}
  :root{--rail-w:56px}
  #navPod{gap:10px; padding:9px; bottom:calc(env(safe-area-inset-bottom,0px) + 20px)}
  #navPod .nv-sat{width:44px; height:44px;
    background:linear-gradient(180deg, rgba(26,22,14,.94), rgba(8,7,4,.96));
    box-shadow:0 0 0 1px rgba(240,220,140,.28), inset 0 1px 0 var(--spec), var(--drop)}
  #navPod .nv-sat::after{width:56px; height:56px}
  .tp-rock{width:44px; height:94px; border-radius:22px}
  .tp-half{flex:0 0 47px; width:44px}
  .tp-half::after{width:60px; height:47px}
  #errToast{left:auto; right:var(--gut); max-width:520px}
}
/* v1.14.0 — the FAB label: CONTROLS in the map room, TO MAP in the brief. */
.nv-fablbl{position:absolute; left:0; top:3px; transform:translateX(-50%);
  font:700 7px/1 var(--mono); letter-spacing:.14em; color:var(--accent);
  white-space:nowrap; pointer-events:none; -webkit-user-select:none; user-select:none}
/* v1.21.0: the label under the globe IS the scope readout — the button that
   controls the layers says what the layers are showing. */
.nv-fablbl{white-space:nowrap}
body.ly-on .nv-fablbl{color:var(--accent)}
/* THE LAYER LIST (v1.22.0, recut v1.23.0 — owner: "super compact layers in
   bottom left. Translucent and do not take up more page than you need to").
   It sizes to its own content (width:max-content) instead of reserving a
   column, sits in the free bottom-LEFT corner, and reads as a film over the
   globe rather than a panel on top of it. */
#lyPanel{
  position:absolute; z-index:44;
  left:var(--safe-l);
  bottom:calc(env(safe-area-inset-bottom,0px) + 152px);   /* clear of the search band */
  width:max-content; max-width:min(56vw,190px);
  padding:4px 5px 5px; border-radius:11px;
  background:linear-gradient(180deg, rgba(20,17,10,.58), rgba(6,5,4,.66));
  box-shadow:0 0 0 1px rgba(240,220,140,.13), var(--drop);
  opacity:0; transform:translateY(6px) scale(.97); pointer-events:none;
  transition:opacity .16s ease, transform .18s cubic-bezier(.22,1,.36,1);
}
#lyPanel[hidden]{display:none}
body.ly-on #lyPanel{opacity:1; transform:none; pointer-events:auto}
.ly-modes{display:flex; flex-wrap:wrap; gap:2px; padding:0 1px 4px}
.ly-md{appearance:none; -webkit-appearance:none; border:0; margin:0; cursor:pointer;
  flex:0 1 auto; padding:3px 5px; border-radius:5px; background:rgba(0,0,0,.3);
  font:800 6.5px/1 var(--mono); letter-spacing:.04em; color:var(--faint); text-transform:uppercase;
  white-space:nowrap}
.ly-md.on{background:var(--accent-wash); color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent)}
.ly-cb{appearance:none; -webkit-appearance:none; border:0; margin:0; cursor:pointer;
  display:flex; align-items:center; gap:6px; width:100%; padding:3px 4px; border-radius:6px;
  background:none; color:var(--text); font:600 10px/1.15 var(--body); text-align:left;
  min-height:22px}
.ly-cb:active{background:var(--accent-wash)}
.ly-bx{flex:none; width:11px; height:11px; border-radius:3px; position:relative;
  box-shadow:inset 0 0 0 1.2px rgba(240,220,140,.42)}
.ly-cb.on .ly-bx{background:var(--accent); box-shadow:none}
.ly-cb.on .ly-bx::after{content:''; position:absolute; left:3.6px; top:1px;
  width:2.8px; height:5.8px; border:solid #141006; border-width:0 1.6px 1.6px 0; transform:rotate(42deg)}
.ly-cb .ly-nm{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.ly-cb:not(.on) .ly-nm{color:var(--faint)}
.ly-cb .ly-n{flex:none; margin-left:8px; font:700 8px/1 var(--mono); color:var(--faint)}
.ly-sep{height:1px; margin:3px 4px; background:rgba(240,220,140,.13)}
body.ly-on #navGlobe{box-shadow:0 0 0 2px var(--accent), 0 0 26px rgba(245,215,110,.4), inset 0 1px 0 var(--spec)}
/* the save-hold paints the ring the FAB already carries */
body.ly-save #navGlobe{box-shadow:0 0 0 2px var(--accent), 0 0 30px rgba(245,215,110,.55), inset 0 1px 0 var(--spec)}

/* BRIEF MODE — unmistakably a different room: the bar goes solid gold with
   black ink, the page warms, a gold frame bounds the stage, the map chrome
   yields. Same grammar, different light. */
/* THE CHART CARD (v0.7.0 owner reversal: the brief is built ON the globe; the
   tree SUPPLEMENTS it) — a compact floating card of hierarchy chips over the
   full-screen chain globe. Minimize (–) collapses it to a "⌗ CHART" tab. */
#briefStage{display:none}
body.brief-mode #briefStage{
  /* v1.15.0 (design 5a) — THE FRAMELESS CONSOLE: not a card. A radial pool of
     near-black that the world glows through at the edges; no ring, no drop.
     Full pane minus 6px gutters on phone; centered 880px on desktop. */
  display:block; position:absolute; z-index:16;
  left:6px; right:var(--gut);   /* v1.19.0: the gutter token owns the edge */
  /* v1.16.3 (owner: "maximize space — push top up and bottom down"): the
     console hugs the seg (+84) and may run down to the lowered search pill */
  top:calc(env(safe-area-inset-top,0px) + 84px);
  width:auto;
  max-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 218px);
  max-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 218px);
  overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
  padding:6px 6px 10px; border-radius:18px;
  background:radial-gradient(ellipse 95% 100% at 50% 30%, rgba(6,5,4,.85) 60%, rgba(6,5,4,0) 100%);
}
@media(min-width:1100px){ body.brief-mode #briefStage{
  left:0; right:0; margin:0 auto;   /* centered WITHOUT a transform — the stage scrolls */
  top:calc(env(safe-area-inset-top,0px) + 84px);
  width:min(880px,72vw); max-height:72vh; padding:8px 14px 14px; border-radius:24px;
  background:radial-gradient(ellipse 90% 100% at 50% 30%, rgba(6,5,4,.82) 55%, rgba(6,5,4,0) 100%);
} }
body.brief-mode.chart-min #briefStage{
  width:auto; max-height:none; overflow:visible; padding:0; background:none; box-shadow:none;
}
body.chart-min #briefStage > :not(.ch-head){display:none}
body.chart-min .ch-head{padding:8px 13px; border-radius:var(--r-pill);
  background:linear-gradient(180deg,var(--glass-hi),var(--glass-lo));
  box-shadow:0 0 0 1px var(--line), inset 0 1px 0 var(--spec)}
.ch-head{display:flex; align-items:center; flex-wrap:wrap; gap:6px 8px; width:100%; border:none; background:none;
  margin:0 0 4px; padding:2px 0; cursor:pointer; -webkit-tap-highlight-color:transparent;
  font:800 10.5px/1 var(--body); letter-spacing:.22em; color:var(--faint); text-align:left}
/* v1.13.0 — the title text is gone; ⌗ alone marks the fold handle.
   v1.15.0 (design 5a): the org count returns as a quiet mono kicker, and the
   head is CHART-SCOPED only — the file tools moved to the bottom brief dock. */
.ch-mk{flex:none; font-size:13px; color:var(--dim); padding:0 2px}
.ch-n{flex:none; font:700 9px/1 var(--mono); letter-spacing:.1em; color:var(--faint)}
.ch-hint{flex:none; font:700 6.5px/1.4 var(--mono); letter-spacing:.08em; color:#6E6650;
  display:none; text-transform:uppercase}
@media(min-width:1100px){ .ch-hint{display:inline-block} }
body.chart-min .ch-head .bf-seg, body.chart-min .bf-clearfoc, body.chart-min .ch-hint{display:none}
/* v1.5.1 — brief-only view toggles: ON = accent; OFF = dimmed hollow. */
.ch-head .bf-vw{color:var(--accent)}
/* v1.12.1 THE DOCK MATERIAL · v1.15.0 (design 2b): the dock is its own bottom
   element now (#briefDock) — same grammar: dark pill, uniform labeled slots,
   gold circle = toggle ON, hairline divider between VIEW and FILE clusters. */
.ch-dock{display:inline-flex; align-items:flex-start; gap:1px;
  background:#141006; border-radius:22px; padding:5px 7px 3px;
  box-shadow:0 0 0 1px rgba(240,220,140,.22), 0 1px 2px rgba(20,14,4,.28)}
.ch-dock .od-ico{background:none; box-shadow:none; color:#F2E4BC; width:28px; height:28px}
.ch-dock .bf-vw{color:#F2E4BC}
.ch-dock .bf-vw:not(.off){background:var(--accent); color:#141006; border-radius:50%}
.ch-dock .bf-vw.off{background:none; opacity:.5}
.ch-div{flex:none; width:1px; height:20px; background:rgba(242,228,188,.28); margin:4px 4px 0; align-self:flex-start}
#briefDock{display:none}
/* v1.18.0 THE RAIL, brief side: same panel grammar as the map's #navPod —
   one vertical pill on the right edge, always live. The bottom band frees up. */
body.brief-mode #briefDock{display:flex; flex-direction:column; align-items:center; gap:8px;
  position:absolute; z-index:43;
  right:var(--rail-r); left:auto; top:auto; bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
  transform:none; padding:7px 4px; border-radius:20px;
  background:linear-gradient(180deg,var(--glass-hi),var(--glass-lo));
  box-shadow:0 0 0 1px var(--line), inset 0 1px 0 var(--spec), var(--drop);
  opacity:.55; transition:opacity .18s ease}
body.tp-live #briefDock{opacity:1}
#briefDock .nv-sat{width:34px; height:34px}
#briefDock .nv-sat svg{width:19px; height:19px}
#briefDock .ch-div{width:18px; height:1px; margin:2px 0; background:var(--line); align-self:center}
.bd-aa{font:800 15px/1 var(--body)}
#briefDock .bf-vw.off{opacity:.42}
#briefDock .ch-div{width:20px; height:1px; margin:3px 0; align-self:center}
body.sheet-open #briefDock{opacity:0; pointer-events:none; transition:opacity .15s ease}
@media(max-width:1099px){
  /* v1.16.3: the search pill sits just above the FAB band in brief (74),
     and the results shelf follows */
  body.brief-mode #searchPill{bottom:calc(env(safe-area-inset-bottom,0px) + 74px)}
  body.brief-mode #searchResults{bottom:calc(env(safe-area-inset-bottom,0px) + 126px)}
}
@media(min-width:1100px){
  body.brief-mode #briefDock{bottom:calc(env(safe-area-inset-bottom,0px) + 20px); gap:10px; padding:9px}
  #briefDock .nv-sat{width:44px; height:44px}
}
/* v1.15.0 — the chart-to-globe leader */
#bfLeader{position:absolute; inset:0; z-index:15; pointer-events:none}
#bfLeader[hidden]{display:none}
body.chart-min #bfLeader, body:not(.brief-mode) #bfLeader{display:none}
.bl-svg{position:absolute; inset:0; width:100%; height:100%}
.bl-path{fill:none; stroke:rgba(245,215,110,.5); stroke-width:1.4; stroke-dasharray:1 5; stroke-linecap:round}
.bl-dia{fill:none; stroke:#F5D76E; stroke-width:2}
.bl-lbl{position:absolute; font:700 8.5px/1 var(--mono); letter-spacing:.1em; color:var(--accent);
  text-shadow:0 0 8px rgba(0,0,0,.9); white-space:nowrap}
body.gesturing #bfLeader, body.gesturing #briefDock{opacity:.22; transition:opacity .2s ease}
/* v1.12.1 — the deck: LEVELS · STACK · ZOOM as ONE aligned row of equal-height
   tracks; groups wrap as whole units, nothing floats to the ragged right */
.bf-zseg{align-items:center}
.bf-seg{min-height:32px}
/* v1.7.0 — THE LEDGER: right-side drawer (IDs · records · saved briefs) */
#ledger{position:fixed; inset:0; z-index:58; pointer-events:none}
#ledger .ld-scrim{position:absolute; inset:0; background:rgba(12,9,3,.42); opacity:0; transition:opacity .24s ease}
#ledger .ld-panel{position:absolute; top:0; right:0; bottom:0; width:min(370px,88vw);
  transform:translateX(103%); transition:transform .26s ease;
  overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 24px);
  border-radius:0; border-left:1px solid var(--accent-wash)}
#ledger.on{pointer-events:auto}
#ledger.on .ld-scrim{opacity:1}
#ledger.on .ld-panel{transform:none}
.ld-head{display:flex; align-items:center; gap:8px; margin-bottom:6px}
.ld-tabs{margin:2px 0 10px}
.ld-pane .rc-row{padding:8px 0}
.ld-pane .sh-acts .od-ico{width:28px; height:28px}
.ld-title{font-weight:900; font-size:15px; letter-spacing:.06em; color:var(--text)}
.ld-sub{font-size:11px; color:var(--faint)}
.ld-pad{padding:6px 0 2px; line-height:1.45}
.ld-org{display:flex; align-items:center; gap:8px; margin-top:12px}
.ld-orgbtn{background:none; border:0; padding:2px 0; font:inherit; font-weight:900; font-size:12.5px; color:var(--accent-deep, var(--accent)); text-align:left; cursor:pointer}
.ld-tot{font-size:10.5px; font-weight:800; color:var(--faint)}
/* an ID row is a BUTTON — tap unfolds the items filed under it */
.ld-idrow{display:flex; align-items:center; gap:8px; width:100%; padding:5px 0 5px 12px;
  background:none; border:0; border-bottom:1px solid var(--accent-wash); font:inherit; text-align:left; cursor:pointer}
.ld-idrow.on{border-bottom-color:transparent}
.ld-idrow.on .ld-id{color:var(--accent-deep, var(--accent))}
.ld-id{flex:1; min-width:0; font-weight:800; font-size:12px; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.ld-untag{color:var(--faint); font-style:italic; font-weight:600}
.ld-cts{display:flex; gap:6px}
.ld-ct{font-size:10.5px; font-weight:800; color:var(--dim, var(--faint)); letter-spacing:.02em}
.ld-items{margin:0 0 6px 14px; padding:2px 0 4px 10px; border-left:2px solid var(--accent-wash)}
.ld-it{display:flex; gap:8px; align-items:baseline; padding:3px 0}
.ld-itk{flex:0 0 14px; font-size:10px; font-weight:900; color:var(--faint)}
.ld-itx{flex:1; min-width:0; font-size:12px; color:var(--text); overflow-wrap:anywhere}
.sb-arm{color:var(--accent-deep, var(--accent))}
/* v1.7.0 — ASSET INVENTORY rows in the object sheets */
.bf-invl{display:flex; flex-direction:column}
.bf-invrow{display:flex; align-items:center; gap:8px; padding:5px 0; border-bottom:1px solid var(--accent-wash)}
.bf-invq{min-width:44px; font-weight:900; font-size:12.5px; text-align:right; color:var(--accent-deep, var(--accent))}
.bf-invd{flex:1; min-width:0; font-size:12.5px; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.bf-invin{display:flex; gap:8px}
.bf-invin .bf-invqin{flex:0 0 72px}
.bf-invin .rc-in{min-width:0}
.ch-head .bf-vw.off{color:var(--faint); background:transparent; opacity:.6}
/* ═══ v1.15.0 THE ILLUMINATED CHART (design 5a — replaces the ul/li rail tree
   and the matte 124×48 card). The plot is one absolutely-positioned surface:
   boxes hug their content on a 24px grid (48px level pitch · 32px stack
   pitch), every box lit from within — tier-tint fill, glowing tier-color
   ring, pale tier text — and one SVG net carries echelon hairlines, rounded-
   elbow connectors, the focused chain's glow pass and its junction beads. */
.bf-wrap{overflow:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
  max-height:52vh; padding:4px 2px 8px}
.bf-tree{position:relative; margin:0 auto}
.bf-net{position:absolute; inset:0; pointer-events:none}
.bf-elbl{position:absolute; font:700 8px/1 var(--mono); letter-spacing:.14em;
  color:#6E6650; pointer-events:none; -webkit-user-select:none; user-select:none}
.bf-elbl.lit{color:var(--accent)}
.bf-vseg{align-items:center}
.bf-vlab{font:700 8px/1 var(--mono); letter-spacing:.14em; color:var(--faint); padding:0 5px 0 8px}
.bf-box{position:absolute; transform:translateX(-50%); cursor:pointer; -webkit-tap-highlight-color:transparent;
  height:22px; box-sizing:border-box; padding:0 10px; border-radius:7px; white-space:nowrap;
  display:inline-flex; align-items:center; justify-content:center;
  background:var(--bfbg,rgba(255,255,255,.12)); color:var(--bftx,#FFFFFF);
  box-shadow:0 0 0 1.4px var(--bfrg,#FFFFFF), 0 0 9px var(--bfgl,rgba(255,255,255,.3));
  transition:transform .22s cubic-bezier(.32,1.4,.45,1), box-shadow .22s ease, opacity .18s ease;
  will-change:transform}
@media(min-width:1100px){ .bf-box{height:24px; padding:0 12px;
  box-shadow:0 0 0 1.5px var(--bfrg,#FFFFFF), 0 0 10px var(--bfgl,rgba(255,255,255,.3))} }
.bf-box:active{transform:translateX(-50%) scale(.96)}
/* v1.10.0 — a box that just joined the diagram springs in (FLIP enter state) */
.bf-box.bf-enter{opacity:0; transform:translateX(-50%) scale(.85)}
.bf-nm{font:900 9px/1 var(--body); letter-spacing:.01em}
@media(min-width:1100px){ .bf-nm{font-size:10px} }
/* tier light (design 5a): ring = tier color · fill = 13% tint · text = pale tint */
.bf-t1{--bfrg:#FFFFFF; --bfbg:rgba(255,255,255,.12); --bftx:#FFFFFF; --bfgl:rgba(255,255,255,.3)}
.bf-t2{--bfrg:#6FC7E8; --bfbg:rgba(111,199,232,.13); --bftx:#BFE9FA; --bfgl:rgba(111,199,232,.3)}
.bf-t3{--bfrg:#FFC95C; --bfbg:rgba(255,201,92,.13); --bftx:#FFDFA0; --bfgl:rgba(255,201,92,.3)}
.bf-t4{--bfrg:#FF8FC0; --bfbg:rgba(255,143,192,.13); --bftx:#FFC4DE; --bfgl:rgba(255,143,192,.3)}
.bf-box.bf-dim{opacity:.35}
.bf-box.bf-foc{box-shadow:0 0 0 1.5px var(--bfrg,#FFFFFF), 0 0 0 3.5px rgba(245,215,110,.4),
  0 0 16px var(--bfgl,rgba(255,255,255,.3))}
/* a GROUP is filler — SAME solid light as every other box (v1.16.3, owner:
   "groups have the dotted line again which we got rid of — make it solid".
   The v1.9.1 law stands: dashed reads as edit-mode chrome; never again.) */
.bf-box.bf-grp{box-shadow:0 0 9px var(--bfgl,rgba(255,255,255,.3)); border:1.4px solid var(--bfrg,#FFFFFF)}
/* the fold caret sits under its box and carries the hidden count */
/* v0.26.0 — the per-object ops: ＋ add subordinates · ✎ edit. Small and quiet so
   the box stays minimal, but always reachable without opening anything first. */
/* v1.11.0 (owner: "the + and pencil take up so much space — leave them off,
   appear on hover"): the ops are an OVERLAY now — boxes stay compact, and on
   a hover-capable screen the chips fade in over the box's lower half while
   the station line steps back. Touch flows lose nothing: tapping the box
   opens its sheet, which leads with the same two actions. */
.bf-ops{display:flex; gap:8px; align-items:center; justify-content:center;
  position:absolute; inset:0; margin:0;
  opacity:0; pointer-events:none; transition:opacity .16s ease}
@media(hover:hover){
  .bf-box:hover .bf-ops{opacity:1; pointer-events:auto}
  .bf-box:hover .bf-nm{opacity:.14}
}
.bf-nm{transition:opacity .16s ease}
.bf-op{appearance:none;-webkit-appearance:none; border:0; cursor:pointer; margin:0; padding:0;
  width:18px; height:18px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center;
  background:color-mix(in srgb, var(--bftx,#FFFFFF) 14%, transparent); color:var(--bftx,#FFFFFF);
  font:700 12px/1 var(--body);
  transition:transform .16s cubic-bezier(.34,1.56,.64,1), background .16s ease}
.bf-op:active{transform:scale(.86); background:color-mix(in srgb, var(--bftx,#FFFFFF) 24%, transparent)}
@media(hover:hover){ .bf-op:hover{background:color-mix(in srgb, var(--bftx,#FFFFFF) 22%, transparent)} }
@media(hover:hover){ .bf-box.bf-dim:hover .bf-ops{opacity:.5} }   /* dimmed boxes cap their ops — and only under a pointer */
/* the fold caret hangs just under its box on the plot */
.bf-caret{appearance:none;-webkit-appearance:none; border:0; cursor:pointer; margin:0;
  position:absolute; transform:translateX(-50%); z-index:2;
  padding:1px 7px; border-radius:999px; background:#141006; color:var(--dim);
  box-shadow:0 0 0 1px var(--line); font:800 8px/1.4 var(--mono); letter-spacing:.04em;
  transition:transform .16s cubic-bezier(.34,1.56,.64,1), color .16s ease, box-shadow .16s ease}
.bf-caret:active{transform:translateX(-50%) scale(.9)}
.bf-caret.on{color:var(--accent); box-shadow:0 0 0 1px var(--accent)}
/* v1.9.1 micro-motion — every chart control answers the finger (iOS grammar) */
.bf-dep,.bf-zb,.bf-zpct{transition:transform .15s cubic-bezier(.34,1.56,.64,1), background .15s ease, color .15s ease}
.bf-dep:active,.bf-zb:active,.bf-zpct:active{transform:scale(.9)}
.bf-act{transition:transform .16s cubic-bezier(.32,1.4,.45,1), filter .16s ease}
.bf-act:active{transform:scale(.98)}
/* the control bar — depth dial + zoom, one quiet row */
/* the armed "adding under X" bar — says where the next pick will land */
/* v0.26.0 — the ＋ multi-select picker */
.bf-pickq{margin:8px 0 2px}
.bf-picklist{max-height:38vh; overflow-y:auto; -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain; display:flex; flex-direction:column; gap:3px; margin:4px 0 2px}
.bf-pickrow{appearance:none;-webkit-appearance:none; border:0; cursor:pointer; margin:0; width:100%;
  display:flex; align-items:center; gap:9px; text-align:left; min-height:44px; padding:7px 10px;
  border-radius:10px; background:rgba(0,0,0,.2); box-shadow:inset 0 0 0 1px var(--line)}
.bf-pickrow.on{background:var(--accent-wash); box-shadow:inset 0 0 0 1.5px var(--accent)}
.bf-pickck{flex:none; width:19px; height:19px; border-radius:6px; display:flex; align-items:center;
  justify-content:center; box-shadow:inset 0 0 0 1.4px var(--line); color:var(--accent); font:800 12px/1 var(--body)}
.bf-pickrow.on .bf-pickck{box-shadow:inset 0 0 0 1.4px var(--accent)}
.bf-picknm{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  font:700 12.5px/1.25 var(--body); color:var(--text)}
.bf-picksub{flex:none; max-width:38%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  font:500 10px/1.2 var(--body); color:var(--dim)}
#dossier .bf-picklist{max-height:46vh}
/* v1.0.4 — sticky is the PICKER's contract only (its commit button must stay
   reachable over a long list). On every other sheet the acts row flows with
   the content: a sticky, see-through row over sheet text read as a second
   pop-up in the owner's recording. */
#dossier .rc-acts.bf-picksticky{position:sticky; bottom:0; padding-bottom:calc(env(safe-area-inset-bottom,0px) + 8px);
  background:linear-gradient(180deg, transparent, var(--panel) 22%)}
.bf-commit.in{background:var(--accent); color:#1a1305; box-shadow:none}
.bf-commit.in:active{filter:brightness(1.1)}
.bf-toast{position:fixed; left:calc((100% - var(--gut)) / 2); transform:translateX(-50%) translateY(8px); z-index:60;   /* v1.19.0: centred on the CONTENT, so it never drifts under the control column */
  bottom:calc(env(safe-area-inset-bottom,0px) + 180px); padding:9px 14px; border-radius:12px;
  background:linear-gradient(180deg, rgba(60,46,14,.98), rgba(32,24,8,.98));
  box-shadow:0 0 0 1.3px var(--accent), 0 8px 22px -10px rgba(0,0,0,.7);
  color:var(--accent); font:700 11.5px/1.3 var(--body); max-width:min(90vw,340px);
  opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease}
.bf-toast.on{opacity:1; transform:translateX(-50%) translateY(0)}
.bf-armbar{position:fixed; left:50%; transform:translateX(-50%); z-index:44;
  bottom:calc(env(safe-area-inset-bottom,0px) + 170px);
  display:flex; align-items:center; gap:9px; padding:8px 10px 8px 13px; border-radius:12px;
  background:linear-gradient(180deg, rgba(60,46,14,.97), rgba(32,24,8,.97));
  box-shadow:0 0 0 1.4px var(--accent), 0 0 18px rgba(245,215,110,.3);
  color:var(--accent); font:600 11.5px/1.25 var(--body); max-width:min(92vw,340px)}
.bf-armbar b{font-weight:800}
.bf-armbar button{appearance:none;-webkit-appearance:none; border:0; cursor:pointer; margin:0;
  width:24px; height:24px; border-radius:50%; flex:none;
  background:rgba(0,0,0,.35); color:var(--accent); font:800 12px/1 var(--body)}
.bf-addsub{width:100%; margin-top:8px}
/* the chart foot — two QUIET chips on the console (v1.15.0: the bright slab
   pair died with the card; the dock's ADD is the primary door now) */
#briefStage .bf-foot{display:flex; justify-content:center; gap:8px; padding-top:10px}
#briefStage .bf-foot .bf-act{flex:0 0 auto; width:auto; margin:0; min-height:30px; padding:0 13px;
  border-radius:15px; font:700 10.5px/1 var(--body); color:var(--dim);
  background:rgba(0,0,0,.35); box-shadow:inset 0 0 0 1px var(--line)}
#briefStage .bf-foot .bf-act.in{color:var(--accent); background:rgba(0,0,0,.35);
  box-shadow:inset 0 0 0 1px rgba(245,215,110,.4)}
/* v1.11.0 iOS segments · v1.13.0 (owner: "same black and gold color scheme"):
   the tracks wear the DOCK's material now — dark pill, cream cells, gold ON.
   The separate .bf-bar row is retired; tracks live in the head. */
.bf-seg{display:inline-flex; align-items:center; gap:2px; padding:3px;
  border-radius:999px; background:#141006; box-shadow:0 1px 2px rgba(20,14,4,.28)}
.bf-seg .bf-dep,.bf-seg .bf-zb,.bf-seg .bf-zpct{appearance:none;-webkit-appearance:none; border:0; cursor:pointer; margin:0;
  background:none; box-shadow:none; color:rgba(242,228,188,.72); font:700 9.5px/1 var(--mono); letter-spacing:.05em;
  padding:5px 9px; border-radius:999px; -webkit-touch-callout:none; user-select:none}
.bf-seg .bf-dep.on{color:#141006; background:var(--accent); box-shadow:0 1px 2px rgba(20,14,4,.25)}
.bf-seg .bf-zpct{min-width:46px; text-align:center}
.bf-seg .bf-zb{font-size:12px; color:var(--accent); padding:5px 8px}
.bf-seg .bf-vlab{color:rgba(242,228,188,.5)}
.bf-clearfoc{appearance:none;-webkit-appearance:none; border:0; cursor:pointer;
  padding:6px 10px; border-radius:999px; background:#141006; box-shadow:0 1px 2px rgba(20,14,4,.28);
  color:var(--accent); font:700 9.5px/1 var(--mono); letter-spacing:.04em}
/* v1.13.0 — the hold-a-level STACK popover */
#bfStackPop{position:absolute; z-index:6}
#bfStackPop .bf-sp{appearance:none;-webkit-appearance:none; border:0; cursor:pointer;
  background:#141006; color:#F2E4BC; font:700 10px/1 var(--mono); letter-spacing:.08em;
  padding:10px 14px; border-radius:999px;
  box-shadow:0 6px 18px rgba(20,14,4,.4), 0 0 0 1px rgba(242,228,188,.22)}
#bfStackPop .bf-sp.on{background:var(--accent); color:#141006}
/* v0.13.0 THE HAND-BUILT BRIEF: echelon depth control · per-HQ group eyes */
.bf-depth{display:flex; gap:4px; padding:5px 0 7px}
.bf-dep{appearance:none; -webkit-appearance:none; border:0; cursor:pointer; margin:0;
  font:700 9.5px/1 var(--mono); letter-spacing:.06em; padding:6px 10px; border-radius:8px;
  background:rgba(0,0,0,.35); color:var(--faint); box-shadow:0 0 0 1px var(--line)}
.bf-dep.on{color:var(--accent); background:var(--accent-wash)}
/* v0.20.0 FOCUS — isolate one branch; the rest dims */
/* v0.24.0 THE SELECTIONS — palette, stripe toggle, move/reorder controls */
.bf-pal{display:grid; grid-template-columns:repeat(8,1fr); gap:5px; padding:2px 0 6px}
.bf-sw{appearance:none;-webkit-appearance:none; border:0; cursor:pointer; margin:0; padding:0;
  height:26px; border-radius:7px; box-shadow:inset 0 0 0 1px rgba(0,0,0,.45)}
.bf-sw.on{box-shadow:0 0 0 2px var(--accent), inset 0 0 0 1px rgba(0,0,0,.45)}
.bf-sublab{font:700 9.5px/1 var(--mono); letter-spacing:.08em; text-transform:uppercase;
  color:var(--faint); padding:8px 0 4px}
.bf-move{width:100%; box-sizing:border-box; appearance:none;-webkit-appearance:none;
  padding:10px 11px; border:0; border-radius:9px; background:rgba(0,0,0,.42);
  box-shadow:0 0 0 1px var(--line); color:var(--text); font:600 12.5px/1.2 var(--body)}
.bf-ord{display:flex; gap:6px; padding-top:2px}
.bf-ord .bf-act{flex:1}
.bf-act[disabled]{opacity:.35; pointer-events:none}
.bf-subhead{font:700 9.5px/1 var(--mono); letter-spacing:.09em; text-transform:uppercase; color:var(--faint); padding:9px 0 3px}
.bf-subfilter{margin:2px 0 6px}
.bf-sub{max-height:264px; overflow-y:auto; margin:0 0 4px}
.bf-sub .rc-row{min-height:44px; padding:4px 2px}
.bf-subadd{appearance:none; -webkit-appearance:none; border:0; cursor:pointer; margin-left:auto; flex:0 0 auto;
  width:30px; height:30px; border-radius:50%; background:rgba(0,0,0,.35); box-shadow:0 0 0 1px var(--line);
  color:var(--accent); display:flex; align-items:center; justify-content:center; font:800 16px/1 var(--body)}
.bf-subadd.in{background:var(--accent-wash); box-shadow:0 0 0 1px var(--accent); font-size:13px}
/* the quiet offer (v0.10.0): the chain grew — export glows twice, says nothing */
@keyframes xpPulse{0%,100%{box-shadow:0 0 0 1px var(--line)} 35%{box-shadow:0 0 0 2px var(--accent), 0 0 14px rgba(var(--accent-rgb),.55)}}
.xp-pulse{animation:xpPulse 1.4s ease 2; color:var(--accent)}
/* v1.15.0 — THE CREAM INVERSION IS RETIRED (owner's design handoff, 3b/5a):
   brief stays in the black-and-gold room. The room change is said by the seg,
   a quiet gold frame, a dimmed globe and the brief dock — never a palette
   flip. (The old body-scoped token override lived here; the canvas never
   inverted because _mTok reads the document element — that asymmetry is gone
   with the inversion itself.) */
body.brief-mode::before{content:''; position:absolute; inset:8px; border-radius:20px;  /* body is the non-scrolling 100dvh anchor — absolute is fixed here, and the no-fixed law holds */
  box-shadow:0 0 0 1.5px rgba(245,215,110,.55); pointer-events:none; z-index:14}
body.brief-mode #globeCanvas{opacity:.78}
/* v1.14.0: the time ledger PERSISTS in brief (design 2a — the old corner clocks
   vanished there; the owner called that a bug to fix). */
.bf-empty{padding:8px 2px 6px; text-align:left; display:flex; flex-direction:column; gap:8px}
.bf-empty b{font:800 13px/1.3 var(--body)}
.bf-empty span{font:500 11.5px/1.5 var(--body); color:var(--dim)}

/* v1.14.0 — THE TIME LEDGER (design 2a): one glass chip, top-right. Two-row
   baseline grid — LOCAL hh:mm:ss (seconds tick) · BASE hh:mm; labels faint mono,
   digits glowing accent mono, zones dim. The whole chip is the zone-sheet door
   (the BASE row keeps today's tap-to-pick behavior). Empty = hidden. */
#timeLedger{
  position:absolute; z-index:10; appearance:none; -webkit-appearance:none; border:0;
  margin:0; cursor:pointer; text-align:left; -webkit-tap-highlight-color:transparent;
  /* phone (design 2a phone mock): compact chip BELOW the centered seg */
  top:calc(env(safe-area-inset-top,0px) + 88px); right:var(--safe-r);
  display:grid; grid-template-columns:auto auto auto; gap:3px 7px; align-items:baseline;
  padding:7px 10px; border-radius:var(--r-chip); white-space:nowrap;
}
#timeLedger:empty{display:none}
#timeLedger:active{filter:brightness(1.25)}
.tl-k{font:700 6.5px/1 var(--mono); letter-spacing:.14em; color:var(--faint)}
.tl-d{font:800 11px/1 var(--mono); font-variant-numeric:tabular-nums; color:var(--accent);
  text-shadow:0 0 8px rgba(var(--accent-rgb),.4)}
.tl-d.tl-idle{color:var(--faint); text-shadow:none}
.tl-z{font:700 7px/1 var(--mono); color:var(--dim)}
/* phone brief: the chart owns the top band (2a/3b phone mocks carry no ledger);
   the desktop brief keeps the ledger (design 5a). */
@media(max-width:1099px){ body.brief-mode #timeLedger{display:none} }
@media(min-width:1100px){
  #timeLedger{gap:3px 8px; padding:9px 12px}
  .tl-k{font-size:7px; letter-spacing:.16em}
  .tl-d{font-size:13px}
  .tl-z{font-size:8px}
}
/* zone sheet rows: name left, live face right; pinned wears the accent */
.tz-row .rc-top{display:flex; align-items:center; gap:8px; flex:1; max-width:none; min-height:44px}
.tz-hh{margin-left:auto; font:700 11px var(--mono); font-variant-numeric:tabular-nums;
  letter-spacing:.06em; color:var(--dim)}
.tz-on{color:var(--accent)}
.tz-on .tz-hh{color:var(--accent)}


/* ─── 5 · DIAGNOSTICS SURFACES (load-bearing — never remove) ───────────────── */
/* A-ORG-1 #errToast (~L2108) ported verbatim except position:fixed→absolute
   (reliability contract; body is the viewport so geometry is identical). */
#errToast{position:absolute;left:var(--safe-l);right:var(--safe-r);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:120;padding:10px 13px;border-radius:12px;background:rgba(40,10,10,.94);color:#ffd7d0;font:700 12px var(--body);box-shadow:0 0 0 1.4px rgba(255,110,90,.7),0 8px 24px rgba(0,0,0,.5);opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .2s,transform .2s;word-break:break-word}
#errToast.show{opacity:1;pointer-events:auto;transform:none}
/* sandbox banner (A-ORG-1 ~L22198 idiom, arctic-voiced in signal gold) */
#sbxNote{
  position:absolute; z-index:130;
  top:calc(env(safe-area-inset-top,0px) + 64px); left:var(--safe-l); right:var(--safe-r);
  display:flex; align-items:center; gap:8px;
  padding:8px 12px; border-radius:12px;
  background:rgba(58,42,14,.95); color:#ffe3ad;
  box-shadow:0 0 0 1px rgba(226,178,78,.55), 0 8px 24px rgba(0,0,0,.5);
  font:600 11px/1.4 var(--body);
}
#sbxNote button{
  appearance:none; -webkit-appearance:none; border:0; background:none; margin-left:auto;
  color:#ffe3ad; font:700 12px/1 var(--body); padding:6px; cursor:pointer;
}

/* ─── 6 · FOCUS + MOTION DISCIPLINE ────────────────────────────────────────── */
/* ported focus-visible idiom (A-ORG-1 ~L4890), accent-voiced for arctic */
button:focus-visible, [role="button"]:focus-visible, a:focus-visible, input:focus-visible{
  outline:2px solid var(--accent); outline-offset:2px;
  box-shadow:0 0 0 4px rgba(6,5,4,.9)}   /* v1.19.0: a gold ring alone has no
     guaranteed adjacent colour over an arbitrary globe pixel — the dark halo
     buys the ring its contrast wherever focus lands */
#searchPill input:focus-visible{outline:none}   /* the pill's focus-within ring speaks */
/* all motion dies under prefers-reduced-motion (doctrine) */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important; animation:none!important}
  /* v1.19.0: vestibular motion dies, TAP CONFIRMATION lives. A control that
     cannot acknowledge a press reads as broken, and these are the only
     single-pointer path to zoom out. */
  .nv-sat,.tp-half,.ly-tile,.lg-row,.od-tab{
    transition:opacity .12s ease, background-color .12s ease, box-shadow .12s ease !important}
}

/* ─── 7 · DESKTOP ≥1100px — ENHANCEMENTS ONLY (phone-first is sacred) ──────── */
@media (min-width:1100px){
  /* top edge centers; corners come free for the clocks */
  #searchPill{left:0; right:0; width:560px; margin-inline:auto}
  #searchResults{left:0; right:0; width:560px; margin-inline:auto;
    bottom:calc(env(safe-area-inset-bottom,0px) + 160px)}   /* three-row law holds on desktop too */
  /* the time ledger takes the true corner (design 2a: top 64, right 18) */
  #timeLedger{top:calc(env(safe-area-inset-top,0px) + 64px); right:18px}
  #timeLedger:hover{filter:brightness(1.12)}
  /* v0.32.0 ONE SURFACE (owner: "initial pop up on the left side and then
     details show on the right? Pick one and expand off the same pop up"):
     the dossier panel now occupies the EXACT rail the docked card lives on
     (left, 400px, same top) — Details reads as the card expanding in place,
     and the sheet's ✕ collapses it back to the card on the same spot. */
  #dossier{left:var(--safe-l); right:auto; width:400px;
    top:calc(env(safe-area-inset-top,0px) + 114px); bottom:auto;
    max-height:calc(100vh - 180px); max-height:calc(100dvh - 180px)}
  /* hovers live ONLY here */
  .pill:hover,.chip:hover{
    box-shadow:0 0 0 1px var(--accent), inset 0 1px 0 var(--spec), var(--drop);
    color:var(--text)}
  #searchResults .sr-row:hover{background:var(--accent-wash)}
  #globeCanvas{cursor:grab}
  #globeCanvas:active{cursor:grabbing}
  /* toast docks to the corner on wide screens (A-ORG-1 ~L2139) */
  #errToast{left:auto; right:24px; max-width:520px; bottom:24px}
}

/* ═══ v0.2.0 CHROME — trail · legend · export sheet · slim-first dossier
   (owner references: edge chrome, the globe never impeded) ═══ */
/* (trail bar retired at v0.3.0 — crumbs live in the sheet header) */

/* v1.19.0: #legendPanel is RETIRED — Layers is a pane of the one drawer.
   The floating card bloomed bottom-LEFT from a right-edge button, shared
   #searchPill's exact anchor at a higher z, was missing from the canvas
   chrome zones, and its own button could never close it. The .lg-* row
   vocabulary survives; only the container and its head are gone. */
.lg-row{display:flex; align-items:center; gap:9px; width:100%; border:none; background:none;
  cursor:pointer; padding:8px 10px; border-radius:9px; color:var(--text); font:600 12.5px/1.2 var(--body); text-align:left}
.lg-row:active{background:var(--accent-wash)}
.lg-row{min-height:48px}                 /* a thumb target in a sheet, not a list item */
.lg-row.off .lg-nm, .lg-row.off .lg-ct{color:var(--faint); text-decoration:line-through}
.lg-zero{opacity:.3; pointer-events:none}
.lg-dep .lg-nm{color:var(--faint)}
.lg-sw{flex:none; width:16px; height:16px; border-radius:50%; box-shadow:0 0 0 1px rgba(255,255,255,.25)}
.lg-sw-vw{box-shadow:none; background:none; display:flex; align-items:center; justify-content:center;
  font:800 9.5px/1 var(--mono); color:var(--accent)}
/* THE MODE STRIP — every configuration of the map has a NAME, so the app can
   never again show a filtered map without saying so. Modes WRAP the family
   toggles; CUSTOM is derived and inert, never a tile you press. */
.ly-strip{display:flex; gap:7px; overflow-x:auto; scrollbar-width:none; padding:8px 0 4px; margin:0 -2px}
.ly-strip::-webkit-scrollbar{display:none}
.ly-tile{appearance:none; -webkit-appearance:none; border:0; margin:0; cursor:pointer;
  flex:0 0 auto; width:84px; min-height:60px; padding:8px 6px; border-radius:12px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  background:rgba(0,0,0,.30); box-shadow:0 0 0 1px var(--line); color:var(--dim)}
.ly-tile b{font:700 15px/1 var(--body); color:var(--text)}
.ly-tile span{font:800 9px/1 var(--mono); letter-spacing:.12em; text-transform:uppercase}
.ly-tile.on{background:var(--accent-wash); box-shadow:0 0 0 1.5px var(--accent); color:var(--accent)}
.ly-tile.on b{color:var(--accent)}
.ly-tile:active{background:var(--accent-wash)}
.ly-cust{cursor:default; pointer-events:none}
/* THE SHELF ROW — a saved thing answers "is this the one?" without opening:
   a deterministic 30px glyph drawn from the record's own camera, zero stored
   bytes (24 raster thumbs would be ~1MB through IndexedDB and the board). */
.sh-gl{flex:none; width:30px; height:30px; fill:none; stroke:rgba(245,215,110,.55); stroke-width:1.3}
.sh-gl .sh-pin{fill:var(--accent); stroke:none}
.sh-acts{margin-left:auto; display:flex; align-items:center; gap:4px}
/* the scope line is the point of the row — give it its own line rather than
   letting the glyph and three actions squeeze it to "WORK…" */
.sh-row{align-items:center}
.sh-txt{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px}
.sh-row .rc-top{flex:none; max-width:100%}
.sh-row .rc-sub{flex:none; width:100%; white-space:normal; overflow:visible;
  font:500 11px/1.3 var(--body)}
.sh-acts .od-ico{width:30px; height:30px}
.sh-acts .od-ico{margin-left:0}
.sh-pn{color:var(--faint)}
.sh-pn.on{color:var(--accent)}
.sh-rn{color:var(--faint)}
.sr-tag-view{background:var(--accent-wash); color:var(--accent)}
.lg-nm{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.lg-ct{flex:none; font:700 10.5px/1 var(--mono); color:var(--faint)}

/* v0.22.0 — SHARED DISCLOSURE PRIMITIVE (.disc): ONE accordion used across the
   legend, callout and dossier so options expand only when needed, not by default
   (owner refs: FAQ accordion / Android expandable list). Header toggles the body;
   open state lives in GlobeState._discOpen so it survives a re-render. */
/* v1.9.0 (owner: "categories need to read as categories"): the header is no
   longer a gray slab — an engraved uppercase label with a gold tick on a
   hairline rule. Skin only; the _disc structure and handler are untouched. */
.disc{border-radius:0}
.disc + .disc{margin-top:0}
.disc-h{display:flex; align-items:center; gap:8px; width:100%; border:none; background:none;
  border-top:1px solid var(--accent-wash);
  cursor:pointer; padding:12px 2px 10px; border-radius:0; text-align:left;
  font:800 10px/1 var(--mono); letter-spacing:.13em; text-transform:uppercase; color:var(--dim)}
.disc-h > span:first-child::before{content:''; display:inline-block; width:3px; height:11px;
  margin-right:7px; border-radius:2px; background:var(--accent); vertical-align:-1px}
.disc-h:active{background:var(--accent-wash)}
.disc.open .disc-h{color:var(--accent)}
.disc-h .disc-ct{margin-left:auto; padding-left:8px; font:700 10.5px/1 var(--mono); color:var(--faint)}
.disc.open .disc-h .disc-ct{color:var(--accent)}
.disc-h .disc-cv{flex:none; width:13px; height:13px; transition:transform .18s ease; color:var(--dim)}
.disc.open .disc-h .disc-cv{transform:rotate(180deg); color:var(--accent)}
.disc-b{display:none; padding:4px 2px 2px}
.disc.open .disc-b{display:block}

#exportSheet{position:absolute; z-index:40; right:var(--safe-r);
  bottom:calc(env(safe-area-inset-bottom,0px) + 96px);
  width:min(86vw,320px); padding:6px}
.xp-head{font:800 10.5px/1 var(--mono); letter-spacing:.12em; text-transform:uppercase;
  color:var(--faint); padding:8px 10px 6px}
.xp-row{display:block; width:100%; border:none; background:none; cursor:pointer; text-align:left;
  padding:9px 10px; border-radius:9px; color:var(--text)}
.xp-row:active{background:var(--accent-wash)}
.xp-row b{display:block; font:700 13px/1.25 var(--body)}
.xp-row span{display:block; font:500 11px/1.35 var(--body); color:var(--dim); margin-top:1px}

/* ═══ v0.4.0 DATASTORE — sheet tabs · record rows · one add/edit form ═══ */
.od-tabs{display:flex; gap:4px; margin-top:12px; border-radius:12px; background:rgba(0,0,0,.35);
  padding:4px; box-shadow:0 0 0 1px var(--line); overflow-x:auto; scrollbar-width:none}
.od-tabs::-webkit-scrollbar{display:none}
.od-tab{
  appearance:none; -webkit-appearance:none; border:0; background:none; margin:0; cursor:pointer;
  flex:1 0 auto; min-height:44px; padding:0 12px; border-radius:9px; white-space:nowrap;
  font:700 11.5px/1 var(--body); color:var(--faint);
}
.od-tab.on{background:var(--accent-wash); color:var(--accent)}
.rc-row{display:flex; align-items:center; gap:10px; min-height:52px; padding:8px 2px;
  box-shadow:0 -1px 0 var(--line)}
.rc-row:first-of-type{box-shadow:none}
.rc-top{flex:none; max-width:52%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  color:var(--text); font:700 13.5px/1.3 var(--body); text-decoration:none}
a.rc-top{color:var(--accent)}
.od-crumb-on{box-shadow:0 0 0 1.5px var(--accent)}
/* rows that ACT (saved views, time zones) are buttons — kill the UA pill */
button.rc-top{appearance:none; -webkit-appearance:none; border:0; background:none;
  padding:0; cursor:pointer; text-align:left; font:700 13.5px/1.3 var(--body)}
.rc-sub{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  color:var(--dim); font:500 12px/1.3 var(--body)}
.rc-dots{margin-left:auto}
.rc-add{
  appearance:none; -webkit-appearance:none; border:0; background:none; margin:10px 0 2px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:7px; width:100%;
  min-height:48px; border-radius:12px; box-shadow:0 0 0 1px var(--line);
  font:700 13px/1 var(--body); color:var(--accent);
}
.rc-add:active{background:var(--accent-wash)}
.rc-note{font:500 11px/1.4 var(--body); color:var(--dim); padding:2px 2px 8px}
/* v1.1.0 THE ID REGISTRY — chips on rows, the ID pane, the form's ID box */
.rc-xid{flex:none; align-self:flex-start; font:800 8.5px/1 var(--mono); letter-spacing:.06em;
  color:var(--accent); padding:3px 6px; border-radius:6px; box-shadow:inset 0 0 0 1px var(--accent)}
.rc-idrow{align-items:center}
.rc-idrow .rc-idbtn{appearance:none;-webkit-appearance:none; border:0; background:none; margin:0; padding:0;
  cursor:pointer; text-align:left; color:var(--accent); font:800 12.5px/1.3 var(--mono); letter-spacing:.05em}
.rc-idrow.on{box-shadow:inset 0 0 0 1.4px var(--accent)}
.rc-idit{margin-left:14px; opacity:.92}
.rc-sublab{font:700 9px/1 var(--mono); letter-spacing:.12em; color:var(--faint);
  text-transform:uppercase; padding:4px 2px 0}
.rc-idsel{appearance:none;-webkit-appearance:none}
/* the database door — status line states */
.db-status{font:600 11px/1.4 var(--body); color:var(--dim); padding:6px 2px}
.db-status.db-live{color:var(--accent)}
.db-status.db-error{color:#ff5f50}
.db-status.db-connecting{color:var(--text)}
.am-dbchip{float:right; font:800 8.5px/1 var(--mono); letter-spacing:.08em; padding:3px 6px;
  border-radius:6px; box-shadow:inset 0 0 0 1px var(--line); color:var(--faint)}
.am-dbchip.am-db-live{color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent)}
.am-dbchip.am-db-error{color:#ff5f50; box-shadow:inset 0 0 0 1px #ff5f50}
.db-sql{display:block; margin:6px 0; padding:8px 10px; border-radius:8px; background:rgba(0,0,0,.25);
  box-shadow:inset 0 0 0 1px var(--line); font:600 10px/1.6 var(--mono); color:var(--text);
  user-select:text; -webkit-user-select:text; overflow-x:auto; white-space:nowrap}
/* v1.2.0 — the boot reconnect chip: settings exist, session is offline, one tap */
#dbChip{position:fixed; left:50%; transform:translateX(-50%) translateY(-6px); z-index:40;
  top:calc(env(safe-area-inset-top,0px) + 96px);
  display:inline-flex; align-items:center; gap:8px; padding:8px 8px 8px 13px; border-radius:16px;
  appearance:none;-webkit-appearance:none; border:0; cursor:pointer;
  background:linear-gradient(180deg, rgba(60,46,14,.97), rgba(32,24,8,.97));
  box-shadow:0 0 0 1.3px var(--accent), 0 8px 22px -10px rgba(0,0,0,.7);
  color:var(--accent); font:700 11.5px/1 var(--body);
  opacity:0; transition:opacity .25s ease, transform .25s ease}
#dbChip.in{opacity:1; transform:translateX(-50%) translateY(0)}
#dbChip.busy{opacity:.6}
#dbChip .dbc-dot{width:7px; height:7px; border-radius:50%; background:var(--accent);
  box-shadow:0 0 8px rgba(245,215,110,.8); flex:none}
#dbChip .dbc-x{width:22px; height:22px; border-radius:50%; display:inline-flex; align-items:center;
  justify-content:center; background:rgba(0,0,0,.35); color:var(--faint); font:800 11px/1 var(--body); flex:none}
.rc-form{display:flex; flex-direction:column; gap:8px; padding:12px; margin:10px 0 2px;
  border-radius:12px; background:rgba(0,0,0,.4); box-shadow:0 0 0 1.5px var(--accent)}
.rc-in{
  appearance:none; -webkit-appearance:none; border:0; outline:none; width:100%; box-sizing:border-box;
  min-height:46px; padding:0 13px; border-radius:10px; background:var(--panel-2);
  box-shadow:0 0 0 1px var(--line); color:var(--text); font:600 14px/1.2 var(--body);
}
.rc-in::placeholder{color:var(--faint)}
.rc-btns{display:flex; align-items:center; gap:8px}
.rc-save,.rc-cancel,.rc-del{
  appearance:none; -webkit-appearance:none; border:0; margin:0; cursor:pointer;
  min-height:44px; padding:0 18px; border-radius:var(--r-pill); font:800 12.5px/1 var(--body);
}
.rc-save{background:var(--accent); color:#141006}
.rc-cancel{background:none; color:var(--faint)}
.rc-del{background:none; color:var(--danger); box-shadow:0 0 0 1px rgba(255,122,102,.4); padding:0 14px}

/* ═══ v0.5.0 BRIEF 2.0 — add action · annotations · selected box ═══ */
.bf-act{
  appearance:none; -webkit-appearance:none; border:0; margin:12px 0 0; cursor:pointer;
