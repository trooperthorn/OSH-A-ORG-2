    ctx.fillText(String(g.n), cx, cy+0.5);
    GlobeState._cluHits.push({x:cx, y:cy, r:r+8, lat:g.la/g.n, lon:g.lo/g.n});
  });
  ctx.restore(); GlobeState._clu=null;
}

// ═══ THE BRIEF ON THE GLOBE (v0.7.0 owner reversal) — the chain is BUILT on the
// sphere: white dots wearing tier rings, tier-colored great-circle connectors,
// tier-colored labels. The chart card only supplements this picture.
// (A-ORG-1 recipe, consult 6: dot spec L17589, arcs L16849, streams L21656 —
// stream families re-keyed to the Lumen tier law: L2 cools NEVER green.) ────────
const BF_STREAMS={
  1:['255,255,255','232,238,255'],
  2:['111,199,232','178,102,255','70,120,255','0,205,255','150,160,255'],
  3:['255,201,92','255,150,50','255,120,80','255,190,110'],
  4:['255,143,192','230,70,160','255,120,150'],
};
// short label for chain nodes + chart chips: '(WSMR)' captures beat everything;
// else standard military short forms (Inf · Abn · Bde · Cmd …) beat truncation.
const _BF_SHORT={Infantry:'Inf',Armored:'Armd',Airborne:'Abn',Division:'Div',Brigade:'Bde',
  Battalion:'Bn',Command:'Cmd',Support:'Spt',Mountain:'Mtn',Military:'Mil',Theater:'Thtr',
  Mission:'Msn',Regiment:'Regt',Artillery:'Arty',Medical:'Med',Cavalry:'Cav',Intelligence:'Intel',
  Ammunition:'Ammo',Depot:'Dep',Arsenal:'Ars',Training:'Trng',Readiness:'Rdns',General:'Gen'};
function _bfAbbr(name){
  const s=String(name||'');
  const p=s.match(/\(([A-Za-z0-9&\- ]{2,10})\)/); if(p) return p[1];
  const cap=s.split(/\s+/).find(function(w){ return w.length>=2&&w.length<=7&&w===w.toUpperCase()&&/[A-Z]/.test(w); });
  if(cap) return cap.replace(/[.,]$/,'');
  const short=s.split(/\s+/).map(function(w){ return _BF_SHORT[w]||w; }).join(' ');
  return short.length>18 ? short.slice(0,17)+'…' : short;
}
// v0.13.0 THE HAND-BUILT BRIEF (owner directive: no auto-subtrees, EVER — the
// v0.11.0 walker dumped whole A-ORG-1 commands onto the globe). The chain map
// now renders ONLY orgs the owner explicitly added (BRIEF.mem). Levels are
// DERIVED: an added org nests under its nearest added ancestor in the tree
// (L1 = no added ancestor). opts.all ignores the view filters (group eyes +
// echelon depth) — the chart and exports see everything; the globe sees the
// filtered picture.
function _bfParentOf(id){
  const c=(typeof orgById==='function')?orgById(id):null; if(c) return c.parent;
  const t=(typeof orgOf==='function')?orgOf(id):null; return t?t.parent:null;
}
function _briefChainMap(opts){
  const out={nodes:{}, order:[]};
  if(typeof BRIEF==='undefined' || !BRIEF.mem || !BRIEF.mem.length) return out;
  const all=!!(opts&&opts.all);
  const memIx={}; BRIEF.mem.forEach(function(m,i){ memIx[m]=i; });
  const hid=new Set(BRIEF.hide||[]);
  const depth=all?4:(GlobeState._bfDepth||4);
  // nearest ADDED ancestor per member (custom chains climb into the tree)
  const near={};
  BRIEF.mem.forEach(function(id){
    let p=_bfParentOf(id), hops=0, hit=null;
    while(p && ++hops<40){ if(memIx[p]!=null){ hit=p; break; } p=_bfParentOf(p); }
    near[id]=hit;
  });
  const lvlOf=function(id){ let l=1,c=near[id],g=0; while(c!=null&&++g<40){ l++; c=near[c]; } return l; };
  const rootOf=function(id){ let c=id,g=0; while(near[c]!=null&&++g<40){ c=near[c]; } return c; };
  const tierN={1:0,2:0,3:0,4:0};
  BRIEF.mem.forEach(function(id){
    const c=(typeof orgById==='function')?orgById(id):null;
    const t=(!c&&typeof orgOf==='function')?orgOf(id):null;
    if(!c && !t) return;                                  // a deleted custom leaves a hole, never a crash
    const lvl=lvlOf(id), root=rootOf(id), tier=Math.min(4,lvl);
    if(!all && (hid.has(root) || lvl>depth)) return;
    let lat=null, lon=null;
    if(c){ const b=c.base?siteById(c.base):null; if(b){ lat=b.lat; lon=b.lon; } }
    else { const hs=siteById(ogEffSite(id)||''); if(hs){ lat=hs.lat; lon=hs.lon; } }
    const fam=BF_STREAMS[tier];
    out.nodes[id]={id:id, tier:tier, lvl:lvl, shade:fam[tierN[tier]++ % fam.length],
      parent:near[id], root:root, lat:lat, lon:lon, name:c?c.name:t.name, custom:!!c};
    out.order.push(id);
  });
  out.order.forEach(function(k){ const n=out.nodes[k];
    if(n.lat==null && n.parent && out.nodes[n.parent]){ n.lat=out.nodes[n.parent].lat; n.lon=out.nodes[n.parent].lon; }
    if(n.parent && !out.nodes[n.parent]) n.parent=null;   // filtered-out parent: no dangling arc
  });
  return out;
}
// Connectors: grouped by parent shade + child tier; per-level width/alpha
// (A-ORG-1 L16878), deepest first so bright trunks paint on top.
function drawBriefArcs(ctx, m){
  GlobeState.__bfC=_briefChainMap();                 // links draw first each frame — nodes reuse this
  if(GlobeState._linesOff) return;
  const C=GlobeState.__bfC, groups={};
  for(const key of C.order){
    const n=C.nodes[key]; if(!n.parent||n.lat==null) continue;
    const pn=C.nodes[n.parent]; if(!pn||pn.lat==null) continue;
    if(Math.abs(pn.lat-n.lat)<1e-6 && Math.abs(pn.lon-n.lon)<1e-6) continue;   // same point: no zero arc
    const gk=pn.shade+'|'+n.tier;
    (groups[gk]||(groups[gk]={shade:pn.shade, tier:n.tier, arcs:[]}))
      .arcs.push({from:{lon:pn.lon,lat:pn.lat}, to:{lon:n.lon,lat:n.lat}});
  }
  const W={2:2.8,3:2.1,4:1.8}, A={2:.9,3:.85,4:.8};
  Object.keys(groups).map(function(k){ return groups[k]; })
    .sort(function(a,b){ return b.tier-a.tier; })
    .forEach(function(g){ drawSubtleArcs(ctx, m, g.arcs, g.shade, W[g.tier]||1.8, A[g.tier]||0.8); });
}
// Chain dots + labels (A-ORG-1 chain dot spec: solid white, tier ring, HQ halo
// ring; labels tier-colored over a dark halo, collision-placed).
function drawBriefNodes(ctx, m){
  const T=_mTok();
  const C=GlobeState.__bfC||(GlobeState.__bfC=_briefChainMap());
  const zb=Math.min(2.4, 1 + (GlobeState.zoom-1)*0.14);
  const zb2=Math.min(2.1, 0.85+zb*0.16);
  const dotsOff=!!GlobeState._dotsOff, namesOff=!!GlobeState._namesOff;
  for(const key of C.order){
    const n=C.nodes[key];
    if(n.lat==null||n.lon==null) continue;
    const p=_projectLonLat(n.lon, n.lat, m);
    if(p[2]<0) continue;
    const sx=p[0], sy=p[1], fade=Math.max(0.3, p[2]);
    const dotR=(n.tier===1?3.4:(n.tier===2?3.0:2.7))*zb2;
    if(!dotsOff){
      ctx.globalAlpha=fade;
      ctx.beginPath(); ctx.arc(sx, sy, dotR, 0, Math.PI*2);
      ctx.fillStyle='#ffffff'; ctx.fill();
      ctx.lineWidth=1.0; ctx.strokeStyle='rgba(8,7,4,.9)'; ctx.stroke();
      ctx.beginPath(); ctx.arc(sx, sy, dotR+3.4, 0, Math.PI*2);
      ctx.lineWidth=(n.tier===1?2.2:1.6);
      ctx.strokeStyle='rgba('+n.shade+','+(n.tier===1?0.95:0.88)+')'; ctx.stroke();
      if(n.tier===1){
        ctx.beginPath(); ctx.arc(sx, sy, dotR+6.6, 0, Math.PI*2);
        ctx.lineWidth=1.1; ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.stroke();
      }
      ctx.globalAlpha=1;
      GlobeState._screen.push({inst:{id:key, base:n.name, lat:n.lat, lon:n.lon, _bf:true}, sx:sx, sy:sy, depth:p[2]});
    }
    if(!namesOff){
      const nm=_bfAbbr(n.name);
      const fs=(m.w<560?12:11);
      ctx.save(); ctx.textBaseline='middle'; ctx.font='800 '+fs+'px '+T.body;
      const tw=ctx.measureText(nm).width;
      const pos=_placeGlobeLabel(ctx, sx, sy, tw, m, GlobeState.__gLbl, {gap:dotR+7, h:14});
      if(pos){
        ctx.lineWidth=(fs>11?3.6:3.2); ctx.strokeStyle='rgba('+T.ground+',.9)'; ctx.strokeText(nm, pos.x, pos.y);
        ctx.fillStyle='rgba('+n.shade+',1)'; ctx.fillText(nm, pos.x, pos.y);
      }
      ctx.restore();
    }
  }
}

// ---- Tap hit-test for m3 (PORT of handleGlobeTap's best-dot loop) --------------
// Canvas-relative coords in (what tapAtScreen receives); nearest front-hemisphere
// site within 18px, else null. Tests LAST FRAME's _screen — exactly A-ORG-1.
function siteHitTest(x, y){
  let best=null, bestD=18*18;
  for(const s of (GlobeState._screen||[])){
    const d=(s.sx-x)*(s.sx-x)+(s.sy-y)*(s.sy-y);
    if(d<bestD){ bestD=d; best=s; }
  }
  return best?best.inst:null;
}

/* ============================================================================

   PORTED from A-ORG-1 index.html (globe data loaders ~L18337–18525, and
   _namedStateShapes ~L16889 — the decode is ported, not rewritten).

   A-ORG-1 functions ported (names kept):
     loadGlobeCoastlinesHi   — coastline loader (deviation 2: 110m→50m ladder)
     loadStateBorders        — US state borders (auto-detect lon/lat vs Albers)
     loadCountryBorders      — world country borders (thin context layer)
     decodeTopoLand          — land TopoJSON → lon/lat rings
     _decodeTopoLonLat       — generic TopoJSON → lon/lat rings (named object)
     decodeStatesTopo        — Albers-projected states → lon/lat rings (AK/HI
                               insets skipped by FIPS id)
     _albersUsaInvert        — inverse d3 Albers-USA (975x610 viewport)
     _ringsLookGeographic    — geographic-vs-projected coordinate sniff
     _namedStateShapes       — states decode KEEPING per-state identity;
                               fills GLOBE_STATE_SHAPES for the brief layer

   m2-render.js; redeclaring them here would be a SyntaxError once all modules
   concatenate into the ONE <script>):
     GLOBE_RINGS, _globeLoadedHi,
     GLOBE_STATE_RINGS, GLOBE_STATE_SHAPES, _statesLoaded,
     GLOBE_COUNTRY_RINGS, _countriesLoaded
   After each swap it only sets GlobeState.dirty=true — the m2 render loop
   redraws on dirty; nothing here forces a frame or touches the DOM.

   DEVIATIONS from A-ORG-1 (each one deliberate):
   1. SAME-ORIGIN ONLY. A-ORG-1's SOURCES lists carried jsdelivr/unpkg CDN
      fallbacks after each data/ entry; A-ORG-2 ships all four TopoJSON files
      in data/ (land-110m, land-50m, states-10m, countries-110m) and never

   2. Coastline ladder INVERTED to 110m-first→50m-upgrade. A-ORG-1 tried 50m
      first and used 110m only as a fallback, returning on first success.
      Here land-110m (~100KB, 130 arcs) loads and draws first, then land-50m

   3. loadStateBorders drops A-ORG-1's fourth source (states-albers-10m.json —

async function loadGlobeCoastlinesHi(){
  if(_globeLoadedHi) return;
  // A-ORG-1 v8.9.1 lineage: the real coastlines ship WITH the app (data/,
  // same-origin, SW-precached). A-ORG-2 ladder (deviations 1–2): 110m first
  // for a fast first paint, then 50m upgrades the same GLOBE_RINGS in place.
  const SOURCES=[
    'data/land-110m.json',
    'data/land-50m.json'
  ];
  for(const SRC of SOURCES){
    try{
      const r=await fetch(SRC); if(!r.ok) continue;
      const topo=await r.json();
      const rings=decodeTopoLand(topo);
      if(rings && rings.length>20){
        GLOBE_RINGS=rings; _globeLoadedHi=true;
        if(window.GlobeState){ GlobeState.dirty=true; }   // redraw with real coastlines
      }
    }catch(e){ /* rung failed → keep current rings, try the next rung */ }
  }
  /* both rungs failed → keep embedded fallback */
}

// Load US state borders and decode to lon/lat rings for the globe. Same-origin
// data/ only (deviation 1). The us-atlas states file MAY be in Albers USA
// projection, so the projected case inverts that projection back to lon/lat.
async function loadStateBorders(){
  if(_statesLoaded) return;
  const SOURCES=[
    'data/states-10m.json'
  ];
  for(const SRC of SOURCES){
    try{
      const r=await fetch(SRC); if(!r.ok) continue;
      const topo=await r.json();
      // us-atlas ships two variants: states-10m.json is UNPROJECTED lon/lat, while the -albers-
      // file is pre-projected to a 975x610 canvas. Auto-detect: decode raw first — if the
      // coordinates are already geographic, use them directly (this also keeps REAL Alaska &
      // Hawaii outlines); only run the Albers inverse when the data is actually projected.
      // detect projection off the polygon decode, then take the INTERIOR MESH
      // (shared borders only — the coast is the land layer's, drawn once)
      const _probe=_decodeTopoLonLat(topo,'states');
      const _geo=_ringsLookGeographic(_probe);
      const rings=_topoInteriorMesh(topo,'states', _geo?null:_albersUsaInvert);
      if(rings && rings.length>=30){
        GLOBE_STATE_RINGS=rings; _statesLoaded=true;
        try{ GLOBE_STATE_SHAPES=_namedStateShapes(topo, _geo); }catch(_){ GLOBE_STATE_SHAPES=null; }
        if(window.GlobeState){ GlobeState.dirty=true; }
        return;
      }
    }catch(e){ /* try next */ }
  }
}

// Invert the d3 Albers-USA projection (approx) to recover lon/lat from projected x/y.
// us-atlas states-10m.json is pre-projected to a 975x610 viewport in Albers USA.
function _albersUsaInvert(x, y){
  // Inverse of d3.geoAlbersUsa as used by us-atlas v3 (975x610 viewport): scale 1300,
  // translate [487.5, 305], screen y-down. Verified: US center → canvas center, coasts span
  // the full width, and it round-trips exactly.
  const scale=1300, tx=487.5, ty=305;
  const phi0=37.5*Math.PI/180, lam0=-96*Math.PI/180;
  const p1=29.5*Math.PI/180, p2=45.5*Math.PI/180;
  const n=(Math.sin(p1)+Math.sin(p2))/2;
  const C=Math.cos(p1)*Math.cos(p1)+2*n*Math.sin(p1);
  const rho0=Math.sqrt(C-2*n*Math.sin(phi0))/n;
  const px=(x - tx)/scale, py=-(y - ty)/scale;   // negated: screen-up = north (matches on-device result)
  const rho0my=rho0 - py;
  const rho=Math.sqrt(px*px + rho0my*rho0my);
  const theta=Math.atan2(px, rho0my);
  const phi=Math.asin(Math.max(-1,Math.min(1,(C - rho*rho*n*n)/(2*n))));
  const lam=lam0 + theta/n;
  return [lam*180/Math.PI, phi*180/Math.PI];
}

function _ringsLookGeographic(rings){
  if(!rings || !rings.length) return false;
  let n=0, okc=0, minLon=999;
  for(const ring of rings){
    for(const p of ring){ n++; if(p[0]>=-180&&p[0]<=180&&p[1]>=-90&&p[1]<=90) okc++; if(p[0]<minLon) minLon=p[0]; if(n>400) break; }
    if(n>400) break;
  }
  return okc>n*0.98 && minLon<-60;   // US longitudes are negative; projected pixels sit in 0..975
}

// (decodeStatesTopo cut at v0.11.0 — the states layer now takes the interior
// mesh; _albersUsaInvert survives as the mesh's projection inverse. Recover
// from git history if a full-polygon states decode ever returns.)

// Load WORLD country borders (lon/lat TopoJSON — no projection inversion needed) from the
// same-origin data/ file (deviation 1). Drawn as a thin global context layer.

// v0.11.0 (owner: "map looks double traced — sharpen and fix"): border layers
// were decoding FULL polygons, so every coastline got re-stroked by the state
// and country rings on top of the land layer, and every shared border drew
// twice. This decoder emits the INTERIOR MESH instead — each TopoJSON arc once,
// and only arcs shared by two geometries (a real border). Coastal arcs belong
// to exactly one polygon and are skipped: the land layer owns the coast.
function _topoInteriorMesh(topo, objName, projInvert){
  const tr=topo.transform, arcs=topo.arcs;
  const obj=topo.objects && topo.objects[objName]; if(!obj) return [];
  const use=new Array(arcs.length).fill(0);
  function tally(ix){ for(const i of ix) use[i<0?~i:i]++; }
  for(const g of (obj.geometries||[])){
    if(g.type==='Polygon'){ for(const r of g.arcs) tally(r); }
    else if(g.type==='MultiPolygon'){ for(const poly of g.arcs) for(const r of poly) tally(r); }
  }
  const out=[];
  for(let i=0;i<arcs.length;i++){
    if(use[i]<2) continue;                     // coastline / unused — not a border
    let x=0,y=0; const line=[];
    for(const d of arcs[i]){
      let px,py;
      if(tr){ x+=d[0]; y+=d[1]; px=x*tr.scale[0]+tr.translate[0]; py=y*tr.scale[1]+tr.translate[1]; }
      else { px=d[0]; py=d[1]; }
      line.push(projInvert ? projInvert(px,py) : [px,py]);
    }
    if(line.length>1) out.push(line);
  }
  return out;
}

async function loadCountryBorders(){
  if(_countriesLoaded) return;
  const SOURCES=[

      const r=await fetch(SRC); if(!r.ok) continue;
      const topo=await r.json();

// Generic TopoJSON→lon/lat ring decoder (delta-decoded arcs + transform; data already geographic).
function _decodeTopoLonLat(topo, objName){
  const tr=topo.transform, arcs=topo.arcs;
  const obj=topo.objects && topo.objects[objName]; if(!obj) return [];
  function dec(a){ let x=0,y=0; const o=[]; for(const d of a){ if(tr){ x+=d[0]; y+=d[1]; o.push([x*tr.scale[0]+tr.translate[0], y*tr.scale[1]+tr.translate[1]]); } else o.push([d[0],d[1]]); } return o; }
  const D=arcs.map(dec);
  function ringFor(ix){ let p=[]; for(let k=0;k<ix.length;k++){ let i=ix[k],a; if(i<0){a=D[~i].slice().reverse();} else {a=D[i];} if(k>0) a=a.slice(1); p=p.concat(a); } return p; }
  const out=[];
  for(const g of (obj.geometries||[])){
    if(g.type==='Polygon'){ for(const r of g.arcs) out.push(ringFor(r)); }
    else if(g.type==='MultiPolygon'){ for(const poly of g.arcs) for(const r of poly) out.push(ringFor(r)); }
  }
  return out;
}

function decodeTopoLand(topo){
  const tr=topo.transform, arcs=topo.arcs;
  const sx=tr.scale[0], sy=tr.scale[1], tx=tr.translate[0], ty=tr.translate[1];
  function decodeArc(arc){ let x=0,y=0; const out=[]; for(const d of arc){ x+=d[0]; y+=d[1]; out.push([x*sx+tx, y*sy+ty]); } return out; }
  const decoded=arcs.map(decodeArc);
  function ringFor(arcIdxs){
    let pts=[];
    for(let k=0;k<arcIdxs.length;k++){
      let idx=arcIdxs[k], arc;
      if(idx<0){ arc=decoded[~idx].slice().reverse(); } else { arc=decoded[idx]; }
      if(k>0) arc=arc.slice(1);
      pts=pts.concat(arc);
    }
    return pts;
  }
  const out=[]; const geoms=topo.objects.land.geometries;
  for(const g of geoms){
    if(g.type==='Polygon'){ for(const r of g.arcs) out.push(ringFor(r)); }
    else if(g.type==='MultiPolygon'){ for(const poly of g.arcs) for(const r of poly) out.push(ringFor(r)); }
  }
  return out;
}

// Decode the states topojson KEEPING per-state identity (the border layer flattens it).
// Ported from A-ORG-1's brief-states section (deviation 4): it is pure topo→rings decode,
// so it lives with the other decoders; GLOBE_STATE_SHAPES fills the moment states load.
function _namedStateShapes(topo, geographic){
  const obj=topo.objects && (topo.objects.states || topo.objects['states-10m']); if(!obj) return null;
  const tr=topo.transform, arcs=topo.arcs;
  function dec(a){ let x=0,y=0; const o=[]; for(const d of a){ if(tr){ x+=d[0]; y+=d[1]; o.push([x*tr.scale[0]+tr.translate[0], y*tr.scale[1]+tr.translate[1]]); } else o.push([d[0],d[1]]); } return o; }
  const D=arcs.map(dec);
  function ringFor(ix){ let p=[]; for(let k=0;k<ix.length;k++){ let i=ix[k],a; if(i<0){a=D[~i].slice().reverse();} else {a=D[i];} if(k>0) a=a.slice(1); p=p.concat(a); } return p; }
  const out={};
  for(const g of (obj.geometries||[])){
    const nm=g.properties && g.properties.name; if(!nm) continue;
    const rings=[];
    if(g.type==='Polygon'){ for(const r of g.arcs) rings.push(ringFor(r)); }
    else if(g.type==='MultiPolygon'){ for(const poly of g.arcs) for(const r of poly) rings.push(ringFor(r)); }
    out[nm]=geographic? rings : rings.map(function(r){ return r.map(function(pt){ const v=_albersUsaInvert(pt[0],pt[1]); return (v&&v.length===2)?v:null; }).filter(Boolean); });
  }
  return out;
}

// ═══════════════════════════════════════════════════════════════════════════════
// s3-search.js — A-ORG-2 shell: THE ONE SEARCH (charter law: one selection model,
// one search). Index over sites (base + unit + st) at boot; #searchPill input
// filters as-you-type; #searchResults shows the top TWO results as large rows
// (MAP-FIRST grammar) + an honest count line; Enter/tap selects.
// (PORTED from A-ORG-1 index.html — the source is truth; names kept where ported.)
//
// Ported from A-ORG-1 (function/state names kept where the code came across):

//                                  prefix 80 · word-start 60 (token regex
//                                  (^|[\s(\-\/]) + regex-escaped query) · expansion
//                                  word-start · bare substring floor; +8 whole-word
//                                  bonus; −min(10, len/12) shorter-name tiebreak.
//   Enter-selects       (~L22805)  Enter clicks a '#searchResults [data-sfs]' row.

//                                  gap 6px; rows = borderless radius cards, bold

//
// NEW (A-ORG-2 contracts, no direct A-ORG-1 counterpart):
//   buildSearchIndex()   boot index over SITES: {base, unit(+unitFull), st} folded
//                        once (m5's _siteIndex identity-cache idiom, so a SITES
//                        swap re-indexes lazily and boot order can't break it).
//   searchSelect(id)     THE select: GlobeState.sel = site id + dirty (m5 deviation
//                        6 lazy-follow picks up the arcs), flyToLatLon(site), then
//                        the showDossier(id) hook — all guarded typeof, order-safe.
//   initSearch()         shell boot hook: build index + inject the search CSS. Also
//                        self-arms on 'load' (once-guarded) so the search works
//                        even if the shell forgets to call it.
//   _srFold()            diacritic/case folding (NFD strip) — mission-mandated;
//                        A-ORG-1 never folded ("Chièvres" was unfindable as
//                        "chievres"; 276-site A-ORG-2 is international by charter).
//
// DEVIATIONS (everything changed vs. A-ORG-1, and why):
//   1. ONE search, not three. A-ORG-1 grew a stage pill (sfs*), a universal overlay
//      (_usRun/openUSearch) and a workspace filter; the sfs zero-result row escaped
//      into universal search. A-ORG-2's single-brain law collapses them: sfsResults
//      carries _usRun's ranking directly, and the zero-result state is a plain
//      "No matches" card (there is no second search to escape to).
//   2. sfsResults(q) searches SITES (flat array, parent pointer only) instead of
//      walking ARMY_DATA's tree, and returns {list, total, q} instead of an array
//      of names: the count line needs the TRUE match count, so the source's
//      40-hit walk cap is gone (276 sites, one O(n) pass — no cap needed).
//   3. Scoring ladder extended per mission: BASE-NAME HITS BEAT UNIT HITS. Base
//      keeps the source rungs (exact 100 · prefix 80 · word-start 60, +8 whole
//      word); unit rungs sit strictly below the lowest base rung (exact 50 ·
//      prefix 44 · word-start 38), unitFull word-start 30 (the source's fl rung),
//      st exact 26 / word-start 22 (st is a searchable field per mission — "NC"
//      must find North Carolina posts), bare substring floor 10. Length tiebreak
//      ported unchanged, on the base name.
//   4. Rows carry data-sfs="<site id>" (A-ORG-1 carried the org NAME because
//      selectOrgNode took names). A-ORG-2's selection model is GlobeState.sel =

//   5. Arrow-key highlight is NEW (mission): _sfsHi moves over the rows,
//      re-rendering classes only; Enter clicks the highlighted row where A-ORG-1
//      always clicked the first. With no arrows pressed _sfsHi is 0 — identical
//      behavior to the source.
//   6. searchSelect does NOT call _syncSelArcs: m5's lazy follow (_selSyncCheck,
//      its deviation 6) rebuilds arcs from GlobeState.sel on the next dirty frame.
//      Setting sel + globeMark() is the entire selection contract.
//   7. Input/keydown/click land as document-level DELEGATED listeners installed at
//      script eval (A-ORG-1's own pattern for sfsInput, ~L22802-22808) — they need
//      no DOM at install time, so concatenation order and shell build order can't
//      race them. The field is matched by 'input inside #searchPill' instead of
//      id==='sfsInput' (shell contract names the pill, not the input).

//      utilities that belong to the shell core at concatenation; a second

//   9. CSS ships as a JS-injected <style id="s3SearchCSS"> — construction-phase
//      only. m-modules are canvas-side and own no CSS; this module builds DOM. At
//      final assembly the block moves verbatim into index.html's single <style>
//      (dead-lint expects one style block) and the injector no-ops via its
//      already-present guard. Tokens only; phone-first; the sole desktop tweak
//      sits inside @media(min-width:1100px); no position:fixed, no transforms
//      (the results stack can scroll — transform-free per the reliability
//      contract). Pill/dropdown GEOMETRY (where the search sits on the stage) is
//      the shell owner's; this block styles only what this module renders.
//  10. tenants are NOT indexed — mission scopes the index to base + unit + st
//      (unitFull rides along as the unit's expansion, exactly like _usRun's
//      n.full). Tenant search is a backlog item for the dossier owner.
//
// OWNERSHIP (concatenation law — no duplicate top-level declarations):
//   - DECLARED HERE: buildSearchIndex, sfsResults, sfsRender, searchSelect,
//     initSearch, _searchEntries, _srFold, _srEsc, _srEscA, _sfsField,
//     _isSearchField, _srInjectCSS, _srEntries, _srSrc, _sfsHi, _srBooted.
//   - USED, declared elsewhere (ALL guarded typeof at call time): GlobeState
//     (shell), SITES (shell data loader), siteById (m5), globeMark (m2),
//     flyToLatLon (m4), showDossier (dossier owner's hook — optional).
//
// CONTRACTS HONORED:
//   - Reads SITES / GlobeState at call time only — concatenation-order safe.
//   - Redraw law: selection marks GlobeState.dirty once per select (an event,
//     never per-frame); nothing here touches the render loop.
//   - No frameworks, no webfonts, sloppy-mode top-level function declarations.
//   - Brief tier tokens (--t1..--t4) untouched; no green near data.
// ═══════════════════════════════════════════════════════════════════════════════

// A-ORG-1's four grouping shells — structure, not commands. They stay OUT of
// search and OUT of the brief's subordinates picker (their children surface
// directly); the map-room tree shows them faithfully.
const _OG_CATS={acoms:1, asccs:1, drus:1, 'acquisition-paes-cpes':1};

// ---- Escaping (PORT of esc ~L14030 / _escA ~L14129 — renamed, deviation 8) -----
function _srEsc(s){ return String(s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }
function _srEscA(v){ return String(v).replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

// ---- Diacritic/case fold (NEW — mission-mandated; deviation in header) ---------
function _srFold(s){
  s=String(s==null?'':s).toLowerCase();
  try{ s=s.normalize('NFD').replace(/[\u0300-\u036f]/g,''); }catch(_){}
  return s;
}

// ---- The index: SITES folded once, rebuilt only when SITES identity changes ----
// (m5 _siteIndex idiom — boot builds it, a data swap re-indexes lazily.)
let _srEntries=null, _srSrc=null;

function _searchEntries(){
  const arr=(typeof SITES!=='undefined' && SITES && SITES.length!=null) ? SITES : [];
  if(_srSrc===arr && _srEntries) return _srEntries;
  _srEntries=[];
  for(const s of arr){
    if(!s || s.id==null) continue;
    // the site's unit voice = its PRIMARY org from the A-ORG-1 tree (v0.11.0:
    // the tree is the ONE structure — the old site.unit field no longer speaks)
    const base=String(s.base||s.id), st=String(s.st||'');
    const po=(typeof ogPrimary==='function')?ogPrimary(s.id):null;
    const unit=po?String(po.name):'';
    _srEntries.push({
      id:s.id, base:base,
      sub:(unit?unit:'')+((unit&&st)?' · ':'')+st,          // "III Armored Corps · TX"
      baseF:_srFold(base), unitF:_srFold(unit), stF:_srFold(st),
      allF:_srFold(base+' '+unit+' '+st)
    });
  }
  // ORGANIZATIONS (A-ORG-1 law: units are searchable) — picking one selects its
  // effective site with that org driving the chain picture
  if(typeof A1ORGS!=='undefined'){
    for(const og of A1ORGS){
      if(_OG_CATS[og.id]) continue;                        // grouping shells aren't destinations
      // (v0.13.0: HQDA and NGB — real commands at lvl 1-2 — ARE searchable now)
      const sid=(typeof ogEffSite==='function')?ogEffSite(og.id):null;
      const hs=sid?siteById(sid):null;
      _srEntries.push({
        id:'og:'+og.id, base:og.name,
        sub:(hs?hs.base:'')+((hs&&hs.st)?(' · '+hs.st):''),
        baseF:_srFold(og.name), unitF:'', stF:_srFold(hs?(hs.st||''):''),
        allF:_srFold(og.name+' '+(hs?(hs.base+' '+(hs.st||'')):''))
      });
    }
  }
  _srSrc=arr;
  return _srEntries;
}

function buildSearchIndex(){ _srSrc=null; return _searchEntries(); }

// ---- Results (PORT of sfsResults + _usRun's v22.3.1 ranking; deviations 2-3) ---
// Returns {list:[entry,entry], total:N, q:foldedQuery}. list is the TOP TWO.
function sfsResults(q){
  q=_srFold((q||'').trim());
  if(q.length<2) return {list:[], total:0, q:q};
  // v22.3.1 ranking (ported): rank word-starts above mid-word noise — 'bragg'
  // finds Fort Bragg before anything that merely CONTAINS the letters; base-name
  // matches beat unit matches; shorter names win ties.
  const tk=new RegExp('(^|[\\s(\\-\\/])'+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  const hits=[];
  for(const e of _searchEntries()){
    let s2=0;
    if(e.baseF===q) s2=100;
    else if(e.baseF.indexOf(q)===0) s2=80;
    else if(tk.test(e.baseF)) s2=60;
    else if(e.unitF && e.unitF===q) s2=50;
    else if(e.unitF && e.unitF.indexOf(q)===0) s2=44;
    else if(e.unitF && tk.test(e.unitF)) s2=38;
    else if(e.stF && e.stF===q) s2=26;
    else if(e.stF && tk.test(e.stF)) s2=22;
    else if(e.allF.indexOf(q)>=0) s2=10;
    if(!s2) continue;
    if(e.baseF.split(/[\s()\-\/,]+/).indexOf(q)>=0) s2+=8;   // whole-word bonus (ported)
    hits.push({e:e, _s:s2 - Math.min(10, e.baseF.length/12)});
  }
  hits.sort(function(a,b){
    return (b._s-a._s) || (a.e.baseF.length-b.e.baseF.length) || (a.e.baseF<b.e.baseF?-1:1);
  });
  return {list:hits.slice(0,2).map(function(h){ return h.e; }), total:hits.length, q:q};
}

// ---- Render (PORT of sfsRender — rows via innerHTML <button data-sfs>) ---------
// res = {list,total,q} from sfsResults, or null/'' query → dropdown folds shut.
let _sfsHi=0;   // keyboard highlight over the (at most two) rows — deviation 5

function _srFuse(){
  const dd=document.getElementById('searchResults');
  const p=document.getElementById('searchPill');
  const open=!!(dd && dd.innerHTML);
  if(dd) dd.classList.toggle('sr-open', open);
  if(p)  p.classList.toggle('sr-open', open);
}
function sfsRender(res){
  _sfsPaint(res);
  _srFuse();                                   // pill + results fuse into one surface when open
}
function _sfsPaint(res){
  const dd=document.getElementById('searchResults'); if(!dd) return;
  _sfsHi=0;
  if(!res || !res.q || res.q.length<2){ dd.innerHTML=''; return; }
  // v21.5.1 flow law (ported): zero results never dead-end SILENTLY. There is no
  // second search to escape to (deviation 1) — say so, plainly.
  if(!res.list.length){
    dd.innerHTML='<div class="sr-none">No matches for “'+_srEsc(res.q)+'”.</div>';
    return;
  }
  const count = res.total===1 ? '1 site'
    : res.total<=2 ? res.total+' sites'
    : res.total+' sites — top 2 shown';
  dd.innerHTML=res.list.map(function(e,i){
    return '<button type="button" class="sr-row'+(i===_sfsHi?' hi':'')+'" role="option"'
      +' aria-selected="'+(i===_sfsHi?'true':'false')+'" data-sfs="'+_srEscA(e.id)+'">'
      +'<b>'+_srEsc(e.base)+'</b><span class="sr-sub">'+_srEsc(e.sub)+'</span></button>';
  }).join('')+'<div class="sr-count">'+_srEsc(count)+'</div>';
}

// ---- THE select (mission contract; deviation 6 — m5 lazy-follows sel) ----------
// v0.6.0: delegates to the canonical selectSite (s4) so a search pick rides the
// SAME rails as every other pick — trail crumb, SELECT-clock auto-fill, brief
// re-render. The inline body below is only the boot-order fallback (s4 absent).
function searchSelect(id){
  // v0.13.0: in the BRIEF room a search pick opens the org's popup (fly to its
  // base first) — from there one tap adds it. The map room keeps map selection.
  const inBrief=!!(document.body && document.body.classList && document.body.classList.contains('brief-mode'));
  if(String(id).slice(0,3)==='og:'){                       // an ORGANIZATION pick
    const oid=String(id).slice(3);
    const sid=(typeof ogEffSite==='function')?ogEffSite(oid):null;
    if(inBrief){
      const hs=sid?siteById(sid):null;
      if(hs && hs.lat!=null) try{ flyToLatLon(hs.lat, hs.lon, Math.max(GlobeState.zoom||1, 2.4)); }catch(_){}
      try{ _bfObjSheet(oid); }catch(_){}
      return;
    }
    if(sid && typeof selectSite==='function'){ selectSite(sid, {orgId:oid}); return; }
  }
  if(inBrief && siteById(id)){
    const s0=siteById(id);
    if(s0.lat!=null) try{ flyToLatLon(s0.lat, s0.lon, Math.max(GlobeState.zoom||1, 2.4)); }catch(_){}
    try{ _bfObjSheet(id); }catch(_){}
    return;
  }
  if(typeof selectSite==='function'){ selectSite(id); return; }
  const s=(typeof siteById==='function') ? siteById(id) : null;
  if(!s) return;
  GlobeState.sel=s.id;
  if(typeof globeMark==='function') globeMark(); else GlobeState.dirty=true;
  if(typeof flyToLatLon==='function' && s.lat!=null && s.lon!=null){
    // the base-dossier fly (~L15089): never zoom OUT to meet a selection
    try{ flyToLatLon(s.lat, s.lon, Math.max(GlobeState.zoom||1, 2.6)); }catch(_){}
  }
  try{ if(typeof showDossier==='function') showDossier(s.id); }catch(_){}
}

// ---- bottom search vs the phone keyboard (v0.14.0) ----------------------------
if(!window.__sbKbWired){ window.__sbKbWired=true;
  try{
    const vv=window.visualViewport;
    const _sbLift=function(){
      const p=document.getElementById('searchPill'), r=document.getElementById('searchResults');
      if(!p) return;
      const kb=vv?Math.max(0, window.innerHeight - vv.height - vv.offsetTop):0;
      const on=document.activeElement && document.activeElement.id==='searchInput' && kb>40;
      p.style.bottom=on?((kb+12)+'px'):'';
      if(r) r.style.bottom=on?((kb+60)+'px'):'';
    };
    if(vv){ vv.addEventListener('resize', _sbLift); vv.addEventListener('scroll', _sbLift); }
    document.addEventListener('focusin', function(){ setTimeout(_sbLift, 80); });
    document.addEventListener('focusout', function(){ setTimeout(_sbLift, 120); });
  }catch(_){}
}

// ---- Field lookup (shell contract names the PILL; the input lives inside) ------
function _sfsField(){
  const p=document.getElementById('searchPill'); if(!p) return null;
  return (p.tagName==='INPUT') ? p : p.querySelector('input');
}
function _isSearchField(t){
  return !!(t && t.tagName==='INPUT' && t.closest && t.closest('#searchPill'));
}

// ---- Delegated wiring (A-ORG-1's document-level pattern, ~L22802 — deviation 7) -
document.addEventListener('input', function(e){
  if(e.target && _isSearchField(e.target)) sfsRender(sfsResults(e.target.value));
});

document.addEventListener('keydown', function(e){
  const t=e.target;
  if(!t || !_isSearchField(t)) return;
  if(e.key==='Enter'){                                   // ported (~L22805): Enter = pick
    const rows=document.querySelectorAll('#searchResults [data-sfs]');
    const b=rows[_sfsHi]||rows[0]; if(b) b.click();
    e.preventDefault(); return;
  }
  if(e.key==='ArrowDown' || e.key==='ArrowUp'){          // deviation 5: move the highlight
    const rows=document.querySelectorAll('#searchResults [data-sfs]');
    if(!rows.length) return;
    _sfsHi=Math.max(0, Math.min(rows.length-1, _sfsHi+(e.key==='ArrowDown'?1:-1)));
    for(let i=0;i<rows.length;i++){
      rows[i].classList.toggle('hi', i===_sfsHi);
      rows[i].setAttribute('aria-selected', i===_sfsHi?'true':'false');
    }
    e.preventDefault(); return;
  }
  if(e.key==='Escape'){                                  // ported (~L22772): Esc clears
    if(t.value){ t.value=''; sfsRender(null); }
    else{ try{ t.blur(); }catch(_){} }
    return;
  }
});

document.addEventListener('click', function(e){
  if(!e.target.closest) return;
  const sb=e.target.closest('#searchResults [data-sfs]');
  if(sb){                                                // ported (~L22845): tap = pick
    searchSelect(sb.getAttribute('data-sfs'));
    const i=_sfsField(); if(i){ i.value=''; try{ i.blur(); }catch(_){} }
    sfsRender(null);
    return;
  }
});

// ---- Boot (A-ORG-1 load+setTimeout idiom ~L23544; __mdWired-style once-guard) --
let _srBooted=false;

function initSearch(){
  if(_srBooted) return;
  _srBooted=true;
  buildSearchIndex();
  _srInjectCSS();
  const dd=document.getElementById('searchResults');
  if(dd){ dd.setAttribute('role','listbox'); dd.setAttribute('aria-label','Search results'); }
  const i=_sfsField();
  if(i && !i.__srWired){
    i.__srWired=1;
    // blur collapse (ported ~L23570): an emptied field folds its results after 150ms
    // (the delay lets a row tap land before the dropdown disappears under it).
    i.addEventListener('blur', function(){
      setTimeout(function(){ if(!(i.value||'').trim()) sfsRender(null); }, 150);
    });
  }
}

addEventListener('load', function(){ setTimeout(function(){ try{ initSearch(); }catch(_){} }, 0); });

// ---- CSS (deviation 9 — construction-phase injection; tokens only; phone-first;
//      row grammar ported from .sfs-dd ~L5365 + .us-row ~L1856) -------------------
function _srInjectCSS(){
  if(document.getElementById('s3SearchCSS')) return;     // the final-assembly no-op guard
  // (M1 verify: the construction-phase injected CSS was removed — s1-tokens.css
  //  owns the #searchResults/.sr-row recipe; dual ownership was fighting it.)
}


/* ══════════ module: s4-dossier ══════════ */
// ═══════════════════════════════════════════════════════════════════════════════
// s4-dossier.js — A-ORG-2 shell: THE DOSSIER + THE SELECTION BRAIN (single-brain
// law: one selection model, one drawer). selectSite(id|null) is the ONE function
// every selection path routes through — m3's tap hook (tapAtScreen), s3's search
// (via its showDossier hook), the dossier's own crumb/child rows, the header ✕
// and the #stageBar Clear pill. showDossier(id)/hideDossier() control #dossier,
// the shell's bottom card. (PORTED from A-ORG-1 index.html — the source is truth;
// names kept where code ported.)
//
// Ported from A-ORG-1 (function/state names kept where the code came across):
//   renderBaseDossier    (~L15039)  the site-card grammar: od-head-slim header
//                                   (od-name + bd-state chip + od-sp spacer +

//                                   bd-tile tappable unit rows, od-note short
//                                   empty states, and the never-zoom-OUT fly

//   _odWired delegate    (~L12480)  ONE document-level click delegate, installed
//                                   at script eval behind the window._odWired
//                                   once-guard: [data-odclose] → select(null),
//                                   [data-odsel] → select(target) (~L13350).

//   fresh-card scroll    (~L15102)  a new selection brings the card top into

//                                   see deviation 7.
//   esc / _escA          (~L14030/14129)  HTML body / attribute escaping,
//                                   renamed _odEsc/_odEscA (s3's deviation-8
//                                   rule: canonical names belong to the shell
//                                   core at concatenation; bodies verbatim).
//   od-sec underline     (~L2214)   the 44px gradient underline on section
//                                   headers (currentColor here — see CSS notes).
//   :active brightness   (~L15342 idiom)  press feedback on icon buttons.
//   boot idiom           (~L23544)  addEventListener('load', setTimeout(try{}))
//                                   + once-guard, exactly as s3 boots.
//
// NEW (A-ORG-2 contracts, no direct A-ORG-1 counterpart):
//   selectSite(id|null)  THE single brain (mission contract). Sets GlobeState.sel
//                        + dirty (m5's lazy follow rebuilds the arc sets), flies,
//                        renders/hides the card, syncs the Clear pill. Exposed on
//                        window explicitly (mission: "Expose selectSite globally").
//   tapAtScreen(x, y)    m3-input's guarded tap hook, DECLARED HERE (m3 header:
//                        "selection/dossier module hook"). siteHitTest (m5) → id
//                        → selectSite. A no-hit tap keeps the selection — exactly
//                        A-ORG-1's handleGlobeTap, which only hid the tip
//                        (~L17929); clearing is a deliberate act (✕ / Clear).
//   showDossier(id)      render + reveal #dossier. RENDER ONLY — it never touches
//                        GlobeState.sel (s3's searchSelect sets sel itself, then
//                        calls this hook; the brain calls it last for the same
//                        order). hideDossier() is the symmetric close — also
//                        side-effect-free; only selectSite(null) clears state.
//   initDossier()        boot hook: inject CSS + re-agree with any GlobeState.sel
//                        that already exists (harness boots). Self-arms on 'load'.
//   _odStageClearSync()  shows/hides the shell's #stageClear pill with the
//                        selection (s1-shell: "back/clear stay hidden until the
//                        selection/search owner wires and shows them" — this
//                        module IS the selection owner; the delegate routes the
//                        pill through selectSite(null)). #stageBack/#stageReset
//                        are NOT touched (reset is shell-wired; back has no
//                        history model in M1).
//
// DEVIATIONS (everything changed vs. A-ORG-1, and why):
//   1. The card is the SHELL's #dossier (bottom card, position:absolute inset
//      math per s1-tokens.css §4 — the reliability-contract translation of
//      "in-flow, never fixed" for a non-scrolling 100dvh body). This module
//      writes CONTENT ONLY: no positioning, no transforms, no fixed layers —
//      A-ORG-1's #orgDetail/host plumbing (cmd-zero sync, navTab, scrollIntoView
//      against a scrolling page) is gone with the page it served.
//   2. Selection is a SITE ID (GlobeState.sel, shell contract) — A-ORG-1 selected
//      org NODES by name (selectOrgNode/OrgSel). data-odsel therefore carries the
//      site id, not a name (same shift as s3's deviation 4). OrgSel itself is not
//      ported: GlobeState.sel IS the selection model, one source of truth.
//   3. UP is crumb ROWS, not the horizontal strip: A-ORG-1's od-crumbs-slim strip
//      packed a deep org path sideways; here each ancestor SITE is a full-width
//      44px row (phone-first tap targets), direct parent first → root last, every
//      one live (the terminal element — the selected site — is the card header,
//      so no inert od-crumb-cur is rendered). The root row wears an HQ tag
//      (m5 deviation 7: roots are "the closest thing to A-ORG-1's kind:hq").
//   4. Crumb sub-lines walk parentUnit: hop N's row shows the unit AT that hop
//      which owns hop N−1 (sel.parentUnit for the first row), falling back to the
//      hop's own headline unit — the row reads as the command line, which is the
//      section's job; A-ORG-1 crumbs had org names only. Child rows show the
//      child's own unit · st.
//   5. bd-tile's right-hand slot (bd-st) held ★ stars in A-ORG-1; A-ORG-2 sites
//      carry no star field, so the slot now carries the child's OWN subordinate
//      count ("N subs" — mission: children rows with counts). Counts come from
//      m5's childrenOf (parent pointer is the only relationship).
//   6. Arc clearing on ✕ (mission: "clears GlobeState.sel + arcs"): sel=null +
//      globeMark() already clears the arcs via m5's lazy follow (its deviation
//      6); the null path ALSO calls _syncSelArcs(null) guarded so the stores drop
//      immediately (m5: "stays exposed for callers that want the rebuild
//      immediately"). The select path relies on the lazy follow alone, exactly
//      like s3's searchSelect (its deviation 6). The duplicate null rebuild on
//      the next frame is idempotent.
//   7. Fresh render sets host.scrollTop=0 instead of scrollIntoView: #dossier IS
//      the scroll container on a non-scrolling body, so 'block:start' has no page
//      to scroll — resetting its own scroll is the same intent (v18.0.2: the
//      whole card into view), zero layout tricks.
//   8. Section voices are the ARC voices: UP rows/header speak --signal (m5 draws
//      the parent chain gold), DOWN rows/header speak --accent (child web blue) —
//      list ⇄ map always in agreement (A-ORG-1's own v10.x law). A-ORG-1's neon
//      green od-sec/od-crumb colors are NOT ported: no green near data (tier
//      law adjacency), and arctic has no neon token.
//   9. CSS ships as a JS-injected <style id="s4DossierCSS"> — s3's deviation 9
//      verbatim: construction-phase only; at final assembly the block moves into
//      index.html's single <style> and the injector no-ops via its guard. Tokens
//      only (+A-ORG-1-literal fallbacks); phone-first; desktop hovers ONLY inside
//      @media(min-width:1100px); no position:fixed; no transforms on anything
//      that scrolls (the ONLY transform is the ✕'s static 44px hit-area pseudo —
//      A-ORG-1's od-ico::after idiom ~L4580 — on a non-scrolling button).
//  10. NOT ported, with reasons: tenant grid/echelon grouping (_unitsAtInstallation,
//      _echelonOf — tenants[] ride sites.json but are the dossier backlog item s3
//      deviation 10 already parked; the mission card is base/unit/UP/DOWN only);
//      cross-org tie cards + cxRelTag (charter §2 OUT: parent pointer is the only
//      relationship); nav history/_navRecord (no tab model); stack popups + tips
//      (one drawer, single-brain law); _cmdClearSync/cmd-zero (no zero-state CSS
//      here — [hidden] does the job).
//
// OWNERSHIP (concatenation law — no duplicate top-level declarations):
//   - DECLARED HERE: selectSite, showDossier, hideDossier, tapAtScreen,
//     initDossier, _odRender, _odEsc, _odEscA, _odStageClearSync, _odInjectCSS,
//     _odBooted (+ the window._odWired delegate flag, A-ORG-1 name kept).
//   - USED, declared elsewhere (ALL guarded typeof at call time): GlobeState
//     (shell), siteById / childrenOf / parentChainOf / siteHitTest / _syncSelArcs
//     (m5), globeMark (m3), flyToLatLon (m4).
//
// CONTRACTS HONORED:
//   - Reads GlobeState/SITES-derived indexes at call time only — concatenation-
//     order safe; the delegate + load boot need no DOM at install time.
//   - Redraw law: selection marks GlobeState.dirty once per select/clear (an
//     event, never per-frame); nothing here touches the render loop.
//   - Reliability: no position:fixed, no pointer capture, no transforms on
//     scroll containers. No frameworks, no webfonts, sloppy-mode top-level
//     function declarations only.
//   - Brief tier tokens (--t1..--t4) untouched; no green on or near data.
// ═══════════════════════════════════════════════════════════════════════════════

// ---- Escaping (PORT of esc ~L14030 / _escA ~L14129 — renamed, s3 dev-8 rule) ---
function _odEsc(s){ return String(s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }
function _odEscA(v){ return String(v).replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

// ---- THE SINGLE BRAIN (mission contract) ---------------------------------------
// Every selection path lands here: m3 tap → tapAtScreen → selectSite; search rows
// → searchSelect (sets sel + flies, then the showDossier hook — same net effect,
// same order); dossier crumb/child rows + ✕ + Clear pill → the delegate below.
// UNDO SPINE (v0.8.0 owner: back = undo one step). Every discrete navigation
// act — a pick, a clear, a double-tap dive, a cluster fly, a recall — pushes
// the camera+selection it is about to replace. The ring's back pops one.
function _undoPush(){
  try{
    const u=GlobeState._undo||(GlobeState._undo=[]);
    const last=u[u.length-1];
    const cur={yaw:GlobeState.yaw, pitch:GlobeState.pitch, zoom:GlobeState.zoom,
      sel:GlobeState.sel, brief:document.body.classList.contains('brief-mode'),
      ts:performance.now()};
    if(last && last.sel===cur.sel && Math.abs(last.yaw-cur.yaw)<1e-4
       && Math.abs(last.pitch-cur.pitch)<1e-4 && Math.abs(last.zoom-cur.zoom)<1e-3) return;
    u.push(cur); if(u.length>24) u.shift();
  }catch(_){}
}
function selectSite(id, o){
  if(!(o&&o.noUndo)) _undoPush();
  if(id==null){
    GlobeState.sel=null;
    GlobeState.selOrg=null;
    if(typeof globeMark==='function') globeMark(); else GlobeState.dirty=true;
    // arcs drop NOW (deviation 6); m5's lazy follow re-confirms next frame.
    try{ if(typeof _syncSelArcs==='function') _syncSelArcs(null); }catch(_){}
    try{ _trailClear(); }catch(_){}
    try{ if(typeof autoFillSelect==='function') autoFillSelect(null); }catch(_){}   // an auto zone dies with its selection
    try{ calloutHide(); }catch(_){}
    hideDossier();
    return;
  }
  const s=(typeof siteById==='function') ? siteById(id) : null;
  if(!s) return;                       // stale id (old DOM, bad deep link): keep the current picture
  GlobeState.sel=s.id;
  // v0.11.0: the org tree drives the chain — a specific org pick (search/org
  // row) wins; otherwise the site's primary org speaks for it
  GlobeState.selOrg=(o && o.orgId && typeof orgOf==='function' && orgOf(o.orgId)) ? o.orgId
    : ((typeof ogPrimary==='function' && ogPrimary(s.id)) ? ogPrimary(s.id).id : null);
  if(typeof globeMark==='function') globeMark(); else GlobeState.dirty=true;
  const _inBrief=(function(){ try{ return document.body.classList.contains('brief-mode'); }catch(_){ return false; } })();
  if(!(o&&o.keepCam) && !_inBrief && typeof flyToLatLon==='function' && s.lat!=null && s.lon!=null){
    // the base-dossier fly (~L15089): never zoom OUT to meet a selection
    // (keepCam: saved-view recall owns the camera — the fly must not eat it)
    try{ flyToLatLon(s.lat, s.lon, Math.max(GlobeState.zoom||1, 2.6)); }catch(_){}
  }
  try{ _trailPush(s.id); }catch(_){}
  try{ if(document.body.classList.contains('nav-open')) window._nvSet(true); }catch(_){}
  try{ if(typeof autoFillSelect==='function') autoFillSelect(s); }catch(_){}   // SELECT clock follows the selection (manual pick wins)
  // v0.9.0 (owner references): identity arrives AT the dot — the sheet only on ▤
  try{ hideDossier(); }catch(_){}
  try{ calloutShow(s.id); }catch(_){ showDossier(s.id); }
  if(_inBrief){ try{ renderBrief(); }catch(_){} }
}

// ---- MODE (v0.3.0 control law): MAP ⇄ BRIEF — one seg, unmistakable shift ----
function setMode(m){
  const brief=(m==='brief');
  document.body.classList.toggle('brief-mode', brief);
  // the globe picture is the hero (owner law): the chart supplement arrives
  // MINIMIZED every time brief opens — one tap on ⌗ CHART expands it
  if(brief) document.body.classList.add('chart-min');
  if(brief) renderBrief();
  try{                                            // the sheet follows the mode
    const host=document.getElementById('dossier');
    // v0.7.0: brief opens on the GLOBE picture — no sheet until an object is
    // tapped (chain dot or chart chip); map restores the selection card.
    if(host){ if(brief){ hideDossier(); } else if(GlobeState.sel) showDossier(GlobeState.sel); else hideDossier(); }
  }catch(_){}
  try{ GlobeState.__bfC=null; }catch(_){}
  try{ calloutHide(); }catch(_){}
  try{ if(typeof globeMark==='function') globeMark(); }catch(_){}
}
try{ window.setMode=setMode; }catch(_){}

// BRIEF 2.0 (v0.5.0): the user-assembled chain — every HQ in the brief set
// renders as its own tier-law block, four echelons deep. Connectors are
// borders: exact lines, never hand-drawn. L1 white spine · L2 cools · L3
// warms · L4 roses; green never touches brief data. Boxes carry the org's
// record count; annotations (≤80 chars) ride under their box in the signal
// voice (chrome, not tier data).
// v0.7.0: the CHART CARD — the tree SUPPLEMENTS the globe picture. Compact chips
// only (owner law: minimal on the object, everything in the popup); minimize (⌗)
// collapses the card to its tab. Chips open the object popup.
function renderBrief(){
  // v0.13.0: one group block per L1 with an EYE (show/hide that component of
  // the brief) + the L1-L4 depth control. Rows show only what the owner added.
  const el=document.getElementById('briefStage'); if(!el) return;
  const esc=_odEsc, escA=_odEscA;
  const memN=(BRIEF.mem||[]).length;
  let h='<button type="button" class="ch-head" data-chmin="1" aria-label="Minimize or expand the chart">⌗ CHART'
    +'<span class="ch-n">'+(memN?(memN+' org'+(memN===1?'':'s')):'')+'</span>'
    +'<span class="od-ico" data-xpbtn="1" role="button" aria-label="Export"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4"></path><path d="M7 9l5-5 5 5"></path><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"></path></svg></span>'
    +'</button>';
  if(!memN){
    const selP=(GlobeState.selOrg&&typeof orgOf==='function')?orgOf(GlobeState.selOrg)
      :((GlobeState.sel&&typeof ogPrimary==='function')?ogPrimary(GlobeState.sel):null);
    h+='<div class="bf-empty"><b>The brief is empty</b>'
      +(selP?('<button type="button" class="bf-addsel" data-bfadd="'+escA(selP.id)+'">Add '+esc(_bfAbbr(selP.name))+'</button>')
            :'<span>Pick an organization on the map, then add it here.</span>')
      +'</div>';
    el.innerHTML=h; return;
  }
  const C=_briefChainMap({all:true});
  const dep=GlobeState._bfDepth||4;
  const hid=new Set(BRIEF.hide||[]);
  h+='<div class="bf-depth">'+[1,2,3,4].map(function(n){
    return '<button type="button" class="bf-dep'+(dep>=n?' on':'')+'" data-bfdepth="'+n+'" aria-label="Show levels through L'+n+'">L'+n+'</button>';
  }).join('')+'</div>';
  const EYE='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z"></path><circle cx="12" cy="12" r="2.6"></circle></svg>';
  const EYEOFF='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z"></path><path d="M4 4l16 16"></path></svg>';
  const CAP={2:10,3:12,4:14};
  const roots=C.order.filter(function(k){ return C.nodes[k].lvl===1; });
  roots.forEach(function(r){
    const rn=C.nodes[r];
    const off=hid.has(r);
    const members=C.order.filter(function(k){ return C.nodes[k].root===r; });
    h+='<div class="ch-col'+(off?' ch-off':'')+'">';
    h+='<div class="ch-grp">'
      +'<button type="button" class="bf-eye'+(off?' off':'')+'" data-bfeye="'+escA(r)+'" aria-label="Show or hide this group">'+(off?EYEOFF:EYE)+'</button>'
      +'<button type="button" class="ch-chip ch-t1" data-bfobj="'+escA(r)+'" title="'+escA(rn.name)+'">'+esc(_bfAbbr(rn.name))+'</button>'
      +'<span class="ch-gn">'+members.length+'</span></div>';
    if(!off) [2,3,4].forEach(function(t){
      if(t>dep) return;
      const row=members.map(function(k){ return C.nodes[k]; })
        .filter(function(n){ return Math.min(4,n.lvl)===t; })
        .sort(function(a,b){ return (b.custom?1:0)-(a.custom?1:0); });
      if(!row.length) return;
      const ind=(t-1)*10;
      h+='<div class="ch-row" style="--ch-ind:'+ind+'px">'
        +row.slice(0,CAP[t]).map(function(n){
          const tcls='ch-t'+t;                             // quote-adjacent for dead-lint's dynamic guard
          return '<button type="button" class="ch-chip '+tcls+(GlobeState.sel===n.id?' on':'')+'" data-bfobj="'+escA(n.id)+'" title="'+escA(n.name)+'">'+esc(_bfAbbr(n.name))+'</button>';
        }).join('')
        +'</div>';
      if(row.length>CAP[t]) h+='<div class="ch-more" style="--ch-ind:'+ind+'px">+'+(row.length-CAP[t])+' more</div>';
    });
    h+='</div>';
  });
  el.innerHTML=h;
}
try{ window.renderBrief=renderBrief; }catch(_){}

// ---- BREADCRUMB TRAIL (v0.2.0) — the globe stroll's memory. Session-only (the
// no-localStorage-at-boot law holds); ‹ Back walks it, chips jump anywhere in it.
function _trailPush(id){
  const t=GlobeState._trail||(GlobeState._trail=[]);
  if(t[t.length-1]===id) { _trailRender(); return; }
  const i=t.indexOf(id); if(i>=0) t.splice(i,1);   // revisits move to the tip, no dupes
  t.push(id); if(t.length>12) t.shift();
  _trailRender();
}
// (back = tapping a crumb; the dedicated _trailBack retired with the Back pill)
function _trailClear(){ GlobeState._trail=[]; _trailRender(); }

// ---- m3's tap hook (m3-input deviation 4 boundary — DECLARED HERE) -------------
function tapAtScreen(x, y){
  if(GlobeState._navSwallow){ GlobeState._navSwallow=false; return; }   // that tap only closed the nav ring
  if(document.body && document.body.classList.contains('brief-mode')){
    // v0.7.0: the brief globe is the destination — a chain dot opens its popup;
    // empty sphere does nothing (hold the globe button 3s to return to map).
    const bs=(typeof siteHitTest==='function') ? siteHitTest(x, y) : null;
    if(bs && bs.id!=null){ _bfAnnEdit=null; _orgForm=null; try{ calloutShow(bs.id); }catch(_){} }
    return;
  }
  const hits=GlobeState._cluHits;
  if(hits){ for(const h of hits){ const dx=x-h.x, dy=y-h.y;
    if(dx*dx+dy*dy<=h.r*h.r){ try{ _undoPush(); flyToLatLon(h.lat, h.lon, 2.4); }catch(_){} return; } } }
  const s=(typeof siteHitTest==='function') ? siteHitTest(x, y) : null;
  if(s && s.id!=null){
    // DRILL DOWN (v0.18.0): tapping a direct-subordinate dot focuses THAT org and
    // its own children — you descend the tree one level per tap, never all at once.
    const kid=GlobeState._selKidOrg && GlobeState._selKidOrg[s.id];
    selectSite(s.id, kid ? {orgId:kid} : undefined);
  }
  // no-hit: selection survives (A-ORG-1 ~L17929 only hid the tip) — clearing is
  // a deliberate act (✕ on the card, or the nav ring's Clear).
}

// ---- The card (PORT of renderBaseDossier's grammar — render only, no state) ----
function showDossier(id){
  const host=document.getElementById('dossier'); if(!host) return;
  if(document.body && document.body.classList && document.body.classList.contains('brief-mode')){
    _bfObjSheet(id); return;                       // brief mode: the sheet is the object popup
  }
  const s=(typeof siteById==='function') ? siteById(id) : null;
  if(!s){ hideDossier(); return; }
  // a NEW org resets the pop-out state — the card always arrives compact
  if(id!==_odLastId){ _odLastId=id; _odFan=false; _odShowRec=false; _odTab='ov'; _rcForm=null; }
  _odInjectCSS();                                  // order-safe if a select lands before 'load'
  const _kept=(host.className.match(/dz-(peek|half|full)/)||[])[1]||'peek';
  host.innerHTML=_odRender(s);
  host.classList.remove('dz-peek','dz-half','dz-full');
  host.classList.add('dz-'+_kept);                 // selection keeps the current detent; first open peeks
  host.classList.toggle('fan-open', _odFan);
  host.hidden=false;
  try{ host.setAttribute('aria-label', s.base+' — dossier'); }catch(_){}
  host.scrollTop=0;                                // deviation 7: whole card into view
  _odStageClearSync(true);
}

function hideDossier(){
  const host=document.getElementById('dossier'); if(!host) return;
  host.hidden=true;
  host.innerHTML='';
  // v0.8.0 audit: a closed card forgets everything — the NEXT card always
  // arrives compact and peeked, even for the same org after a clear.
  _odLastId=null; _odFan=false; _odShowRec=false;
  host.classList.remove('dz-half','dz-full','fan-open'); host.classList.add('dz-peek');
  try{ host.setAttribute('aria-label','Dossier'); }catch(_){}
  _odStageClearSync(false);
}

function _odRender(s){
  // v0.11.0: the A-ORG-1 org tree is the structure. The card speaks for the
  // selection's ORG (GlobeState.selOrg); ancestors and subordinates are org
  // hops rendered with their effective sites.
  const selOg=(GlobeState.selOrg && typeof orgOf==='function') ? orgOf(GlobeState.selOrg) : null;
  const chain=selOg ? ogChainUp(selOg.id) : [];
  const kids=selOg ? ogKids(selOg.id) : [];
  const hosted=(typeof ogAtSite==='function') ? ogAtSite(s.id) : [];

  // sheet header (control law): grip · trail crumbs · export · close. The grip
  // steps the detent; crumbs ARE back-navigation; nothing here needs a caption.
  let h='<button class="sh-grip" type="button" data-dzstep="1" aria-label="Expand or collapse"><span></span></button>';
  const _tr=(GlobeState._trail||[]);
  if(_tr.length>1){
    h+='<div class="sh-crumbs">';
    for(const tid of _tr.slice(-3)){
      const ts=siteById(tid); if(!ts) continue;
      const tip=(tid===_tr[_tr.length-1]);
      h+='<button type="button" class="sh-crumb'+(tip?' tip':'')+'" data-odsel="'+_odEscA(tid)+'">'+_odEsc(ts.base)+'</button>';
    }
    h+='</div>';
  }
  // v0.8.0 COMPACT CARD (owner law: a fraction of the size, information hidden
  // — nested pop-outs like the nav ring). One row: name · state · ⊕ · export · ✕.
  // ⊕ fans out the actions (brief ★ · subordinate ⌥ · records ▤); ▤ expands the
  // tabbed detail in place. No stat lines, no sub-lines, no standing buttons.
  // the pop-out rail RIDES ABOVE the name row (it springs upward from ⊕ like
  // the nav ring) — audit law: the bottom band belongs to the globe button on
  // narrow phones, so nothing tappable may render beneath the head row.
  const fanOrg=(selOg&&selOg.id)||((typeof ogPrimary==='function'&&ogPrimary(s.id))?ogPrimary(s.id).id:null);
  h+='<div class="od-fan'+(_odFan?' open':'')+'">'
    +(fanOrg&&bfHas(fanOrg)
      ?'<button class="od-pop on" type="button" data-bfrm="'+_odEscA(fanOrg)+'" aria-label="Remove from brief"><svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.3.9-4.5 4.4 1 6.1-5.5-2.9-5.5 2.9 1-6.1L3 9.5l6.3-.9L12 3z"></path></svg></button>'
      :'<button class="od-pop" type="button" data-bfadd="'+_odEscA(fanOrg||s.id)+'" aria-label="Add to brief"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.3.9-4.5 4.4 1 6.1-5.5-2.9-5.5 2.9 1-6.1L3 9.5l6.3-.9L12 3z"></path></svg></button>')
    +'<button class="od-pop" type="button" data-orgadd="'+_odEscA(fanOrg||s.id)+'" aria-label="Add subordinate"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><circle cx="12" cy="6" r="2.6"></circle><path d="M12 9v3M12 12l-5 4M12 12l5 4"></path><circle cx="7" cy="18" r="2.2"></circle><circle cx="17" cy="18" r="2.2"></circle></svg></button>'
    +'<button class="od-pop'+(_odShowRec?' on':'')+'" type="button" data-odrec="1" aria-label="Details and records"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"></path></svg></button>'
    +'</div>';

  h+='<div class="od-head od-head-slim">'
    +'<div class="od-name">'+_odEsc((selOg&&selOg.name)||s.base)+'</div>'
    +(s.st?'<span class="bd-state">'+_odEsc(s.st)+'</span>':'')
    +'<span class="od-sp"></span>'
    +'<button class="od-ico od-plus'+(_odFan?' on':'')+'" type="button" data-odfan="1" aria-label="Actions" aria-expanded="'+(_odFan?'true':'false')+'"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></button>'
    +'<button class="od-ico" id="exportBtn" type="button" aria-label="Export"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4"></path><path d="M7 9l5-5 5 5"></path><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"></path></svg></button>'
    +'<button class="od-ico od-ico-x" type="button" data-odclose="1" aria-label="Clear selection">✕</button>'
    +'</div>';

  if(!_odShowRec) return h;

  // ── the hidden detail (▤): Overview + the four record kinds ──
  const rec=(typeof recordOf==='function')?recordOf(s.id):null;
  const cnt=function(k){ return rec?rec[k].length:0; };
  if(_odTab!=='ov' && !RC_KINDS[_odTab]) _odTab='ov';
  h+='<div class="od-tabs">'
    +'<button type="button" class="od-tab'+(_odTab==='ov'?' on':'')+'" data-odtab="ov">Overview</button>'
    +Object.keys(RC_KINDS).map(function(k){
      const c=cnt(k);
      return '<button type="button" class="od-tab'+(_odTab===k?' on':'')+'" data-odtab="'+k+'">'+RC_KINDS[k].n+(c?(' · '+c):'')+'</button>';
    }).join('')
    +'</div>';
  if(_odTab!=='ov') return h+_rcRender(s.id, _odTab);

  // STATIONED HERE — every org the A-ORG-1 tree puts at this site; tapping a
  // row re-aims the chain picture at that org (no site change, no duplicates).
  if(hosted.length>1){
    h+='<div class="od-sec od-sec-up">At '+_odEsc(s.base)+' <b>'+hosted.length+'</b></div>'
      +hosted.map(function(og){
        const on=selOg && selOg.id===og.id;
        return '<button class="od-crumb'+(on?' od-crumb-on':'')+'" type="button" data-ogsel="'+_odEscA(og.id)+'">'
          +'<span class="bd-nm"><b>'+_odEsc(og.name)+'</b></span>'
          +'<span class="od-sp"></span>'
          +(on?'<span class="od-crumb-tag">CHAIN</span>':'')
          +'</button>';
      }).join('');
  }

  // UP — the reporting line as crumb ROWS, direct parent first → HQDA last
  // (A-ORG-1 law: every hop renders at its effective site; gold voice = arcs).
  if(chain.length){
    h+='<div class="od-sec od-sec-up">Reports to <b>'+chain.length+'</b></div>';
    for(let i=0;i<chain.length;i++){
      const p=chain[i];
      const sid=(typeof ogEffSite==='function')?ogEffSite(p.id):null;
      const hs=sid?siteById(sid):null;
      h+='<button class="od-crumb" type="button" data-ogo="'+_odEscA(p.id)+'">'
        +'<i class="od-hop">↑</i>'
        +'<span class="bd-nm"><b>'+_odEsc(p.name)+'</b>'+(hs?'<span>'+_odEsc(hs.base+(hs.st?(' · '+hs.st):''))+'</span>':'')+'</span>'
        +'<span class="od-sp"></span>'
        +(p.parent==null?'<span class="od-crumb-tag">HQDA</span>':'')
        +'</button>';
    }
  }else if(selOg){
    h+='<div class="od-sec od-sec-up">Reports to</div>'
      +'<div class="od-note">Top of the chain.</div>';
  }else{
    h+='<div class="od-sec od-sec-up">Reports to</div>'
      +'<div class="od-note">No organization stationed here — coordinate anchor only.</div>';
  }

  // DOWN — direct subordinate ORGS with their stations. One echelon by design.
  if(kids.length){
    h+='<div class="od-sec od-sec-down">Subordinate orgs <b>'+kids.length+'</b></div>'
      +kids.map(function(c){
        const n=(typeof ogKids==='function') ? ogKids(c.id).length : 0;
        const sid=(typeof ogEffSite==='function')?ogEffSite(c.id):null;
        const hs=sid?siteById(sid):null;
        return '<button class="bd-tile" type="button" data-ogo="'+_odEscA(c.id)+'">'
          +'<i class="od-hop od-hop-dn">↓</i>'
          +'<span class="bd-nm"><b>'+_odEsc(c.name)+'</b>'+(hs?'<span>'+_odEsc(hs.base+(hs.st?(' · '+hs.st):''))+'</span>':'')+'</span>'
          +'<span class="od-sp"></span>'
          +(n?('<span class="bd-st">'+n+' sub'+(n===1?'':'s')+'</span>'):'')
          +'</button>';
      }).join('');
  }else if(selOg){
    h+='<div class="od-sec od-sec-down">Subordinate orgs</div>'
      +'<div class="od-note">No subordinates on file.</div>';
  }
  return h;
}


// ═══ THE ANCHORED CALLOUT (v0.9.0 owner references): the popup lives AT the
// dot. Identity + nested action circles beside the marker; a caret tail points
// at it; it tracks the dot on every dirty frame and hides on the far side.
// Depth (tabs/records/forms) stays in the sheet — summoned by ▤ only. ─────────
let _coId=null;            // the anchored org (site or custom) — null = hidden
let _coAt=null;            // fixed screen anchor (chart chips); null = track the dot
function calloutShow(id, at){
  _coId=id; _coAt=at||null;
  _coRender();
  _coPlace();
}
function calloutHide(){
  _coId=null; _coAt=null;
  const c=document.getElementById('calloutCard'); if(c) c.hidden=true;
}
function _coRefresh(){ if(_coId!=null){ _coRender(); _coPlace(); } }
function _coRender(){
  const c=document.getElementById('calloutCard'); if(!c) return;
  const o=(typeof orgById==='function')?orgById(_coId):null;            // user-built custom
  const ag=(!o && typeof orgOf==='function')?orgOf(_coId):null;          // A-ORG-1 org node
  const s=(!o && !ag)?siteById(_coId):null;                              // installation dot
  if(!o && !ag && !s){ calloutHide(); return; }
  const esc=_odEsc, escA=_odEscA;
  const agHost=ag?siteById(ogEffSite(ag.id)||''):null;
  const selOg=(s && GlobeState.selOrg && typeof orgOf==='function')?orgOf(GlobeState.selOrg):null;
  const sPrim=(s && typeof ogPrimary==='function')?ogPrimary(s.id):null;
  const sOg=(s && GlobeState.sel===s.id && selOg) ? selOg : sPrim;       // the org speaking for this dot
  const name=o?o.name:(ag?ag.name:((sOg&&sOg.name)||s.base));
  const sub=o?('Custom org'+(o.base&&siteById(o.base)?(' · '+siteById(o.base).base):''))
            :(ag?((agHost?agHost.base:'')+((agHost&&agHost.st)?(' · '+agHost.st):''))
                 :(s.base+(s.st?(' · '+s.st):'')));
  const nrec=(s&&typeof recCount==='function')?recCount(_coId):0;
  const brief=document.body.classList.contains('brief-mode');
  let h='<div class="co-head"><div class="co-name">'+esc(name)+'</div>'
    +'<button class="co-x" type="button" data-cox="1" aria-label="Clear selection">✕</button></div>'
    +'<div class="co-sub">'+esc(sub)+(nrec?(' · '+nrec+' rec'):'')+'</div>';
  const briefSubj = ag ? ag.id : (sOg ? sOg.id : null);   // what ★ adds — always an ORG
  // CONNECTION SUMMARY (map): tell the user, in words, what the arcs mean.
  if(!brief && briefSubj && typeof orgOf==='function'){
    let parentName=null;
    try{ for(const anc of ogChainUp(briefSubj)){ if(!(typeof _OG_CATS!=='undefined'&&_OG_CATS[anc.id])){ parentName=anc.name; break; } } }catch(_){}
    const kids=(typeof ogKids==='function')?ogKids(briefSubj).length:0;
    const bits=[];
    if(parentName) bits.push('<span class="co-up">↑</span> Reports to '+esc(_bfAbbr(parentName)));
    if(kids) bits.push('<span class="co-dn">↓</span> '+kids+' subordinate'+(kids===1?'':'s'));
    if(bits.length) h+='<div class="co-rel">'+bits.join('<span class="co-relsep">·</span>')+'</div>';
  }
  h+='<div class="co-acts">';
  if(briefSubj){
    h+=bfHas(briefSubj)
      ?'<button class="co-pop on" type="button" data-bfrm="'+escA(briefSubj)+'" aria-label="Remove from brief"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.3.9-4.5 4.4 1 6.1-5.5-2.9-5.5 2.9 1-6.1L3 9.5l6.3-.9L12 3z"></path></svg></button>'
      :'<button class="co-pop" type="button" data-bfadd="'+escA(briefSubj)+'" aria-label="Add to brief"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.3.9-4.5 4.4 1 6.1-5.5-2.9-5.5 2.9 1-6.1L3 9.5l6.3-.9L12 3z"></path></svg></button>';
  }
  h+='<button class="co-pop" type="button" data-orgadd="'+escA(o?_coId:(briefSubj||_coId))+'" aria-label="Add subordinate"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><circle cx="12" cy="6" r="2.6"></circle><path d="M12 9v3M12 12l-5 4M12 12l5 4"></path><circle cx="7" cy="18" r="2.2"></circle><circle cx="17" cy="18" r="2.2"></circle></svg></button>';
  const detailSite = s ? s.id : (agHost ? agHost.id : null);
  if(detailSite) h+='<button class="co-pop" type="button" data-codetail="'+escA(detailSite)+'"'+(ag?(' data-codeorg="'+escA(ag.id)+'"'):'')+' aria-label="Details and records"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"></path></svg></button>';
  if(brief && (s||ag)) h+='<button class="co-pop" type="button" data-govmap="'+escA(s?_coId:agHost?agHost.id:_coId)+'"'+(ag?(' data-govorg="'+escA(ag.id)+'"'):'')+' aria-label="Show on map"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8"></circle><path d="M12 2v4M12 18v4M2 12h4M18 12h4"></path></svg></button>';
  if(o) h+='<button class="co-pop" type="button" data-orgrm="'+escA(o.id)+'" aria-label="Delete org"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>';
  h+='</div><i class="co-tail" aria-hidden="true"></i>';
  c.innerHTML=h;
  c.hidden=false;
}
// screen anchor: chart chips pass a fixed point; dots re-project every frame
function _coAnchor(){
  if(_coAt) return _coAt;
  const o=(typeof orgById==='function')?orgById(_coId):null;
  let lat=null, lon=null;
  if(o){
    const C=GlobeState.__bfC, n=C&&C.nodes?C.nodes[_coId]:null;
    if(n){ lat=n.lat; lon=n.lon; }
    else if(o.base){ const b=siteById(o.base); if(b){ lat=b.lat; lon=b.lon; } }
  } else {
    const s=siteById(_coId); if(s){ lat=s.lat; lon=s.lon; }
  }
  if(lat==null||lon==null) return null;
  const m=GlobeState.__mCss; if(!m) return null;
  try{
    const p=_projectLonLat(lon, lat, m);
    if(p[2]<0) return {back:true};
    return {x:p[0], y:p[1]};
  }catch(_){ return null; }
}
function _coPlace(){
  const c=document.getElementById('calloutCard');
  if(!c || _coId==null || c.hidden) return;
  try{
    const a=_coAnchor();
    if(!a || a.back){ c.style.opacity='0'; c.style.pointerEvents='none'; return; }
    c.style.opacity=''; c.style.pointerEvents='auto';
    const vw=window.innerWidth||390, vh=window.innerHeight||844;
    const w=c.offsetWidth||236, hgt=c.offsetHeight||110;
    const x=Math.max(8, Math.min(a.x-w/2, vw-w-8));
    // above the dot by default; below when the top chrome would eat it; never
    // over the dot itself, never under the globe button band when avoidable
    let above=(a.y-hgt-18)>=112;
    let y=above ? a.y-hgt-18 : a.y+18;
    if(!above && (y+hgt)>(vh-128)){
      const y2=Math.max(112, a.y-hgt-18);
      if(!(a.y>=y2 && a.y<=y2+hgt)) { y=y2; above=true; }   // only flip up if the dot stays clear
    }
    c.classList.toggle('co-below', !above);
    c.style.left=Math.round(x)+'px'; c.style.top=Math.round(y)+'px';
    const t=c.querySelector('.co-tail');
    if(t) t.style.left=Math.max(12, Math.min(a.x-x-6, w-24))+'px';
  }catch(_){}
}
window._coTrack=function(){ try{ if(_coId!=null && !_coAt) _coPlace(); }catch(_){} };
try{ window.Callout={ show:calloutShow, hide:calloutHide, id:function(){ return _coId; } }; }catch(_){}

      +'<div class="rc-btns"><span class="od-sp"></span>'
      +'<button class="rc-cancel" type="button" data-orgcancel="'+escA(id)+'">Cancel</button>'

  } else {
    h+='<button class="rc-add" type="button" data-orgadd="'+escA(o?id:(sid||id))+'"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg> Add subordinate</button>';
  }
  // action rail: annotate (sites w/o callout yet) · map jump · remove
  h+='<div class="rc-row rc-acts">';
  if(sid && !BRIEF.ann[sid] && _bfAnnEdit!==sid) h+='<button class="bf-act in" type="button" data-bfannedit="'+escA(sid)+'">Annotate</button>';

function _rcRender(id, kind){
  const K=RC_KINDS[kind]; const rec=recordOf(id); const items=rec?rec[kind]:[];
  let h='';
  items.forEach(function(it, i){
    if(_rcForm && _rcForm.kind===kind && _rcForm.idx===i){ h+=_rcFormHTML(kind, it, i); return; }
    let top='', sub='';
    if(kind==='people'){ top=it.name||''; sub=it.role||''; }
    else if(kind==='specs'){ top=it.label||''; sub=it.value||''; }
    else if(kind==='notes'){ top=it.text||''; sub=it.ts?new Date(it.ts).toLocaleDateString():''; }
    else { top=it.label||''; sub=it.url||''; }
    h+='<div class="rc-row">'
      +(kind==='links'&&it.url?('<a class="rc-top" href="'+_odEscA(it.url)+'" target="_blank" rel="noopener">'+_odEsc(top)+'</a>'):('<span class="rc-top">'+_odEsc(top)+'</span>'))
      +(sub?('<span class="rc-sub">'+_odEsc(sub)+'</span>'):'')
      +'<button class="od-ico rc-dots" type="button" data-rcedit="'+i+'" aria-label="Edit"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></button>'
      +'</div>';
  });
  if(_rcForm && _rcForm.kind===kind && _rcForm.idx==null) h+=_rcFormHTML(kind, null, null);
  else h+='<button class="rc-add" type="button" data-rcadd="'+kind+'"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg> Add</button>';
  return h;
}
function _rcFormHTML(kind, it, idx){
  const K=RC_KINDS[kind];
  return '<div class="rc-form">'
    +'<input class="rc-in" id="rcF1" type="text" placeholder="'+_odEscA(K.f1)+'" value="'+_odEscA(it?(it[K.k1]||''):'')+'">'
    +(K.f2?('<input class="rc-in" id="rcF2" type="text" placeholder="'+_odEscA(K.f2)+'" value="'+_odEscA(it?(it[K.k2]||''):'')+'">'):'')
    +'<div class="rc-btns">'
    +(idx!=null?('<button class="rc-del" type="button" data-rcdel="'+idx+'">Delete</button>'):'')
    +'<span class="od-sp"></span>'
    +'<button class="rc-cancel" type="button" data-rccancel="1">Cancel</button>'
    +'<button class="rc-save" type="button" data-rcsave="'+(idx==null?'':idx)+'">Save</button>'
    +'</div></div>';
}
function _rcCommit(idx){
  const id=GlobeState.sel; if(!id||!_rcForm) return;
  const K=RC_KINDS[_rcForm.kind];
  const f1=document.getElementById('rcF1'), f2=document.getElementById('rcF2');
  const v1=(f1&&f1.value||'').trim(), v2=(f2&&f2.value||'').trim();
  if(!v1){ _rcForm=null; showDossier(id); return; }   // empty first field = never save a blank row
  const item={}; item[K.k1]=v1; if(K.k2) item[K.k2]=v2;
  if(idx==null||idx==='') recAdd(id,_rcForm.kind,item); else recUpdate(id,_rcForm.kind,parseInt(idx,10),item);
  _rcForm=null; showDossier(id);
}

/* ══════════ module: s7-records ══════════ */
/* ============================================================================
   s7-records (NEW at v0.4.0) — THE DATASTORE. One record per org, keyed to its
   map site: people · specs · notes · links. Memory map is the source of truth
   at runtime; IndexedDB ('aorg2'/'records') is write-through persistence and
   loads once at boot. No accounts, no network, nothing read at boot from
   localStorage (the boot law holds — IndexedDB opens async after first paint).
   Records ride every export through Snapshot.extras.records — the spine built
   for exactly this. Backup/restore = one JSON file, in the ⋯ menu.
   ========================================================================= */
let RECORDS=Object.create(null);
let _rdb=null;

function _recBlank(id){ return {v:1, id:id, people:[], specs:[], notes:[], links:[], mod:0}; }
function recordOf(id){ return RECORDS[id]||null; }
function recCount(id){
  const r=RECORDS[id]; if(!r) return 0;
  return (r.people.length+r.specs.length+r.notes.length+r.links.length);
}
function _recSave(id){
  const r=RECORDS[id]; if(!r) return;
  r.mod=Date.now();
  try{ if(_rdb){ const tx=_rdb.transaction('records','readwrite'); tx.objectStore('records').put(r); } }catch(_){}
}
function recAdd(id, kind, item){
  if(!RECORDS[id]) RECORDS[id]=_recBlank(id);
  if(kind==='notes' && item && !item.ts) item.ts=Date.now();
  RECORDS[id][kind].push(item); _recSave(id);
}

function _rdbOpen(){
