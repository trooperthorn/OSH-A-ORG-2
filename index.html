const BRIEF={ mem:[], ann:{}, hide:[] };
function _bfSave(){
  try{ if(_rdb){ const tx=_rdb.transaction('kv','readwrite'); tx.objectStore('kv').put({k:'brief', v:{mem:BRIEF.mem, ann:BRIEF.ann, hide:BRIEF.hide}}); } }catch(_){}

// the site's primary org — one structure, never a duplicate pair.
function _bfOrgId(id){
  if(typeof orgOf==='function' && orgOf(id)) return id;
  if(typeof orgById==='function' && orgById(id)) return id;      // user-built custom
  if(siteById(id)){ const p=(typeof ogPrimary==='function')?ogPrimary(id):null; if(p) return p.id; }

// v0.10.0 AUTOMATION: when the chain GROWS while the brief room is open, the
// globe gently reframes to hold the whole picture, and the chart's export
// button pulses once — the app offers the next step without saying a word.
function _bfFrame(){
  try{
    if(!document.body.classList.contains('brief-mode')) return;
    const C=_briefChainMap(); if(!C.order.length) return;
    const d=Math.PI/180; let x=0,y=0,z=0,n=0; const pts=[];
    C.order.forEach(function(k){ const nd=C.nodes[k];
      if(nd.lat==null||nd.lon==null) return;
      pts.push(nd);
      x+=Math.cos(nd.lat*d)*Math.cos(nd.lon*d); y+=Math.cos(nd.lat*d)*Math.sin(nd.lon*d); z+=Math.sin(nd.lat*d); n++;
    });
    if(!n) return;
    const L=Math.hypot(x,y,z)||1;
    const cLat=Math.asin(Math.max(-1,Math.min(1,z/L)))/d, cLon=Math.atan2(y,x)/d;
    let maxSep=0;
    pts.forEach(function(p){
      const a=[Math.cos(cLat*d)*Math.cos(cLon*d),Math.cos(cLat*d)*Math.sin(cLon*d),Math.sin(cLat*d)];
      const b=[Math.cos(p.lat*d)*Math.cos(p.lon*d),Math.cos(p.lat*d)*Math.sin(p.lon*d),Math.sin(p.lat*d)];
      let dot=a[0]*b[0]+a[1]*b[1]+a[2]*b[2]; dot=Math.max(-1,Math.min(1,dot));
      maxSep=Math.max(maxSep, Math.acos(dot)/d);
    });
    const zoom = maxSep>120?1.05 : maxSep>80?1.3 : maxSep>45?1.7 : maxSep>20?2.3 : (n===1?3.2:2.8);
    flyToLatLon(cLat, cLon, Math.max(1.0, Math.min(14, zoom)));
  }catch(_){}
}

function bfRemove(id){
  id=_bfOrgId(id)||id;

  const gone=new Set([id]); let grew=true, guard=0;

  gone.forEach(function(g){ delete BRIEF.ann[g]; });
  BRIEF.hide=(BRIEF.hide||[]).filter(function(r){ return !gone.has(r); });

  try{ renderBrief(); }catch(_){}

/* ============================================================================
   s6-export (NEW at v0.2.0) — THE SNAPSHOT SPINE. The flagship export contract:
   buildSnapshot(scope) is the ONE producer every exporter consumes — take what
   the map shows AND the data beneath it, in one serializable object. Future
   layers (M2 datastore people/notes/equipment, M3 brief chains) ATTACH to
   Snapshot.sites rows / Snapshot.extras — renderers never learn app internals,
   so export never has to be rebuilt. Renderers today: PNG · PDF (print) ·
   HTML dossier (self-contained file) · JSON.
   ========================================================================= */

// scope: 'auto' (selection family if selected, else everything visible-eligible)

  const kids=og?ogKids(og.id).map(function(k){ return siteById(ogEffSite(k.id)||''); }).filter(Boolean):[];

    rows=_sitesArr().filter(function(st){ return !off.has(clsOf(st.id)); });
  }
  const seen=new Set(); rows=rows.filter(function(r){ if(!r||seen.has(r.id)) return false; seen.add(r.id); return true; });
  const famCounts={}; rows.forEach(function(r){ const k=clsOf(r.id); famCounts[k]=(famCounts[k]||0)+1; });

  const cam=(function(){ try{ return {zoom:GlobeState.zoom, yaw:GlobeState.yaw, pitch:GlobeState.pitch}; }catch(_){ return {}; } })();
  return {
    meta:{ app:'A-ORG-2', version:(typeof APP_VERSION!=='undefined'?APP_VERSION:''),

           title: (function(){ try{ if(document.body.classList.contains('brief-mode')&&BRIEF.mem.length){ const Ct=_briefChainMap({all:true}); const r0=Ct.order.filter(function(k){ return Ct.nodes[k].lvl===1; }); const h0=r0.length?Ct.nodes[r0[0]]:null; return 'Brief — '+(h0?h0.name:'')+(r0.length>1?(' +'+(r0.length-1)):''); } }catch(_){} const _po=(GlobeState.selOrg&&typeof orgOf==='function')?orgOf(GlobeState.selOrg):null; return sel ? (sel.base+(_po?(' — '+_po.name):'')) : 'U.S. Army — global laydown'; })(),

    filters:{ classesOff:Array.from(off) },

// ---- shared download helper (app context — a real user gesture each time) -----
function _xpDownload(name, mime, data){
  try{

// ═══════════════════════════════════════════════════════════════════════════════
// s5-clocks.js — A-ORG-2 shell: THE LCD PAIR (v0.6.0 owner directive C: "time in
// LCD format with ability to select the zone"). Two 7-segment cells on the stage:
//   #clockTL  LOCAL  — the platform zone, named (EDT/CST…), never an offset.
//   #clockTR  SELECT — any of 12 theater zones; auto-fills from every selection
//                      (nearest region to the selected site), manual pick always
//                      wins. Idle face: ◷ / SELECT. Tap = zone sheet.
// (PORTED from A-ORG-1 index.html — the source is truth; names kept where ported.)
//
// Ported from A-ORG-1 (consult report 1 recovered the seg7 geometry from
// ada3f5d~1 — HEAD lost .sg-a…g to the v22.27.1 dead-code purge):
//   SEG7_MAP/seg7Digit/seg7HTML (~L13380/18599)  the font-free digit: 12×21px box,
//                                  seven clip-path bars, lit = accent + 4px glow.
//   civilianTime         (~L18780)  12h "hh:mm"+AM/PM via formatToParts, leading-
//                                  zero hours (LCD digits always 2+2), '--:--' face.
//   _selZone/_setSelZone (~L13366)  SELECT state {tz,label,auto} + repaint kick.
//   CLOCK_REGIONS + nearest-region auto-fill (v18.3, ~L22576)  the 12 anchors and
//                                  the dateline-safe dlon wrap; manual > auto;
//                                  clearing the selection clears an auto zone.
//   tickClocks + __k     (~L18799)  per-element write-dedupe: innerHTML only when
//                                  the face key changed (minute boundaries).
//   __tzLbl label law    (~L18829, v12.3 owner)  zone NAME or nothing on LOCAL.
//   cell grammar         (~L4290 .bar-time)  digits row (.bt-t) + AM/PM chip
//                                  (.bt-ap, wears the LCD's own light — v8.1.2)
//                                  over a tracked uppercase zone line (.bt-z).
//
// DEVIATIONS (vs. A-ORG-1, and why):
//   1. setTimeout-TO-BOUNDARY kept from the v0.1.0 module (no seconds on display;
//      the timer sleeps to the next :00). _setSelZone repaints instantly by
//      nulling the cell's __k and calling tickClocks directly.
//   2. Zone state persists in the kv store ('selZone', manual picks only) — the
//      boot law bans localStorage reads; auto zones never survive boot anyway
//      (no selection justifies them). _rdbOpen loads it post-paint.
//   3. The zone sheet rides the dossier host (the _svOpenSheet precedent) — no
//      new surface, same grip/detent/close grammar. Rows: LOCAL-clear + 12
//      regions with live faces; tapping the pinned row clears (source toggle).
//   4. seg7 scale rides CSS zoom on .seg7 (the A-ORG-1 scaling law): .92 phone,
//      1.05 desktop.
//
// Exports (top-level — the final assembly concatenates into ONE <script>):
//   SEG7_MAP, seg7Digit, seg7HTML, civilianTime, CLOCK_REGIONS,
//   nearRegion, autoFillSelect, pickZone, tickClocks, initClocks, _tzOpenSheet,
//   _ckArm, _ckBeat, _ckWake, _ckEsc, _ckInjectCSS, _selSave
//   window state: _selZone (SELECT zone) · __lastMin · __ckT · __visT · __tzLbl
// ═══════════════════════════════════════════════════════════════════════════════

// ---- seg7 engine (PORTED verbatim; geometry from ada3f5d~1 L982-988) ----------
const SEG7_MAP={'0':'abcdef','1':'bc','2':'abged','3':'abgcd','4':'fgbc','5':'afgcd','6':'afgedc','7':'abc','8':'abcdefg','9':'abcfgd','-':'g',' ':''};
function seg7Digit(ch){
  const on=SEG7_MAP[ch]!==undefined?SEG7_MAP[ch]:'';
  let s='<span class="seg7-d">';
  ['a','b','c','d','e','f','g'].forEach(function(g){ s+='<i class="sg sg-'+g+(on.indexOf(g)>=0?' on':'')+'"></i>'; });
  return s+'</span>';
}
function seg7HTML(str){
  let s='<span class="seg7">';
  for(const ch of String(str)) s+= ch===':' ? '<span class="seg7-colon"><i></i><i></i></span>' : seg7Digit(ch);
  return s+'</span>';
}

// 12h civilian face for an IANA zone (PORTED ~L18780: leading-zero hours — the
// LCD always shows 2+2 digits; '--:--' failure face maps to segment g / blank).
function civilianTime(tz, d){
  d=d||new Date();
  try{
    const p=new Intl.DateTimeFormat('en-US',{timeZone:tz,hour:'numeric',minute:'2-digit',hour12:true}).formatToParts(d);
    let hh='12',mm='00',ap='AM';
    p.forEach(function(x){ if(x.type==='hour')hh=x.value; if(x.type==='minute')mm=x.value; if(x.type==='dayPeriod')ap=x.value.toUpperCase(); });
    return {time:hh.padStart(2,'0')+':'+mm, ap:ap};
  }catch(_){ return {time:'--:--', ap:''}; }
}

// text-body escape (A-ORG-1 esc ~L14030, renamed — s3 precedent)
function _ckEsc(v){ return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ---- SELECT zone vocabulary (PORTED v18.3 ~L13729: 12 theater anchors) --------
const CLOCK_REGIONS=[
  {name:'Hawaii',     tz:'Pacific/Honolulu',    ll:[21.3,-157.9]},
  {name:'Alaska',     tz:'America/Anchorage',   ll:[61.2,-149.9]},
  {name:'US Pacific', tz:'America/Los_Angeles', ll:[47.1,-122.6]},
  {name:'US Mountain',tz:'America/Denver',      ll:[38.8,-104.8]},
  {name:'US Central', tz:'America/Chicago',     ll:[31.1,-97.8]},
  {name:'US Eastern', tz:'America/New_York',    ll:[35.1,-79.0]},
  {name:'CET',        tz:'Europe/Berlin',       ll:[50.1,8.2]},
  {name:'E. Europe',  tz:'Europe/Warsaw',       ll:[52.2,21.0]},
  {name:'SW Asia',    tz:'Asia/Kuwait',         ll:[29.3,48.0]},
  {name:'Korea',      tz:'Asia/Seoul',          ll:[37.5,127.0]},
  {name:'Japan',      tz:'Asia/Tokyo',          ll:[35.5,139.4]},
  {name:'Guam',       tz:'Pacific/Guam',        ll:[13.5,144.8]},
];
window._selZone=null;                 // {tz,label,auto?} | null — kv-loaded post-paint

// persist MANUAL picks only ('selZone' in kv — deviation 2); auto zones are
// session-scoped by law (a persisted auto zone would outlive its selection).
function _selSave(){
  try{
    if(!_rdb) return;
    const tx=_rdb.transaction('kv','readwrite');
    const z=window._selZone;
    if(z && !z.auto) tx.objectStore('kv').put({k:'selZone', v:{tz:z.tz, label:z.label}});
    else tx.objectStore('kv').delete('selZone');
  }catch(_){}
}
window._setSelZone=function(z, o){
  window._selZone=z||null;
  // auto-fill traffic never touches storage (o.ephemeral) — otherwise a pre-kv-load
  // auto pass could delete a persisted manual pick before the load restores it
  if(!(o&&o.ephemeral)) _selSave();
  try{ const b=document.getElementById('clockTR'); if(b) b.__k=null; }catch(_){}
  try{ tickClocks(); }catch(_){}
};

// nearest theater region (PORTED exact: dlon wrapped ±180, lon scaled by
// cos(mean lat) — dateline-safe; min squared-degrees wins)
function nearRegion(lat, lon){
  let best=null, bs=1e9;
  CLOCK_REGIONS.forEach(function(r){
    const dlat=lat-r.ll[0], dlon=((lon-r.ll[1]+540)%360)-180;
    const s=dlat*dlat + Math.pow(dlon*Math.cos(((lat+r.ll[0])/2)*Math.PI/180), 2);
    if(s<bs){ bs=s; best=r; }
  });
  return best;
}

// called from every selection: manual pick wins (early return); clearing the
// selection clears an auto zone (PORTED precedence law)
function autoFillSelect(site){
  if(window._selZone && !window._selZone.auto) return;
  if(!site || site.lat==null){ if(window._selZone && window._selZone.auto) window._setSelZone(null, {ephemeral:true}); return; }
  const r=nearRegion(site.lat, site.lon);
  if(r) window._setSelZone({tz:r.tz, label:r.name.toUpperCase().slice(0,12), auto:true}, {ephemeral:true});
}

// manual pick (zone sheet row): toggle-off on repeat — but tapping the row an
// AUTO zone currently shows PINS it manual (the natural gesture is "keep this")
function pickZone(tz, label){
  const cur=window._selZone;
  if(cur && cur.tz===tz && !cur.auto) window._setSelZone(null);
  else window._setSelZone({tz:tz, label:String(label).toUpperCase().slice(0,12)});
}

// ---- The repaint brain (PORTED name + __k write-dedupe ~L18799) ---------------
// One Date() feeds both faces; a cell whose key did not change costs nothing.
function tickClocks(){
  const now=new Date();
  try{
    const el=document.getElementById('clockTL');
    if(el){
      const c=civilianTime(undefined, now);          // undefined tz = platform local
      const lbl=window.__tzLbl||'LOCAL';
      const key=c.time+'|'+c.ap+'|'+lbl;
      if(el.__k!==key){ el.__k=key;
        el.innerHTML='<span class="bt-t">'+seg7HTML(c.time)
          +(c.ap?'<span class="bt-ap">'+c.ap+'</span>':'')
          +'</span><span class="bt-z">'+_ckEsc(lbl)+'</span>';
      }
    }
  }catch(_){}
  try{
    const bs=document.getElementById('clockTR');
    if(bs){
      const z=window._selZone;
      if(z && z.tz){
        const c=civilianTime(z.tz, now);
        const key=c.time+'|'+c.ap+'|'+z.tz+'|'+z.label;
        if(bs.__k!==key){ bs.__k=key;
          bs.innerHTML='<span class="bt-t">'+seg7HTML(c.time)
            +(c.ap?'<span class="bt-ap">'+c.ap+'</span>':'')
            +'</span><span class="bt-z">'+_ckEsc(z.label)+'</span>';
        }
      } else if(bs.__k!=='idle'){ bs.__k='idle';
        bs.innerHTML='<span class="bt-t bt-idle">◷</span><span class="bt-z">SELECT</span>';
      }
    }
  }catch(_){}
}

// ---- Minute-boundary beat (latch + typing guard PORTED ~L22216-22225) ---------
function _ckBeat(){
  try{
    const d=new Date();
    const mm=d.getMinutes();
    if(window.__lastMin!==mm){
      window.__lastMin=mm;
      const ae=document.activeElement;
      const typing=ae && (ae.tagName==='INPUT'||ae.tagName==='TEXTAREA');
      if(!typing) tickClocks();
    }
  }catch(_){}
  _ckArm();
}

// setTimeout-to-boundary: sleep until just past the next :00 (+40ms landing
// guard; an early fire no-ops on the latch and the re-arm self-corrects).
function _ckArm(){
  try{ clearTimeout(window.__ckT); }catch(_){}
  window.__ckT=setTimeout(_ckBeat, 60000-(Date.now()%60000)+40);
}

// ---- Wake (PORTED ~L22186): throttled background tabs snap current on return.
function _ckWake(){
  try{ window.__lastMin=-1; tickClocks(); }catch(_){}
  _ckArm();
}

// ---- Zone sheet (deviation 3: rides the dossier host, _svOpenSheet grammar).
// Rows: LOCAL/clear on top, then the 12 regions with live faces; the pinned
// row wears the accent. Delegate rungs live in the s4 one-delegate.
function _tzOpenSheet(){
  const host=document.getElementById('dossier'); if(!host) return;
  _odInjectCSS();
  const now=new Date();
  const cur=window._selZone;
  let h='<button class="sh-grip" type="button" data-dzstep="1" aria-label="Expand or collapse"><span></span></button>';
  h+='<div class="od-head od-head-slim"><div class="od-name">Time zones</div><span class="od-sp"></span>'
    +'<button class="od-ico od-ico-x" type="button" data-tzclose="1" aria-label="Close">✕</button></div>';
  h+='<div class="rc-row tz-row"><button class="rc-top'+(!cur?' tz-on':'')+'" type="button" data-tzclear="1">'
    +'Local'+ (window.__tzLbl?' · '+_ckEsc(window.__tzLbl):'')
    +'<span class="tz-hh">'+_ckEsc((function(){ const c=civilianTime(undefined,now); return c.time+' '+c.ap; })())+'</span></button></div>';
  CLOCK_REGIONS.forEach(function(r,i){
    const c=civilianTime(r.tz, now);
    const on=cur && cur.tz===r.tz;
    h+='<div class="rc-row tz-row"><button class="rc-top'+(on?' tz-on':'')+'" type="button" data-tzpick="'+i+'">'
      +_ckEsc(r.name)+(on&&cur.auto?' · auto':'')
      +'<span class="tz-hh">'+_ckEsc(c.time+' '+c.ap)+'</span></button></div>';
  });
  const _kept=(host.className.match(/dz-(peek|half|full)/)||[])[1];
  host.innerHTML=h;
  host.classList.remove('dz-peek','dz-half','dz-full');
  host.classList.add(_kept==='full'?'dz-full':'dz-half');
  host.hidden=false;
}

// ---- Boot (A-ORG-1 load+setTimeout idiom ~L23544; s3 _srBooted once-guard) ----
let _ckBooted=false;

function initClocks(){
  if(_ckBooted) return;
  _ckBooted=true;
  // LOCAL label: the v12.3 law (~L18829) — the zone's short NAME (EDT/CST…)
  // else its city; NEVER a Zulu/UTC offset.
  try{
    if(window.__tzLbl===undefined){
      const ltz=Intl.DateTimeFormat().resolvedOptions().timeZone;
      let z=''; try{ z=(new Intl.DateTimeFormat([], {timeZoneName:'short'}).formatToParts(new Date()).find(function(p){ return p.type==='timeZoneName'; })||{}).value||''; }catch(_){}
      if(!z || /GMT|UTC/i.test(z)) z=(String(ltz).split('/').pop()||'').replace(/_/g,' ');
      if(/GMT|UTC|^Etc\b/i.test(z)) z='';   // a zone NAME or nothing — never an offset marker
      window.__tzLbl=z;
    }
  }catch(_){}
  _ckInjectCSS();
  window.__lastMin=new Date().getMinutes();   // first paint owns the current minute
  tickClocks();
  _ckArm();
  try{
    const b=document.getElementById('clockTR');
    if(b && !b.__tzWired){ b.__tzWired=1; b.addEventListener('click', function(){ try{ _tzOpenSheet(); }catch(_){} }); }
  }catch(_){}
  try{ if(!window.__visT){ window.__visT=1;
    document.addEventListener('visibilitychange', function(){ if(!document.hidden) _ckWake(); });
    window.addEventListener('focus', _ckWake);
  } }catch(_){}
}

addEventListener('load', function(){ setTimeout(function(){ try{ initClocks(); }catch(_){} }, 0); });

// ---- CSS (construction-phase injection, s3 precedent; tokens only; the exact
//      A-ORG-1 seg7 geometry — keep .sg-a…g greppable-literal: A-ORG-1 lost them
//      to a dead-code purge that could not see 'sg-'+g. Scale rides CSS zoom on
//      .seg7 (the scaling law), never font-size. .clock static rules (position,
//      glass) still apply; this layer re-voices the interior for the LCD pair. --
function _ckInjectCSS(){
  if(document.getElementById('s5ClockCSS')) return;      // the final-assembly no-op guard
  const st=document.createElement('style'); st.id='s5ClockCSS';
  st.textContent=
    '.clock{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 13px}'+
    '.bt-t{display:inline-flex;align-items:center;gap:2px;font:800 22px/1 var(--body);color:var(--accent)}'+ /* font sizes only the idle ◷ glyph */
    '.bt-ap{font:800 9.5px var(--body);letter-spacing:.04em;color:var(--accent);'+
      'text-shadow:0 0 4px rgba(var(--accent-rgb),.6);margin-left:2px}'+
    '.bt-z{font:800 9px/1 var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}'+
    /* ── seg7 engine — 12×21px digits, seven clip-path bars, no font ── */
    '.seg7{display:inline-flex;align-items:center;gap:3px;zoom:.92}'+
    '.seg7-d{position:relative;display:inline-block;width:12px;height:21px;vertical-align:middle}'+
    '.seg7-d .sg{position:absolute;display:block;background:transparent}'+   /* unlit = nothing (v4.8.1 law) */
    '.seg7-d .sg.on{background:var(--accent);box-shadow:0 0 4px rgba(var(--accent-rgb),.6)}'+
    '.sg-a{top:0;left:1.6px;right:1.6px;height:2.4px;clip-path:polygon(12% 0,88% 0,100% 50%,88% 100%,12% 100%,0 50%)}'+
    '.sg-g{top:9.3px;left:1.6px;right:1.6px;height:2.4px;clip-path:polygon(12% 0,88% 0,100% 50%,88% 100%,12% 100%,0 50%)}'+
    '.sg-d{bottom:0;left:1.6px;right:1.6px;height:2.4px;clip-path:polygon(12% 0,88% 0,100% 50%,88% 100%,12% 100%,0 50%)}'+
    '.sg-f{top:1.6px;left:0;width:2.4px;height:7.7px;clip-path:polygon(50% 0,100% 12%,100% 88%,50% 100%,0 88%,0 12%)}'+
    '.sg-b{top:1.6px;right:0;width:2.4px;height:7.7px;clip-path:polygon(50% 0,100% 12%,100% 88%,50% 100%,0 88%,0 12%)}'+
    '.sg-e{bottom:1.6px;left:0;width:2.4px;height:7.7px;clip-path:polygon(50% 0,100% 12%,100% 88%,50% 100%,0 88%,0 12%)}'+
    '.sg-c{bottom:1.6px;right:0;width:2.4px;height:7.7px;clip-path:polygon(50% 0,100% 12%,100% 88%,50% 100%,0 88%,0 12%)}'+
    '.seg7-colon{display:inline-flex;flex-direction:column;justify-content:center;gap:5px;height:21px;padding:0 1px}'+
    '.seg7-colon i{width:2.6px;height:2.6px;border-radius:1px;background:var(--accent);box-shadow:0 0 4px rgba(var(--accent-rgb),.6)}'+
    /* zone sheet rows: name left, live face right; pinned wears the accent */
    '.tz-row .rc-top{display:flex;align-items:center;gap:8px;flex:1;max-width:none;min-height:44px}'+
    '.tz-hh{margin-left:auto;font:700 11px var(--mono);font-variant-numeric:tabular-nums;letter-spacing:.06em;color:var(--dim)}'+
    '.tz-on{color:var(--accent)}.tz-on .tz-hh{color:var(--accent)}'+
    '@media(min-width:1100px){.seg7{zoom:1.05}}';
  document.head.appendChild(st);
}


// ─── Shell boot spine — everything below survives with zero modules present ────
function bootShell(){
  // Desktop radius factor (PORT of A-ORG-1 ~L22187; re-checked on resize below).
  try{ if(window.matchMedia && matchMedia('(min-width:1100px)').matches){ GlobeState.baseK=0.88; } }catch(_){}

  // Initial orientation (PORT of A-ORG-1 ~L15810 — Atlantic overview).
  try{
    if(!GlobeState._qInit && typeof _faceLonLatAngles==='function'){
      _faceLonLatAngles(-40, 20); GlobeState._qInit=true;
    }
  }catch(_){}

  // Module boot (owner: shell — per m2-render's boot-integration note). Every
  // call is guarded: during construction a module may not be concatenated yet.
  var cv=document.getElementById('globeCanvas');
  if(cv){
    // chrome-yield automation (v0.8.0, audit-tuned): the flag arms only once a
    // press actually MOVES (>8px) — a plain tap never blinks the chrome — and
    // wheel counts only when it zooms (ctrl/meta, matching the zoom handler).
    try{
      var _gyT=null, _gyPend=false, _gyX=0, _gyY=0;
      var _gyOn=function(){ clearTimeout(_gyT); document.body.classList.add('gesturing'); };
      var _gyOff=function(){ _gyPend=false; clearTimeout(_gyT);
        _gyT=setTimeout(function(){ document.body.classList.remove('gesturing'); }, 420); };
      cv.addEventListener('pointerdown', function(e){ _gyPend=true; _gyX=e.clientX; _gyY=e.clientY; GlobeState._touched=true; });
      window.addEventListener('pointermove', function(e){
        if(_gyPend && Math.hypot(e.clientX-_gyX, e.clientY-_gyY)>8){ _gyPend=false; _gyOn(); }
      });
      cv.addEventListener('wheel', function(e){
        if(e.ctrlKey||e.metaKey){ GlobeState._touched=true; _gyOn(); _gyOff();
          // ring rocker stays honest while wheel-zooming with the ring out
          try{ if(document.body.classList.contains('nav-open')) window._nvSet(true); }catch(_){}
        }
      }, {passive:true});
      window.addEventListener('pointerup', _gyOff);
      window.addEventListener('pointercancel', _gyOff);
      window.addEventListener('touchend', _gyOff, {passive:true});
    }catch(_){}
    try{ if(typeof setupGlobeInteraction==='function') setupGlobeInteraction(cv); }catch(_){}
    try{ if(typeof smoothFallbackOnce==='function') smoothFallbackOnce(); }catch(_){}
    try{ if(typeof startGlobeLoop==='function') startGlobeLoop(cv); }catch(_){}
    try{ if(typeof loadGlobeCoastlinesHi==='function') loadGlobeCoastlinesHi(); }catch(_){}
    try{ if(typeof loadStateBorders==='function') loadStateBorders(); }catch(_){}
    try{ if(typeof loadCountryBorders==='function') loadCountryBorders(); }catch(_){}
    try{ if(typeof _rdbOpen==='function') _rdbOpen(); }catch(_){}
    try{ if(typeof globeMark==='function') globeMark(); else GlobeState.dirty=true; }catch(_){}
  }

  // Resize keeps the radius law honest (dirty-flag only — never a forced redraw).
  window.addEventListener('resize', function(){
    try{ GlobeState.baseK=(window.matchMedia && matchMedia('(min-width:1100px)').matches)?0.88:0.72; }catch(_){}
    try{ if(typeof globeMark==='function') globeMark(); else GlobeState.dirty=true; }catch(_){}
  });

  // NAV GLOBE (v0.6.0) — tap opens the hidden ring; hold 3s flips the room.
  // Consult hardening: window-level up/cancel (a drag off the button still ends
  // the press), pointer-id guard, outside-press swallow (closing the ring never
  // selects through it), Escape closes. No pointer capture (reliability law).
  try{
    var ng=document.getElementById('navGlobe');
    var _nvOpen=false, _nvHold=null, _nvT0=0, _nvX=0, _nvY=0, _nvFired=false, _nvRAF=null, _nvId=null;
    var _ring=document.querySelector('#nvRing circle');
    var _ringLen=2*Math.PI*33;
    var _nvRingReset=function(){ if(_ring) _ring.style.strokeDashoffset=_ringLen; };
    if(_ring){ _ring.style.strokeDasharray=_ringLen; _nvRingReset(); }
    window._nvSet=function(open){
      _nvOpen=open;
      document.body.classList.toggle('nav-open', open);
      try{ ng.setAttribute('aria-expanded', open?'true':'false'); }catch(_){}
      var bk=document.getElementById('navSat-back');
      if(bk) bk.disabled=!((GlobeState._undo||[]).length);
      var cl=document.getElementById('navSat-clear');
      if(cl) cl.disabled=(GlobeState.sel==null);
      var zo=document.getElementById('navSat-zoomout');
      if(zo) zo.disabled=(GlobeState.zoom<=1.01);
      var zi=document.getElementById('navSat-zoomin');
      if(zi) zi.disabled=(GlobeState.zoom>=27.9);
    };
    var _holdTick=function(){
      if(!_nvHold) return;
      var p=Math.min(1,(performance.now()-_nvT0)/3000);
      if(_ring) _ring.style.strokeDashoffset=String(_ringLen*(1-p));
      if(p>=1){
        _nvHold=null; _nvFired=true; _nvRingReset();
        try{ setMode(document.body.classList.contains('brief-mode')?'map':'brief'); }catch(_){}
        try{ window._nvSet(false); }catch(_){}   // the ring never survives a mode flip
        try{ navigator.vibrate&&navigator.vibrate(30); }catch(_){}
        return;
      }
      _nvRAF=requestAnimationFrame(_holdTick);
    };
    if(ng){
      ng.addEventListener('pointerdown', function(e){
        _nvFired=false; _nvId=e.pointerId; _nvT0=performance.now(); _nvX=e.clientX; _nvY=e.clientY;
        _nvHold=true; _nvRAF=requestAnimationFrame(_holdTick);
      });
      window.addEventListener('pointermove', function(e){
        if(_nvHold && e.pointerId===_nvId && Math.hypot(e.clientX-_nvX, e.clientY-_nvY)>12){
          _nvHold=null; cancelAnimationFrame(_nvRAF); _nvRingReset();
        }
      });
      var _nvEnd=function(e){
        if(e.pointerId!==_nvId) return;
        var held=_nvHold; _nvHold=null; _nvId=null;
        cancelAnimationFrame(_nvRAF); _nvRingReset();
        if(_nvFired){ _nvFired=false; return; }          // the 3s flip consumed this press
        if(held && e.type==='pointerup') _nvSet(!_nvOpen);   // short press = toggle the ring
      };
      window.addEventListener('pointerup', _nvEnd);
      window.addEventListener('pointercancel', _nvEnd);
      ng.addEventListener('click', function(e){ e.preventDefault(); });   // pointerup owns it
    }
    // outside press: close the ring AND swallow that tap before the canvas turns
    // it into a selection (capture phase beats m3's pointerdown; tapAtScreen
    // consumes the flag; window pointerup clears it so a swallowed DRAG never
    // poisons the next gesture).
    document.addEventListener('pointerdown', function(e){
      if(_nvOpen && e.target && e.target.closest && !e.target.closest('#navDock') && !e.target.closest('#navRow')){
        _nvSet(false); GlobeState._navSwallow=true;
      }
    }, true);
    window.addEventListener('pointerup', function(){ setTimeout(function(){ GlobeState._navSwallow=false; },0); });
    document.addEventListener('keydown', function(e){
      if(e.key!=='Escape') return;
      if(_nvOpen){ _nvSet(false); return; }
      try{
        const cc=document.getElementById('calloutCard');
        if(cc && !cc.hidden) selectSite(null);              // parity with the callout's ✕
      }catch(_){}
    });
    document.addEventListener('keydown', function(e){
      var ae=document.activeElement;
      var typing=!!(ae && (ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'||ae.isContentEditable));
      var k=(e.key==='k'||e.key==='K') && (e.metaKey||e.ctrlKey);
      var slash=e.key==='/' && !e.metaKey && !e.ctrlKey && !e.altKey && !typing;
      if(!k && !slash) return;
      var si=document.getElementById('searchInput');
      if(si){ si.focus(); try{ si.select(); }catch(_){} e.preventDefault(); }
    });
    document.addEventListener('click', function(e){
      if(!e.target||!e.target.closest) return;
      // BACK = undo one step (owner law): restore the last camera+selection
      // snapshot. Stays OPEN — undo invites repeats.
      if(e.target.closest('#navSat-back')){
        try{
          var st=(GlobeState._undo||[]).pop();
          if(st){
            // kill any live camera writer FIRST — a fly tween or flick-glide
            // would silently re-steer the restored camera (audit finding 1)
            try{ cameraCancel(); }catch(_){}
            GlobeState._gliding=false; GlobeState._velDX=0; GlobeState._velDY=0; GlobeState.spin=false;
            GlobeState.yaw=st.yaw; GlobeState.pitch=st.pitch; GlobeState.zoom=st.zoom;
            try{ if(typeof _rebuildGlobeQ==='function') _rebuildGlobeQ(); }catch(_){}
            try{ globeMark(); }catch(_){}
            if(st.sel!=null && siteById(st.sel)) selectSite(st.sel, {keepCam:true, noUndo:true});
            else selectSite(null, {noUndo:true});
            try{ var wantBrief=!!st.brief, isBrief=document.body.classList.contains('brief-mode');
              if(wantBrief!==isBrief) setMode(wantBrief?'brief':'map'); }catch(_){}
          }
        }catch(_){}
        _nvSet(true); return; }
      if(e.target.closest('#navSat-clear')){ _nvSet(false); try{ clearAll(); }catch(_){} return; }
      // ZOOM ± stay open — the ring is a zoom rocker while it's out.
      if(e.target.closest('#navSat-zoomout')){
        try{ GlobeState._touched=true; GlobeState.zoom=Math.max(1.0, GlobeState.zoom/1.45); globeMark(); }catch(_){}
        _nvSet(true); return; }
      if(e.target.closest('#navSat-zoomin')){
        try{ GlobeState._touched=true; GlobeState.zoom=Math.min(28, GlobeState.zoom*1.45); globeMark(); }catch(_){}
        _nvSet(true); return; }
      if(e.target.closest('#navSat-saved')){ _nvSet(false); try{ _svOpenSheet(); }catch(_){} return; }
      if(e.target.closest('#navSat-layers')){ _nvSet(false);
        try{
          var p=document.getElementById('legendPanel');
          if(p){ if(p.hidden) renderLegend(); p.hidden=!p.hidden; }
        }catch(_){} return; }
    });
  }catch(_){}

  // MAINTENANCE SHEET (v0.8.0: the ⋯ tile is gone — long-press the wordmark).
  // version · records backup/restore · diagnostics · site count. Layers moved
  // to the globe button's ring (it's map control, not maintenance).
  try{
    window._renderAppMenu=function(){
      var m=document.getElementById('appMenu'); if(!m) return;
      var _rn=0; try{ for(var k in RECORDS) _rn+=recCount(k); }catch(_){}
      m.innerHTML='<div class="am-row am-ver">A-ORG-2 '+APP_VERSION+' · '+APP_UPDATED+'</div>'
        +'<button class="am-row" type="button" data-am="backup">Back up records ('+_rn+')</button>'
        +'<button class="am-row" type="button" data-am="restore">Restore records</button>'
        +'<button class="am-row" type="button" data-am="diag">Diagnostics</button>'
        +'<div class="am-row am-ver">'+((typeof SITES!=='undefined'&&SITES)?SITES.length:0)+' sites</div>';
    };
    // long-press (600ms) on the wordmark — the quiet maintenance door; a plain
    // tap does nothing (the mark is identity, not a control).
    var wm=document.getElementById('wordmark');
    if(wm && !wm.__amWired){ wm.__amWired=1;
      var _amT=null, _amX=0, _amY=0;
      wm.addEventListener('pointerdown', function(e){
        _amX=e.clientX; _amY=e.clientY;
        clearTimeout(_amT);
        _amT=setTimeout(function(){
          var m=document.getElementById('appMenu'); if(!m) return;
          _renderAppMenu(); m.hidden=false;
        }, 600);
      });
      window.addEventListener('pointermove', function(e){
        if(_amT && Math.hypot(e.clientX-_amX, e.clientY-_amY)>12){ clearTimeout(_amT); _amT=null; }
      });
      ['pointerup','pointercancel'].forEach(function(ev){
        window.addEventListener(ev, function(){ clearTimeout(_amT); _amT=null; });
      });
    }
    document.addEventListener('click', function(e){
      if(!e.target||!e.target.closest) return;
      var d=e.target.closest('[data-am="diag"]');
      if(d){ try{ window._diagDump&&_diagDump(); }catch(_){} var m=document.getElementById('appMenu'); if(m) m.hidden=true; return; }
      var bk=e.target.closest('[data-am="backup"]');
      if(bk){ try{ recBackup(); }catch(_){} var m2=document.getElementById('appMenu'); if(m2) m2.hidden=true; return; }
      var rst=e.target.closest('[data-am="restore"]');
      if(rst){
        var m3=document.getElementById('appMenu'); if(m3) m3.hidden=true;
        try{
          var fi=document.createElement('input'); fi.type='file'; fi.accept='application/json';
          fi.addEventListener('change', function(){
            var f=fi.files&&fi.files[0]; if(!f) return;
            var rd=new FileReader();
            rd.onload=function(){ try{
              var n=recRestore(JSON.parse(String(rd.result)));
              try{ _errToast(n?('records restored for '+n+' org'+(n===1?'':'s')):'no records found in that file'); }catch(_){}
            }catch(err){ try{ _errToast('restore failed: '+err.message); }catch(_){} } };
            rd.readAsText(f);
          });
          fi.click();
        }catch(_){}
        return; }
      var m=document.getElementById('appMenu');
      if(m&&!m.hidden&&!e.target.closest('#appMenu')&&!e.target.closest('#wordmark')) m.hidden=true;
    });
  }catch(_){}

  // Identity is COMMITTED (owner, 20 Aug): Clean Cartography — the Atlas token
  // set in :root is THE look. The mockup switcher and the slate/field candidate
  // blocks were retired to git history @ v0.1.1; --world-glow survives as a token.
  document.documentElement.setAttribute('data-app-theme','lumen');


  // DIAGNOSTICS TOAST (PORT of A-ORG-1 ~L13977): uncaught errors + rejections
  // self-report with real details; capture lives in the first-byte head script.
  try{
    window._errToast=function(msg){
      try{
        let t=document.getElementById('errToast');
        if(!t){ t=document.createElement('div'); t.id='errToast';
          t.addEventListener('click',function(){ t.classList.remove('show'); });
          document.body.appendChild(t); }
        t.textContent='⚠ '+String(msg).slice(0,220);
        t.classList.add('show');
        clearTimeout(window.__errT); window.__errT=setTimeout(function(){ t.classList.remove('show'); }, 9000);
      }catch(_){}
    };
    // replay anything the first-byte layer logged before the toast attached
    try{ (window.__errLog||[]).slice(-1).forEach(function(e){ window._errToast(e.m+((e.s||e.l)?(' @ '+((e.s||'').split('/').pop()||'inline')+(e.l?(':'+e.l):'')):'')); }); }catch(_){}
  }catch(e){}

  // Diagnostics dump — now a ⋯ menu row (the version chip retired with the law;
  // the ring buffer + capture spine are untouched).
  window._diagDump=function(){
    const L=window.__errLog||[];
    const txt=L.length? L.map(function(e){ return '['+e.k+'] '+e.m+'\n  @ '+(e.s||'inline')+':'+e.l+':'+e.c+(e.st?('\n  '+e.st.split('\n').slice(0,3).join(' | ')):''); }).join('\n\n') : 'No errors captured this session.';
    try{ prompt('Diagnostics — last '+L.length+' error(s). Copy below:', txt.slice(0,900)); }
    catch(_){ alert(txt.slice(0,900)); }
  };

  // Sandbox banner (PORT of A-ORG-1 ~L22198): preview hosts announce themselves
  // so host console noise is never mistaken for an A-ORG-2 defect.
  try{
    if(window.__SANDBOX && !document.getElementById('sbxNote')){
      const nb=document.createElement('div'); nb.id='sbxNote';
      nb.innerHTML='⧉ <b>Preview sandbox</b> — host console noise is expected here and does not come from A-ORG-2. Test the deployed app for real signals. <button aria-label="Dismiss">✕</button>';
      nb.querySelector('button').addEventListener('click', function(){ nb.remove(); });
      document.body.appendChild(nb);
    }
  }catch(_){}
}
bootShell();
