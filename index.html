<!DOCTYPE html>

<!-- PWA / installable-app support -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#060504">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="icon" type="image/png" href="icon-192.png">
<script>
/* A-ORG-2 first-byte diagnostics (PORTED from A-ORG-1, its first <script> — the
   diagnostics stack is load-bearing, never remove): captures every error/rejection
   from byte one, ring-buffered at window.__errLog; the styled toast attaches later
   and replays. __SANDBOX detects preview/iframe hosts so their boundary noise is
   logged but not toasted, and the service worker stays unregistered there. */
(function(){
  window.__SANDBOX=(function(){
    try{ if(window.top!==window) return true; }catch(_){ return true; }
    try{ if(window.origin==='null' || location.protocol==='blob:' || location.protocol==='data:' || location.protocol==='file:') return true; }catch(_){}
    return false;
  })();
  window.__errLog=[];
  function log(kind, msg, src, line, col, stack){
    try{
      const hostNoise = window.__SANDBOX && kind==='err' && /^Script error\.?$/.test(String(msg||'')) && !src && !line;
      window.__errLog.push({t:Date.now(), k:hostNoise?'host':kind, m:String(msg||'').slice(0,300), s:String(src||'').slice(0,200), l:line||0, c:col||0, st:String(stack||'').slice(0,500)});
      if(window.__errLog.length>10) window.__errLog.shift();
      if(hostNoise) return;   // preview-host boundary noise: logged, not toasted
      if(window._errToast){
        var at=(src?String(src).split('/').pop():'')||'';
        window._errToast(msg+((at||line)?(' @ '+(at||'inline')+(line?(':'+line):'')):''));
      }
    }catch(_){}
  }
  window.addEventListener('error', function(ev){
    var e=ev.error||{};
    log('err', ev.message, ev.filename||e.sourceURL||'', ev.lineno||e.line||0, ev.colno||e.column||0, e.stack||'');
  }, true);
  window.addEventListener('unhandledrejection', function(ev){
    var r=ev.reason||{};
    log('rej', r.message||r, r.sourceURL||'', r.line||0, r.column||0, r.stack||'');
  });
})();
</script>
<script>
  // Service worker registration (PORTED from A-ORG-1's v13.13.0 auto-update
  // contract): register on load — never in a sandbox — then check for a new
  // sw.js on load, on every return to the app, and every 20 minutes; when a new
  // version takes control (sw.js already skipWaiting+claims) the page reloads
  // itself once. If the user is mid-typing, the reload waits until they leave
  // the field or background the app.
  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      if(window.__SANDBOX) return;
      navigator.serviceWorker.register('sw.js').then(function(reg){
        var kick=function(){ try{ reg.update(); }catch(_){ } };
        setTimeout(kick, 6000);
        setInterval(kick, 20*60*1000);
        document.addEventListener('visibilitychange', function(){
          if(document.visibilityState==='visible') kick();
        });
      }).catch(function(){});
      var hadCtrl=!!navigator.serviceWorker.controller;
      navigator.serviceWorker.addEventListener('controllerchange', function(){
        if(!hadCtrl){ hadCtrl=true; return; }          // first install claiming — not an update
        if(window.__updReloading) return; window.__updReloading=true;
        var go=function(){ try{ location.reload(); }catch(_){ } };
        try{ if(typeof window.toast==='function') window.toast('Updating to the latest version…'); }catch(_){}
        var ae=document.activeElement;
        var typing=!!(ae && (ae.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)));
        if(typing){
          var done=false, fin=function(){ if(done) return; done=true; go(); };
          document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') fin(); }, {once:true});
          ae.addEventListener('blur', function(){ setTimeout(fin, 400); }, {once:true});
        } else setTimeout(go, 650);
      });
    });
  }
</script>
<style>
/* Integration inlines the RAW CONTENTS of modules/s1-tokens.css over the marker
   line below — this <style> element is the wrapper; do not add another. */
/* ═══════════════════════════════════════════════════════════════════════════════
   modules/s1-tokens.css — A-ORG-2 S1: canonical tokens (ARCTIC :root defaults)
   + the base component layer (glass recipes, chrome placement, focus, desktop).

   CONTRACT (canonical token names — themes swap VALUES only, never names):
     --ground --panel --panel-2 --line --text --dim --faint
     --accent --accent-deep --accent-wash --signal --signal-wash --danger --ok
     --t1 --t2 --t3 --t4          (brief tier law — see LOCKED SEMANTICS below)
     --r-card --r-chip --r-pill   (radii, ported from A-ORG-1 P1 tokens ~L92)
     --disp --body --mono         (system font stacks only — no webfonts at boot)
   The identity layer below :root holds no overrides — ORBIT is the one look.
   overrides. Default theme is arctic; these :root values ARE arctic, so
   (ATLAS is also the :root default; its block is inlined anyway — one source of truth.)

   LOCKED SEMANTICS (brief tier law, inherited from A-ORG-1 non-negotiable #6):
     --t1 white-family · --t2 cool (NEVER green) · --t3 warm · --t4 rose.
     No green on brief data. --ok exists for status affordances only.

   PORTED IDIOMS (A-ORG-1 index.html is source of truth):
     radii --r-pill/999 --r-chip/11 --r-card/16       (~L92-95)
     box reset + overscroll discipline                 (~L113-120)
     liquid-glass material (gradient + hairline ring + specular top edge + deep
     soft drop + accent under-glow), DESIGN-DOCTRINE "Material standard v13.7"
     #errToast / #errToast.show                        (~L2108-2109, ~L2139)
     focus-visible outline idiom                       (~L4890)
     phone-first: desktop ONLY inside @media(min-width:1100px); hovers are
     desktop-only; mobile gets springy :active presses; motion dies under
     prefers-reduced-motion                            (DESIGN-DOCTRINE)

   RELIABILITY CONTRACT HONORED:
     - NO position:fixed anywhere. body is the 100dvh non-scrolling anchor and
       all chrome floats position:absolute inside it (deviation from A-ORG-1,
       whose #errToast/#appTabs were fixed — equivalent here because the globe
       IS the page and body never scrolls).
     - NO transforms on scroll containers: #searchResults and #dossier (the two
       overflow:auto surfaces) are positioned with inset math only. The only
       transforms below are on non-scrolling buttons (:active spring) and the
       toast — never on anything that scrolls.
   ═══════════════════════════════════════════════════════════════════════════════ */

/* ─── 1 · TOKENS — ARCTIC is the :root default ─────────────────────────────── */
:root{
  /* ═══ LUMEN — the committed identity (owner, 20 Aug: "illuminated light
     yellow with black background"). A black world lit from within: warm-lit
     continents, bright gold coasts, luminous yellow voice. Not radar — no
     green, no scope; light does the work. ═══ */
  --ground:#060504;                       /* true black, warm hint               */
  --panel:#14110A;                        /* raised glass                        */
  --panel-2:#1C1810;                      /* second step                         */
  --line:rgba(240,220,140,.16);           /* warm hairline                       */
  --text:#F5F1E4;                         /* warm white ink                      */
  --dim:#C4BBA4;
  --faint:#9C947E;                        /* 5.85:1 worst case                   */
  --safe-l:calc(env(safe-area-inset-left,0px) + 12px);
  --safe-r:calc(env(safe-area-inset-right,0px) + 12px);
  --accent:#F5D76E;                       /* the illuminated yellow — selection/live */
  --accent-rgb:245,215,110;               /* the same light, for rgba() glows (LCD) */
  --accent-deep:#D4B54A;
  --accent-wash:rgba(245,215,110,.13);
  --signal:#FFB35C;                       /* lineage/attention — warmer, orange lean */
  --signal-wash:rgba(255,179,92,.14);
  --danger:#FF7A66;
  --ok:#58C08A;                           /* status only — NEVER on brief data   */
  /* brief tiers (LOCKED: t1 white · t2 cool NEVER green · t3 warm · t4 rose) */
  --t1:#FFFFFF; --t2:#6FC7E8; --t3:#FFC95C; --t4:#FF8FC0;
  --r-card:16px; --r-chip:11px; --r-pill:999px;
  --disp:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  --body:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  --mono:ui-monospace,'SF Mono','Cascadia Mono','Segoe UI Mono',Menlo,Consolas,monospace;
  --glass-hi:rgba(26,22,14,.9);
  --glass-lo:rgba(8,7,4,.95);
  --spec:rgba(255,240,200,.09);
  --drop:0 10px 26px -10px rgba(0,0,0,.7);
  /* world paint (v0.8.0 owner: NO overcast — the wash and the limb halo were
     A-ORG-1 carryovers and are gone). True-black space, near-black land a
     whisper above the ocean, bright gold linework carries the whole map. */
  --ocean-hi:#080706;
  --ocean-lo:#030302;
  --land:17,14,9;
  --coast:240,220,140;
  --world-glow:0;
}

/* ─── 2 · RESET + THE STAGE (the globe IS the page) ────────────────────────── */
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%; background:var(--ground)}
html,body{margin:0; padding:0; overscroll-behavior:none; -webkit-text-size-adjust:100%}
body{
  position:relative;                       /* the ONLY positioning anchor — all
                                              chrome is absolute in here; nothing
                                              is position:fixed (reliability)    */
  width:100%; height:100vh; height:100dvh;
  overflow:hidden;                         /* the page never scrolls — full-bleed */
  background:var(--ground); color:var(--text);
  font-family:var(--body);
  -webkit-tap-highlight-color:transparent;
}
::selection{background:var(--accent-wash); color:var(--text)}

/* full-bleed stage: #globeCanvas fills the viewport between a minimal top edge
   (the search pill floats over it) and nothing. Radius law lives in globeMetrics:
   R = min(w,h)/2 * GlobeState.zoom * GlobeState.baseK (0.72 phone / 0.88 desktop). */
#globeCanvas{
  position:absolute; inset:0; z-index:0;
  width:100%; height:100%; display:block;
  touch-action:none;                       /* canvas owns its gestures (A-ORG-1
                                              v1.27.3 lesson — never page-scroll
                                              mid-drag)                          */
  background:transparent;                  /* --ground shows through             */
}

/* ─── 3 · LIQUID GLASS RECIPES (pill / chip / card / seg) ──────────────────── */
/* Material standard: gradient + hairline ring + specular top edge + deep soft
   drop. Search, dossier, stage bar, clocks and the theme switch all compose
   from these three recipes — restyle the tokens, never fork the recipe. */
.glass{
  background:linear-gradient(180deg,var(--glass-hi),var(--glass-lo));
  box-shadow:0 0 0 1px var(--line), inset 0 1px 0 var(--spec), var(--drop);
  -webkit-backdrop-filter:blur(14px) saturate(1.3);
  backdrop-filter:blur(14px) saturate(1.3);
}
.pill,.chip{
  appearance:none; -webkit-appearance:none; border:0; margin:0;
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  color:var(--text); text-transform:uppercase;
  user-select:none; -webkit-user-select:none; cursor:pointer;
  transition:transform .12s ease, box-shadow .15s ease, background-color .15s ease;
}
.pill{
  min-height:44px; padding:0 16px; border-radius:var(--r-pill);
  font:700 12px/1 var(--body); letter-spacing:.08em;
}
.chip{
  min-height:38px; padding:0 12px; border-radius:var(--r-chip);
  font:700 11px/1 var(--body); letter-spacing:.06em; color:var(--dim);
}
/* mobile press feel: springy :active (hovers are desktop-only, see §7) */
.pill:active,.chip:active{transform:scale(.96)}
.pill.on,.chip.on{
  color:var(--text);
  background:linear-gradient(180deg,var(--glass-hi),var(--glass-lo)),var(--accent-wash);
  box-shadow:0 0 0 1px var(--accent), inset 0 1px 0 var(--spec), var(--drop);
}
.card{
  border-radius:var(--r-card); padding:14px 16px; color:var(--text);
}
/* segmented control (Globe ⇄ Brief placeholder on #stageBar) */
/* (.seg retired v0.3.0; #modeSeg retired v0.6.0 — mode flips on the nav globe hold) */
/* uppercase micro-label (doctrine: letterspaced, tabular numerals on readouts) */

/* ─── 4 · CHROME PLACEMENT (all absolute — no fixed layers) ────────────────── */
/* z ladder: stage 0 · clocks 10 · stage bar 25 · top edge 20 · results 30 ·
   dossier 40 · errToast 120 · sbxNote 130 (A-ORG-1's toast z, kept). */

/* TITLE BAND — the wordmark alone, top center (v0.8.0: tiles retired; long-press = maintenance) */
#titleBar{
  position:absolute; z-index:22;
  top:calc(env(safe-area-inset-top,0px) + 6px);
  left:var(--safe-l); right:var(--safe-r);
  height:44px; display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:0 2px;
}
#wordmark{
  /* the A-ORG-1 engraved-wordmark voice (900/.34em, consult 2), gold-lit for Lumen */
  margin:0; font:900 17px/1 var(--disp); letter-spacing:.34em; text-indent:.34em;
  color:var(--text); text-align:center; flex:1; white-space:nowrap;
  background:linear-gradient(180deg,#FFFDF2 0%,#FFF6D8 30%,#F5D76E 58%,#B9973E 92%,#D4B54A 100%);
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 1px 0 rgba(0,0,0,.65)) drop-shadow(0 0 12px rgba(var(--accent-rgb),.30));
}
@media(min-width:1100px){ #wordmark{font-size:21px} }
#wordmark{ -webkit-user-select:none; user-select:none; -webkit-touch-callout:none }

/* CHROME YIELDS (v0.8.0 automation): while a gesture is moving the globe, every
   floating surface steps back so the world owns the screen; it breathes back in
   the moment the hand lifts. Pure CSS response to one body flag. */
body.gesturing #titleBar, body.gesturing #searchPill, body.gesturing .clock,
body.gesturing #briefStage, body.gesturing #legendPanel, body.gesturing #calloutCard{opacity:.22; transition:opacity .2s ease}
#titleBar, #searchPill, .clock, #briefStage, #legendPanel{transition:opacity .3s ease}

/* SEARCH — standalone, one job, search-engine calm */
#searchPill{
  position:absolute; z-index:20;
  bottom:calc(env(safe-area-inset-bottom,0px) + 96px);   /* v0.14.0: thumb reach — clear of the globe button */
  left:max(var(--safe-l), calc(50% - 300px)); right:max(var(--safe-r), calc(50% - 300px));
  display:flex; align-items:center; gap:10px;
  min-height:48px; padding:0 18px; border-radius:var(--r-pill);
}
#searchPill .sp-ico{color:var(--faint); line-height:0; flex:none}
#searchPill input{
  flex:1; min-width:0; background:none; border:0; outline:none; padding:0;
  color:var(--text); font:600 16px/1.2 var(--body);   /* 16px kills the iOS focus-zoom (A-ORG-1 usInput law) */
}
#searchPill input::placeholder{color:var(--faint)}
#searchPill:focus-within{box-shadow:0 0 0 1.5px var(--accent), inset 0 1px 0 var(--spec), var(--drop)}
#appMenu{
  position:absolute; z-index:45; right:var(--safe-r);
  top:calc(env(safe-area-inset-top,0px) + 54px);
  width:min(78vw,260px); padding:6px; border-radius:var(--r-card);
}
.am-row{
  display:block; width:100%; border:0; background:none; margin:0; cursor:pointer; text-align:left;
  padding:13px 12px; border-radius:9px; color:var(--text); font:600 12.5px/1.3 var(--body);
}
.am-row:active{background:var(--accent-wash)}
.am-row.am-ver{color:var(--faint); font:600 10.5px/1.4 var(--mono); letter-spacing:.08em; text-transform:uppercase; cursor:default}

/* search results — SCROLL CONTAINER: inset math only, never transformed */
#searchResults{
  position:absolute; z-index:30;
  bottom:calc(env(safe-area-inset-bottom,0px) + 144px);   /* opens UPWARD, flush on the pill */
  left:max(var(--safe-l), calc(50% - 300px)); right:max(var(--safe-r), calc(50% - 300px));
  max-height:44vh; max-height:48dvh;
  overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
  border-radius:var(--r-card); padding:4px;
}
#searchResults:empty{display:none}
/* row recipe for the search owner (module fills; shell only styles) */
#searchResults .sr-row{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  width:100%; min-height:44px; padding:10px 12px;
  appearance:none; -webkit-appearance:none; border:0; background:none; margin:0;
  border-radius:var(--r-chip); text-align:left; cursor:pointer;
  color:var(--text); font:600 13px/1.3 var(--body);
}
#searchResults .sr-row + .sr-row{box-shadow:0 -1px 0 var(--line)}
#searchResults .sr-row:active{background:var(--accent-wash)}
#searchResults .sr-sub{color:var(--dim); font:500 11px/1.3 var(--body)}
#searchResults .sr-none{padding:12px 14px; color:var(--dim); font:500 13px/1.5 var(--body)}
#searchResults .sr-count{padding:6px 14px 8px; color:var(--faint); font:600 10.5px/1 var(--mono); letter-spacing:.08em; text-transform:uppercase}

/* DOCK 3 · context sheet — one card, three detents. SCROLL CONTAINER:
   inset math only, never transformed. */
#dossier{
  position:absolute; z-index:40;
  left:calc(var(--safe-l) - 4px); right:calc(var(--safe-r) - 4px);
  bottom:calc(env(safe-area-inset-bottom,0px) + 8px);
  overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
  border-radius:var(--r-card); padding:6px 16px 14px;
}
#dossier::after{content:''; display:block; height:96px}  /* rows rest above the globe button */
#dossier.dz-peek{max-height:112px; overflow:hidden}
#dossier.dz-peek.fan-open{max-height:208px}   /* the ⊕ rail needs its spring room */
/* fan out = card UP: while the rail is sprung, the whole card lifts clear of
   the globe button's circle — no pop-out can hide under the FAB at ANY width
   (audit: ▤ was unreachable at ≤360px when the card sat in the FAB band) */
#dossier.fan-open{bottom:calc(env(safe-area-inset-bottom,0px) + 122px)}
#dossier.dz-peek::after{content:''; position:absolute; left:0; right:0; bottom:0; height:26px;
  background:linear-gradient(180deg, rgba(0,0,0,0), var(--glass-lo)); pointer-events:none;
  border-radius:0 0 var(--r-card) var(--r-card)}
#dossier.dz-half{max-height:46vh; max-height:46dvh}
#dossier.dz-full{top:calc(env(safe-area-inset-top,0px) + 8px); max-height:none}
.sh-grip{
  appearance:none; -webkit-appearance:none; border:0; background:none; margin:0; cursor:pointer;
  display:block; width:100%; height:26px; padding:0;
}
.sh-grip span{display:block; width:38px; height:4px; border-radius:2px; background:rgba(240,220,140,.35); margin:0 auto}
.sh-crumbs{display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; padding-bottom:8px}
.sh-crumbs::-webkit-scrollbar{display:none}
.sh-crumb{
  appearance:none; -webkit-appearance:none; border:0; margin:0; cursor:pointer;
  flex:none; max-width:44vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  padding:12px 13px; border-radius:var(--r-pill); background:var(--panel-2);
  font:700 11px/1 var(--body); color:var(--dim);
}
.sh-crumb.tip{color:var(--text); box-shadow:0 0 0 1.5px var(--accent)}
.sh-crumb:active{background:var(--accent-wash)}

/* NAV DOCK — the centerpiece globe button; the ring hides inside it.
   Satellites pop as small symmetric circles on an arc above the button. */
#navDock{
  position:absolute; z-index:44; left:50%; transform:translateX(-50%);
  bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
  width:0; height:0;                                  /* children position from this point */
}
#navGlobe{
  appearance:none; -webkit-appearance:none; border:0; margin:0; cursor:pointer;
  position:absolute; left:-34px; bottom:0; width:68px; height:68px; border-radius:50%;
  background:linear-gradient(180deg,var(--glass-hi),var(--glass-lo));
  box-shadow:0 0 0 1.5px var(--accent), inset 0 1px 0 var(--spec), var(--drop);
  color:var(--accent); display:flex; align-items:center; justify-content:center;
  touch-action:none; user-select:none; -webkit-user-select:none;
}
#nvMark{pointer-events:none; display:block; -webkit-user-drag:none}
#nvRing{position:absolute; inset:1px; pointer-events:none; transform:rotate(-90deg)}
#nvRing circle{stroke:var(--signal); stroke-width:3; stroke-linecap:round; transition:none}
.nv-sat{
  appearance:none; -webkit-appearance:none; border:0; margin:0; cursor:pointer;
  position:relative; width:44px; height:44px; border-radius:50%; padding:0; flex:0 0 auto;
  display:flex; align-items:center; justify-content:center; color:var(--text);
}
.nv-sat:disabled{opacity:.35; cursor:default; pointer-events:none}
/* v0.16.0 — THE CONTROL ROW (owner: the ring's pop-outs go left-to-right under
   the search bar, not a circle, to maximize space). Full-width bar just below
   the search pill; the pill lifts while the row is open so the row sits under it. */
#navRow{
  position:absolute; z-index:43;
  left:max(var(--safe-l),12px); right:max(var(--safe-r),12px);
  bottom:calc(env(safe-area-inset-bottom,0px) + 14px);   /* the globe's own band */
  height:68px;
  display:flex; align-items:center; justify-content:space-between;
  opacity:0; transform:translateY(10px); pointer-events:none;
  transition:opacity .18s ease, transform .18s ease;
}
.nv-side{display:flex; align-items:center; gap:8px}       /* three buttons per side, flanking the globe */
body.nav-open #navRow{opacity:1; transform:none; pointer-events:auto}
body.nav-open #navGlobe{box-shadow:0 0 0 2px var(--accent), 0 0 22px rgba(245,215,110,.35), inset 0 1px 0 var(--spec)}

/* BRIEF MODE — unmistakably a different room: the bar goes solid gold with
   black ink, the page warms, a gold frame bounds the stage, the map chrome
   yields. Same grammar, different light. */
/* THE CHART CARD (v0.7.0 owner reversal: the brief is built ON the globe; the
   tree SUPPLEMENTS it) — a compact floating card of hierarchy chips over the
   full-screen chain globe. Minimize (–) collapses it to a "⌗ CHART" tab. */
#briefStage{display:none}
body.brief-mode #briefStage{
  display:block; position:absolute; z-index:16;
  left:var(--safe-l); top:calc(env(safe-area-inset-top,0px) + 58px);
  width:min(300px, 76vw); max-height:44vh;
  overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
  padding:10px 12px 12px; border-radius:var(--r-card);
  background:linear-gradient(180deg,var(--glass-hi),var(--glass-lo));
  box-shadow:0 0 0 1px var(--line), inset 0 1px 0 var(--spec), var(--drop);
}
body.brief-mode.chart-min #briefStage{

// ---- GlobeState — the shared globe spine (shell-owned; modules consume) --------
// PORTED from A-ORG-1 ~L13906. Orientation is stored as two plain angles — yaw
// (spin around the polar axis) and pitch (latitude tilt) — and the quaternion q is
// rebuilt from them each drag (m3 _rebuildGlobeQ). Pitch is clamped so the globe
// never rolls or flips. A-ORG-2 additions per contract: dirty (the render loop
// redraws ONLY when set — globeMark()), sel (selected site id | null), baseK
// (radius factor: 0.72 phone / 0.88 desktop; R = min(w,h)/2 * zoom * baseK).
const GlobeState = window.GlobeState = {

function _ogBuild(){
  if(window._OG) return window._OG;
  const byId={}, kids={}, atSite={}, eff={};
  for(const o of A1ORGS){ byId[o.id]=o; if(o.parent){ (kids[o.parent]||(kids[o.parent]=[])).push(o); } }
  for(const o of A1ORGS){ if(o.site){ (atSite[o.site]||(atSite[o.site]=[])).push(o); } }
  for(const o of A1ORGS){                       // A-ORG-1 installationForNode law (≤8 hops)
    let c=o, h=0;
    while(c && h<=8){ if(c.site){ eff[o.id]=c.site; break; } c=byId[c.parent]; h++; }
  }
  const hostsCmd=new Set();
  for(const o of A1ORGS){ if(o.lvl<=3 && o.site) hostsCmd.add(o.site); }
  return (window._OG={byId:byId, kids:kids, atSite:atSite, eff:eff, hostsCmd:hostsCmd});
}
function orgOf(id){ return _ogBuild().byId[id]||null; }
function ogKids(id){ return _ogBuild().kids[id]||[]; }
function ogEffSite(id){ return _ogBuild().eff[id]||null; }
function ogAtSite(siteId){ return _ogBuild().atSite[siteId]||[]; }
// the site's PRIMARY org: lowest level wins, source order breaks ties
function ogPrimary(siteId){
  const a=ogAtSite(siteId); if(!a.length) return null;
  let b=a[0]; for(const o of a){ if(o.lvl<b.lvl) b=o; } return b;
}
// UP the reporting chain: [parent, grandparent, … hqda] — cycle-guarded
function ogChainUp(id){
  const out=[]; const seen=new Set([id]);
  let c=orgOf(id);
  while(c && c.parent && !seen.has(c.parent)){
    seen.add(c.parent); c=orgOf(c.parent); if(c) out.push(c);
  }
  return out;
}

// m1-geom.js — A-ORG-2 M1 sphere math + canvas metrics (PORTED from A-ORG-1)
//
// Ported from A-ORG-1 index.html (source of truth — math survived 22 major versions):
//   _qMul            (~L16027)  quaternion product a*b
//   _qNorm           (~L16037)  quaternion normalize
//   _qFromAxisAngle  (~L16039)  axis-angle → quaternion
//   lonLatToVec      (~L16042)  geographic degrees → unit vector [x,y,z]
//   _setGlobeRot     (~L16048)  GlobeState.q → 3x3 rotation matrix _gM (once per frame)
//   _gM / _qFrame    (~L13922)  per-frame rotation matrix + the quaternion it came from
//   _projectLonLat   (~L16069)  lon/lat → [screenX, screenY, depth]
//   _projectVec      (~L16078)  precomputed unit vector → [screenX, screenY, depth]
//   globeMetrics     (~L16751)  canvas metrics: DPR clamp 2, backing-store sync,
//                               radius law R = min(w,h)/2 * zoom * baseK (0.72 fallback)
//
// DEVIATIONS (everything changed vs. A-ORG-1, and why):
//   1. _visibleLonLat(lon, lat, tol) is NEW-NAMED: A-ORG-1 has no named front-hemisphere
//      test — the gate is inline everywhere (drawGlobePath: rz>=0; marker loop: p[2]<0 →
//      skip; arc paths: v[2] >= -0.02 limb tolerance). This function is that exact inline
//      math (depth = _gM row 3 · vec) hoisted behind a name so M1+ callers stop
//      re-deriving it. tol defaults to 0 (the strict dot/ring gate); pass 0.02 to get the
//      arcs' limb tolerance. Depth sign convention unchanged: >= 0 faces the viewer.
//   2. No inverse projection is ported because NONE EXISTS in A-ORG-1: picking hit-tests
//      the forward-projected marker cache (GlobeState._screen) — handleGlobeTap
//      (~L17893) — never a screen→lon/lat unproject. Do not invent one here.
//   3. _setGlobeRot keeps its legacy (rotLon, rotLat) signature UNUSED, exactly as in
//      A-ORG-1: orientation comes solely from GlobeState.q. Callers pass anything.
//   4. NOT ported here (owned by other M1 files, kept out to avoid duplicate top-level
//      declarations at concatenation): GlobeState literal, _rebuildGlobeQ /
//      _faceLonLatAngles / applyDrag (interaction), drawGlobePath /
//      latRing / lonRing (render loop), GLOBE_RINGS data.
//
// CONTRACTS HONORED:
//   - Reads GlobeState.{q, zoom, baseK} at CALL time only — concatenation-order safe;
//     no DOM beyond the canvas param of globeMetrics; zero rendering; no per-frame work
//     here (render loop redraws only on GlobeState.dirty — that gate lives elsewhere).
//   - Plain sloppy-mode JS: top-level function declarations, no ES modules, no classes.
//   - Screen mapping is A-ORG-1's exact [cx - rx*R, cy - ry*R] (both axes negated) —
//     this is what makes east-right / north-up true under _rebuildGlobeQ's quaternion
//     convention. Do not "fix" the signs.
// ═══════════════════════════════════════════════════════════════════════════════

// ---- Per-frame rotation matrix (quaternion expanded once per frame; hot loops do
//      9 mults per vertex, no trig, no gimbal lock) ----
let _qFrame=[0,0,0,1];

// ---- Quaternion helpers (minimal) ----
function _qMul(a,b){ // a*b

// globeMark() is declared by m3-input (the documented owner) — the m2 copy was removed at M1 final verify (duplicate top-level declaration).

const _latRingCache={}, _lonRingCache={};

function startGlobeLoop(cv){
  const ctx=cv.getContext('2d');
  GlobeState.dirty=true;
  let last=performance.now();
  function frame(now){
    try{ GlobeState.__lastF=performance.now(); }catch(_){}
    if(!cv.isConnected){ GlobeState.raf=null; return; }
    if(cv.offsetParent===null && cv.getClientRects().length===0){
      GlobeState.raf=requestAnimationFrame(frame); return;   // hidden → idle, don't draw
    }
    const dt=Math.min(64, now-last); last=now;
    // Momentum glide — m3 owns the integrator (globeGlideStep sets dirty itself,
    // so the dirty-gate law holds; the inline duplicate this replaced was flagged
    // at M1 verify as a constants fork waiting to drift).
    if(typeof globeGlideStep==='function') globeGlideStep(dt);
    // pulse redraw throttled: idle loop breathes at ~14fps instead of every frame.
    // (A-ORG-1 kept this inside drawGlobeMarkers next to the selection pulse; m5 owns
    // markers here, so the loop re-marks dirty while a site is selected — deviation 3.)
    if(GlobeState.sel!=null){
      if(!GlobeState._lp || performance.now()-GlobeState._lp>70){ GlobeState.dirty=true; GlobeState._lp=performance.now(); }
    }
    if(GlobeState.dirty){ drawGlobe(cv, ctx); GlobeState.dirty=false;
      try{ if(window._coTrack) _coTrack(); }catch(_){}   // the callout rides its dot
    }
    GlobeState.raf=requestAnimationFrame(frame);
  }
  if(GlobeState.raf) cancelAnimationFrame(GlobeState.raf);
  GlobeState.raf=requestAnimationFrame(frame);
}

// globeMetrics(cv) is declared by m1-geom (the documented owner) — the m2 copy was removed at M1 final verify (later hoist was silently winning).

function drawGlobe(cv, ctx){
  const m=globeMetrics(cv);
  GlobeState.__mCss=m;                                  // css-px metrics for DOM anchors (callout)
  _setGlobeRot(GlobeState.rotLon, GlobeState.rotLat);   // camera matrix once per frame
  ctx.setTransform(m.dpr,0,0,m.dpr,0,0);
  ctx.clearRect(0,0,m.w,m.h);
  // v14.2.0 ATMOSPHERE — a soft limb glow ringing the sphere so the hero reads as a
  // lit body, not a flat wireframe. Drawn first; the sphere fills over the inner half,
  // leaving a rim halo. Additive, no geometry change.
  // M1 gate fix: the WORLD wears the theme. Every stroke/fill below derives from the
  // token cache (m5's _mTok — declaration hoisting makes it callable from here); the
  // A-ORG-1 mint literals survive only as fallback triples. The sphere body itself
  // stays a dark instrument under every theme — a deliberate constant, so the light
  // Command Paper chrome reads as a console around a scope, not a washed-out map.
  const W=(typeof _mTok==='function')?_mTok():null;
  const wAcc=(W&&W.accent)||'92,238,210';
  const wCoast=(W&&W.coast)||wAcc, wLand=(W&&W.land)||'64,178,152';
  const wGlow=!!(W&&W.glow);
  if(wGlow){
    // instrument mode (token --world-glow:1) — the A-ORG-1 limb halo survives as an option
    const ag=ctx.createRadialGradient(m.cx,m.cy,m.R*0.88, m.cx,m.cy,m.R*1.20);
    ag.addColorStop(0,'rgba('+wAcc+',0)');
    ag.addColorStop(0.66,'rgba('+wAcc+',.06)');
    ag.addColorStop(0.84,'rgba('+wAcc+',.15)');
    ag.addColorStop(1,'rgba('+wAcc+',0)');
    ctx.beginPath(); ctx.arc(m.cx,m.cy,m.R*1.20,0,Math.PI*2); ctx.fillStyle=ag; ctx.fill();
  }
  const grad=ctx.createRadialGradient(m.cx-m.R*0.3,m.cy-m.R*0.3,m.R*0.2, m.cx,m.cy,m.R);
  grad.addColorStop(0,(W&&W.oceanHi)||'#0f1d1a'); grad.addColorStop(1,(W&&W.oceanLo)||'#091110');   // ocean: theme tokens
  ctx.beginPath(); ctx.arc(m.cx,m.cy,m.R,0,Math.PI*2); ctx.fillStyle=grad; ctx.fill();
  ctx.lineWidth=1.2; ctx.strokeStyle='rgba('+wCoast+','+(wGlow?'.6':'.4')+')'; ctx.stroke();
  // Clip all overlay drawing to the sphere disc (prevents any chord/limb artifacts).
  ctx.save();
  ctx.beginPath(); ctx.arc(m.cx,m.cy,m.R,0,Math.PI*2); ctx.clip();
  ctx.strokeStyle='rgba('+wCoast+','+(wGlow?'.17':'.12')+')'; ctx.lineWidth=0.6;
  for(let lat=-60; lat<=60; lat+=30){ drawGlobePath(ctx,m, latRing(lat)); }
  for(let lon=-180; lon<180; lon+=30){ drawGlobePath(ctx,m, lonRing(lon)); }
  // land: flat print = near-solid paper/slab fill under a quiet coast stroke;
  // glow = the old translucent accent wash under a bright accent line.
  ctx.strokeStyle='rgba('+wCoast+','+(wGlow?'1':'.85')+')'; ctx.lineWidth=(wGlow?1.4:1.0);
  ctx.fillStyle=(W&&W.land)?('rgba('+wLand+',.96)'):(wGlow?('rgba('+wAcc+',.30)'):('rgba('+wLand+',.96)'));
  for(const ring of GLOBE_RINGS){ drawGlobePath(ctx,m, ring, true); }
  // World COUNTRY borders — very thin, dim, global context layer.
  if(GLOBE_COUNTRY_RINGS && GLOBE_COUNTRY_RINGS.length){
    ctx.strokeStyle='rgba('+wCoast+','+(wGlow?'.34':'.30')+')'; ctx.lineWidth=0.55;
    for(const ring of GLOBE_COUNTRY_RINGS){ drawGlobePath(ctx,m, ring, false); }
  }
  // US state borders — thin lines drawn over the land fill (no fill, no glow).
  if(GLOBE_STATE_RINGS && GLOBE_STATE_RINGS.length){
    ctx.strokeStyle='rgba('+wCoast+','+(wGlow?'.62':'.45')+')'; ctx.lineWidth=(wGlow?0.8:0.7);
    for(const ring of GLOBE_STATE_RINGS){ drawGlobePath(ctx,m, ring, false); }
  }
  // m5 owns every marker/label/link/brief overlay (A-ORG-1: drawGlobeMarkers et al).
  if(typeof drawMarkersHook==='function') drawMarkersHook(ctx, m);
  ctx.restore();
}

function latRing(lat){ if(_latRingCache[lat]) return _latRingCache[lat]; const a=[]; for(let lon=-180;lon<=180;lon+=6) a.push([lon,lat]); return (_latRingCache[lat]=a); }

function lonRing(lon){ if(_lonRingCache[lon]) return _lonRingCache[lon]; const a=[]; for(let lat=-90;lat<=90;lat+=6) a.push([lon,lat]); return (_lonRingCache[lon]=a); }

function drawGlobePath(ctx,m,ring,fill){
  // STROKE: each contiguous front-hemisphere run is its own sub-path, so the
  // limb is never stroked. FILL (v0.3.0 fix): one continuous path in which
  // back-hemisphere vertices are CLAMPED TO THE LIMB — the boundary hugs the
  // sphere edge instead of auto-closing with a chord across the disc. Those
  // chords were the owner's "overcast" band: near-invisible under A-ORG-1's
  // faint washes, glaring under Lumen's near-solid land.
  const xyz=_ringXYZ(ring);
  const m00=_gM.m00,m01=_gM.m01,m02=_gM.m02, m10=_gM.m10,m11=_gM.m11,m12=_gM.m12, m20=_gM.m20,m21=_gM.m21,m22=_gM.m22;
  const cx=m.cx, cy=m.cy, R=m.R;
  if(fill){
    let any=false, started=false;
    ctx.beginPath();
    for(let i=0;i<xyz.length;i+=3){
      const x=xyz[i], y=xyz[i+1], z=xyz[i+2];
      const rz=m20*x+m21*y+m22*z;
      let rx=m00*x+m01*y+m02*z, ry=m10*x+m11*y+m12*z;
      let px, py;
      if(rz>=0){ any=true; px=cx-rx*R; py=cy-ry*R; }
      else {
        const L=Math.hypot(rx,ry); if(L<1e-6) continue;   // dead-behind point: no direction
        px=cx-(rx/L)*R; py=cy-(ry/L)*R;
      }
      if(!started){ ctx.moveTo(px,py); started=true; } else ctx.lineTo(px,py);
    }
    if(any && started){ ctx.closePath(); ctx.fill(); }
    if(!any) return;                                     // fully behind: nothing to stroke either
  }
  let run=null;
  const flush=()=>{
    if(run && run.length>=4){
      ctx.beginPath(); ctx.moveTo(run[0],run[1]);
      for(let k=2;k<run.length;k+=2) ctx.lineTo(run[k],run[k+1]);
      ctx.stroke();
    }
    run=null;
  };
  for(let i=0;i<xyz.length;i+=3){
    const x=xyz[i], y=xyz[i+1], z=xyz[i+2];
    // rotate by the per-frame matrix (quaternion-derived)
    const rz=m20*x+m21*y+m22*z;        // depth (toward viewer when >=0)
    if(rz>=0){
      const rx=m00*x+m01*y+m02*z;
      const ry=m10*x+m11*y+m12*z;
      if(!run) run=[];
      run.push(cx-rx*R, cy-ry*R);
    } else { flush(); }
  }
  flush();
}

function _smoothRing(r, iters){
  // Chaikin corner-cutting: rounds the polyline so straight hand-traced
  // segments read as natural coastline. Applied only to the embedded fallback.
  for(let it=0; it<iters; it++){
    const out=[r[0]];
    for(let i=0;i<r.length-1;i++){
      const a=r[i], b=r[i+1];
      out.push([a[0]*0.75+b[0]*0.25, a[1]*0.75+b[1]*0.25]);
      out.push([a[0]*0.25+b[0]*0.75, a[1]*0.25+b[1]*0.75]);
    }
    out.push(r[r.length-1]);
    r=out;
  }
  return r;
}

function smoothFallbackOnce(){
  if(_fallbackSmoothed || _globeLoadedHi) return;
  GLOBE_RINGS = GLOBE_RINGS.map(r=> r.length>=4 ? _smoothRing(r,2) : r);
  _fallbackSmoothed=true;
}

/* ══════════ module: m3-input ══════════ */
// ═══════════════════════════════════════════════════════════════════════════════
// m3-input.js — A-ORG-2 M3 pointer interaction (PORTED from A-ORG-1)
//
// Ported from A-ORG-1 index.html (source of truth — movement feel survived 22 major
// versions; "v1.23.0 movement feel (known-good) on a no-roll yaw+pitch core"):
//   globeMark              (~L13934)  request a redraw (sets GlobeState.dirty)
//   _rebuildGlobeQ         (~L16009)  yaw+pitch → orientation quaternion GlobeState.q
//   _faceLonLatAngles      (~L16017)  set yaw/pitch so (lon,lat) faces the viewer
//   setupGlobeInteraction  (~L16592)  drag-to-orbit (applyDrag), flick velocity,
//                                     tap-vs-drag, double-tap zoom (_dblZoom),
//                                     ctrl/cmd-wheel zoom, two-finger pinch+pan
//   glide block            (~L16733)  momentum glide from startGlobeLoop's frame(),
//                                     hoisted here as globeGlideStep(dt) — see dev 2
//
// OWNERSHIP NOTES (concatenation law — no duplicate top-level declarations):
//   - globeMark and _rebuildGlobeQ/_faceLonLatAngles are DECLARED HERE (m1-geom.js
//     header explicitly deferred the interaction trio to this file; globeMark's first
//     consumer is input). The render module must NOT redeclare them.
//   - Uses (declared elsewhere): GlobeState (shell), _qMul/_qNorm/_qFromAxisAngle/
//     globeMetrics (m1-geom.js), startGlobeLoop (render module, called guarded),
//     tapAtScreen (selection/dossier module hook, called guarded).
//
// DEVIATIONS (everything changed vs. A-ORG-1, and why):
//   1. NO POINTER CAPTURE (reliability contract). A-ORG-1 calls setPointerCapture/
//      releasePointerCapture on the canvas and listens for lostpointercapture; capture
//      is what kept a drag alive once the pointer left the canvas. Here pointermove/
//      pointerup/pointercancel attach to window instead (addEventListener only), and
//      the handlers no-op unless this drag's pointerId is active — same drag-outside-
//      canvas behavior, zero capture API. The lostpointercapture safety-reset is gone
//      with the capture; window pointercancel covers it.
//   2. globeGlideStep(dt) is NEW-NAMED: in A-ORG-1 the glide integrator is an inline
//      block of startGlobeLoop's frame(). The render loop is not this file (exclusive
//      ownership), so the block is hoisted behind a name. The render module MUST call
//      globeGlideStep(dt) once per frame BEFORE its dirty check; the step sets
//      GlobeState.dirty itself, so the redraws-only-when-dirty law holds.
//   3. Glide constants are the CURRENT source's: decay Math.pow(0.94, dt/16.67),
//      stop < 0.005 (the mission brief's grep hooks 0.78 / 0.02 are a pre-Apple-settle
//      version — the source comment at ~L16739 literally says "was 0.78"; source wins).
//   4. Tap fires the M3 hook tapAtScreen(x, y) — canvas-relative px/py, the exact
//      coords A-ORG-1's handleGlobeTap derives from e.clientX/Y minus the canvas rect.
//      handleGlobeTap itself (tips, stack popups, brief taps) is NOT ported: it is
//      selection/dossier UI owned elsewhere; only the hook boundary lives here.
//   5. endPointer's stale-pointer guard is TIGHTENED for the window listeners:
//      A-ORG-1's (e.pointerId!==activeId && activeId!==null) let a pointerup with no
//      active drag fall through to tap logic — harmless when the listener sat on the
//      canvas, but on window it would fire taps for clicks anywhere in the app. Now
//      activeId===null returns early too.
//   6. startGlobeLoop call on release is guarded (typeof) — the render module may not
//      be concatenated yet during construction; A-ORG-1 called it bare.
//   7. GlobeState._lastInteract is NOT touched here (A-ORG-1 sets it in fly-to paths
//      for idle-spin resume; A-ORG-2 has no idle spin). The spin=false /_spinAxis /
//      _spinVel resets in pointerdown ARE kept verbatim so ported state names survive.
//
// CONTRACTS HONORED:
//   - Reads GlobeState at event/call time only — concatenation-order safe. No DOM
//     beyond the canvas passed in (+ window listeners). Plain sloppy-mode JS, no
//     classes, no modules. Nothing here draws; every visual change routes through
//     GlobeState.dirty (globeMark) and the render loop's dirty gate.
//   - Zoom clamps: wheel/pinch Math.max(1.0, Math.min(28, …)), double-tap
//     Math.min(28, z0*2) — span widened 16→28 at v0.8.0 (owner: deeper zoom-in)
//     at-max reset to 2.0. Radius law via GlobeState.baseK (0.72 fallback).
// ═══════════════════════════════════════════════════════════════════════════════

function globeMark(){ GlobeState.dirty=true; }   // request a redraw

// Rebuild the orientation quaternion from yaw + pitch: pitch about the camera X axis, then yaw
// about the world Y (polar) axis. Verified to reach ±90° latitude with north up and no roll.
function _rebuildGlobeQ(){
  GlobeState.q = _qNorm(_qMul(
    _qFromAxisAngle(1,0,0, GlobeState.pitch||0),
    _qFromAxisAngle(0,1,0, GlobeState.yaw||0)
  ));
}

// Set yaw/pitch so geographic (lon,lat) sits at screen center (used by fly-to). Verified:
// yaw = lon-90 and pitch = lat center the point with east-right and north-up in this projection.
function _faceLonLatAngles(lon,lat){
  GlobeState.yaw   = (lon-90)*Math.PI/180;
  GlobeState.pitch =  lat*Math.PI/180;
  const lim=Math.PI/2-0.001;
  GlobeState.pitch=Math.max(-lim,Math.min(lim,GlobeState.pitch));
  _rebuildGlobeQ();
}

function setupGlobeInteraction(cv){
  // ===== v1.23.0 movement feel (known-good) on a no-roll yaw+pitch core. =====
  // Drag left/right spins around the polar axis (yaw); up/down tilts latitude (pitch). We keep
  // yaw & pitch as plain numbers and rebuild the orientation each drag: pitch wraps freely so
  // you can spin continuously over the poles, but the globe never rolls. This is the simplest
  // model that reaches the poles AND keeps north up — no drift, no guards, no lock.
  let activeId=null, lastX=0, lastY=0, lastT=0, sx0=0, sy0=0;
  function applyDrag(dx, dy){
    const R = Math.min(cv.clientWidth, cv.clientHeight)/2 * Math.max(1e-3,GlobeState.zoom) * (GlobeState.baseK||0.72);
    const sensDeg = Math.max(0.02, Math.min(0.5, 57.2958 / R));   /* ~54% of finger speed at rest */
    GlobeState.yaw   = (GlobeState.yaw||0)   - dx * sensDeg * Math.PI/180;   // drag right → turn right
    GlobeState.pitch = (GlobeState.pitch||0) + dy * sensDeg * Math.PI/180;   // drag up → globe follows finger up
    // NO clamp — pitch wraps freely so you can spin continuously over the poles and all the way
    // around, like a real globe. (Keep pitch bounded to ±2π just so the number never grows huge.)
    if(GlobeState.pitch >  Math.PI*2) GlobeState.pitch -= Math.PI*2;
    if(GlobeState.pitch < -Math.PI*2) GlobeState.pitch += Math.PI*2;
    _rebuildGlobeQ();
  }
  cv.addEventListener('pointerdown', e=>{
    if(e.pointerType==='touch' && GlobeState._pinching) return;
    try{ if(typeof cameraCancel==='function') cameraCancel(); }catch(_){}   // user wins over any live fly tween
    activeId=e.pointerId;
    GlobeState.dragging=true; GlobeState.moved=false;
    GlobeState.spin=false; GlobeState._gliding=false;
    GlobeState._spinAxis=null; GlobeState._spinVel=0;
    lastX=e.clientX; lastY=e.clientY; lastT=performance.now(); sx0=e.clientX; sy0=e.clientY;
    GlobeState.dirty=true;
  });
  // Move/up/cancel live on window (NOT the canvas): with pointer capture banned, this is
  // what keeps a drag alive when the pointer leaves the canvas. Handlers no-op unless
  // OUR pointer is mid-drag, so app-wide events cost one compare. (Deviations 1 & 5.)
  window.addEventListener('pointermove', e=>{
    if(!GlobeState.dragging || e.pointerId!==activeId) return;
    if(e.cancelable) e.preventDefault();
    const dx=e.clientX-lastX, dy=e.clientY-lastY;
    if(Math.hypot(e.clientX-sx0, e.clientY-sy0) > (e.pointerType==='touch'?6:3)) GlobeState.moved=true;
    applyDrag(dx, dy);
    // track drag velocity in px/ms for a v1.23.0-style flick glide (smoothed)
    const now=performance.now(); const dt=Math.max(8, now-lastT);
    GlobeState._velDX = 0.7*(dx/dt) + 0.3*(GlobeState._velDX||0);
    GlobeState._velDY = 0.7*(dy/dt) + 0.3*(GlobeState._velDY||0);
    lastX=e.clientX; lastY=e.clientY; lastT=now;
    globeMark();
  }, {passive:false});
  function endPointer(e){
    if(activeId===null || e.pointerId!==activeId) return;   // tightened vs. A-ORG-1 (deviation 5)
    const wasMoved=GlobeState.moved;
    GlobeState.dragging=false; activeId=null;
    let speed=Math.hypot(GlobeState._velDX||0, GlobeState._velDY||0);
    const CAP=1.6;   /* fling cap: a hard flick can't launch a multi-rev spin */
    if(speed>CAP){ const _s=CAP/speed; GlobeState._velDX*=_s; GlobeState._velDY*=_s; speed=CAP; }
    if(wasMoved && speed>0.05 && !GlobeState._pinching){ GlobeState._gliding=true; }
    else { GlobeState._gliding=false; GlobeState._velDX=0; GlobeState._velDY=0; }
    if(!wasMoved && !GlobeState._pinching){
      // Tap-vs-drag already settled (moved thresholds above); now tap-vs-DOUBLE-tap:
      // two stationary releases within 300ms and 24px = double-tap zoom, else a tap.
      const nowT=performance.now();
      if(nowT-(GlobeState._dtT||0)<300 && Math.hypot(e.clientX-(GlobeState._dtX||0), e.clientY-(GlobeState._dtY||0))<24){
        GlobeState._dtT=0; try{ _dblZoom(e); }catch(_){}
      } else {
        GlobeState._dtT=nowT; GlobeState._dtX=e.clientX; GlobeState._dtY=e.clientY;
        // M3 hook boundary: canvas-relative coords, exactly what A-ORG-1's
        // handleGlobeTap derived before hit-testing GlobeState._screen. (Deviation 4.)
        try{
          if(typeof tapAtScreen==='function'){
            const r=cv.getBoundingClientRect();
            tapAtScreen(e.clientX-r.left, e.clientY-r.top);
          }
        }catch(_){}
      }
    }
    GlobeState.dirty=true;
    if(!GlobeState.raf && typeof startGlobeLoop==='function') startGlobeLoop(cv);   // guarded (deviation 6)
  }
  // v15.14.0 double-tap: animated x2 toward the tap point (at max: reset to 2.0, Apple-style)
  function _dblZoom(e){
    try{ if(typeof cameraCancel==='function') cameraCancel(); }catch(_){}   // don't fight a live fly tween
    const m=globeMetrics(cv), r=cv.getBoundingClientRect();
    const ox=(e.clientX-r.left)-m.cx, oy=(e.clientY-r.top)-m.cy;
    // one gesture, one entry: a double-tap ON a marker already pushed via the
    // first tap's select ms ago — don't charge the dive a second Back press
    try{
      const _u=GlobeState._undo, _lastTs=(_u&&_u.length)?(_u[_u.length-1].ts||0):0;
      if(typeof _undoPush==='function' && !(performance.now()-_lastTs<450)) _undoPush();
    }catch(_){}
    const z0=GlobeState.zoom, zT=(z0>=27.9)?2.0:Math.min(28, z0*2);
    const t0=performance.now(), dur=260;
    let zPrev=z0;
    (function step(now){
      const p=Math.min(1,(now-t0)/dur), ez=1-(1-p)*(1-p);
      const z=z0+(zT-z0)*ez, k=z/zPrev; zPrev=z;
      GlobeState.zoom=z;
      if(GlobeState._applyDrag && k!==1) GlobeState._applyDrag(-(k-1)*ox, -(k-1)*oy);
      globeMark();
      if(p<1) requestAnimationFrame(step);
    })(t0);
  }
  // expose applyDrag so the glide loop can reuse the exact same no-roll rotation
  GlobeState._applyDrag = applyDrag;
  window.addEventListener('pointerup', endPointer);
  window.addEventListener('pointercancel', endPointer);

  // ZOOM via wheel: Ctrl/Cmd+wheel (or trackpad pinch) zooms; plain wheel scrolls page.
  cv.addEventListener('wheel', e=>{
    if(!(e.ctrlKey || e.metaKey)) return;               // gesture ownership unchanged
    e.preventDefault();
    try{ if(typeof cameraCancel==='function') cameraCancel(); }catch(_){}   // wheel zoom wins over a live fly
    const m=globeMetrics(cv), r=cv.getBoundingClientRect();
    const ox=(e.clientX-r.left)-m.cx, oy=(e.clientY-r.top)-m.cy;
    const z0=GlobeState.zoom;
    const z1=Math.max(1.0, Math.min(28, z0*Math.exp(-e.deltaY*0.0015)));
    if(z1===z0) return;
    GlobeState.zoom=z1;
    const k=z1/z0;
    if(GlobeState._applyDrag) GlobeState._applyDrag(-(k-1)*ox, -(k-1)*oy);   // zoom dives at the cursor
    globeMark();
  }, {passive:false});

  // ZOOM via two-finger pinch — incremental, focal-anchored, and it PANS (v15.14.0).
  let pinchPrevD=0, pinchPrevX=0, pinchPrevY=0;
  function dist(t){ const dx=t[0].clientX-t[1].clientX, dy=t[0].clientY-t[1].clientY; return Math.hypot(dx,dy); }
  function mid(t){ return [(t[0].clientX+t[1].clientX)/2, (t[0].clientY+t[1].clientY)/2]; }
  cv.addEventListener('touchstart', e=>{
    if(e.touches.length===2){ GlobeState._pinching=true; GlobeState.dragging=false; GlobeState._gliding=false;
      pinchPrevD=dist(e.touches); const c=mid(e.touches); pinchPrevX=c[0]; pinchPrevY=c[1]; }
  }, {passive:true});
  cv.addEventListener('touchmove', e=>{
    if(GlobeState._pinching && e.touches.length===2){
      if(e.cancelable) e.preventDefault();
      const d=dist(e.touches), c=mid(e.touches);
      if(pinchPrevD>0){
        const m=globeMetrics(cv), r=cv.getBoundingClientRect();
        const ox=(c[0]-r.left)-m.cx, oy=(c[1]-r.top)-m.cy;
        const z0=GlobeState.zoom;
        const z1=Math.max(1.0, Math.min(28, z0*(d/pinchPrevD)));
        GlobeState.zoom=z1;
        const k=z1/z0;
        if(GlobeState._applyDrag){
          if(k!==1) GlobeState._applyDrag(-(k-1)*ox, -(k-1)*oy);   // focal anchor
          GlobeState._applyDrag(c[0]-pinchPrevX, c[1]-pinchPrevY); // two-finger pan
        }
        globeMark();
      }
      pinchPrevD=d; pinchPrevX=c[0]; pinchPrevY=c[1];
    }
  }, {passive:false});
  cv.addEventListener('touchend', e=>{
    if(e.touches.length<2 && GlobeState._pinching){ GlobeState._pinching=false; pinchPrevD=0; }
  }, {passive:true});
}

// v1.23.0-style momentum glide, hoisted out of A-ORG-1's startGlobeLoop frame() (deviation 2).
// The render module calls this once per frame with dt (ms, already capped at 64 by the loop)
// BEFORE its dirty check. Keeps applying the released drag velocity through the same no-roll
// rotation (GlobeState._applyDrag), decaying smoothly — reusing applyDrag guarantees the glide
// can't roll the globe either. Sets GlobeState.dirty itself: the redraw law stays dirty-gated.
function globeGlideStep(dt){
  if(GlobeState._gliding && !GlobeState.dragging && !GlobeState._pinching && GlobeState._applyDrag){
    GlobeState._applyDrag((GlobeState._velDX||0)*dt, (GlobeState._velDY||0)*dt);
    const decay=Math.pow(0.94, dt/16.67);   /* was 0.78 — Apple-length settle: half-life ~187ms, ~1s glide */
    GlobeState._velDX*=decay; GlobeState._velDY*=decay;
    if(Math.hypot(GlobeState._velDX||0, GlobeState._velDY||0) < 0.005){ GlobeState._gliding=false; GlobeState._velDX=0; GlobeState._velDY=0; }
    GlobeState.dirty=true;
  }
}

// ---- Camera tween generation token (deviation 1). Every tween entry point bumps it
//      and captures the new value; cameraCancel() bumps it so stale steps go inert. ----
let _camGen=0;

// Cancel any in-flight camera tween (fly, fit, zoom step). m3 calls this on
// pointerdown so a user drag always wins instantly; safe to call when idle.
function cameraCancel(){
  _camGen++;
  GlobeState._fly=false;
}

// (geoAngularSep cut at v0.8.0 with fitGlobeToSites — its only caller.)

// Generalized fly-to: rotate the globe so (lat,lon) faces the viewer and zoom in.
// onArrive (optional) runs when the animation completes (not when cancelled).
// v21.1.0 CINEMATIC flight, ported intact: duration scales with angular distance
// (short hops stay quick, cross-globe travel gets time to read), and long hops
// (>~30°) get a van Wijk-style zoom dip — the camera pulls back mid-flight then
// descends onto the target. Every camera jump in the app routes through here.
function flyToLatLon(lat, lon, zoom, onArrive){
  GlobeState.spin=false; GlobeState._gliding=false;
  const gen=++_camGen;                       // starting a fly cancels any prior tween (deviations 1–2)
  GlobeState._fly=true;
  const startYaw=GlobeState.yaw||0, startPitch=GlobeState.pitch||0, startZ=GlobeState.zoom;
  // Target yaw/pitch that centers (lon,lat) — same convention as _faceLonLatAngles.
  const lim=Math.PI/2-0.001;
  let tgtYaw=(lon-90)*Math.PI/180;
  let tgtPitch=Math.max(-lim,Math.min(lim, lat*Math.PI/180));
  const tgtZ=(zoom!=null?zoom:GlobeState.zoom);
  // take the shortest way around for yaw (wrap to ±π)
  let dYaw=tgtYaw-startYaw;
  dYaw=((dYaw+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI;
  const dist=Math.max(Math.abs(dYaw), Math.abs(tgtPitch-startPitch));
  const dur=550+500*Math.min(1, dist/Math.PI);
  const dip=(dist>0.52)?Math.min(startZ,tgtZ)*0.22:0;
  const t0=performance.now();
  function ease(p){ return p<0.5?2*p*p:1-Math.pow(-2*p+2,2)/2; }
  function step(now){
    if(gen!==_camGen) return;                                    // cancelled (deviation 1)
    if(GlobeState.dragging || GlobeState._pinching){ cameraCancel(); return; }   // user wins
    let p=Math.min(1,(now-t0)/dur); const e=ease(p);
    GlobeState.yaw   = startYaw + dYaw*e;
    GlobeState.pitch = startPitch + (tgtPitch-startPitch)*e;
    GlobeState.zoom  = Math.max(1.05, startZ + (tgtZ-startZ)*e - dip*Math.sin(e*Math.PI));
    _rebuildGlobeQ();
    globeMark();
    if(p<1) requestAnimationFrame(step);
    else{ GlobeState.zoom=tgtZ; GlobeState._fly=false; globeMark(); if(onArrive) onArrive(); }
  }
  requestAnimationFrame(step);
}

// ---- SITES index (parent pointer is the ONLY relationship) ---------------------
let _siteIdx=null, _kidIdx=null, _idxSrc=null;

function _sitesArr(){
  return (typeof SITES!=='undefined' && SITES && SITES.length!=null) ? SITES : [];
}

function _siteIndex(){
  const arr=_sitesArr();
  if(_idxSrc===arr && _siteIdx) return _siteIdx;
  _siteIdx=new Map(); _kidIdx=new Map();
  for(const s of arr){ if(s && s.id!=null) _siteIdx.set(s.id, s); }
  for(const s of arr){
    if(!s || s.parent==null || !_siteIdx.has(s.parent)) continue;
    let L=_kidIdx.get(s.parent); if(!L){ L=[]; _kidIdx.set(s.parent, L); }
    L.push(s);
  }
  _idxSrc=arr;
  return _siteIdx;
}

function siteById(id){ if(id==null) return null; return _siteIndex().get(id)||null; }

  let m=/^#([0-9a-f]{3})$/i.exec(c);
  if(m){ const h=m[1]; return parseInt(h[0]+h[0],16)+','+parseInt(h[1]+h[1],16)+','+parseInt(h[2]+h[2],16); }
  m=/^#([0-9a-f]{6})/i.exec(c);
  if(m){ const h=m[1]; return parseInt(h.slice(0,2),16)+','+parseInt(h.slice(2,4),16)+','+parseInt(h.slice(4,6),16); }
  m=/^rgba?\(\s*([\d.]+)[,\s]+([\d.]+)[,\s]+([\d.]+)/i.exec(c);
  if(m) return Math.round(+m[1])+','+Math.round(+m[2])+','+Math.round(+m[3]);
  return fb;
}

function _mTok(){
  const root=(typeof document!=='undefined')?document.documentElement:null;
  const th=root?(root.getAttribute('data-app-theme')||'lumen'):'lumen';
  if(_mTokCache && _mTokTheme===th) return _mTokCache;
  let rd=function(){ return ''; };
  try{ if(root){ const cs=getComputedStyle(root); rd=function(n){ return (cs.getPropertyValue(n)||'').trim(); }; } }catch(_){}
  const T={};
  // A-ORG-1's literal palette survives as the fallback triples, so the layer still
  // reads if a token is missing (harness stubs, boot order).
  T.text   = _cssRGB(rd('--text'),   '234,248,255');   // dots + labels (ice-white family)
  T.dim    = _cssRGB(rd('--dim'),    '155,140,255');   // guard family (was #9b8cff)
  T.accent = _cssRGB(rd('--accent'), '54,182,255');    // selection + child web (doctrine blue)
  T.signal = _cssRGB(rd('--signal'), '255,217,130');   // lineage gold + oib amber family
  T.ground = _cssRGB(rd('--ground'), '9,17,16');       // glass interiors, label outlines
  T.body   = rd('--body') || '-apple-system,system-ui,sans-serif';
  // world paint (the canvas globe reads the theme too — owner directive 19 Aug:
  // the radar look is retired; glow mode survives only as a token, off by default)
  T.oceanHi = rd('--ocean-hi') || '#0f1d1a';
  T.oceanLo = rd('--ocean-lo') || '#091110';
  T.land    = _cssRGB('rgb('+(rd('--land')||'')+')', null) || (rd('--land')||'').trim() || '64,178,152';
  T.coast   = (rd('--coast')||'').trim() || T.accent;
  T.glow    = (rd('--world-glow')||'0').trim()==='1';
  _mTokCache=T; _mTokTheme=th;
  return T;
}

// ---- Selection → arc sets (PORT of _syncSelArcs, adapted per deviation 1) ------
function _syncSelArcs(selId){
  try{
    GlobeState._selUp=null; GlobeState._selDown=null;
    GlobeState._cmdSites=null; GlobeState._selKidOrg=null;
    if(selId==null){
      GlobeState._hqArc=null; GlobeState._cmdLinkArcs=null;
      if(typeof globeMark==='function') globeMark();
      return;
    }
    const s=siteById(selId);
    if(!s || s.lat==null || s.lon==null){
      GlobeState._hqArc=null; GlobeState._cmdLinkArcs=null;
      if(typeof globeMark==='function') globeMark();
      return;
    }
    // v0.11.0: the A-ORG-1 ORG TREE is the structure. The selected site's org
    // (GlobeState.selOrg — its primary unless a specific org was picked) drives
    // both directions; every org hop renders at its effective site.
    const og=(GlobeState.selOrg && typeof orgOf==='function') ? orgOf(GlobeState.selOrg) : null;
    const up=[]; const upSet=new Set();
    const down=[]; const downSet=new Set();
    if(og){
      // UP (v0.18.0): ONE line to the nearest NON-category located ancestor — the
      // real parent. The full lineage lives in the details sheet; the map shows a
      // single level up so a selection never becomes a lineage tangle.
      for(const p of ogChainUp(og.id)){
        if(typeof _OG_CATS!=='undefined' && _OG_CATS[p.id]) continue;   // grouping shell — not a real parent
        const sid=ogEffSite(p.id); if(!sid) continue;
        const ps=siteById(sid); if(!ps || ps.lat==null) continue;
        upSet.add(ps.id);
        if(sid!==s.id && !(ps.lat===s.lat && ps.lon===s.lon)){
          up.push({ from:{lon:s.lon, lat:s.lat, n:s.id}, to:{lon:ps.lon, lat:ps.lat, n:ps.id}, rel:'parent' });
        }
        break;                                            // one hop only
      }
      // DOWN (v0.18.0): DIRECT subordinate orgs — the "L2" you drill INTO. Each
      // renders at its site; _selKidOrg maps site → the exact child org so a
      // dot-tap descends one level (see tapAtScreen), never the whole subtree.
      const seenKid=new Set(); const kidOrg={};
      for(const c of ogKids(og.id)){
        const sid=ogEffSite(c.id); if(!sid || seenKid.has(sid)) continue;
        seenKid.add(sid);
        const cs=siteById(sid); if(!cs || cs.lat==null) continue;
        downSet.add(cs.id);
        if(cs.id!==s.id && kidOrg[cs.id]==null) kidOrg[cs.id]=c.id;   // never map the focus onto itself
        if(cs.lat===s.lat && cs.lon===s.lon) continue;    // co-located: dot highlights, no arc
        down.push({ from:{lon:s.lon, lat:s.lat, n:s.id}, to:{lon:cs.lon, lat:cs.lat, n:cs.id}, rel:'subordinate' });
      }
      GlobeState._selKidOrg=kidOrg;
    }
    GlobeState._hqArc = up.length?up:null;
    GlobeState._cmdLinkArcs = down.length?down:null;
    GlobeState._selUp=upSet; GlobeState._selDown=downSet;
    const all=new Set(upSet); downSet.forEach(function(id){ all.add(id); }); all.add(selId);
    GlobeState._cmdSites=all;
    if(typeof globeMark==='function') globeMark();
  }catch(_){}
}
// Lazy follow (deviation 6): the selection owner just sets GlobeState.sel + dirty.
function _selSyncCheck(){
  if(GlobeState._selSynced!==GlobeState.sel || GlobeState._selSyncSrc!==_sitesArr()
     || GlobeState._selSyncOrg!==GlobeState.selOrg){
    GlobeState._selSynced=GlobeState.sel;
    GlobeState._selSyncOrg=GlobeState.selOrg;
    GlobeState._selSyncSrc=_sitesArr();
    _syncSelArcs(GlobeState.sel);
  }
}

// ---- Great-circle arcs (PORT of drawSubtleArcs — sampling verbatim) ------------
// Lightweight arc drawer: thin, semi-transparent, glow only past alpha 0.5.
function drawSubtleArcs(ctx, m, arcs, rgb, width, alpha, arrow, dash){
  function slerpPts(aLon,aLat,bLon,bLat,segs){
    const a=lonLatToVec(aLon,aLat), b=lonLatToVec(bLon,bLat);
    let dot=a[0]*b[0]+a[1]*b[1]+a[2]*b[2]; dot=Math.max(-1,Math.min(1,dot));
    const om=Math.acos(dot); const so=Math.sin(om); const pts=[];
    for(let i=0;i<=segs;i++){ const f=i/segs; let w1,w2;
      if(so<1e-6){ w1=1-f; w2=f; } else { w1=Math.sin((1-f)*om)/so; w2=Math.sin(f*om)/so; }
      const lift=1+0.08*Math.sin(Math.PI*f);
      pts.push([ (a[0]*w1+b[0]*w2)*lift, (a[1]*w1+b[1]*w2)*lift, (a[2]*w1+b[2]*w2)*lift ]); }
    return pts;
  }
  ctx.save();
  ctx.lineWidth=(width||0.7); ctx.strokeStyle='rgba('+rgb+','+(alpha!=null?alpha:0.28)+')'; ctx.lineCap='round';
  if(dash) ctx.setLineDash(dash);   // dashed = subordinate spurs; solid = chain of command
  if((alpha||0)>0.5){ ctx.shadowColor='rgba('+rgb+',0.85)'; ctx.shadowBlur=7; }
  arcs.forEach(arc=>{
    const pts=slerpPts(arc.from.lon,arc.from.lat, arc.to.lon,arc.to.lat, 40);
    let s=false; ctx.beginPath();
    let lastV=null, prevV=null;
    for(let i=0;i<pts.length;i++){ const v=_projectVec(pts[i], m); const front=v[2]>=-0.02;
      if(front){ if(!s){ ctx.moveTo(v[0],v[1]); s=true; } else ctx.lineTo(v[0],v[1]); prevV=lastV; lastV=v; } else s=false; }
    ctx.stroke();
    // directional arrowhead at the target — only when the target is front-facing.
    if(arrow && lastV && prevV){
      if(_visibleLonLat(arc.to.lon, arc.to.lat)){   // same front-hemisphere math, one projection cheaper
        const ang=Math.atan2(lastV[1]-prevV[1], lastV[0]-prevV[0]), ah=6.5;
        ctx.save(); ctx.shadowBlur=0; ctx.beginPath();
        ctx.moveTo(lastV[0], lastV[1]);
        ctx.lineTo(lastV[0]-ah*Math.cos(ang-0.45), lastV[1]-ah*Math.sin(ang-0.45));
        ctx.lineTo(lastV[0]-ah*Math.cos(ang+0.45), lastV[1]-ah*Math.sin(ang+0.45));
        ctx.closePath(); ctx.fillStyle='rgba('+rgb+',0.95)'; ctx.fill(); ctx.restore();
      }
    }
  });
  ctx.restore();
}

// ---- Arc families under the dots (PORT of drawGlobeLinks) ----------------------
function drawGlobeLinks(ctx, m){
  // v0.7.0: in brief the chain connectors ARE the link layer (A-ORG-1 law:
  // non-brief arcs are skipped entirely in brief); Lines toggle gates both rooms.
  try{ if(document.body.classList.contains('brief-mode')){ drawBriefArcs(ctx, m); return; } }catch(_){}
  if(GlobeState._linesOff) return;
  const T=_mTok();
  // v0.17.0 — the two families now read as DIFFERENT things (owner: the lines
  // were illegible / meaningless). SUBORDINATES = dashed, dim, thin yellow spurs
  // fanning OUT to each direct command. REPORTS-TO = one solid, bright orange
  // line UP to the parent, with an arrowhead. The callout spells both out in words.
  if(GlobeState._cmdLinkArcs && GlobeState._cmdLinkArcs.length){
    drawSubtleArcs(ctx, m, GlobeState._cmdLinkArcs, T.accent, 1.3, 0.5, false, [2.5,5]);
  }
  if(GlobeState._hqArc && GlobeState._hqArc.length){
    drawSubtleArcs(ctx, m, GlobeState._hqArc, T.signal, 2.4, 0.95, true);

}

// ---- Chrome exclusion zones (PORT of _gChromeZones — A-ORG-2 shell ids, dev. 4) ----
function _gChromeZones(m){
  const W=(m&&m.w)||800, H=(m&&m.h)||600;
  try{
    const cv=(typeof document!=='undefined') && document.getElementById && document.getElementById('globeCanvas');
    const cr=(cv && cv.getBoundingClientRect) ? cv.getBoundingClientRect() : null;
    if(cr && cr.width>0 && cr.height>0){
      const kx=W/cr.width, ky=H/cr.height, live=[], PAD=4;
      const sels=['#searchPill','#searchResults','#dossier','#titleBar',
                  '#clockTL','#clockTR','#navGlobe'];
      for(const s of sels){
        const el=document.querySelector(s); if(!el) continue;
        const cs=getComputedStyle(el); if(cs.display==='none'||cs.visibility==='hidden') continue;
        const r=el.getBoundingClientRect(); if(!r.width||!r.height) continue;
        const x0=(r.left-cr.left)*kx-PAD, y0=(r.top-cr.top)*ky-PAD;
        const x1=(r.right-cr.left)*kx+PAD, y1=(r.bottom-cr.top)*ky+PAD;
        if(x1<0||y1<0||x0>W||y0>H) continue;
        live.push({x0:x0, y0:y0, x1:x1, y1:y1});
      }
      return live;
    }
  }catch(_){}
  return [];   // stubbed-DOM runs (harness): no chrome, no zones
}

// ---- Label placement (PORT of _placeGlobeLabel — verbatim) ---------------------
function _placeGlobeLabel(ctx, sx, sy, w, m, rects, opts){
  opts=opts||{};
  const W=(m&&m.w)||800, H=(m&&m.h)||600;
  const gap=opts.gap!=null?opts.gap:8, h=opts.h!=null?opts.h:13;
  const L=6, R=W-6, T=6, B=H-6;
  const chrome=(GlobeState.__gChrome||(GlobeState.__gChrome=_gChromeZones(m)));
  let ax;
  if(opts.center){ ax=sx-w/2; } else { ax=sx+gap; if(ax+w>R) ax=sx-gap-w; }
  const ys = opts.above ? [sy, sy-16, sy-32, sy+18, sy-48, sy+34]
                        : [sy+4, sy-15, sy+19, sy-30, sy+34, sy-45];
  for(const cy of ys){
    const x=Math.max(L, Math.min(ax, R-w));
    const y=Math.max(T+h, Math.min(cy, B));
    const bx={x0:x-2, y0:y-h+2, x1:x+w+2, y1:y+3};
    // a label that cannot fit inside the canvas at either anchor — or that the edge
    // clamp dragged onto its own marker — is skipped (dot-only)
    let hit=(bx.x1>R+2 || bx.x0<L-2 || Math.abs(x-ax)>4);
    if(!hit) for(const b of rects){ if(bx.x0<b.x1&&bx.x1>b.x0&&bx.y0<b.y1&&bx.y1>b.y0){ hit=true; break; } }
    if(!hit) for(const c of chrome){ if(bx.x0<c.x1&&bx.x1>c.x0&&bx.y0<c.y1&&bx.y1>c.y0){ hit=true; break; } }
    if(!hit){ rects.push(bx); return {x,y}; }
  }
  return null;
}

// ---- The dot loop (PORT of drawGlobeMarkers) ------------------------------------
function drawGlobeMarkers(ctx, m){
  const T=_mTok();
  GlobeState._screen=[];                              // hit-test cache, rebuilt per draw
  GlobeState.__gLbl=[]; GlobeState.__gChrome=null;    // shared label rects + chrome zones, per frame
  const tnow=performance.now()/1000;
  const selId=GlobeState.sel;
  const upSet=GlobeState._selUp, downSet=GlobeState._selDown;
  const cmdSites=GlobeState._cmdSites;
  const zb=Math.min(2.4, 1 + (GlobeState.zoom-1)*0.14);   // dots grow a little as you zoom in
  const rScale=Math.min(2.1, 0.85+zb*0.16);
  const bodyFont=T.body;
  // v0.7.0 REVERSAL (A-ORG-1 L17488 law): brief mode hands the full-screen globe
  // to the chain renderer — only the brief structures draw; everything else waits
  // in map mode. Dots toggle silences the map reticles (and their hit-tests).
  let briefOn=false; try{ briefOn=document.body.classList.contains('brief-mode'); }catch(_){}
  if(briefOn){ drawBriefNodes(ctx, m); return; }
  // Dots toggle: markers, badges and their hit-tests go quiet; the selection's
  // chain labels stay (Names owns text). A dot that isn't drawn can't be tapped.
  const dotsOff=!!GlobeState._dotsOff;

  for(const inst of _sitesArr()){
    if(inst.lat==null||inst.lon==null) continue;
    const p=_projectLonLat(inst.lon, inst.lat, m);
    if(p[2]<0) continue;
    const sx=p[0], sy=p[1];
    const fade=Math.max(0.3, p[2]);
    const isSel=(selId!=null && inst.id===selId);
    const isUp=!!(upSet && upSet.has(inst.id));
    const isDown=!!(downSet && downSet.has(inst.id));
    const onChain=isSel||isUp||isDown;
    const cls=clsOf(inst.id);
    const isGuard=(cls==='guard');
    // class filter (legend): chain members stay — the picture outranks the layers
    if(!onChain && GlobeState._famOff && GlobeState._famOff.has(cls)) continue;
    // CLUSTERS (A-ORG-1 §3.4, gate 1.6 · 44px grid): at world zoom, ordinary
    // sites divert into count badges; the badge pass draws after this loop.
    if(GlobeState.zoom<1.6 && !onChain){
      if(!dotsOff){
        (GlobeState._clu||(GlobeState._clu=[])).push({x:sx, y:sy, lat:inst.lat, lon:inst.lon, c:(CLS_META[cls]||CLS_META.base).c});
        GlobeState._screen.push({inst, sx, sy, depth:p[2]});
      }
      continue;
    }
    const col=(isSel||isDown) ? T.accent : (isUp ? T.signal : (CLS_META[cls]||CLS_META.base).c);
    const zb2=Math.min(2.1, 0.85+zb*0.16);
    const dotR=((isSel?3.6:(onChain?3.0:(cls==='hq'?3.4:(isGuard?2.0:2.5)))))*zb2;
    const rr=dotR*1.16;

    if(isSel && !dotsOff){
      // A-ORG-1's breathing diamond + compass spokes — the selected org owns the map
      const d=7.5+Math.sin(tnow*2.4)*0.8;
      ctx.save(); ctx.translate(sx,sy); ctx.rotate(Math.PI/4);
      ctx.strokeStyle='rgba('+T.accent+','+(0.95*fade)+')'; ctx.lineWidth=1.8;
      ctx.strokeRect(-d,-d,d*2,d*2); ctx.rotate(-Math.PI/4);
      ctx.beginPath();
      ctx.moveTo(-d-4,0); ctx.lineTo(-d+1,0); ctx.moveTo(d-1,0); ctx.lineTo(d+4,0);
      ctx.moveTo(0,-d-4); ctx.lineTo(0,-d+1); ctx.moveTo(0,d-1); ctx.lineTo(0,d+4);
      ctx.strokeStyle='rgba('+T.accent+','+(0.8*fade)+')'; ctx.lineWidth=1.3; ctx.stroke();
      ctx.restore();
    }

    // GLASS RETICLE, SHARP (A-ORG-1 recipe, halo deleted per owner: dark interior
    // disc + one thin ring + bright core; HQ adds one concentric ring; no glow,
    // no shadowBlur — ~270 markers must hold phone frames).
    if(!dotsOff){
      ctx.globalAlpha=fade*(isGuard&&!onChain?0.8:1);
      ctx.beginPath(); ctx.arc(sx, sy, rr, 0, Math.PI*2);
      ctx.fillStyle='rgba(8,7,4,.85)'; ctx.fill();
      ctx.lineWidth=onChain?1.6:1.25; ctx.strokeStyle='rgb('+col+')'; ctx.stroke();
      ctx.beginPath(); ctx.arc(sx, sy, Math.max(0.9, rr*0.34), 0, Math.PI*2);
      ctx.fillStyle='rgb('+col+')'; ctx.fill();
      if(cls==='hq' && !isSel){
        ctx.lineWidth=1.1; ctx.strokeStyle='rgb('+col+')'; ctx.globalAlpha=0.9*fade;
        ctx.beginPath(); ctx.arc(sx, sy, rr+2.8, 0, Math.PI*2); ctx.stroke();
      }
      ctx.globalAlpha=1;
    }

    // chain-member labels draw at ANY zoom AND through the Names/USACE toggles —
    // a selected command string keeps its names (v0.12.0 owner directive).
    if(onChain){
      const _nm=inst.unit||inst.base||inst.id;
      const _fs=(m.w<560?12:11);
      ctx.save();
      ctx.textBaseline='middle';
      ctx.font='800 '+_fs+'px '+bodyFont;
      const _tw=ctx.measureText(_nm).width;
      const _pos=_placeGlobeLabel(ctx, sx, sy, _tw, m, GlobeState.__gLbl, {gap:dotR+7, h:14});
      if(_pos){
        ctx.lineWidth=(_fs>11?3.6:3.2); ctx.strokeStyle='rgba('+T.ground+',.9)'; ctx.strokeText(_nm, _pos.x, _pos.y);
        ctx.fillStyle='rgba('+col+',1)'; ctx.fillText(_nm, _pos.x, _pos.y);
      }
      ctx.restore();
    }

    if(!dotsOff) GlobeState._screen.push({inst, sx, sy, depth:p[2]});
  }

  // Tiny labels for the rest, zoom-gated (keeps world view clean).
  if(GlobeState.zoom >= 1.5 && !GlobeState._namesOff){
    ctx.save();
    try{ ctx.letterSpacing='0.35px'; }catch(_){}
    ctx.textBaseline='middle';
    // PRIORITY CULLING: placement is first-come-first-served on collision cells, so
    // iterate a priority-sorted copy — chain picture, then roots, depots, bases, guard.
    const _hostCmd=(typeof _ogBuild==='function')?(_ogBuild().hostsCmd||new Set()):new Set();
    const _lblPr=function(s){ const i=s.inst;
      if(cmdSites && cmdSites.has(i.id)) return 0;
      if(_hostCmd.has(i.id)) return 1;                     // hosts a command (lvl≤3 org)
      if(i.grp==='oib') return 2;
      if(clsOf(i.id)==='guard'||String(i.grp||'').split('|')[0]==='guardInset') return 4;
      return 3; };
    const _lblQ=Array.from(GlobeState._screen).sort(function(a,b){ return _lblPr(a)-_lblPr(b); });
    for(const s of _lblQ){
      const inst=s.inst;
      if(clsOf(inst.id)==='guard' && GlobeState.zoom<6.5) continue;   // guard names arrive only deep in
      if(GlobeState._usaceOff && clsOf(inst.id)==='usace') continue;   // USACE names toggled off
      if(s.depth<0.25) continue;
      if(cmdSites && cmdSites.has(inst.id)) continue; // chain labels already drew in the dot loop
      // ZOOM LADDER (v0.10.0 tune — owner: COCOM labels crowded CONUS): density
      // arrives BY ECHELON as the room for it does — roots first, then HQs,
      // depots, bases, insets; phones climb 0.7 later (less room per name).
      const _mzb=(m.w<700)?0.7:0;
      const _cls=clsOf(inst.id);
      const _need=(_hostCmd.has(inst.id)?2.4:(_cls==='hq'?2.6:(_cls==='depot'?3.2:(String(inst.grp||'').split('|')[0]==='guardInset'?4.2:3.8))))+_mzb;
      if(GlobeState.zoom < _need) continue;
      if(s.sx<1||s.sx>m.w-1||s.sy<1||s.sy>m.h-1) continue;   // off-map dot — don't orphan its label
      ctx.font='600 9.5px '+bodyFont;
      const name=inst.base||inst.id;
      const tw=ctx.measureText(name).width;
      const _pl=_placeGlobeLabel(ctx, s.sx, s.sy, tw, m, GlobeState.__gLbl, {h:12});
      if(!_pl) continue;
      ctx.shadowColor='rgba('+T.ground+',.9)'; ctx.shadowBlur=3; ctx.shadowOffsetY=1;
      ctx.lineWidth=2.2; ctx.strokeStyle='rgba('+T.ground+',.78)'; ctx.strokeText(name, _pl.x, _pl.y);
      ctx.shadowBlur=0; ctx.shadowOffsetY=0;
      ctx.fillStyle='rgba('+(clsOf(inst.id)==='depot'?T.signal:T.text)+',.92)'; ctx.fillText(name, _pl.x, _pl.y);
    }
    ctx.restore();
  }
}

// ---- CLUSTER BADGES (A-ORG-1 §3.4, single-pass port): 44px screen grid,
// active below zoom 1.6; badge = glass disc + accent ring + halo ring + reticle
// ticks + count. Tap eases past the gate at the badge's centroid. ------------
function drawClusters(ctx, m){
  const T=_mTok();
  if(GlobeState.zoom>=1.6 || !GlobeState._clu || !GlobeState._clu.length){ GlobeState._cluHits=null; GlobeState._clu=null; return; }
  const gm=new Map();
  for(const c of GlobeState._clu){
    const k=((c.x/44)|0)+':'+((c.y/44)|0);
    let g=gm.get(k); if(!g){ g={x:0,y:0,la:0,lo:0,n:0}; gm.set(k,g); }
    g.x+=c.x; g.y+=c.y; g.la+=c.lat; g.lo+=c.lon; g.n++; g.c=c.c;
  }
  GlobeState._cluHits=[];
  ctx.save(); ctx.textAlign='center'; ctx.textBaseline='middle';
  gm.forEach(function(g){
    const cx=g.x/g.n, cy=g.y/g.n;
    if(g.n===1){
      ctx.beginPath(); ctx.arc(cx,cy,2.2,0,Math.PI*2);
      ctx.fillStyle='rgb('+(g.c||T.accent)+')'; ctx.globalAlpha=.85; ctx.fill(); ctx.globalAlpha=1;
      return;
    }
    const r=Math.min(15, 7+Math.log2(g.n)*2.6);
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
    ctx.fillStyle='rgba(8,7,4,.66)'; ctx.fill();
    ctx.strokeStyle='rgba('+T.accent+',.85)'; ctx.lineWidth=1.4; ctx.stroke();
    ctx.beginPath(); ctx.arc(cx,cy,r+3.5,0,Math.PI*2);
    ctx.strokeStyle='rgba('+T.accent+',.28)'; ctx.lineWidth=1; ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx-r-7,cy); ctx.lineTo(cx-r-2,cy); ctx.moveTo(cx+r+2,cy); ctx.lineTo(cx+r+7,cy);
    ctx.moveTo(cx,cy-r-7); ctx.lineTo(cx,cy-r-2); ctx.moveTo(cx,cy+r+2); ctx.lineTo(cx,cy+r+7);
    ctx.strokeStyle='rgba('+T.accent+',.5)'; ctx.lineWidth=1; ctx.stroke();
    ctx.fillStyle='rgba('+T.text+',.95)';
