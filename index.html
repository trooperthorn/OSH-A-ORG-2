<!-- PWA / installable-app support -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0A111C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="A-ORG-2">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<script>
/* A-ORG-2 first-byte diagnostics (PORTED from A-ORG-1, its first <script> — the
   diagnostics stack is load-bearing, never remove): captures every error/rejection
   from byte one, ring-buffered at window.__errLog; the styled toast attaches later
   and replays. __SANDBOX detects preview/iframe hosts so their boundary noise is
   logged but not toasted, and the service worker stays unregistered there. */
(function(){
  window.__SANDBOX=(function(){
    try{ if(window.top!==window) return true; }catch(_){ return true; }
    try{ if(window.origin==='null' || location.protocol==='blob:' || location.protocol==='data:' || location.protocol==='file:') return true; }catch(_){}
    return false;
  })();
  window.__errLog=[];
  function log(kind, msg, src, line, col, stack){
    try{
      const hostNoise = window.__SANDBOX && kind==='err' && /^Script error\.?$/.test(String(msg||'')) && !src && !line;
      window.__errLog.push({t:Date.now(), k:hostNoise?'host':kind, m:String(msg||'').slice(0,300), s:String(src||'').slice(0,200), l:line||0, c:col||0, st:String(stack||'').slice(0,500)});
      if(window.__errLog.length>10) window.__errLog.shift();
      if(hostNoise) return;   // preview-host boundary noise: logged, not toasted
      if(window._errToast){
        var at=(src?String(src).split('/').pop():'')||'';
        window._errToast(msg+((at||line)?(' @ '+(at||'inline')+(line?(':'+line):'')):''));
      }
    }catch(_){}
  }
  window.addEventListener('error', function(ev){
    var e=ev.error||{};
    log('err', ev.message, ev.filename||e.sourceURL||'', ev.lineno||e.line||0, ev.colno||e.column||0, e.stack||'');
  }, true);
  window.addEventListener('unhandledrejection', function(ev){
    var r=ev.reason||{};
    log('rej', r.message||r, r.sourceURL||'', r.line||0, r.column||0, r.stack||'');
  });
})();
</script>
<script>
  // Service worker registration (PORTED from A-ORG-1's v13.13.0 auto-update
  // contract): register on load — never in a sandbox — then check for a new
  // sw.js on load, on every return to the app, and every 20 minutes; when a new
  // version takes control (sw.js already skipWaiting+claims) the page reloads
  // itself once. If the user is mid-typing, the reload waits until they leave
  // the field or background the app.
  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      if(window.__SANDBOX) return;
      navigator.serviceWorker.register('sw.js').then(function(reg){
        var kick=function(){ try{ reg.update(); }catch(_){ } };
        setTimeout(kick, 6000);
        setInterval(kick, 20*60*1000);
        document.addEventListener('visibilitychange', function(){
          if(document.visibilityState==='visible') kick();
        });
      }).catch(function(){});
      var hadCtrl=!!navigator.serviceWorker.controller;
      navigator.serviceWorker.addEventListener('controllerchange', function(){
        if(!hadCtrl){ hadCtrl=true; return; }          // first install claiming — not an update
        if(window.__updReloading) return; window.__updReloading=true;
        var go=function(){ try{ location.reload(); }catch(_){ } };
        try{ if(typeof window.toast==='function') window.toast('Updating to the latest version…'); }catch(_){}
        var ae=document.activeElement;
        var typing=!!(ae && (ae.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)));
        if(typing){
          var done=false, fin=function(){ if(done) return; done=true; go(); };
          document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') fin(); }, {once:true});
          ae.addEventListener('blur', function(){ setTimeout(fin, 400); }, {once:true});
        } else setTimeout(go, 650);
      });
    });
  }
</script>
<style>
/* Integration inlines the RAW CONTENTS of modules/s1-tokens.css over the marker
   line below — this <style> element is the wrapper; do not add another. */
/* ═══════════════════════════════════════════════════════════════════════════════
   modules/s1-tokens.css — A-ORG-2 S1: canonical tokens (ARCTIC :root defaults)
   + the base component layer (glass recipes, chrome placement, focus, desktop).

   CONTRACT (canonical token names — themes swap VALUES only, never names):
     --ground --panel --panel-2 --line --text --dim --faint
     --accent --accent-deep --accent-wash --signal --signal-wash --danger --ok
     --t1 --t2 --t3 --t4          (brief tier law — see LOCKED SEMANTICS below)
     --r-card --r-chip --r-pill   (radii, ported from A-ORG-1 P1 tokens ~L92)
     --disp --body --mono         (system font stacks only — no webfonts at boot)
   Themes land in the @THEMES layer as html[data-app-theme="night"|"paper"]{...}
   overrides. Default theme is arctic; these :root values ARE arctic, so
   html[data-app-theme="arctic"] needs no override block.

   LOCKED SEMANTICS (brief tier law, inherited from A-ORG-1 non-negotiable #6):
     --t1 white-family · --t2 cool (NEVER green) · --t3 warm · --t4 rose.
     No green on brief data. --ok exists for status affordances only.

   PORTED IDIOMS (A-ORG-1 index.html is source of truth):
     radii --r-pill/999 --r-chip/11 --r-card/16       (~L92-95)
     box reset + overscroll discipline                 (~L113-120)
     liquid-glass material (gradient + hairline ring + specular top edge + deep
     soft drop + accent under-glow), DESIGN-DOCTRINE "Material standard v13.7"
     #errToast / #errToast.show                        (~L2108-2109, ~L2139)
     focus-visible outline idiom                       (~L4890)
     phone-first: desktop ONLY inside @media(min-width:1100px); hovers are
     desktop-only; mobile gets springy :active presses; motion dies under
     prefers-reduced-motion                            (DESIGN-DOCTRINE)

   RELIABILITY CONTRACT HONORED:
     - NO position:fixed anywhere. body is the 100dvh non-scrolling anchor and
       all chrome floats position:absolute inside it (deviation from A-ORG-1,
       whose #errToast/#appTabs were fixed — equivalent here because the globe
       IS the page and body never scrolls).
     - NO transforms on scroll containers: #searchResults and #dossier (the two
       overflow:auto surfaces) are positioned with inset math only. The only
       transforms below are on non-scrolling buttons (:active spring) and the
       toast — never on anything that scrolls.
   ═══════════════════════════════════════════════════════════════════════════════ */

/* ─── 1 · TOKENS — ARCTIC is the :root default ─────────────────────────────── */
:root{
  /* ground + surfaces */
  --ground:#0A111C;                       /* deep harbor — page + label halos     */
  --panel:#101B2C;                        /* raised surface                       */
  --panel-2:#16243A;                      /* second step (hover/nested)           */
  --line:rgba(140,185,220,.18);           /* steel hairline ring (M1 verify: synced with theme-arctic's refinement) */
  /* ink ladder */
  --text:#EAF8FF;                         /* ice-white ink (m5 fallback triple)   */
  --dim:#A4BED6;                          /* secondary ink                        */
  --faint:#7C93AB;                        /* tertiary ink / placeholders (M1 verify: 4.91:1+ on every surface — was #5C7690, failing AA) */
  --safe-l:calc(env(safe-area-inset-left,0px) + 12px);   /* M1 verify: viewport-fit=cover means edge chrome must respect the notch in landscape */
  --safe-r:calc(env(safe-area-inset-right,0px) + 12px);
  /* voices */
  --accent:#56C8E8;                       /* ice — live/active/selection          */
  --accent-deep:#2E8FB5;                  /* pressed / gradient floor of accent   */
  --accent-wash:rgba(86,200,232,.13);     /* accent fill for ON states            */
  --signal:#E2B24E;                       /* signal gold — lineage/attention      */
  --signal-wash:rgba(226,178,78,.14);
  --danger:#FF6D5A;
  --ok:#43C97F;                           /* status only — NEVER on brief data    */
  /* brief tiers (LOCKED SEMANTICS — see header) */
  --t1:#FFFFFF; --t2:#40E0D0; --t3:#FFDC46; --t4:#FF5FBE;
  /* radii (A-ORG-1 P1 values, ported) */
  --r-card:16px; --r-chip:11px; --r-pill:999px;
  /* type (system stacks only — zero webfonts at boot) */
  --disp:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  --body:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  --mono:ui-monospace,'SF Mono','Cascadia Mono','Segoe UI Mono',Menlo,Consolas,monospace;
  /* derived component tokens (glass material) — NOT part of the canonical
     contract, but themes may override them to retune the material. */
  --glass-hi:rgba(22,36,56,.86);          /* gradient ceiling of glass            */
  --glass-lo:rgba(10,17,28,.94);          /* gradient floor of glass              */
  --spec:rgba(255,255,255,.07);           /* specular top edge                    */
  --drop:0 10px 26px -10px rgba(0,0,0,.6);/* deep soft drop                       */
}

/* ─── 2 · RESET + THE STAGE (the globe IS the page) ────────────────────────── */
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%; background:var(--ground)}
html,body{margin:0; padding:0; overscroll-behavior:none; -webkit-text-size-adjust:100%}
body{
  position:relative;                       /* the ONLY positioning anchor — all
                                              chrome is absolute in here; nothing
                                              is position:fixed (reliability)    */
  width:100%; height:100vh; height:100dvh;
  overflow:hidden;                         /* the page never scrolls — full-bleed */
  background:var(--ground); color:var(--text);
  font-family:var(--body);
  -webkit-tap-highlight-color:transparent;
}
::selection{background:var(--accent-wash); color:var(--text)}

/* full-bleed stage: #globeCanvas fills the viewport between a minimal top edge
   (the search pill floats over it) and nothing. Radius law lives in globeMetrics:
   R = min(w,h)/2 * GlobeState.zoom * GlobeState.baseK (0.72 phone / 0.88 desktop). */
#globeCanvas{
  position:absolute; inset:0; z-index:0;
  width:100%; height:100%; display:block;
  touch-action:none;                       /* canvas owns its gestures (A-ORG-1
                                              v1.27.3 lesson — never page-scroll
                                              mid-drag)                          */
  background:transparent;                  /* --ground shows through             */
}

/* ─── 3 · LIQUID GLASS RECIPES (pill / chip / card / seg) ──────────────────── */
/* Material standard: gradient + hairline ring + specular top edge + deep soft
   drop. Search, dossier, stage bar, clocks and the theme switch all compose
   from these three recipes — restyle the tokens, never fork the recipe. */
.glass{
  background:linear-gradient(180deg,var(--glass-hi),var(--glass-lo));
  box-shadow:0 0 0 1px var(--line), inset 0 1px 0 var(--spec), var(--drop);
  -webkit-backdrop-filter:blur(14px) saturate(1.3);
  backdrop-filter:blur(14px) saturate(1.3);
}
.pill,.chip{
  appearance:none; -webkit-appearance:none; border:0; margin:0;
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  color:var(--text); text-transform:uppercase;
  user-select:none; -webkit-user-select:none; cursor:pointer;
  transition:transform .12s ease, box-shadow .15s ease, background-color .15s ease;
}
.pill{
  min-height:44px; padding:0 16px; border-radius:var(--r-pill);
  font:700 12px/1 var(--body); letter-spacing:.08em;
}
.chip{
  min-height:38px; padding:0 12px; border-radius:var(--r-chip);
  font:700 11px/1 var(--body); letter-spacing:.06em; color:var(--dim);
}
/* mobile press feel: springy :active (hovers are desktop-only, see §7) */
.pill:active,.chip:active{transform:scale(.96)}
.pill.on,.chip.on{
  color:var(--text);
  background:linear-gradient(180deg,var(--glass-hi),var(--glass-lo)),var(--accent-wash);
  box-shadow:0 0 0 1px var(--accent), inset 0 1px 0 var(--spec), var(--drop);
}
.card{
  border-radius:var(--r-card); padding:14px 16px; color:var(--text);
}
/* segmented control (Globe ⇄ Brief placeholder on #stageBar) */
.seg{
  display:inline-flex; align-items:center; gap:2px;
  padding:3px; border-radius:var(--r-pill);
}
.seg .seg-b{
  appearance:none; -webkit-appearance:none; border:0; margin:0;
  min-height:38px; padding:0 14px; border-radius:var(--r-pill);
  background:transparent; color:var(--dim);
  font:700 11px/1 var(--body); letter-spacing:.1em; text-transform:uppercase;
  user-select:none; -webkit-user-select:none; cursor:pointer;
}
.seg .seg-b.on{
  color:var(--text); background:var(--accent-wash);
  box-shadow:0 0 0 1px var(--accent);
}
.seg .seg-b:disabled{opacity:.4; cursor:default}
/* uppercase micro-label (doctrine: letterspaced, tabular numerals on readouts) */

/* ─── 4 · CHROME PLACEMENT (all absolute — no fixed layers) ────────────────── */
/* z ladder: stage 0 · clocks 10 · stage bar 25 · top edge 20 · results 30 ·
   dossier 40 · errToast 120 · sbxNote 130 (A-ORG-1's toast z, kept). */

/* minimal top edge: search pill + theme switch float over the globe */
#searchPill{
  position:absolute; z-index:20;
  top:calc(env(safe-area-inset-top,0px) + 10px);
  left:var(--safe-l); right:calc(var(--safe-r) + 52px);  /* right lane reserved for #themeSwitch */
  display:flex; align-items:center; gap:8px;
  min-height:46px; padding:0 14px; border-radius:var(--r-pill);
}
#searchPill .sp-ico{color:var(--faint); font-size:15px; line-height:1; flex:none}
#searchPill input{
  flex:1; min-width:0; background:none; border:0; outline:none; padding:0;
  color:var(--text); font:600 14px/1.2 var(--body);
}
#searchPill input::placeholder{color:var(--faint)}
#searchPill:focus-within{
  box-shadow:0 0 0 1.5px var(--accent), inset 0 1px 0 var(--spec), var(--drop);
}
#themeSwitch{
  position:absolute; z-index:20;
  top:calc(env(safe-area-inset-top,0px) + 10px); right:var(--safe-r);
  width:46px; height:46px; border-radius:var(--r-pill);
  display:flex; align-items:center; justify-content:center;
}
#themeSwitch:empty{display:none}
#themeSwitch .ts-b{
  appearance:none; -webkit-appearance:none; border:0; background:none; margin:0;
  width:100%; height:100%; border-radius:var(--r-pill);
  color:var(--dim); font-size:17px; line-height:1; cursor:pointer;
  user-select:none; -webkit-user-select:none;
}

/* search results — SCROLL CONTAINER: inset math only, never transformed */
#searchResults{
  position:absolute; z-index:30;
  top:calc(env(safe-area-inset-top,0px) + 64px);
  left:var(--safe-l); right:var(--safe-r);
  max-height:48vh; max-height:48dvh;
  overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
  border-radius:var(--r-card); padding:4px;
}
#searchResults:empty{display:none}
/* row recipe for the search owner (module fills; shell only styles) */
#searchResults .sr-row{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  width:100%; min-height:44px; padding:10px 12px;
  appearance:none; -webkit-appearance:none; border:0; background:none; margin:0;
  border-radius:var(--r-chip); text-align:left; cursor:pointer;
  color:var(--text); font:600 13px/1.3 var(--body);
}
#searchResults .sr-row + .sr-row{box-shadow:0 -1px 0 var(--line)}
#searchResults .sr-row:active{background:var(--accent-wash)}
#searchResults .sr-sub{color:var(--dim); font:500 11px/1.3 var(--body)}
#searchResults .sr-none{padding:12px 14px; color:var(--dim); font:500 13px/1.5 var(--body)}
#searchResults .sr-count{padding:6px 14px 8px; color:var(--faint); font:600 10.5px/1 var(--mono); letter-spacing:.08em; text-transform:uppercase}

/* dossier — bottom sheet card, SCROLL CONTAINER: inset math only */
#dossier{
  position:absolute; z-index:40;
  left:calc(var(--safe-l) - 4px); right:calc(var(--safe-r) - 4px);
  bottom:calc(env(safe-area-inset-bottom,0px) + 68px);  /* clears the stage bar */
  max-height:56vh; max-height:56dvh;
  overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
  border-radius:var(--r-card); padding:14px 16px;
}

/* stage bar — reset/back/clear pills + Globe⇄Brief seg, bottom center */
#stageBar{
  position:absolute; z-index:25;
  left:0; right:0; bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  display:flex; align-items:center; justify-content:center; gap:8px;
  padding:0 12px; margin:0 auto; max-width:calc(100% - 96px);
  pointer-events:none;                     /* corners stay live for chrome       */
}
#stageBar>*{pointer-events:auto}

/* corner clocks — glass chips, mono + tabular numerals, readouts only.
   TL/TR sit under the top edge; BL/BR above the stage bar. Empty = hidden
   (the clock owner fills them; the skeleton shows no dead chrome). */
.clock{
  position:absolute; z-index:10; pointer-events:none;
  padding:6px 10px; border-radius:var(--r-chip);
  font:600 10px/1.45 var(--mono); font-variant-numeric:tabular-nums;
  letter-spacing:.08em; color:var(--dim); text-transform:uppercase;
  white-space:nowrap;
}
.clock:empty{display:none}
#clockTL{top:calc(env(safe-area-inset-top,0px) + 66px); left:var(--safe-l)}
#clockTR{top:calc(env(safe-area-inset-top,0px) + 66px); right:var(--safe-r)}
#clockBL{bottom:calc(env(safe-area-inset-bottom,0px) + 66px); left:var(--safe-l)}
#clockBR{bottom:calc(env(safe-area-inset-bottom,0px) + 66px); right:var(--safe-r)}

/* version chip — long-press dumps the diagnostics ring buffer (shell script) */
#verChip{
  position:absolute; z-index:26;
  right:var(--safe-r); bottom:calc(env(safe-area-inset-bottom,0px) + 4px);
  padding:4px 8px; border-radius:var(--r-pill);
  font:700 9px/1 var(--mono); letter-spacing:.14em; text-transform:uppercase;
  color:var(--faint); user-select:none; -webkit-user-select:none;
  touch-action:none; cursor:default;
}

/* ─── 5 · DIAGNOSTICS SURFACES (load-bearing — never remove) ───────────────── */
/* A-ORG-1 #errToast (~L2108) ported verbatim except position:fixed→absolute
   (reliability contract; body is the viewport so geometry is identical). */
#errToast{position:absolute;left:var(--safe-l);right:var(--safe-r);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:120;padding:10px 13px;border-radius:12px;background:rgba(40,10,10,.94);color:#ffd7d0;font:700 12px var(--body);box-shadow:0 0 0 1.4px rgba(255,110,90,.7),0 8px 24px rgba(0,0,0,.5);opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .2s,transform .2s;word-break:break-word}
#errToast.show{opacity:1;pointer-events:auto;transform:none}
/* sandbox banner (A-ORG-1 ~L22198 idiom, arctic-voiced in signal gold) */
#sbxNote{
  position:absolute; z-index:130;
  top:calc(env(safe-area-inset-top,0px) + 64px); left:var(--safe-l); right:var(--safe-r);
  display:flex; align-items:center; gap:8px;
  padding:8px 12px; border-radius:12px;
  background:rgba(58,42,14,.95); color:#ffe3ad;
  box-shadow:0 0 0 1px rgba(226,178,78,.55), 0 8px 24px rgba(0,0,0,.5);
  font:600 11px/1.4 var(--body);
}
#sbxNote button{
  appearance:none; -webkit-appearance:none; border:0; background:none; margin-left:auto;
  color:#ffe3ad; font:700 12px/1 var(--body); padding:6px; cursor:pointer;
}

/* ─── 6 · FOCUS + MOTION DISCIPLINE ────────────────────────────────────────── */
/* ported focus-visible idiom (A-ORG-1 ~L4890), accent-voiced for arctic */
button:focus-visible, [role="button"]:focus-visible, a:focus-visible, input:focus-visible{
  outline:2px solid var(--accent); outline-offset:2px}
#searchPill input:focus-visible{outline:none}   /* the pill's focus-within ring speaks */
/* all motion dies under prefers-reduced-motion (doctrine) */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important; animation:none!important}
}

/* ─── 7 · DESKTOP ≥1100px — ENHANCEMENTS ONLY (phone-first is sacred) ──────── */
@media (min-width:1100px){
  /* top edge centers; corners come free for the clocks */
  #searchPill{left:0; right:0; width:560px; margin-inline:auto}
  #searchResults{left:0; right:0; width:560px; margin-inline:auto;
    top:calc(env(safe-area-inset-top,0px) + 70px); max-height:60vh; max-height:60dvh}
  #themeSwitch{top:calc(env(safe-area-inset-top,0px) + 12px); right:24px}
  /* clocks take the true corners */
  #clockTL{top:calc(env(safe-area-inset-top,0px) + 18px); left:18px}
  #clockTR{top:calc(env(safe-area-inset-top,0px) + 18px); right:18px}
  #clockBL{bottom:calc(env(safe-area-inset-bottom,0px) + 18px); left:18px}
  #clockBR{bottom:calc(env(safe-area-inset-bottom,0px) + 18px); right:18px}
  #verChip{right:18px; bottom:calc(env(safe-area-inset-bottom,0px) + 52px)}
  /* dossier becomes a right-hand panel; still a plain inset scroll container */
  #dossier{left:auto; right:24px; width:400px;
    top:calc(env(safe-area-inset-top,0px) + 84px); bottom:auto;
    max-height:calc(100vh - 180px); max-height:calc(100dvh - 180px)}
  #stageBar{bottom:calc(env(safe-area-inset-bottom,0px) + 20px)}
  /* hovers live ONLY here */
  .pill:hover,.chip:hover,#themeSwitch .ts-b:hover{
    box-shadow:0 0 0 1px var(--accent), inset 0 1px 0 var(--spec), var(--drop);
    color:var(--text)}
  #searchResults .sr-row:hover{background:var(--accent-wash)}
  #globeCanvas{cursor:grab}
  #globeCanvas:active{cursor:grabbing}
  /* toast docks to the corner on wide screens (A-ORG-1 ~L2139) */
  #errToast{left:auto; right:24px; max-width:520px; bottom:24px}
}

</style>
<style>
/* Integration inlines the theme override layer (html[data-app-theme="arctic" |
   "night" | "paper"] — values only, never token names) over the marker line
   below. Arctic is ALSO the :root default; its block is inlined anyway so the
   token set has one source of truth (M1 verify: the :root/--faint drift). */
/* ═══════════════════════════════════════════════════════════════════════════════
   modules/theme-arctic.css — ARCTIC COMMAND (default theme, explicit block)
   Cold precise console: deep harbor blue-black ground · ice-cyan accent ·
   amber signal. These values ARE the s1-tokens.css :root defaults, restated
   under the theme selector so arctic is complete even when :root drifts —
   with two refinements (--faint, --line) documented in the math block below.
   Contract: values only. One selector. Every canonical token. No layout.
   LOCKED SEMANTICS (brief tier law, A-ORG-1 non-negotiable #6):
   --t1 white-family · --t2 cool (NEVER green) · --t3 warm · --t4 rose.
   ═══════════════════════════════════════════════════════════════════════════════ */
html[data-app-theme="arctic"]{
  /* ground + surfaces — the harbor at night, three steps of depth */
  --ground:#0A111C;                       /* deep harbor — page, label halos      */
  --panel:#101B2C;                        /* raised surface                       */
  --panel-2:#16243A;                      /* second step (hover / nested)         */
  --line:rgba(140,185,220,.18);           /* steel hairline (was .16 — see math)  */
  /* ink ladder — ice-white down to steel */
  --text:#EAF8FF;                         /* ice-white ink (m5 fallback family)   */
  --dim:#A4BED6;                          /* secondary ink                        */
  --faint:#7C93AB;                        /* tertiary / placeholders (REFINED —

  /* glass quartet — same values as :root (M1 verify: all three themes now carry the full 28-token shape, so no theme rides on :root fallback) */
  --glass-hi:rgba(22,36,56,.86);
  --glass-lo:rgba(10,17,28,.94);
  --spec:rgba(255,255,255,.07);
  --drop:0 10px 26px -10px rgba(0,0,0,.6);
                                             #5C7690 failed 4.5:1, see math)      */
  /* voices — ice leads, amber signals, red warns, green is status-only */
  --accent:#56C8E8;                       /* ice-cyan — live / active / selection */
  --accent-deep:#2E8FB5;                  /* pressed state / gradient floor       */
  --accent-wash:rgba(86,200,232,.13);     /* ON-state fill (always + accent ring) */
  --signal:#E2B24E;                       /* amber signal — lineage / attention   */
  --signal-wash:rgba(226,178,78,.14);
  --danger:#FF6D5A;
  --ok:#43C97F;                           /* status affordances ONLY — never on
                                             brief data (tier law)                */
  /* brief tiers — LOCKED SEMANTICS, tuned for this ground */
  --t1:#FFFFFF;                           /* L1 white-family                      */
  --t2:#40E0D0;                           /* L2 cool turquoise (A-ORG-1 canonical
                                             64,224,208 triple) — NEVER green     */
  --t3:#FFDC46;                           /* L3 warm gold                         */
  --t4:#FF5FBE;                           /* L4 rose                              */
  /* radii — A-ORG-1 P1 tokens (~L92), identical across all themes */
  --r-card:16px;
  --r-chip:11px;

  --disp:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  --body:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  --mono:ui-monospace,'SF Mono','Cascadia Mono','Segoe UI Mono',Menlo,Consolas,monospace;

/* ═══════════════════════════════════════════════════════════════════════════════
   CONTRAST MATH — WCAG 2.x relative luminance, ratio = (Lhi+.05)/(Llo+.05).
   Surfaces: ground #0A111C (L .0055) · panel #101B2C (L .0108) · panel-2
   #16243A (L .0174). Worst case for light ink is panel-2 (lightest surface).
   TEXT PAIRS (need ≥ 4.5:1)          vs ground   vs panel   vs panel-2
     --text   #EAF8FF                    17.45       15.94      14.37   PASS
     --dim    #A4BED6                     9.83        8.98       8.10   PASS
     --faint  #7C93AB  (refined)          5.96        5.45       4.91   PASS
       · old :root #5C7690 scored 4.01 / 3.66 / 3.30 — FAILED as placeholder
         and microlabel ink; lifted two steps up the steel ramp, hue kept.
     --accent #56C8E8 (as link/label)     9.75        8.91       8.03   PASS
     --signal #E2B24E (as label)          9.65        8.82       7.95   PASS
     --danger #FF6D5A (toast/label)       6.84        6.24       5.63   PASS
     --t1 #FFFFFF                        18.92       17.28      15.58   PASS
     --t2 #40E0D0                        11.53       10.53       9.49   PASS
     --t3 #FFDC46                        14.04       12.82      11.56   PASS
     --t4 #FF5FBE                         6.88        6.28       5.66   PASS

     --accent ring/focus on any surface        8.03–9.75              PASS
     --accent-deep pressed floor               4.24–5.15              PASS
     --signal ring (sandbox/lineage)           7.95–9.65              PASS
     --ok status dot                           7.35–8.92              PASS
     --danger ring                             5.63–6.84              PASS
   DECORATIVE (exempt, by design — not identification carriers):
     --line @.18 composites to #212F3F on ground ≈ 1.39:1. The hairline rides
     WITH the glass gradient + specular + drop shadow; every interactive state
     boundary is carried by the --accent ring at ≥ 8:1. Alpha raised .16→.18
     for a crisper console edge. Washes (.13/.14) are fills under ≥ 4.9:1 ink
     and always pair with a passing ring — never the sole state signal.
   ─────────────────────────────────────────────────────────────────────────────
   DESIGN RATIONALE (6)
   1. One cold ramp: ground→panel→panel-2 climb a single blue-steel hue, so
      depth reads as ice thickness, not as color change — precision by economy.
   2. Ice-cyan #56C8E8 is the lone structural voice: selection, focus, ON.

      lineage/attention because nothing else on this ground is warm.
   3. The ink ladder (17.4 → 9.8 → 6.0 on ground) steps by near-halves, so

   4. Tier law is tuned, not restated: t2 turquoise keeps A-ORG-1's canonical
      cool triple but sits 23° of hue from the accent, and t4 rose is lifted
      until it clears 4.5:1 on the lightest glass it can ever land on.
   5. Green appears exactly once (--ok) and is barred from brief data, so a
      green pixel always means "system healthy," never "tier two."
   6. Every value passes on panel-2 — the worst surface — so no component
      needs a theme-specific exception, and the contract stays values-only.
   ═══════════════════════════════════════════════════════════════════════════════ */


/* ═══════════════════════════════════════════════════════════════════════════════

   Surfaces: ground #0B0F0C · panel #121A14 · panel-2 #18231B (lightest = worst
   case). Targets: text ≥ 4.5:1 · chrome (rings, icons, pressed states) ≥ 3:1.

   token        hex       on ground  on panel  on panel-2   grade      verdict
   --text       #E8F5EA     17.17      15.78     14.42      text       PASS
   --dim        #A7BFAC      9.83       9.03      8.26      text       PASS
   --faint      #7C947F      5.88       5.41      4.94      text       PASS
   --accent     #56D364     10.02       9.21      8.41      text+chrome PASS
   --accent-deep#2EA043      5.72       5.26      4.81      chrome     PASS
   --signal     #E3B341      9.92       9.12      8.33      text+chrome PASS
   --danger     #FF7B66      7.61       6.99      6.39      text       PASS
   --ok         #4CC38A      8.71       8.01      7.32      text+chrome PASS
   --t1         #FFFFFF     19.30      17.74     16.22      text       PASS
   --t2         #79C0FF      9.92       9.12      8.34      text       PASS
   --t3         #FFD166     13.39      12.31     11.25      text       PASS
   --t4         #FF7BAC      7.98       7.33      6.70      text       PASS

    the 3:1 chrome bar for its placeholder/microlabel role, but do not set body
    copy in --faint on --panel-2. --line is a decorative hairline (no target).
    Washes (.13/.14 alpha) composite over dark glass; ink on washed surfaces is

/* ═══════════════════════════════════════════════════════════════════════════════
   modules/theme-paper.css — A-ORG-2 theme: COMMAND PAPER
   Complete value-override of the canonical token contract (s1-tokens.css §1)
   under html[data-app-theme="paper"]. Values only — no new selectors, no layout.

   Direction: light, document-native. Cool paper ground (#F2F5F8 family), ink
   text, restrained crimson/ink accents — the register of an official command
   paper, not a website. Built to hold OUTDOORS IN SUNLIGHT: every ink clears
   4.5:1 on the worst surface, and edges are carried by the ink hairline (not
   by drop shadows, which glare washes out first).

   LOCKED SEMANTICS honored (brief tier law): --t1 white-family · --t2 cool,
   NEVER green · --t3 warm · --t4 rose. On a paper ground the white-family
   tier PRINTS at the achromatic ink end of its family (#0D1117): neutrality
   is the semantic the law protects; luminance flips with the ground, exactly
   as white headline ink flips to black when a slide becomes a printed page.
   --ok is status-affordance only — never on brief data.
   ═══════════════════════════════════════════════════════════════════════════════ */

html[data-app-theme="paper"]{
  /* ground + surfaces — cool paper, three steps of sheet depth */

  --panel:#FFFFFF;                        /* raised sheet (brightest = closest)   */
  --panel-2:#E5EBF1;                      /* second step (hover/nested) — the
                                             DARKEST surface = worst case below  */
  --line:rgba(13,27,42,.24);              /* ink hairline — does the edge work
                                             sunlight steals from shadows        */

  --text:#131F2B;                         /* primary ink, blue-black             */
  --dim:#3E5468;                          /* secondary ink                       */
  --faint:#53687A;                        /* tertiary ink / placeholders         */
  /* voices — crimson leads (restrained), bronze signals, scarlet warns */

                                             selection                           */
  --accent-deep:#7C1333;                  /* pressed / gradient floor of accent  */
  --accent-wash:rgba(163,29,69,.10);      /* ON-state fill (always + accent ring)*/
  --signal:#8A5800;                       /* bronze — lineage/attention (amber
                                             family, inked down for paper)       */
  --signal-wash:rgba(138,88,0,.12);
  --danger:#AC2418;                       /* scarlet — red-orange lean keeps it
                                             apart from the crimson accent       */
  --ok:#166F3E;                           /* status only — NEVER on brief data   */
  /* brief tiers (LOCKED SEMANTICS — tuned for the paper ground) */
  --t1:#0D1117;                           /* L1 white-family at its ink end      */
  --t2:#0B6484;                           /* L2 cool deep cerulean — NEVER green */
  --t3:#9A4D00;                           /* L3 warm sienna                      */
  --t4:#A1246E;                           /* L4 rose, magenta-leaning — ~20° of
                                             hue from the crimson accent         */

     the complete-override rule) */
  --r-card:16px; --r-chip:11px; --r-pill:999px;
  /* type — system stacks only, zero webfonts. Display goes to the system
     serifs: the one document-native move type can make without a webfont.
     Body/mono stay sans/mono for UI and readout legibility. */
  --disp:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif;
  --body:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  --mono:ui-monospace,'SF Mono','Cascadia Mono','Segoe UI Mono',Menlo,Consolas,monospace;

  --glass-lo:rgba(236,242,247,.88);       /* gradient floor of glass             */
  --spec:rgba(255,255,255,.75);           /* specular top edge — sheet gloss     */
  --drop:0 10px 26px -12px rgba(16,32,48,.28);

   #E5EBF1 (L .8243). Dark ink on light ground → the DARKEST surface (panel-2)
   is the worst case; every value below is checked against all three.

     --text   #131F2B                    15.25       16.69      13.89   PASS

     --faint  #53687A                     5.29        5.79       4.82   PASS
     --accent #A31D45 (link/label)        6.81        7.45       6.20   PASS
     --signal #8A5800 (label)             5.52        6.04       5.03   PASS

     --t3     #9A4D00                     5.59        6.11       5.09   PASS
     --t4     #A1246E                     6.41        7.02       5.84   PASS
   CHROME PAIRS (need ≥ 3:1)
     --accent ring/focus on any surface        6.20–7.45              PASS
     --accent-deep pressed floor               8.75–10.51             PASS
     --signal ring (sandbox/lineage)           5.03–6.04              PASS
     --ok status dot                           5.18–6.22              PASS
     --danger ring                             5.79–6.95              PASS
   WASH COMPOSITES (fills under ink, never the sole state signal):
     --accent-wash @.10 over panel → #F6E8EC; --text on it = 14.04:1   PASS
     --signal-wash @.12 over panel → #F1EBE0; --text on it = 14.06:1   PASS
   DECORATIVE (exempt, by design — not identification carriers):
     --line @.24 composites to ≈#C5C8CC on panel ≈ 1.68:1. Same argument as
     arctic: the hairline rides WITH the glass gradient + drop; every

     shadow, is what still reads.
   ─────────────────────────────────────────────────────────────────────────────
   DESIGN RATIONALE (6)
   1. Sunlight is the brief: light grounds beat dark ones in glare, so every
      ink is floored at 4.5:1 on the WORST surface and edges live in the
      hairline — the two things direct sun cannot wash out.
   2. One cool paper ramp: ground→panel→panel-2 move only in luminance on the
      same blue-gray cast, so depth reads as sheet stacking, not color change.
   3. Crimson #A31D45 is the lone structural voice — the classic command-paper
      red — and it is RESTRAINED: washes at .10/.12 keep the page ink-and-paper
      with red reserved for what is live, selected, or focused.
   4. Tier law survives the polarity flip by carrying HUE FAMILY, not
      luminance: t1 is the achromatic family at its ink end, t2 is unmistakable

      sans/tabular so pills, microlabels and clock readouts keep their

   ═══════════════════════════════════════════════════════════════════════════════ */

const APP_VERSION = 'v0.1.0';

// ---- GlobeState — the shared globe spine (shell-owned; modules consume) --------
// PORTED from A-ORG-1 ~L13906. Orientation is stored as two plain angles — yaw
// (spin around the polar axis) and pitch (latitude tilt) — and the quaternion q is
// rebuilt from them each drag (m3 _rebuildGlobeQ). Pitch is clamped so the globe
// never rolls or flips. A-ORG-2 additions per contract: dirty (the render loop
// redraws ONLY when set — globeMark()), sel (selected site id | null), baseK
// (radius factor: 0.72 phone / 0.88 desktop; R = min(w,h)/2 * zoom * baseK).
const GlobeState = window.GlobeState = {
  yaw: 0, pitch: 0,
  q: [0,0,0,1],
  rotLon: 60, rotLat: -10, zoom: 1.5,
  dragging:false, lastX:0, lastY:0, moved:false,
  spin:false, raf:null,

// ═══════════════════════════════════════════════════════════════════════════════
// m1-geom.js — A-ORG-2 M1 sphere math + canvas metrics (PORTED from A-ORG-1)
//
// Ported from A-ORG-1 index.html (source of truth — math survived 22 major versions):
//   _qMul            (~L16027)  quaternion product a*b
//   _qNorm           (~L16037)  quaternion normalize
//   _qFromAxisAngle  (~L16039)  axis-angle → quaternion
//   lonLatToVec      (~L16042)  geographic degrees → unit vector [x,y,z]
//   _setGlobeRot     (~L16048)  GlobeState.q → 3x3 rotation matrix _gM (once per frame)
//   _gM / _qFrame    (~L13922)  per-frame rotation matrix + the quaternion it came from
//   _projectLonLat   (~L16069)  lon/lat → [screenX, screenY, depth]
//   _projectVec      (~L16078)  precomputed unit vector → [screenX, screenY, depth]
//   globeMetrics     (~L16751)  canvas metrics: DPR clamp 2, backing-store sync,
//                               radius law R = min(w,h)/2 * zoom * baseK (0.72 fallback)
//
// DEVIATIONS (everything changed vs. A-ORG-1, and why):
//   1. _visibleLonLat(lon, lat, tol) is NEW-NAMED: A-ORG-1 has no named front-hemisphere
//      test — the gate is inline everywhere (drawGlobePath: rz>=0; marker loop: p[2]<0 →
//      skip; arc paths: v[2] >= -0.02 limb tolerance). This function is that exact inline
//      math (depth = _gM row 3 · vec) hoisted behind a name so M1+ callers stop
//      re-deriving it. tol defaults to 0 (the strict dot/ring gate); pass 0.02 to get the
//      arcs' limb tolerance. Depth sign convention unchanged: >= 0 faces the viewer.
//   2. No inverse projection is ported because NONE EXISTS in A-ORG-1: picking hit-tests
//      the forward-projected marker cache (GlobeState._screen) — handleGlobeTap
//      (~L17893) — never a screen→lon/lat unproject. Do not invent one here.
//   3. _setGlobeRot keeps its legacy (rotLon, rotLat) signature UNUSED, exactly as in
//      A-ORG-1: orientation comes solely from GlobeState.q. Callers pass anything.
//   4. NOT ported here (owned by other M1 files, kept out to avoid duplicate top-level
//      declarations at concatenation): GlobeState literal, _rebuildGlobeQ /
//      _faceLonLatAngles / applyDrag (interaction), drawGlobePath /
//      latRing / lonRing (render loop), GLOBE_RINGS data.
//
// CONTRACTS HONORED:
//   - Reads GlobeState.{q, zoom, baseK} at CALL time only — concatenation-order safe;
//     no DOM beyond the canvas param of globeMetrics; zero rendering; no per-frame work
//     here (render loop redraws only on GlobeState.dirty — that gate lives elsewhere).
//   - Plain sloppy-mode JS: top-level function declarations, no ES modules, no classes.
//   - Screen mapping is A-ORG-1's exact [cx - rx*R, cy - ry*R] (both axes negated) —
//     this is what makes east-right / north-up true under _rebuildGlobeQ's quaternion
//     convention. Do not "fix" the signs.
// ═══════════════════════════════════════════════════════════════════════════════

// ---- Per-frame rotation matrix (quaternion expanded once per frame; hot loops do
//      9 mults per vertex, no trig, no gimbal lock) ----
let _qFrame=[0,0,0,1];
let _gM={ m00:1,m01:0,m02:0, m10:0,m11:1,m12:0, m20:0,m21:0,m22:1 };

// ---- Quaternion helpers (minimal) ----
function _qMul(a,b){ // a*b
  const ax=a[0],ay=a[1],az=a[2],aw=a[3], bx=b[0],by=b[1],bz=b[2],bw=b[3];
  return [
    aw*bx+ax*bw+ay*bz-az*by,
    aw*by-ax*bz+ay*bw+az*bx,
    aw*bz+ax*by-ay*bx+az*bw,
    aw*bw-ax*bx-ay*by-az*bz
  ];
}

function _qNorm(q){ const l=Math.hypot(q[0],q[1],q[2],q[3])||1; return [q[0]/l,q[1]/l,q[2]/l,q[3]/l]; }

function _qFromAxisAngle(ax,ay,az,ang){ const h=ang/2, s=Math.sin(h); return [ax*s,ay*s,az*s,Math.cos(h)]; }

// Geographic degrees → unit sphere vector. Axis convention (load-bearing):
// x = cos(lat)cos(lon), y = sin(lat) [north up], z = cos(lat)sin(lon).
function lonLatToVec(lon, lat){
  const la=lat*Math.PI/180, lo=lon*Math.PI/180;
  const cl=Math.cos(la);
  return [ cl*Math.cos(lo), Math.sin(la), cl*Math.sin(lo) ];
}

// Expand GlobeState.q into _gM. Call ONCE per frame before any projection.
// (rotLon, rotLat) are legacy A-ORG-1 params and are intentionally unused.
function _setGlobeRot(rotLon, rotLat){
  const q=GlobeState.q||[0,0,0,1];
  const x=q[0],y=q[1],z=q[2],w=q[3];
  const xx=x*x, yy=y*y, zz=z*z, xy=x*y, xz=x*z, yz=y*z, wx=w*x, wy=w*y, wz=w*z;
  // standard quaternion→matrix
  _gM.m00=1-2*(yy+zz); _gM.m01=2*(xy-wz);   _gM.m02=2*(xz+wy);
  _gM.m10=2*(xy+wz);   _gM.m11=1-2*(xx+zz); _gM.m12=2*(yz-wx);
  _gM.m20=2*(xz-wy);   _gM.m21=2*(yz+wx);   _gM.m22=1-2*(xx+yy);
  _qFrame=q;
}

// lon/lat → [screenX, screenY, depth]. depth (rz) >= 0 means front hemisphere.
// m is a globeMetrics(cv) result ({cx, cy, R}).
function _projectLonLat(lon, lat, m){
  const lo=lon*Math.PI/180, la=lat*Math.PI/180, cl=Math.cos(la);
  const x=cl*Math.cos(lo), y=Math.sin(la), z=cl*Math.sin(lo);
  const rx=_gM.m00*x+_gM.m01*y+_gM.m02*z;
  const ry=_gM.m10*x+_gM.m11*y+_gM.m12*z;
  const rz=_gM.m20*x+_gM.m21*y+_gM.m22*z;
  return [m.cx - rx*m.R, m.cy - ry*m.R, rz];
}

// Same projection for a precomputed unit vector (arc interpolation feeds this —
// skips the per-point trig of _projectLonLat).
function _projectVec(v, m){
  const x=v[0],y=v[1],z=v[2];
  const rx=_gM.m00*x+_gM.m01*y+_gM.m02*z;
  const ry=_gM.m10*x+_gM.m11*y+_gM.m12*z;
  const rz=_gM.m20*x+_gM.m21*y+_gM.m22*z;
  return [m.cx - rx*m.R, m.cy - ry*m.R, rz];
}

// Front-hemisphere visibility: true when (lon,lat) faces the viewer under the current
// _gM. This is A-ORG-1's inline gate (depth = _gM row 3 · unit vector, >= 0 visible)
// given a name — see header deviation 1. tol (optional, default 0): pass 0.02 for the
// arc-path limb tolerance (A-ORG-1 draws arc segments down to depth >= -0.02 so curves
// kiss the limb instead of popping).
function _visibleLonLat(lon, lat, tol){
  const lo=lon*Math.PI/180, la=lat*Math.PI/180, cl=Math.cos(la);
  const x=cl*Math.cos(lo), y=Math.sin(la), z=cl*Math.sin(lo);
  return (_gM.m20*x+_gM.m21*y+_gM.m22*z) >= -(tol||0);
}

// Canvas metrics + the radius law. DPR clamped to 2; backing store synced to CSS size
// (the one canvas mutation this module performs — metrics, not rendering).
// R = min(w,h)/2 * zoom * baseK (baseK: 0.72 phone / 0.88 desktop, set by the shell;
// 0.72 fallback preserved from A-ORG-1).
function globeMetrics(cv){
  const dpr=Math.min(2, window.devicePixelRatio||1);
  const w=cv.clientWidth, h=cv.clientHeight;
  if(cv.width!==w*dpr||cv.height!==h*dpr){ cv.width=w*dpr; cv.height=h*dpr; }
  const R=Math.min(w,h)/2*GlobeState.zoom*(GlobeState.baseK||0.72);
  return { dpr, w, h, cx:w/2, cy:h/2, R };
}


// Ring → cached Cartesian vertices (PORT of A-ORG-1 L16059-16068; cache re-keyed
// by ring identity — m6 and smoothFallbackOnce always swap whole arrays, so a
// WeakMap can never go stale). Consumed every frame by m2's drawGlobePath.
const _ringXYZCache=new WeakMap();
function _ringXYZ(ring){
  let a=_ringXYZCache.get(ring);
  if(a) return a;
  a=new Float64Array(ring.length*3);
  for(let i=0;i<ring.length;i++){
    const lo=ring[i][0]*Math.PI/180, la=ring[i][1]*Math.PI/180, cl=Math.cos(la);
    a[3*i]=cl*Math.cos(lo); a[3*i+1]=Math.sin(la); a[3*i+2]=cl*Math.sin(lo);
  }
  _ringXYZCache.set(ring,a);
  return a;
}

     _gliding/_velDX/_velDY/_applyDrag set by input wiring),
     _setGlobeRot, _ringXYZ, _gM.

   m5 hook: drawGlobe calls drawMarkersHook(ctx, m) if defined — ALL marker,
   label, link-line and brief overlay drawing belongs to m5, not here.

   DEVIATIONS from A-ORG-1 (each one deliberate):
   1. drawGlobe: drawGlobeMarkers(ctx,m) -> optional drawMarkersHook(ctx,m),
      called inside the sphere clip exactly where markers drew in A-ORG-1.
   2. drawGlobe: dropped the drawGlobeLinks / drawBriefChain / drawBriefStates
      branches and the __bfC/__bfHQ/__bfLab bookkeeping. Cross-org link arcs are
      OUT of A-ORG-2 scope (parent pointer is the only relationship); any
      parent-child/brief overlay drawing rides the m5 hook.
   3. frame: the ~14fps pulse throttle (GlobeState._lp, 70ms) moved here from
      A-ORG-1 drawGlobeMarkers, keyed on GlobeState.sel != null, so the idle
      loop breathes for the selection pulse without m5 self-marking dirty.
      (Minor change: it also ticks while the selected site is on the back
      hemisphere; A-ORG-1 only ticked when the pulse actually drew.)
   4. loadStateBorders: the GLOBE_STATE_SHAPES fill is guarded with
      typeof _namedStateShapes === 'function' — that per-state decoder ships
      with the brief-states owner; until it lands the shapes stay null.
   5. _smoothRing is defined here (its only consumer is smoothFallbackOnce);
      if m1-geom also ports it the duplicate declaration is identical-body and
      harmless under single-script concatenation.

   Boot integration (owner: shell/boot module) — call once #globeCanvas exists:
     smoothFallbackOnce(); startGlobeLoop(cv);
     loadGlobeCoastlinesHi(); loadStateBorders(); loadCountryBorders();
   ============================================================================ */

/* ============================================================
   3D ROTATING GLOBE — orthographic, canvas, no external libs.
   Drag to rotate, scroll/pinch to zoom, markers projected onto

//   globeMark              (~L13934)  request a redraw (sets GlobeState.dirty)
//   _rebuildGlobeQ         (~L16009)  yaw+pitch → orientation quaternion GlobeState.q
//   _faceLonLatAngles      (~L16017)  set yaw/pitch so (lon,lat) faces the viewer
//   setupGlobeInteraction  (~L16592)  drag-to-orbit (applyDrag), flick velocity,
//                                     tap-vs-drag, double-tap zoom (_dblZoom),
//                                     ctrl/cmd-wheel zoom, two-finger pinch+pan
//   glide block            (~L16733)  momentum glide from startGlobeLoop's frame(),
//                                     hoisted here as globeGlideStep(dt) — see dev 2
//
// OWNERSHIP NOTES (concatenation law — no duplicate top-level declarations):
//   - globeMark and _rebuildGlobeQ/_faceLonLatAngles are DECLARED HERE (m1-geom.js
//     header explicitly deferred the interaction trio to this file; globeMark's first
//     consumer is input). The render module must NOT redeclare them.
//   - Uses (declared elsewhere): GlobeState (shell), _qMul/_qNorm/_qFromAxisAngle/
//     globeMetrics (m1-geom.js), startGlobeLoop (render module, called guarded),
//     tapAtScreen (selection/dossier module hook, called guarded).
//
// DEVIATIONS (everything changed vs. A-ORG-1, and why):
//   1. NO POINTER CAPTURE (reliability contract). A-ORG-1 calls setPointerCapture/
//      releasePointerCapture on the canvas and listens for lostpointercapture; capture
//      is what kept a drag alive once the pointer left the canvas. Here pointermove/
//      pointerup/pointercancel attach to window instead (addEventListener only), and
//      the handlers no-op unless this drag's pointerId is active — same drag-outside-
//      canvas behavior, zero capture API. The lostpointercapture safety-reset is gone
//      with the capture; window pointercancel covers it.
//   2. globeGlideStep(dt) is NEW-NAMED: in A-ORG-1 the glide integrator is an inline
//      block of startGlobeLoop's frame(). The render loop is not this file (exclusive
//      ownership), so the block is hoisted behind a name. The render module MUST call
//      globeGlideStep(dt) once per frame BEFORE its dirty check; the step sets
//      GlobeState.dirty itself, so the redraws-only-when-dirty law holds.
//   3. Glide constants are the CURRENT source's: decay Math.pow(0.94, dt/16.67),
//      stop < 0.005 (the mission brief's grep hooks 0.78 / 0.02 are a pre-Apple-settle
//      version — the source comment at ~L16739 literally says "was 0.78"; source wins).
//   4. Tap fires the M3 hook tapAtScreen(x, y) — canvas-relative px/py, the exact
//      coords A-ORG-1's handleGlobeTap derives from e.clientX/Y minus the canvas rect.
//      handleGlobeTap itself (tips, stack popups, brief taps) is NOT ported: it is
//      selection/dossier UI owned elsewhere; only the hook boundary lives here.
//   5. endPointer's stale-pointer guard is TIGHTENED for the window listeners:
//      A-ORG-1's (e.pointerId!==activeId && activeId!==null) let a pointerup with no
//      active drag fall through to tap logic — harmless when the listener sat on the
//      canvas, but on window it would fire taps for clicks anywhere in the app. Now
//      activeId===null returns early too.
//   6. startGlobeLoop call on release is guarded (typeof) — the render module may not
//      be concatenated yet during construction; A-ORG-1 called it bare.
//   7. GlobeState._lastInteract is NOT touched here (A-ORG-1 sets it in fly-to paths
//      for idle-spin resume; A-ORG-2 has no idle spin). The spin=false /_spinAxis /
//      _spinVel resets in pointerdown ARE kept verbatim so ported state names survive.
//
// CONTRACTS HONORED:
//   - Reads GlobeState at event/call time only — concatenation-order safe. No DOM
//     beyond the canvas passed in (+ window listeners). Plain sloppy-mode JS, no
//     classes, no modules. Nothing here draws; every visual change routes through
//     GlobeState.dirty (globeMark) and the render loop's dirty gate.
//   - Zoom clamps as in source: wheel Math.max(1.0, Math.min(16, …)), pinch
//     Math.max(1.0, Math.min(16, …)), double-tap Math.min(16, z0*2) with the
//     at-max reset to 2.0. Radius law via GlobeState.baseK (0.72 fallback).
// ═══════════════════════════════════════════════════════════════════════════════

function globeMark(){ GlobeState.dirty=true; }   // request a redraw

// Rebuild the orientation quaternion from yaw + pitch: pitch about the camera X axis, then yaw
// about the world Y (polar) axis. Verified to reach ±90° latitude with north up and no roll.
function _rebuildGlobeQ(){
  GlobeState.q = _qNorm(_qMul(
    _qFromAxisAngle(1,0,0, GlobeState.pitch||0),
    _qFromAxisAngle(0,1,0, GlobeState.yaw||0)
  ));
}

// Set yaw/pitch so geographic (lon,lat) sits at screen center (used by fly-to). Verified:
// yaw = lon-90 and pitch = lat center the point with east-right and north-up in this projection.
function _faceLonLatAngles(lon,lat){
  GlobeState.yaw   = (lon-90)*Math.PI/180;
  GlobeState.pitch =  lat*Math.PI/180;
  const lim=Math.PI/2-0.001;
  GlobeState.pitch=Math.max(-lim,Math.min(lim,GlobeState.pitch));
  _rebuildGlobeQ();
}

function setupGlobeInteraction(cv){
  // ===== v1.23.0 movement feel (known-good) on a no-roll yaw+pitch core. =====
  // Drag left/right spins around the polar axis (yaw); up/down tilts latitude (pitch). We keep
  // yaw & pitch as plain numbers and rebuild the orientation each drag: pitch wraps freely so
  // you can spin continuously over the poles, but the globe never rolls. This is the simplest
  // model that reaches the poles AND keeps north up — no drift, no guards, no lock.
  let activeId=null, lastX=0, lastY=0, lastT=0, sx0=0, sy0=0;
  function applyDrag(dx, dy){
    const R = Math.min(cv.clientWidth, cv.clientHeight)/2 * Math.max(1e-3,GlobeState.zoom) * (GlobeState.baseK||0.72);
    const sensDeg = Math.max(0.02, Math.min(0.5, 57.2958 / R));   /* ~54% of finger speed at rest */
    GlobeState.yaw   = (GlobeState.yaw||0)   - dx * sensDeg * Math.PI/180;   // drag right → turn right
    GlobeState.pitch = (GlobeState.pitch||0) + dy * sensDeg * Math.PI/180;   // drag up → globe follows finger up
    // NO clamp — pitch wraps freely so you can spin continuously over the poles and all the way
    // around, like a real globe. (Keep pitch bounded to ±2π just so the number never grows huge.)
    if(GlobeState.pitch >  Math.PI*2) GlobeState.pitch -= Math.PI*2;
    if(GlobeState.pitch < -Math.PI*2) GlobeState.pitch += Math.PI*2;
    _rebuildGlobeQ();
  }
  cv.addEventListener('pointerdown', e=>{
    if(e.pointerType==='touch' && GlobeState._pinching) return;
    try{ if(typeof cameraCancel==='function') cameraCancel(); }catch(_){}   // user wins over any live fly tween
    activeId=e.pointerId;
    GlobeState.dragging=true; GlobeState.moved=false;
    GlobeState.spin=false; GlobeState._gliding=false;
    GlobeState._spinAxis=null; GlobeState._spinVel=0;
    lastX=e.clientX; lastY=e.clientY; lastT=performance.now(); sx0=e.clientX; sy0=e.clientY;
    GlobeState.dirty=true;
  });
  // Move/up/cancel live on window (NOT the canvas): with pointer capture banned, this is
  // what keeps a drag alive when the pointer leaves the canvas. Handlers no-op unless
  // OUR pointer is mid-drag, so app-wide events cost one compare. (Deviations 1 & 5.)
  window.addEventListener('pointermove', e=>{
    if(!GlobeState.dragging || e.pointerId!==activeId) return;
    if(e.cancelable) e.preventDefault();
    const dx=e.clientX-lastX, dy=e.clientY-lastY;
    if(Math.hypot(e.clientX-sx0, e.clientY-sy0) > (e.pointerType==='touch'?6:3)) GlobeState.moved=true;
    applyDrag(dx, dy);
    // track drag velocity in px/ms for a v1.23.0-style flick glide (smoothed)
    const now=performance.now(); const dt=Math.max(8, now-lastT);
    GlobeState._velDX = 0.7*(dx/dt) + 0.3*(GlobeState._velDX||0);
    GlobeState._velDY = 0.7*(dy/dt) + 0.3*(GlobeState._velDY||0);
    lastX=e.clientX; lastY=e.clientY; lastT=now;
    globeMark();
  }, {passive:false});
  function endPointer(e){
    if(activeId===null || e.pointerId!==activeId) return;   // tightened vs. A-ORG-1 (deviation 5)
    const wasMoved=GlobeState.moved;
    GlobeState.dragging=false; activeId=null;
    let speed=Math.hypot(GlobeState._velDX||0, GlobeState._velDY||0);
    const CAP=1.6;   /* fling cap: a hard flick can't launch a multi-rev spin */
    if(speed>CAP){ const _s=CAP/speed; GlobeState._velDX*=_s; GlobeState._velDY*=_s; speed=CAP; }
    if(wasMoved && speed>0.05 && !GlobeState._pinching){ GlobeState._gliding=true; }
    else { GlobeState._gliding=false; GlobeState._velDX=0; GlobeState._velDY=0; }
    if(!wasMoved && !GlobeState._pinching){
      // Tap-vs-drag already settled (moved thresholds above); now tap-vs-DOUBLE-tap:
      // two stationary releases within 300ms and 24px = double-tap zoom, else a tap.
      const nowT=performance.now();
      if(nowT-(GlobeState._dtT||0)<300 && Math.hypot(e.clientX-(GlobeState._dtX||0), e.clientY-(GlobeState._dtY||0))<24){
        GlobeState._dtT=0; try{ _dblZoom(e); }catch(_){}
      } else {
        GlobeState._dtT=nowT; GlobeState._dtX=e.clientX; GlobeState._dtY=e.clientY;
        // M3 hook boundary: canvas-relative coords, exactly what A-ORG-1's
        // handleGlobeTap derived before hit-testing GlobeState._screen. (Deviation 4.)
        try{
          if(typeof tapAtScreen==='function'){
            const r=cv.getBoundingClientRect();
            tapAtScreen(e.clientX-r.left, e.clientY-r.top);
          }
        }catch(_){}
      }
    }
    GlobeState.dirty=true;
    if(!GlobeState.raf && typeof startGlobeLoop==='function') startGlobeLoop(cv);   // guarded (deviation 6)
  }
  // v15.14.0 double-tap: animated x2 toward the tap point (at max: reset to 2.0, Apple-style)
  function _dblZoom(e){
    try{ if(typeof cameraCancel==='function') cameraCancel(); }catch(_){}   // don't fight a live fly tween
    const m=globeMetrics(cv), r=cv.getBoundingClientRect();
    const ox=(e.clientX-r.left)-m.cx, oy=(e.clientY-r.top)-m.cy;
    const z0=GlobeState.zoom, zT=(z0>=15.9)?2.0:Math.min(16, z0*2);
    const t0=performance.now(), dur=260;
    let zPrev=z0;
    (function step(now){
      const p=Math.min(1,(now-t0)/dur), ez=1-(1-p)*(1-p);
      const z=z0+(zT-z0)*ez, k=z/zPrev; zPrev=z;
      GlobeState.zoom=z;
      if(GlobeState._applyDrag && k!==1) GlobeState._applyDrag(-(k-1)*ox, -(k-1)*oy);
      globeMark();
      if(p<1) requestAnimationFrame(step);
    })(t0);
  }
  // expose applyDrag so the glide loop can reuse the exact same no-roll rotation
  GlobeState._applyDrag = applyDrag;
  window.addEventListener('pointerup', endPointer);
  window.addEventListener('pointercancel', endPointer);

  // ZOOM via wheel: Ctrl/Cmd+wheel (or trackpad pinch) zooms; plain wheel scrolls page.
  cv.addEventListener('wheel', e=>{
    if(!(e.ctrlKey || e.metaKey)) return;               // gesture ownership unchanged
    e.preventDefault();
    try{ if(typeof cameraCancel==='function') cameraCancel(); }catch(_){}   // wheel zoom wins over a live fly
    const m=globeMetrics(cv), r=cv.getBoundingClientRect();
    const ox=(e.clientX-r.left)-m.cx, oy=(e.clientY-r.top)-m.cy;
    const z0=GlobeState.zoom;
    const z1=Math.max(1.0, Math.min(16, z0*Math.exp(-e.deltaY*0.0015)));
    if(z1===z0) return;
    GlobeState.zoom=z1;
    const k=z1/z0;
    if(GlobeState._applyDrag) GlobeState._applyDrag(-(k-1)*ox, -(k-1)*oy);   // zoom dives at the cursor
    globeMark();
  }, {passive:false});

  // ZOOM via two-finger pinch — incremental, focal-anchored, and it PANS (v15.14.0).
  let pinchPrevD=0, pinchPrevX=0, pinchPrevY=0;
  function dist(t){ const dx=t[0].clientX-t[1].clientX, dy=t[0].clientY-t[1].clientY; return Math.hypot(dx,dy); }
  function mid(t){ return [(t[0].clientX+t[1].clientX)/2, (t[0].clientY+t[1].clientY)/2]; }
  cv.addEventListener('touchstart', e=>{
    if(e.touches.length===2){ GlobeState._pinching=true; GlobeState.dragging=false; GlobeState._gliding=false;
      pinchPrevD=dist(e.touches); const c=mid(e.touches); pinchPrevX=c[0]; pinchPrevY=c[1]; }
  }, {passive:true});
  cv.addEventListener('touchmove', e=>{
    if(GlobeState._pinching && e.touches.length===2){
      if(e.cancelable) e.preventDefault();
      const d=dist(e.touches), c=mid(e.touches);
      if(pinchPrevD>0){
        const m=globeMetrics(cv), r=cv.getBoundingClientRect();
        const ox=(c[0]-r.left)-m.cx, oy=(c[1]-r.top)-m.cy;
        const z0=GlobeState.zoom;
        const z1=Math.max(1.0, Math.min(16, z0*(d/pinchPrevD)));
        GlobeState.zoom=z1;
        const k=z1/z0;
        if(GlobeState._applyDrag){
          if(k!==1) GlobeState._applyDrag(-(k-1)*ox, -(k-1)*oy);   // focal anchor
          GlobeState._applyDrag(c[0]-pinchPrevX, c[1]-pinchPrevY); // two-finger pan
        }
        globeMark();
      }
      pinchPrevD=d; pinchPrevX=c[0]; pinchPrevY=c[1];
    }
  }, {passive:false});
  cv.addEventListener('touchend', e=>{
    if(e.touches.length<2 && GlobeState._pinching){ GlobeState._pinching=false; pinchPrevD=0; }
  }, {passive:true});
}

// v1.23.0-style momentum glide, hoisted out of A-ORG-1's startGlobeLoop frame() (deviation 2).
// The render module calls this once per frame with dt (ms, already capped at 64 by the loop)
// BEFORE its dirty check. Keeps applying the released drag velocity through the same no-roll
// rotation (GlobeState._applyDrag), decaying smoothly — reusing applyDrag guarantees the glide
// can't roll the globe either. Sets GlobeState.dirty itself: the redraw law stays dirty-gated.
function globeGlideStep(dt){
  if(GlobeState._gliding && !GlobeState.dragging && !GlobeState._pinching && GlobeState._applyDrag){
    GlobeState._applyDrag((GlobeState._velDX||0)*dt, (GlobeState._velDY||0)*dt);
    const decay=Math.pow(0.94, dt/16.67);   /* was 0.78 — Apple-length settle: half-life ~187ms, ~1s glide */
    GlobeState._velDX*=decay; GlobeState._velDY*=decay;
    if(Math.hypot(GlobeState._velDX||0, GlobeState._velDY||0) < 0.005){ GlobeState._gliding=false; GlobeState._velDX=0; GlobeState._velDY=0; }
    GlobeState.dirty=true;
  }
}

// m4-camera.js — A-ORG-2 M4 camera moves (PORTED from A-ORG-1)
//

// "CINEMATIC flight", controls-council approved):
//   flyToLatLon      (~L16560)  eased yaw/pitch/zoom tween to face (lat,lon):
//                               duration scales with angular distance
//                               (550+500·min(1,dist/π) ms), easeInOutQuad, and long
//                               hops (>~30°) get a van Wijk-style zoom dip so the eye
//                               keeps its bearings instead of smearing at full zoom.
//   fitGlobeToSites  (~L15784)  frame a set of sites: average their 3-D unit vectors
//                               (correct across the date line) → centroid lat/lon,
//                               maxSep = greatest angular separation from centroid,
//                               then the maxSep→zoom ladder
//                               (>120°:1.05 · >80°:1.3 · >45°:1.7 · >20°:2.3 ·
//                                else 2.8, or 3.2 for a single site), optional
//                               tightenBias multiplier, final clamp 1.0..14.
//   geoAngularSep    (~L18032)  angular separation (degrees) between two lat/lon
//                               points — verbatim (fitGlobeToSites' only dependency
//                               not already in m1–m3).
//   _zoomAnim        (~L16336)  zoom step control: animated ×f (180ms easeOut),
//                               clamp 1.0..16.
//   _wireZoomHold    (~L16342)  zoom button wiring: click → _zoomAnim(f); press-and-
//                               hold 300ms → repeat ×1.06 (or ÷1.06) every 50ms.

//   reset-view       (~L16476, ~L23001)  inline `flyToLatLon(38,-98,2.3)` — the 'h'/'0'

//     No DOM at load time; zoomAt looks up #globeCanvas (shell contract id) at CALL

// DEVIATIONS (everything changed vs. A-ORG-1, and why):

//      org-chart SVG pan-zoom (~L21085), not the globe camera. This one is

//      the camera at the point). cx/cy are client (viewport) px; omit them and it
//      degrades to a pure center zoom identical to _zoomAnim.

// ---- Camera tween generation token (deviation 1). Every tween entry point bumps it
//      and captures the new value; cameraCancel() bumps it so stale steps go inert. ----
let _camGen=0;

// Cancel any in-flight camera tween (fly, fit, zoom step). m3 calls this on
// pointerdown so a user drag always wins instantly; safe to call when idle.
function cameraCancel(){
  _camGen++;
  GlobeState._fly=false;
}

// Angular separation (degrees) between two lat/lon points.
function geoAngularSep(lat1,lon1,lat2,lon2){
  const d=Math.PI/180;
  const a=[Math.cos(lat1*d)*Math.cos(lon1*d), Math.cos(lat1*d)*Math.sin(lon1*d), Math.sin(lat1*d)];
  const b=[Math.cos(lat2*d)*Math.cos(lon2*d), Math.cos(lat2*d)*Math.sin(lon2*d), Math.sin(lat2*d)];
  let dot=a[0]*b[0]+a[1]*b[1]+a[2]*b[2]; dot=Math.max(-1,Math.min(1,dot));
  return Math.acos(dot)/d;
}

// Generalized fly-to: rotate the globe so (lat,lon) faces the viewer and zoom in.
// onArrive (optional) runs when the animation completes (not when cancelled).
// v21.1.0 CINEMATIC flight, ported intact: duration scales with angular distance
// (short hops stay quick, cross-globe travel gets time to read), and long hops
// (>~30°) get a van Wijk-style zoom dip — the camera pulls back mid-flight then
// descends onto the target. Every camera jump in the app routes through here.
function flyToLatLon(lat, lon, zoom, onArrive){
  GlobeState.spin=false; GlobeState._gliding=false;
  const gen=++_camGen;                       // starting a fly cancels any prior tween (deviations 1–2)
  GlobeState._fly=true;
  const startYaw=GlobeState.yaw||0, startPitch=GlobeState.pitch||0, startZ=GlobeState.zoom;
  // Target yaw/pitch that centers (lon,lat) — same convention as _faceLonLatAngles.
  const lim=Math.PI/2-0.001;
  let tgtYaw=(lon-90)*Math.PI/180;
  let tgtPitch=Math.max(-lim,Math.min(lim, lat*Math.PI/180));
  const tgtZ=(zoom!=null?zoom:GlobeState.zoom);
  // take the shortest way around for yaw (wrap to ±π)
  let dYaw=tgtYaw-startYaw;
  dYaw=((dYaw+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI;
  const dist=Math.max(Math.abs(dYaw), Math.abs(tgtPitch-startPitch));
  const dur=550+500*Math.min(1, dist/Math.PI);
  const dip=(dist>0.52)?Math.min(startZ,tgtZ)*0.22:0;
  const t0=performance.now();
  function ease(p){ return p<0.5?2*p*p:1-Math.pow(-2*p+2,2)/2; }
  function step(now){
    if(gen!==_camGen) return;                                    // cancelled (deviation 1)
    if(GlobeState.dragging || GlobeState._pinching){ cameraCancel(); return; }   // user wins
    let p=Math.min(1,(now-t0)/dur); const e=ease(p);
    GlobeState.yaw   = startYaw + dYaw*e;
    GlobeState.pitch = startPitch + (tgtPitch-startPitch)*e;
    GlobeState.zoom  = Math.max(1.05, startZ + (tgtZ-startZ)*e - dip*Math.sin(e*Math.PI));
    _rebuildGlobeQ();
    globeMark();
    if(p<1) requestAnimationFrame(step);
    else{ GlobeState.zoom=tgtZ; GlobeState._fly=false; globeMark(); if(onArrive) onArrive(); }
  }
  requestAnimationFrame(step);
}

// Frame the camera to fit a set of sites (by averaging their 3-D vectors so it's
// correct across the date line) and pick a zoom from their angular spread.
// list: Array or Set of site objects from data/sites.json ({lat, lon, ...}); id
// strings are resolved against a global SITES array when one exists (deviation 5).
function fitGlobeToSites(list, tightenBias){
  if(!list) return;
  const arr = (typeof Set!=='undefined' && list instanceof Set) ? Array.from(list) : list;
  if(!arr || !arr.length) return;
  const pts=[];
  arr.forEach(s=>{
    let it=s;
    if(typeof s==='string'){
      it=null;
      if(typeof SITES!=='undefined' && SITES && SITES.length){
        for(let i=0;i<SITES.length;i++){ if(SITES[i].id===s){ it=SITES[i]; break; } }
      }
    }
    if(it && it.lat!=null && it.lon!=null) pts.push(it);
  });
  if(!pts.length) return;
  const d=Math.PI/180; let x=0,y=0,z=0;
  pts.forEach(p=>{ x+=Math.cos(p.lat*d)*Math.cos(p.lon*d); y+=Math.cos(p.lat*d)*Math.sin(p.lon*d); z+=Math.sin(p.lat*d); });
  const L=Math.hypot(x,y,z)||1;
  const cLat=Math.asin(Math.max(-1,Math.min(1,z/L)))/d, cLon=Math.atan2(y,x)/d;
  // max angular separation from the centroid → spread
  let maxSep=0;
  pts.forEach(p=>{ maxSep=Math.max(maxSep, geoAngularSep(cLat,cLon,p.lat,p.lon)); });
  let zoom = maxSep>120 ? 1.05 : maxSep>80 ? 1.3 : maxSep>45 ? 1.7 : maxSep>20 ? 2.3 : (pts.length===1? 3.2 : 2.8);
  if(tightenBias) zoom*=tightenBias;
  flyToLatLon(cLat, cLon, Math.max(1.0, Math.min(14, zoom)));
}

// M4 public alias per the A-ORG-2 work order; the ported name above stays canonical.

// v15.14.0: zoom keys animate (180ms easeOut) and repeat on hold; keyboard +/- reuses .click()
function _zoomAnim(f){ const z0=GlobeState.zoom, zT=Math.max(1.0,Math.min(16,z0*f));
  const t0=performance.now(), dur=180;
  GlobeState.spin=false;
  const gen=++_camGen;                       // a zoom step cancels a fly mid-flight (deviation 2)
  GlobeState._fly=false;
  (function step(now){
    if(gen!==_camGen) return;
    if(GlobeState.dragging || GlobeState._pinching){ cameraCancel(); return; }
    const p=Math.min(1,(now-t0)/dur), ez=1-(1-p)*(1-p);
    GlobeState.zoom=z0+(zT-z0)*ez; globeMark(); if(p<1) requestAnimationFrame(step); })(t0);
}

// Animated zoom step anchored at a screen point: ×f toward client coords (cx,cy),
// diving the camera at that point exactly like the source's wheel/double-tap zooms
// (per-frame focal anchor through GlobeState._applyDrag — deviation 6). Omit cx/cy
// (zoomAt — the focal-anchored zoom step — was cut at M1 integration: zero call
// sites; the M1 zoom pills use _zoomAnim via _wireZoomHold. Recover from git
// history when a consumer arrives.)

// Zoom button wiring: click animates ×f; press-and-hold (300ms) repeats ×1.06 per
// 50ms tick. The shell passes its own buttons (A-ORG-1 used #globeZoomIn/#globeZoomOut
// at f=1.35 / 1/1.35). addEventListener only — no pointer capture.
function _wireZoomHold(btn, f){
  if(!btn) return;
  btn.onclick=()=>_zoomAnim(f);
  let ht=null, rt=null;
  btn.addEventListener('pointerdown', ()=>{ ht=setTimeout(()=>{ rt=setInterval(()=>{ cameraCancel(); GlobeState.zoom=Math.max(1.0,Math.min(16,GlobeState.zoom*(f>1?1.06:1/1.06))); globeMark(); },50); },300); });
  const stop=()=>{ clearTimeout(ht); clearInterval(rt); ht=rt=null; };
  btn.addEventListener('pointerup',stop); btn.addEventListener('pointerleave',stop); btn.addEventListener('pointercancel',stop);
}

// Reset view — A-ORG-1's home camera, hoisted from its two inline call sites
// ('h'/'0' key and the recenter FAB): CONUS at ease. Home flies, never snaps.
function resetGlobeView(){
  flyToLatLon(38, -98, 2.3);
}

//      (§2). The diamond/triangle shape grammar is not ported because A-ORG-1 itself
//      retired it (v16.15.0: "everything is a circle"); _markerPath is therefore
//      inlined as plain arcs. The v18.4.1 arc-endpoint labeling pass is dropped
//      because every arc endpoint here IS a drawn dot (no filters hide them) — chain
//      labels render in the dot loop instead.
//   6. Selection sync is LAZY as well as explicit: drawGlobeMarkers rebuilds the arc
//      sets when GlobeState.sel changed since the last frame (A-ORG-1 called
//      _syncSelArcs from every selection path; A-ORG-2's selection owner just sets
//      GlobeState.sel + dirty and this module follows). _syncSelArcs stays exposed
//      for callers that want the rebuild immediately.
//   7. Chain-member labels draw at ANY zoom (the picture is the product); ordinary
//      sites climb the ported ladder — roots (parent === null, the closest thing to
//      A-ORG-1's kind:"hq") at 2.0, grp "oib" at 2.8, ordinary 3.2, guardInset 3.6,
//      grp "guard" never (A-ORG-1 skipped it outright), phones (+0.7, m.w < 700).

// CONTRACTS HONORED:
//   - Reads SITES / GlobeState at call time only — concatenation-order safe.
//   - No DOM writes, no CSS, no position:fixed, no pointer capture, no webfonts:
//     canvas drawing only, fonts via token stack with system fallback.
//   - Plain sloppy-mode JS: top-level function declarations, no modules, no classes.
//   - Redraw law: nothing here forces per-frame redraws (deviation 3).
