                  t:(n.t==='state'||n.t==='custom')?n.t:'org', r:(n.r==null?null:n.r),
                  c:(/^#[0-9a-fA-F]{6}$/.test(String(n.c||''))?String(n.c).toLowerCase():''),
                  sh:n.sh?1:0, tx:String(n.tx||'').slice(0,80)};
                // v1.4.0 — a PLACE keeps its pinned spot + host-base label
                if(typeof n.la==='number' && typeof n.lo==='number'){ m2.la=n.la; m2.lo=n.lo; m2.bs=String(n.bs||'').slice(0,60); }
                // v1.7.0 — the asset inventory rides the node
                if(Array.isArray(n.inv) && n.inv.length){ const iv=_bfInvClean(n.inv); if(iv.length) m2.inv=iv; }
                return m2;
              });
              BRIEF.nodes.forEach(function(n){ if(n.p && !BRIEF.nodes.some(function(x){ return x.k===n.p; })) n.p=null; });
              _bfSync();
            } else {
              // v1 → v2 MIGRATION: a flat {mem, ann} list becomes real nodes. The
              // structure it USED to derive is frozen in as each node's own parent,
              // so an existing brief reopens looking identical — and is now movable.
              const srcIds=Array.isArray(v.mem)?v.mem:(Array.isArray(v.hqs)?v.hqs:[]);
              const mapped=[]; const seenM={};
              srcIds.forEach(function(id){
                const k=(typeof _bfOrgId==='function')?_bfOrgId(id):id;
                if(k && !seenM[k]){ seenM[k]=1; mapped.push(k); }
              });
              const oldAnn=v.ann||{}; const annN={};
              for(const k in oldAnn){ const nk=(typeof _bfOrgId==='function')?(_bfOrgId(k)||k):k; if(!annN[nk]) annN[nk]=oldAnn[k]; }
              const inSet={}; mapped.forEach(function(k){ inSet[k]=1; });
              BRIEF.nodes=mapped.map(function(k){
                let par=null, up=(typeof _bfParentOf==='function')?_bfParentOf(k):null, hops=0;
                while(up && ++hops<40){ if(inSet[up]){ par=up; break; } up=_bfParentOf(up); }
                const o=(typeof orgOf==='function'&&orgOf(k))||(typeof orgById==='function'?orgById(k):null);
                return {k:k, n:o?o.name:k, p:par, t:'org', r:k, c:'', sh:0, tx:String(annN[k]||'').slice(0,80)};
              });
              _bfSave();
            }
          }
          try{ if(document.body.classList.contains('brief-mode')) renderBrief(); }catch(_){}
          try{ globeMark(); }catch(_){}
        };
      }catch(_){}
    };
  }catch(_){}
}

// ---- THE BRIEF SET (v0.13.0) — HAND-BUILT: mem lists exactly the orgs the
// owner added (HQs and the specific subordinates picked under them); hide
// lists the L1 group ids currently eyed off; ann keys ≤80-char callouts.
// v0.24.0 — THE BRIEF IS A DIAGRAM YOU BUILD (A-ORG-1's briefing ability, in
// A-ORG-2's format). Structure is STORED, never derived: every node carries its
// OWN parent, so anything can be a peer, a parent or a subordinate of anything
// else regardless of the real Army tree. A node is one of three kinds:
//   t:'org'    r=org id      — a real organization (carries its real location)
//   t:'state'  r=state name  — a US state: highlighted polygon, optional stripes
//   t:'custom' r=null        — a free-text box for a proposed/notional element
// node = { k:key, n:name, p:parentKey|null, t:kind, r:ref, c:color, sh:stripe, tx:note }
// BRIEF.mem / BRIEF.ann stay as maintained MIRRORS so exports and the harnesses
// keep reading one shape; _bfSync rebuilds them after every mutation.
const BRIEF={ nodes:[], mem:[], ann:{}, hide:[], vert:[] };   // vert: chart levels (2-4) stacked vertically
let _bfMod=0;                                     // v1.2.0: last local edit — the board merges newest-wins
function _bfSync(){
  BRIEF.mem=BRIEF.nodes.map(function(n){ return n.k; });
  const a={}; BRIEF.nodes.forEach(function(n){ if(n.tx) a[n.k]=n.tx; });
  BRIEF.ann=a;
}
function _bfSave(){
  _bfSync();
  _bfMod=Date.now();                              // v1.2.0: the board merges newest-wins
  try{ if(_rdb){ const tx=_rdb.transaction('kv','readwrite');
    tx.objectStore('kv').put({k:'brief', v:{v:2, nodes:BRIEF.nodes, hide:BRIEF.hide, vert:BRIEF.vert, mod:_bfMod}}); } }catch(_){}
  try{ dbPush(); }catch(_){}                      // the diagram rides the database board too
}
// v1.7.0 ASSET INVENTORY (owner: "in brief object pop out need an asset
// inventory list to add QTYs and descriptions for specific sites"). Rows of
// {q:qty-text, d:description} live ON the node, so they ride kv 'brief', the
// board snapshot and saved briefs with zero extra plumbing. This sanitizer is
// the single gate every load path uses (kv, board, saved-brief restore).
function _bfInvClean(a){
  if(!Array.isArray(a)) return [];
  return a.slice(0,40)
    .map(function(it){ return {q:String((it&&it.q)||'').slice(0,10), d:String((it&&it.d)||'').slice(0,60)}; })
    .filter(function(it){ return it.d; });
}
function bfNode(k){ for(const n of BRIEF.nodes) if(n.k===k) return n; return null; }
function bfKids(k){ return BRIEF.nodes.filter(function(n){ return (n.p||null)===(k||null); }); }
// v0.11.0 law kept: a SITE id resolves to the site's primary org, so a caller may
// still hand us a base and get one organization — never a duplicate pair.
function _bfOrgId(id){
  if(typeof orgOf==='function' && orgOf(id)) return id;
  if(typeof orgById==='function' && orgById(id)) return id;      // user-built custom
  if(siteById(id)){ const p=(typeof ogPrimary==='function')?ogPrimary(id):null; if(p) return p.id; }
  return null;
}
function bfHas(id){ const k=_bfOrgId(id)||id; return !!bfNode(k); }
// the key namespace: an org node IS its org id, so bfHas(orgId) stays true.
function _bfStateKey(name){ return 'st:'+String(name); }
function bfStateName(k){ const m=/^st:(.+)$/.exec(String(k||'')); return m?m[1]:null; }

// v0.10.0 AUTOMATION: when the chain GROWS while the brief room is open, the
// globe gently reframes to hold the whole picture, and the chart's export
// button pulses once — the app offers the next step without saying a word.
function _bfFrame(){
  try{
    if(!document.body.classList.contains('brief-mode')) return;
    const C=_briefChainMap(); if(!C.order.length) return;
    const d=Math.PI/180; let x=0,y=0,z=0,n=0; const pts=[];
    C.order.forEach(function(k){ const nd=C.nodes[k];
      if(nd.lat==null||nd.lon==null) return;
      pts.push(nd);
      x+=Math.cos(nd.lat*d)*Math.cos(nd.lon*d); y+=Math.cos(nd.lat*d)*Math.sin(nd.lon*d); z+=Math.sin(nd.lat*d); n++;
    });
    if(!n) return;
    const L=Math.hypot(x,y,z)||1;
    const cLat=Math.asin(Math.max(-1,Math.min(1,z/L)))/d, cLon=Math.atan2(y,x)/d;
    let maxSep=0;
    pts.forEach(function(p){
      const a=[Math.cos(cLat*d)*Math.cos(cLon*d),Math.cos(cLat*d)*Math.sin(cLon*d),Math.sin(cLat*d)];
      const b=[Math.cos(p.lat*d)*Math.cos(p.lon*d),Math.cos(p.lat*d)*Math.sin(p.lon*d),Math.sin(p.lat*d)];
      let dot=a[0]*b[0]+a[1]*b[1]+a[2]*b[2]; dot=Math.max(-1,Math.min(1,dot));
      maxSep=Math.max(maxSep, Math.acos(dot)/d);
    });
    const zoom = maxSep>120?1.05 : maxSep>80?1.3 : maxSep>45?1.7 : maxSep>20?2.3 : (n===1?3.2:2.8);
    flyToLatLon(cLat, cLon, Math.max(1.0, Math.min(14, zoom)));
  }catch(_){}
}
function _xpPulse(){
  try{
    let b=document.querySelector('#briefStage [data-xpbtn]'); if(!b) return;
    b=(b.querySelector && b.querySelector('.od-ico'))||b;   // v1.9.0: pulse the circle, not the labeled wrapper
    b.classList.remove('xp-pulse'); void b.offsetWidth;   // restart the beat
    b.classList.add('xp-pulse');
    setTimeout(function(){ try{ b.classList.remove('xp-pulse'); }catch(_){} }, 2900);
  }catch(_){}
}
// ── MUTATORS. Every add takes an optional parent key, so the caller decides the
// relationship (subordinate to X / peer of X / top-level) instead of the app
// guessing it from the real Army tree.
function _bfPush(node){
  if(bfNode(node.k)) return null;
  if(node.p && !bfNode(node.p)) node.p=null;      // never strand a node under a ghost
  BRIEF.nodes.push(node); _bfSave();
  try{ renderBrief(); }catch(_){}
  try{ globeMark(); }catch(_){}
  try{ _bfFrame(); _xpPulse(); }catch(_){}
  return node;
}
// add a REAL organization. parent omitted → its nearest already-added real
// ancestor (so a natural build still nests itself), else top level.
function bfAdd(id, parent){
  id=_bfOrgId(id);
  if(!id || bfNode(id)) return;
  const o=(typeof orgOf==='function'&&orgOf(id))||(typeof orgById==='function'?orgById(id):null);
  if(!o) return;
  let p=(parent===undefined)?null:parent;
  if(parent===undefined){
    let up=_bfParentOf(id), hops=0;
    while(up && ++hops<40){ if(bfNode(up)){ p=up; break; } up=_bfParentOf(up); }
  }
  p=_bfTakeParent(p);            // an armed "add under X" wins over the natural nesting
  _bfPush({k:id, n:o.name, p:p||null, t:'org', r:id, c:'', sh:0, tx:''});
}
// add a US STATE — it paints as a highlighted polygon on the globe
function bfAddState(name, parent){
  const st=(typeof US_STATES!=='undefined')?US_STATES.find(function(s){ return s.n===name; }):null;
  if(!st) return;
  parent=_bfTakeParent(parent||null);
  _bfPush({k:_bfStateKey(st.n), n:st.n, p:parent||null, t:'state', r:st.n, c:'', sh:0, tx:''});
}
// add a GROUP — an owner-named filler element with no app record (v1.0.3 face
// of the old free-text custom box; same storage, so old briefs load unchanged).
// It shapes the hierarchy: anything can nest under it, and it under anything.
function bfAddCustom(name, parent){
  name=String(name||'').slice(0,60).trim(); if(!name) return;
  parent=_bfTakeParent(parent||null);          // an armed "add under X" is honoured here too
  _bfPush({k:'cx:'+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36),
    n:name, p:parent||null, t:'custom', r:null, c:'', sh:0, tx:''});
}
// rename a GROUP in place (real orgs and states keep their true names)
function bfRename(k, name){
  const n=bfNode(k); if(!n || n.t!=='custom') return;
  name=String(name||'').slice(0,60).trim(); if(!name) return;
  n.n=name; _bfSave();
  try{ renderBrief(); }catch(_){}
  try{ globeMark(); }catch(_){}
}
function bfRemove(id){
  const k=(_bfOrgId(id)||id);
  if(!bfNode(k)) return;
  // CASCADE over the STORED tree: a node's descendants leave with it, no orphans
  const gone=new Set([k]); let grew=true, guard=0;
  while(grew && ++guard<60){ grew=false;
    BRIEF.nodes.forEach(function(n){ if(!gone.has(n.k) && n.p && gone.has(n.p)){ gone.add(n.k); grew=true; } });
  }
  BRIEF.nodes=BRIEF.nodes.filter(function(n){ return !gone.has(n.k); });
  BRIEF.hide=(BRIEF.hide||[]).filter(function(r){ return !gone.has(r); });
  if(GlobeState._bfFocus && gone.has(GlobeState._bfFocus)) GlobeState._bfFocus=null;
  _bfSave();
  try{ renderBrief(); }catch(_){}
  try{ globeMark(); }catch(_){}
}
// ⇄ MOVE UNDER — re-parent a node (its subtree follows). Cycles are refused.
function bfMove(k, newParent){
  const n=bfNode(k); if(!n) return false;
  newParent=newParent||null;
  if(newParent===k) return false;
  let c=newParent, guard=0;                       // would newParent sit inside k's own subtree?
  while(c && ++guard<60){ if(c===k) return false; const pn=bfNode(c); c=pn?pn.p:null; }
  if(newParent && !bfNode(newParent)) return false;
  n.p=newParent; _bfSave();
  try{ renderBrief(); }catch(_){}
  try{ globeMark(); }catch(_){}
  return true;
}
// ◀▶ REORDER among same-parent sisters (chart order = array order)
function bfReorder(k, dir){
  const n=bfNode(k); if(!n) return false;
  const sibs=bfKids(n.p); const i=sibs.indexOf(n);
  const j=i+(dir<0?-1:1);
  if(i<0 || j<0 || j>=sibs.length) return false;
  const a=BRIEF.nodes.indexOf(sibs[i]), b=BRIEF.nodes.indexOf(sibs[j]);
  BRIEF.nodes[a]=sibs[j]; BRIEF.nodes[b]=sibs[i];
  _bfSave();
  try{ renderBrief(); }catch(_){}
  try{ globeMark(); }catch(_){}
  return true;
}
// per-node COLOR — a state tints its highlight, any other node tints its chip
function bfColor(k, hex){
  const n=bfNode(k); if(!n) return;
  n.c=(/^#[0-9a-fA-F]{6}$/.test(String(hex||'')))?String(hex).toLowerCase():'';
  _bfSave();
  try{ renderBrief(); }catch(_){}
  try{ globeMark(); }catch(_){}
}
// ▨ STRIPED FILL — diagonal attention lines across a highlighted state
function bfStripe(k){
  const n=bfNode(k); if(!n) return;

function bfNote(id, text){
  const n=bfNode(_bfOrgId(id)||id); if(!n) return;

// v1.5.0 — STACK A LEVEL (owner: "pick a level L2, L3, L4 to stack
// vertically; keep horizontal by default"). Toggles ride the diagram: kv,
// the board, every device.
function bfStack(n){

function orgById(id){ for(let i=0;i<ORGS.length;i++) if(ORGS[i].id===id) return ORGS[i]; return null; }

function orgRemove(id){

/* ═══ v1.1.0 THE DATABASE DOOR — the inception concept, finally built.
   Records (People · Specs · Notes · Links · the ID registry) live in the
   owner's own database (Supabase), not on the device. The A-ORG-1 contract
   holds verbatim: ZERO foreign code at boot — the client library is injected
   by ensureSupabase() only when the owner taps Connect; Connect is manual
   each session. One board row carries the whole records map (jsonb), a
   realtime channel mirrors other devices, updated_by kills echo loops.
   IndexedDB stays as the offline cache under it (a PWA must open in a dead
   zone); the database is the source of truth whenever connected. ═══ */
let _db=null, _dbCh=null, _dbCfg=null, _dbState='off', _dbMsg='Not connected';
let _dbPushT=null;
const _dbClientId=Math.random().toString(36).slice(2)+Date.now().toString(36);
const DB_TABLE='a2_records';
function _dbSetState(st, msg){
  _dbState=st; _dbMsg=msg||'';
  try{ const el=document.getElementById('dbStatus');
    if(el){ el.textContent=_dbMsg;
      el.className='db-status '+(st==='live'?'db-live':(st==='error'?'db-error':(st==='connecting'?'db-connecting':'db-off'))); } }catch(_){}
  try{ const ch=document.querySelector('.am-dbchip');
    if(ch){ ch.textContent=(st==='live')?'LIVE':(st==='connecting'?'…':(st==='error'?'ERR':'OFF'));
      ch.className='am-dbchip '+(st==='live'?'am-db-live':(st==='error'?'am-db-error':'am-db-off')); } }catch(_){}
}
function _dbCfgSave(cfg){

  try{ if(_rdb){ const tx=_rdb.transaction('kv','readwrite'); tx.objectStore('kv').put({k:'dbcfg', v:cfg}); } }catch(_){}
}
function ensureSupabase(){
  return new Promise(function(res){
    if(window.supabase && window.supabase.createClient) return res(true);
    var ex=document.getElementById('sbLib');
    if(ex){
      ex.addEventListener('load', function(){ res(!!(window.supabase&&window.supabase.createClient)); }, {once:true});
      ex.addEventListener('error', function(){ res(false); }, {once:true});
      return;
    }
    var sc=document.createElement('script');
    sc.id='sbLib'; sc.crossOrigin='anonymous';
    sc.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7';   // dead-lint allowlisted: injected on MANUAL Connect only
    sc.onload=function(){ res(!!(window.supabase&&window.supabase.createClient)); };
    sc.onerror=function(){ _dbSetState('error','Database library failed to load (offline or CDN blocked) — the app is unaffected.'); res(false); };
    document.head.appendChild(sc);
  });
}
function _dbSnapshot(){
  // v1.2.0 — the board carries the whole working set: records, the brief
  // diagram (groups included) and saved views. Each part merges newest-wins.
  return {v:2, records:RECORDS,
    brief:{nodes:BRIEF.nodes, hide:BRIEF.hide, vert:BRIEF.vert, mod:_bfMod},
    views:{list:SAVEDV, mod:_svMod},
    briefs:{list:SAVEDB, mod:_sbMod}};             // v1.7.0: the saved-brief shelf rides too
}
function _dbApply(data){
  if(!data) return;
  let took=0;
  Object.keys(data.records||{}).forEach(function(k){
    const r2=data.records[k]; if(!r2||!r2.id) return;
    if(!r2.ids) r2.ids=[];
    const loc=RECORDS[k];
    if(!loc || (r2.mod||0)>=(loc.mod||0)){       // newest record wins, per record
      RECORDS[k]=r2; took++;
      try{ if(_rdb){ const tx=_rdb.transaction('records','readwrite'); tx.objectStore('records').put(r2); } }catch(_){}
    }
  });
  // v1.2.0 — the brief diagram: one blob, newest edit wins. Write kv DIRECTLY
  // (never through _bfSave — that would dbPush the merge back out, an echo).
  if(data.brief && Array.isArray(data.brief.nodes) && (data.brief.mod||0)>(_bfMod||0)){
    const seen={};
    BRIEF.nodes=data.brief.nodes.filter(function(n){
      if(!n || typeof n.k!=='string' || seen[n.k]) return false;
      if(n.t==='org' && !((typeof orgOf==='function'&&orgOf(n.r))||(typeof orgById==='function'&&orgById(n.r)))) return false;
      seen[n.k]=1; return true;
    });
    BRIEF.nodes.forEach(function(n){ if(n.p && !BRIEF.nodes.some(function(x){ return x.k===n.p; })) n.p=null; });
    BRIEF.hide=Array.isArray(data.brief.hide)?data.brief.hide.slice():[];
    BRIEF.vert=Array.isArray(data.brief.vert)?data.brief.vert.slice():[];
    _bfMod=data.brief.mod; _bfSync();
    try{ if(_rdb){ const tx=_rdb.transaction('kv','readwrite');
      tx.objectStore('kv').put({k:'brief', v:{v:2, nodes:BRIEF.nodes, hide:BRIEF.hide, vert:BRIEF.vert, mod:_bfMod}}); } }catch(_){}
    took++;
    try{ if(document.body.classList.contains('brief-mode')){ renderBrief(); globeMark(); } }catch(_){}
  }
  // v1.2.0 — saved views: same law
  if(data.views && Array.isArray(data.views.list) && (data.views.mod||0)>(_svMod||0)){
    SAVEDV=data.views.list.slice(); _svMod=data.views.mod;
    try{ if(_rdb){ const tx=_rdb.transaction('kv','readwrite');
      tx.objectStore('kv').put({k:'views', v:{v:1, list:SAVEDV, mod:_svMod}}); } }catch(_){}
    took++;
  }
  // v1.7.0 — saved briefs: same law (write kv directly — never via _sbSave, echo law)
  if(data.briefs && Array.isArray(data.briefs.list) && (data.briefs.mod||0)>(_sbMod||0)){
    SAVEDB=data.briefs.list.slice(); _sbMod=data.briefs.mod;
    try{ if(_rdb){ const tx=_rdb.transaction('kv','readwrite');
      tx.objectStore('kv').put({k:'briefs', v:{v:1, list:SAVEDB, mod:_sbMod}}); } }catch(_){}
    took++;
  }
  if(took){
    try{ const dz=document.getElementById('dossier');
      if(dz && !dz.hidden && GlobeState.sel) showDossier(GlobeState.sel); }catch(_){}
    // v1.8.0: an open repository re-reads whatever the merge brought in
    try{ const lp=document.getElementById('ledger'); if(lp && lp.classList.contains('on')) _ledgerRender(); }catch(_){}
  }
}
// ── v1.2.0 THE RECONNECT CHIP — settings exist but this session is offline:
// one tap goes live. The law holds — NOTHING foreign loads until the tap.
function _dbChipShow(){
  try{
    if(!_dbCfg || !_dbCfg.url || _db) return;
    if(!document.body || !document.createElement) return;
    if(document.getElementById('dbChip')) return;
    const el=document.createElement('button');
    el.id='dbChip'; el.type='button';
    el.innerHTML='<span class="dbc-dot"></span>Reconnect database<span class="dbc-x" data-dbchipx="1" role="button" aria-label="Not now">✕</span>';
    el.addEventListener('click', function(ev){
      if(ev.target && ev.target.closest && ev.target.closest('[data-dbchipx]')){ el.remove(); return; }
      el.classList.add('busy'); el.disabled=true;
      dbConnect().then(function(ok){ try{ el.remove(); }catch(_){}
        if(ok){ try{ _bfToast('Database live — records save off-device'); }catch(_){} }
        else { try{ _dbSheet(); }catch(_){} }      // trouble → the full sheet says why
      });
    });
    document.body.appendChild(el);
    setTimeout(function(){ try{ el.classList.add('in'); }catch(_){} }, 60);
    setTimeout(function(){ try{ if(!el.disabled) el.remove(); }catch(_){} }, 25000);   // quiet exit; it returns next boot
  }catch(_){}
}
function dbPush(){
  if(!_db || !_dbCfg) return;                     // not connected: IndexedDB cache only
  clearTimeout(_dbPushT);
  _dbPushT=setTimeout(async function(){
    try{
      const { error }=await _db.from(DB_TABLE).upsert({ id:_dbCfg.board, data:_dbSnapshot(),
        updated_at:new Date().toISOString(), updated_by:_dbClientId });
      if(error) _dbSetState('error','Save to database failed: '+error.message);
      else _dbSetState('live','Database live — saved '+new Date().toLocaleTimeString());
    }catch(e){ _dbSetState('error','Save error: '+(e&&e.message||e)); }
  }, 700);
}
async function dbPullOnce(){
  try{
    const { data, error }=await _db.from(DB_TABLE).select('data,updated_by').eq('id',_dbCfg.board).maybeSingle();
    if(error){ _dbSetState('error','Load failed: '+error.message+' — is the '+DB_TABLE+' table created?'); return false; }
    if(data && data.data) _dbApply(data.data);
    else await _db.from(DB_TABLE).upsert({ id:_dbCfg.board, data:_dbSnapshot(),
      updated_at:new Date().toISOString(), updated_by:_dbClientId });   // first device seeds the board
    return true;
  }catch(e){ _dbSetState('error','Load error: '+(e&&e.message||e)); return false; }
}
async function dbConnect(){
  const cfg=_dbCfg;
  if(!cfg || !cfg.url || !cfg.key){ _dbSetState('off','Not configured — enter the project URL and key.'); return false; }
  _dbSetState('connecting','Connecting…');
  const ok=await ensureSupabase();
  if(!ok) return false;
  try{
    dbDisconnect(true);
    _db=window.supabase.createClient(cfg.url, cfg.key, { realtime:{ params:{ eventsPerSecond:5 } } });
    const pulled=await dbPullOnce();
    if(!pulled){ _db=null; return false; }
    _dbCh=_db.channel('a2-'+cfg.board)
      .on('postgres_changes', { event:'*', schema:'public', table:DB_TABLE, filter:'id=eq.'+cfg.board }, function(payload){
        const row=payload.new||{};
        if(row.updated_by===_dbClientId) return;   // our own write echoing back
        if(row.data) _dbApply(row.data);
      })
      .subscribe(function(status){
        if(status==='SUBSCRIBED') _dbSetState('live','Database live — records save off-device and mirror your other devices.');
        else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT') _dbSetState('error','Realtime channel error — saves still reach the database; live mirroring may lag.');
      });
    _dbSetState('live','Connected — records now live in your database.');
    return true;
  }catch(e){ _dbSetState('error','Connect failed: '+(e&&e.message||e)); _db=null; return false; }
}
function dbDisconnect(silent){
  try{ if(_dbCh && _db) _db.removeChannel(_dbCh); }catch(_){}
  _dbCh=null; _db=null;
  if(!silent) _dbSetState('off','Disconnected — new records stay on this device until you reconnect.');
}

/* ============================================================================
   s6-export (NEW at v0.2.0) — THE SNAPSHOT SPINE. The flagship export contract:
   buildSnapshot(scope) is the ONE producer every exporter consumes — take what
   the map shows AND the data beneath it, in one serializable object. Future
   layers (M2 datastore people/notes/equipment, M3 brief chains) ATTACH to
   Snapshot.sites rows / Snapshot.extras — renderers never learn app internals,
   so export never has to be rebuilt. Renderers today: PNG · PDF (print) ·
   HTML dossier (self-contained file) · JSON.
   ========================================================================= */

// scope: 'auto' (selection family if selected, else everything visible-eligible)
function buildSnapshot(scope){
  scope=scope||'auto';
  const sel=GlobeState.sel?siteById(GlobeState.sel):null;
  const off=_famOffSet();
  // v0.11.0: the selection family = the selected ORG's chain, at their sites
  const og=(GlobeState.selOrg&&typeof orgOf==='function')?orgOf(GlobeState.selOrg):null;
  const chain=og?ogChainUp(og.id).map(function(p){ return siteById(ogEffSite(p.id)||''); }).filter(Boolean):[];
  const kids=og?ogKids(og.id).map(function(k){ return siteById(ogEffSite(k.id)||''); }).filter(Boolean):[];
  let rows;
  if(sel && scope!=='all'){
    rows=[sel].concat(chain, kids);
  } else {
    rows=_sitesArr().filter(function(st){ return !off.has(clsOf(st.id)); });
  }
  const seen=new Set(); rows=rows.filter(function(r){ if(!r||seen.has(r.id)) return false; seen.add(r.id); return true; });
  const famCounts={}; rows.forEach(function(r){ const k=clsOf(r.id); famCounts[k]=(famCounts[k]||0)+1; });
  let img=null;
  try{ const cv=document.getElementById('globeCanvas'); if(cv&&cv.toDataURL) img=cv.toDataURL('image/png'); }catch(_){}
  const cam=(function(){ try{ return {zoom:GlobeState.zoom, yaw:GlobeState.yaw, pitch:GlobeState.pitch}; }catch(_){ return {}; } })();
  return {
    meta:{ app:'A-ORG-2', version:(typeof APP_VERSION!=='undefined'?APP_VERSION:''),
           generated:new Date().toISOString(),
           title: (function(){ try{ if(document.body.classList.contains('brief-mode')&&BRIEF.mem.length){ const Ct=_briefChainMap({all:true}); const r0=Ct.order.filter(function(k){ return Ct.nodes[k].lvl===1; }); const h0=r0.length?Ct.nodes[r0[0]]:null; return 'Brief — '+(h0?h0.name:'')+(r0.length>1?(' +'+(r0.length-1)):''); } }catch(_){} const _po=(GlobeState.selOrg&&typeof orgOf==='function')?orgOf(GlobeState.selOrg):null; return sel ? (sel.base+(_po?(' — '+_po.name):'')) : 'U.S. Army — global laydown'; })(),
           scope: sel&&scope!=='all' ? 'selection-family' : 'all-visible' },
    camera:cam,
    selection: sel ? { id:sel.id, chainUp:chain.map(function(c){return c.id;}), children:kids.map(function(k){return k.id;}) } : null,
    filters:{ classesOff:Array.from(off) },
    classes:famCounts,
    sites:rows.map(function(r){ return { id:r.id, base:r.base, st:r.st, unit:r.unit,
      lat:r.lat, lon:r.lon, grp:r.grp, parent:r.parent, cls:clsOf(r.id) }; }),
    extras:{ brief:(BRIEF.mem.length?(function(){
      const Cb=_briefChainMap({all:true});
      return { mem:BRIEF.mem.slice(), hide:(BRIEF.hide||[]).slice(),
        hqs:Cb.order.filter(function(k){ return Cb.nodes[k].lvl===1; }),
        ann:JSON.parse(JSON.stringify(BRIEF.ann)),
        rows:Cb.order.map(function(k){ const n=Cb.nodes[k];
          let siteName='';
          if(n.custom){ const c=orgById(n.id); const b=(c&&c.base)?siteById(c.base):null; siteName=b?b.base:''; }
          else { const s2=siteById(ogEffSite(n.id)||''); siteName=s2?s2.base:''; }
          return {id:n.id, name:n.name, lvl:n.lvl, root:n.root, custom:n.custom,
            site:siteName, note:BRIEF.ann[n.id]||''};
        }) };
    })():null),
      orgs:((typeof ORGS!=='undefined'&&ORGS.length)?JSON.parse(JSON.stringify(ORGS)):null),   // custom subordinates ride too (v0.7.0)
      records:(function(){                     // the datastore rides every export
      const out={}; if(typeof recordOf==='function') rows.forEach(function(r){ const rec=recordOf(r.id); if(rec && recCount(r.id)) out[r.id]=rec; });
      return out; })() },
    image:img,
  };
}

// ---- shared download helper (app context — a real user gesture each time) -----
function _xpDownload(name, mime, data){
  try{
    const blob=(data instanceof Blob)?data:new Blob([data],{type:mime});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download=name;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ try{ URL.revokeObjectURL(a.href); a.remove(); }catch(_){} }, 800);
  }catch(e){ try{ window._errToast&&_errToast('export failed: '+e.message); }catch(_){} }
}
function _xpStamp(){ const d=new Date(); const p=function(n){return (n<10?'0':'')+n;};
  return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes()); }
function _xpSlug(sn){ return (sn.selection?sn.selection.id:'laydown'); }

// ---- ① PNG — the stage as shown, title + legend burned in ---------------------
function exportPNG(){
  const sn=buildSnapshot();
  const cv=document.getElementById('globeCanvas'); if(!cv) return;
  const W=cv.width, HEAD=Math.round(58*(window.devicePixelRatio||1)), FOOT=Math.round(40*(window.devicePixelRatio||1));
  const out=document.createElement('canvas'); out.width=W; out.height=cv.height+HEAD+FOOT;
  const cx=out.getContext('2d'); const T=_mTok();
  cx.fillStyle='rgb('+T.ground+')'; cx.fillRect(0,0,out.width,out.height);
  cx.drawImage(cv,0,HEAD);
  const fs=Math.round(HEAD*0.34);
  cx.fillStyle='rgb('+T.text+')'; cx.font='800 '+fs+'px '+T.body;
  cx.textBaseline='middle'; cx.fillText(sn.meta.title, Math.round(HEAD*0.35), Math.round(HEAD*0.52));
  cx.font='600 '+Math.round(fs*0.62)+'px '+T.body; cx.fillStyle='rgba('+T.text+',.62)';
  const when=new Date(sn.meta.generated).toLocaleString();
  cx.fillText(sn.meta.app+' '+sn.meta.version+' · '+when+' · '+sn.sites.length+' sites', Math.round(HEAD*0.35), out.height-FOOT*0.5);
  _xpDownload('a-org-2-'+_xpSlug(sn)+'-'+_xpStamp()+'.png','image/png',
    (function(){ const b=atob(out.toDataURL('image/png').split(',')[1]); const u=new Uint8Array(b.length);
      for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return new Blob([u],{type:'image/png'}); })());
}

// LCD format with ability to select the zone"). Two 7-segment cells on the stage:
//   #clockTL  LOCAL  — the platform zone, named (EDT/CST…), never an offset.
//   #clockTR  SELECT — any of 12 theater zones; auto-fills from every selection

// Ported from A-ORG-1 (consult report 1 recovered the seg7 geometry from

//   SEG7_MAP/seg7Digit/seg7HTML (~L13380/18599)  the font-free digit: 12×21px box,
//                                  seven clip-path bars, lit = accent + 4px glow.
//   civilianTime         (~L18780)  12h "hh:mm"+AM/PM via formatToParts, leading-
//                                  zero hours (LCD digits always 2+2), '--:--' face.

//   CLOCK_REGIONS + nearest-region auto-fill (v18.3, ~L22576)  the 12 anchors and
//                                  the dateline-safe dlon wrap; manual > auto;

//                                  the face key changed (minute boundaries).

//   cell grammar         (~L4290 .bar-time)  digits row (.bt-t) + AM/PM chip

//      the timer sleeps to the next :00). _setSelZone repaints instantly by

// ---- seg7 engine (PORTED verbatim; geometry from ada3f5d~1 L982-988) ----------
const SEG7_MAP={'0':'abcdef','1':'bc','2':'abged','3':'abgcd','4':'fgbc','5':'afgcd','6':'afgedc','7':'abc','8':'abcdefg','9':'abcfgd','-':'g',' ':''};
function seg7Digit(ch){
  const on=SEG7_MAP[ch]!==undefined?SEG7_MAP[ch]:'';
  let s='<span class="seg7-d">';
  ['a','b','c','d','e','f','g'].forEach(function(g){ s+='<i class="sg sg-'+g+(on.indexOf(g)>=0?' on':'')+'"></i>'; });
  return s+'</span>';
}
function seg7HTML(str){
  let s='<span class="seg7">';
  for(const ch of String(str)) s+= ch===':' ? '<span class="seg7-colon"><i></i><i></i></span>' : seg7Digit(ch);
  return s+'</span>';
}

// 12h civilian face for an IANA zone (PORTED ~L18780: leading-zero hours — the
// LCD always shows 2+2 digits; '--:--' failure face maps to segment g / blank).
function civilianTime(tz, d){
  d=d||new Date();
  try{
    const p=new Intl.DateTimeFormat('en-US',{timeZone:tz,hour:'numeric',minute:'2-digit',hour12:true}).formatToParts(d);
    let hh='12',mm='00',ap='AM';
    p.forEach(function(x){ if(x.type==='hour')hh=x.value; if(x.type==='minute')mm=x.value; if(x.type==='dayPeriod')ap=x.value.toUpperCase(); });
    return {time:hh.padStart(2,'0')+':'+mm, ap:ap};
  }catch(_){ return {time:'--:--', ap:''}; }
}

// text-body escape (A-ORG-1 esc ~L14030, renamed — s3 precedent)
function _ckEsc(v){ return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// nearest theater region (PORTED exact: dlon wrapped ±180, lon scaled by
// cos(mean lat) — dateline-safe; min squared-degrees wins)
function nearRegion(lat, lon){
  let best=null, bs=1e9;
  CLOCK_REGIONS.forEach(function(r){
    const dlat=lat-r.ll[0], dlon=((lon-r.ll[1]+540)%360)-180;
    const s=dlat*dlat + Math.pow(dlon*Math.cos(((lat+r.ll[0])/2)*Math.PI/180), 2);
    if(s<bs){ bs=s; best=r; }
  });
  return best;
}

// guard; an early fire no-ops on the latch and the re-arm self-corrects).

      if(!z || /GMT|UTC/i.test(z)) z=(String(ltz).split('/').pop()||'').replace(/_/g,' ');

      var ae=document.activeElement;
      var typing=!!(ae && (ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'||ae.isContentEditable));
      var k=(e.key==='k'||e.key==='K') && (e.metaKey||e.ctrlKey);
      var slash=e.key==='/' && !e.metaKey && !e.ctrlKey && !e.altKey && !typing;
      if(!k && !slash) return;
      var si=document.getElementById('searchInput');
      if(si){ si.focus(); try{ si.select(); }catch(_){} e.preventDefault(); }
    });
    document.addEventListener('click', function(e){
      if(!e.target||!e.target.closest) return;
      // BACK = undo one step (owner law): restore the last camera+selection
      // snapshot. Stays OPEN — undo invites repeats.
      if(e.target.closest('#navSat-back')){
        try{
          var st=(GlobeState._undo||[]).pop();
          if(st){
            // kill any live camera writer FIRST — a fly tween or flick-glide
            // would silently re-steer the restored camera (audit finding 1)
            try{ cameraCancel(); }catch(_){}
            GlobeState._gliding=false; GlobeState._velDX=0; GlobeState._velDY=0; GlobeState.spin=false;
            GlobeState.yaw=st.yaw; GlobeState.pitch=st.pitch; GlobeState.zoom=st.zoom;
            try{ if(typeof _rebuildGlobeQ==='function') _rebuildGlobeQ(); }catch(_){}
            try{ globeMark(); }catch(_){}
            if(st.sel!=null && siteById(st.sel)) selectSite(st.sel, {keepCam:true, noUndo:true});
            else selectSite(null, {noUndo:true});
            try{ var wantBrief=!!st.brief, isBrief=document.body.classList.contains('brief-mode');
              if(wantBrief!==isBrief) setMode(wantBrief?'brief':'map'); }catch(_){}
          }
        }catch(_){}
        _nvSet(true); return; }
      if(e.target.closest('#navSat-clear')){ _nvSet(false); try{ clearAll(); }catch(_){} return; }
      // ZOOM ± stay open — the ring is a zoom rocker while it's out.
      if(e.target.closest('#navSat-zoomout')){
        try{ GlobeState._touched=true; GlobeState.zoom=Math.max(1.0, GlobeState.zoom/1.45); globeMark(); }catch(_){}
        _nvSet(true); return; }
      if(e.target.closest('#navSat-zoomin')){
        try{ GlobeState._touched=true; GlobeState.zoom=Math.min(28, GlobeState.zoom*1.45); globeMark(); }catch(_){}
        _nvSet(true); return; }
      if(e.target.closest('#navSat-brief')){ _nvSet(false);
        try{ setMode(document.body.classList.contains('brief-mode')?'map':'brief'); }catch(_){}
        return; }
      if(e.target.closest('#navSat-saved')){ _nvSet(false); try{ _svOpenSheet(); }catch(_){} return; }
      if(e.target.closest('#navSat-layers')){ _nvSet(false);
        try{
          var p=document.getElementById('legendPanel');
          if(p){ if(p.hidden) renderLegend(); p.hidden=!p.hidden; }
        }catch(_){} return; }
    });
  }catch(_){}

  // MAINTENANCE SHEET (v0.8.0: the ⋯ tile is gone — long-press the wordmark).
  // version · records backup/restore · diagnostics · site count. Layers moved
  // to the globe button's ring (it's map control, not maintenance).
  try{
    window._renderAppMenu=function(){
      var m=document.getElementById('appMenu'); if(!m) return;
      var _rn=0; try{ for(var k in RECORDS) _rn+=recCount(k); }catch(_){}
      m.innerHTML='<div class="am-row am-ver">A-ORG-2 '+APP_VERSION+' · '+APP_UPDATED+'</div>'
        // v1.1.0 — the database door: records live off-device once connected
        +'<button class="am-row" type="button" data-am="db">Database — records off-device'
          +'<span class="am-dbchip '+(_dbState==='live'?'am-db-live':(_dbState==='error'?'am-db-error':'am-db-off'))+'">'
          +(_dbState==='live'?'LIVE':(_dbState==='connecting'?'…':(_dbState==='error'?'ERR':'OFF')))+'</span></button>'
        // v1.8.0 — the repository door (map data: IDs + everything filed under them)
        +'<button class="am-row" type="button" data-am="repo">Repository — IDs &amp; saved map data</button>'
        +'<button class="am-row" type="button" data-am="backup">Back up records ('+_rn+')</button>'
        +'<button class="am-row" type="button" data-am="restore">Restore records</button>'
        +'<button class="am-row" type="button" data-am="diag">Diagnostics</button>'
        // v1.0.0 — ABOUT: what this is + data provenance, for users who aren't the owner
        +'<div class="am-about">A-ORG-2 maps the U.S. Army — every installation and command chain on one globe, with a brief room for building and presenting your own org diagrams. Unclassified; assembled from public sources (DVIDS, army.mil).</div>'
        +'<div class="am-row am-ver">'+((typeof SITES!=='undefined'&&SITES)?SITES.length:0)+' installations · '
          +((typeof A1ORGS!=='undefined'&&A1ORGS)?A1ORGS.length:0)+' organizations · data as of '+APP_UPDATED+'</div>';
    };
    // long-press (600ms) on the wordmark — the quiet maintenance door; a plain
    // tap does nothing (the mark is identity, not a control).
    var wm=document.getElementById('wordmark');
    if(wm && !wm.__amWired){ wm.__amWired=1;
      var _amT=null, _amX=0, _amY=0;
      wm.addEventListener('pointerdown', function(e){
        _amX=e.clientX; _amY=e.clientY;
        clearTimeout(_amT);
        _amT=setTimeout(function(){
          var m=document.getElementById('appMenu'); if(!m) return;
          _renderAppMenu(); m.hidden=false;
        }, 600);
      });
      window.addEventListener('pointermove', function(e){
        if(_amT && Math.hypot(e.clientX-_amX, e.clientY-_amY)>12){ clearTimeout(_amT); _amT=null; }
      });
      ['pointerup','pointercancel'].forEach(function(ev){
        window.addEventListener(ev, function(){ clearTimeout(_amT); _amT=null; });
      });
    }
    document.addEventListener('click', function(e){
      if(!e.target||!e.target.closest) return;
      var d=e.target.closest('[data-am="diag"]');
      if(d){ try{ window._diagDump&&_diagDump(); }catch(_){} var m=document.getElementById('appMenu'); if(m) m.hidden=true; return; }
      var dbm=e.target.closest('[data-am="db"]');
      if(dbm){ var m0=document.getElementById('appMenu'); if(m0) m0.hidden=true;
        try{ _dbSheet(); }catch(_){} return; }
      var lgm=e.target.closest('[data-am="repo"]');
      if(lgm){ var mL=document.getElementById('appMenu'); if(mL) mL.hidden=true;
        try{ _ledgerOpen(); }catch(_){} return; }
      var dbc=e.target.closest('[data-dbconnect]');
      if(dbc){
        try{
          var u=(document.getElementById('dbUrl')||{}).value||'', k2=(document.getElementById('dbKey')||{}).value||'', b2=(document.getElementById('dbBoard')||{}).value||'';
          u=String(u).trim(); if(u && u.indexOf('://')<0) u='https://'+u;
          _dbCfgSave({url:u, key:String(k2).trim(), board:(String(b2).trim()||'a-org-2')});
          dbConnect().then(function(){ try{ _dbSheet(); }catch(_){} });
          _dbSetState('connecting','Connecting…');
        }catch(_){}
        return; }
      var dbx=e.target.closest('[data-dbdisconnect]');
      if(dbx){ dbDisconnect(); try{ _dbSheet(); }catch(_){} return; }
      var bk=e.target.closest('[data-am="backup"]');
      if(bk){ try{ recBackup(); }catch(_){} var m2=document.getElementById('appMenu'); if(m2) m2.hidden=true; return; }
      var rst=e.target.closest('[data-am="restore"]');
      if(rst){
        var m3=document.getElementById('appMenu'); if(m3) m3.hidden=true;
        try{
          var fi=document.createElement('input'); fi.type='file'; fi.accept='application/json';
          fi.addEventListener('change', function(){
            var f=fi.files&&fi.files[0]; if(!f) return;
            var rd=new FileReader();
            rd.onload=function(){ try{
              var n=recRestore(JSON.parse(String(rd.result)));
              try{ _errToast(n?('records restored for '+n+' org'+(n===1?'':'s')):'no records found in that file'); }catch(_){}
            }catch(err){ try{ _errToast('restore failed: '+err.message); }catch(_){} } };
            rd.readAsText(f);
          });
          fi.click();
        }catch(_){}
        return; }
      var m=document.getElementById('appMenu');
      if(m&&!m.hidden&&!e.target.closest('#appMenu')&&!e.target.closest('#wordmark')) m.hidden=true;
    });
  }catch(_){}

  // Identity is COMMITTED (owner, 20 Aug): Clean Cartography — the Atlas token
  // set in :root is THE look. The mockup switcher and the slate/field candidate
  // blocks were retired to git history @ v0.1.1; --world-glow survives as a token.
  document.documentElement.setAttribute('data-app-theme','lumen');


  // DIAGNOSTICS TOAST (PORT of A-ORG-1 ~L13977): uncaught errors + rejections
  // self-report with real details; capture lives in the first-byte head script.
  try{
    window._errToast=function(msg){
      try{
        let t=document.getElementById('errToast');
        if(!t){ t=document.createElement('div'); t.id='errToast';
          t.addEventListener('click',function(){ t.classList.remove('show'); });
          document.body.appendChild(t); }
        t.textContent='⚠ '+String(msg).slice(0,220);
        t.classList.add('show');
        clearTimeout(window.__errT); window.__errT=setTimeout(function(){ t.classList.remove('show'); }, 9000);
      }catch(_){}
    };
    // replay anything the first-byte layer logged before the toast attached
    try{ (window.__errLog||[]).slice(-1).forEach(function(e){ window._errToast(e.m+((e.s||e.l)?(' @ '+((e.s||'').split('/').pop()||'inline')+(e.l?(':'+e.l):'')):'')); }); }catch(_){}
  }catch(e){}

  // Diagnostics dump — now a ⋯ menu row (the version chip retired with the law;
  // the ring buffer + capture spine are untouched).
  window._diagDump=function(){
    const L=window.__errLog||[];
    const txt=L.length? L.map(function(e){ return '['+e.k+'] '+e.m+'\n  @ '+(e.s||'inline')+':'+e.l+':'+e.c+(e.st?('\n  '+e.st.split('\n').slice(0,3).join(' | ')):''); }).join('\n\n') : 'No errors captured this session.';
    try{ prompt('Diagnostics — last '+L.length+' error(s). Copy below:', txt.slice(0,900)); }
    catch(_){ alert(txt.slice(0,900)); }
  };

  // Sandbox banner (PORT of A-ORG-1 ~L22198): preview hosts announce themselves
  // so host console noise is never mistaken for an A-ORG-2 defect.
  try{
    if(window.__SANDBOX && !document.getElementById('sbxNote')){
      const nb=document.createElement('div'); nb.id='sbxNote';
      nb.innerHTML='⧉ <b>Preview sandbox</b> — host console noise is expected here and does not come from A-ORG-2. Test the deployed app for real signals. <button aria-label="Dismiss">✕</button>';
      nb.querySelector('button').addEventListener('click', function(){ nb.remove(); });
      document.body.appendChild(nb);
    }
  }catch(_){}
}
bootShell();

// ── v0.34.0 BOOT TITLE (retimed v1.0.2, owner: faster spin, 4–5 s) — three
// revolutions of the real globe under the big mark over ~4.6 s:
// main color → one PAPER-INVERT beat (45–72% of the flight) → main → the map.
// Tap skips. prefers-reduced-motion skips entirely (motion law). Ends exactly
// where it started (whole revolutions), so the map view lands untouched.
(function(){
  try{
    var veil=document.getElementById('introVeil');
    if(!veil || !veil.classList || typeof requestAnimationFrame!=='function') return;   // stub DOM (harness) → no intro
    var rm=false; try{ rm=window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(_){}
    if(rm || window.__SANDBOX){ try{ veil.remove(); }catch(_){} return; }
    var vv=veil.querySelector('.in-ver'); if(vv) vv.textContent=APP_VERSION;
    document.body.classList.add('intro');
    veil.hidden=false;
    var T=4600, REVS=3, t0=performance.now(), y0=GlobeState.yaw||0, n=0, done=false;
    var ease=function(p){ return p<0.5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2; };
    var fin=function(){
      if(done) return; done=true;
      try{ GlobeState._introInvert=false; GlobeState.yaw=y0; _rebuildGlobeQ(); GlobeState.dirty=true; globeMark(); }catch(_){}
      document.body.classList.remove('intro');
      veil.style.opacity='0'; veil.style.pointerEvents='none';
      setTimeout(function(){ try{ veil.remove(); }catch(_){} }, 500);
    };
    veil.addEventListener('pointerdown', fin);
    var step=function(now){
      if(done) return;
      if(++n>900){ fin(); return; }                       // hard cap — no environment may loop this
      var p=Math.min(1,(now-t0)/T);
      try{
        GlobeState.yaw=y0 - ease(p)*Math.PI*2*REVS;
        GlobeState._introInvert=(p>0.45 && p<0.72);       // the paper beat — real palette, in the renderer
        _rebuildGlobeQ(); GlobeState.dirty=true; globeMark();
      }catch(_){}
      if(p>=1){ fin(); return; }
      requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }catch(_){}
})();
</script>
