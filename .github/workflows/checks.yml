name: app-checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Data lint (sites.json invariants)
        run: node tools/data-lint.js
      - name: Globe harness (projection + arcs over all sites)
        run: node tools/harness_globe.js
      - name: Boot smoke (full boot + probes)
        run: node tools/smoke_runtime.js
      - name: Ship lint (APP_VERSION ↔ CACHE + changelog)
        run: node tools/ship-lint.js
      - name: Dead lint (unreachable CSS/JS + size budget)
        run: node tools/dead-lint.js
      # v1.28.0 — the six checks below were added in v1.26–v1.27 but never wired
      # in, so they ran once at birth and never again. A check outside CI is a
      # one-shot script, not a guard.
      - name: Brief scale check
        run: node tools/brief-scale-check.js
      - name: Brief support check
        run: node tools/brief-support-check.js
      - name: UX navigation check
        run: node tools/ux-navigation-check.js
      - name: UX persistence check
        run: node tools/ux-persistence-check.js
      - name: UX records check
        run: node tools/ux-records-check.js
      - name: UX search check
        run: node tools/ux-search-check.js
