name: A-ORG-2 prune release

on:
  push:
    paths:
      - '.github/workflows/prune-release.yml'

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply anchored prune
        run: |
          node <<'NODE'
          const fs = require('fs');
          const enc = 'utf8';
          let s = fs.readFileSync('index.html', enc);
          const before = Buffer.byteLength(s, enc);
          function rep(oldText, newText, n=1){
            const got = s.split(oldText).length - 1;
            if(got !== n) throw new Error(`anchor count ${got} != ${n}: ${oldText.slice(0,120)}`);
            s = s.replace(oldText, newText);
          }

          // Ship ritual first: the suite must exercise the bundle that will ship.
          rep("const APP_VERSION = 'v1.25.0';", "const APP_VERSION = 'v1.25.1';");
          rep("const APP_UPDATED = '8 September 2026';", "const APP_UPDATED = '9 September 2026';");

          const changelogBanner = "// ═══ CHANGELOG — append new entries ABOVE the previous newest '//   vPREV' marker ═══\n";
          const newest = "//   v1.25.0 • THE CONNECTED APP";
          if((s.split(changelogBanner).length-1)!==1 || (s.split(newest).length-1)!==1) throw new Error('changelog anchors moved');
          s = s.replace(changelogBanner + newest,
            changelogBanner +
            "//   v1.25.1 • THE SECOND PRUNE. No user-facing feature: the in-file\n" +
            "//            changelog keeps v1.16.1+ only; v1.5.0–v1.16.0 remains\n" +
            "//            permanently recoverable in git log and CLAUDE.md. This\n" +
            "//            restores byte headroom before the next feature instead\n" +
            "//            of letting the hard 900 KB CI gate become the release\n" +
            "//            blocker. The dead v1.15.0 [data-bfledger] click route\n" +
            "//            is retired with the cell it once served.\n" + newest);

          // Prune only the historical ledger block. v1.16.1 itself stays as the
          // prior-prune milestone; all behavior/code below APP_VERSION is untouched.
          const cutStart = s.indexOf('//   v1.16.0 • THE WORLD TOUR');
          const cutEnd = s.indexOf("\nconst APP_VERSION = 'v1.25.1';");
          if(cutStart < 0 || cutEnd < 0 || cutEnd <= cutStart) throw new Error('prune seam not found');
          const archived = s.slice(cutStart, cutEnd);
          for(const must of ['v1.16.0','v1.5.0','v1.16.1 THE PRUNE']){
            if(!archived.includes(must)) throw new Error(`archive guard missing ${must}`);
          }
          const footer =
            "//   (v1.25.1 SECOND PRUNE — v1.5.0–v1.16.0 changelog history is\n" +
            "//   archived in git log and CLAUDE.md; v1.16.1+ remains inline.)\n";
          s = s.slice(0, cutStart) + footer + s.slice(cutEnd);

          // Open-item #2 from the handoff: the LEDGER dock cell disappeared in
          // v1.22.0; its delegated click route can no longer be reached.
          rep("    // v1.15.0 — the brief dock's LEDGER cell opens the Repository drawer\n    const bld=e.target.closest('[data-bfledger]');\n    if(bld){ try{ _ldSet('records'); Repo.open(); }catch(_){} return; }\n", "");

          const after = Buffer.byteLength(s, enc);
          const freed = before - after;
          if(freed < 30000) throw new Error(`prune freed only ${freed} bytes; expected >= 30000`);
          if(after >= 900*1024) throw new Error(`index.html remains over gate: ${after}`);
          fs.writeFileSync('index.html', s, enc);
          fs.writeFileSync('.prune-result', JSON.stringify({before,after,freed})+'\n');
          console.log({before,after,freed});
          NODE

      - name: Bump worker cache
        run: |
          node <<'NODE'
          const fs=require('fs');
          let s=fs.readFileSync('sw.js','utf8');
          const old="const CACHE = 'a-org-2-v1-25-0';";
          if((s.split(old).length-1)!==1) throw new Error('CACHE anchor moved');
          s=s.replace(old,"const CACHE = 'a-org-2-v1-25-1';");
          fs.writeFileSync('sw.js',s);
          NODE

      - name: Append prune law
        run: |
          cat >> CLAUDE.md <<'EOF'

## v1.25.1 — THE SECOND PRUNE: HEADROOM IS A RELEASE PREREQUISITE

**Owner decision, 9 Sep 2026:** proceed with the prune before adding another feature.

The hard 900 KB gate had become the blocking constraint at 899,862 bytes. The
correct response is not to squeeze behavior or diagnostics opportunistically;
it is to move historical ledger prose back to the history systems that already
preserve it. `index.html` therefore keeps the current era from v1.16.1 forward,
while v1.5.0–v1.16.0 remains losslessly available in git history and these law
sections. The unreachable `[data-bfledger]` route is removed with the dock cell
that disappeared in v1.22.0.

**Law:** when byte headroom becomes the blocker, prune historical/dead weight as
its own release before feature work. Never trade away diagnostics, invariants,
or live behavior merely to satisfy the gate. The prune itself follows the full
ship ritual and the five-tool suite runs last, against the exact bundle shipped.
EOF

      - name: Remove one-shot workflow before verification
        run: rm .github/workflows/prune-release.yml

      - name: Five-tool suite — LAST
        run: |
          node tools/data-lint.js
          node tools/harness_globe.js
          node tools/smoke_runtime.js
          node tools/ship-lint.js
          node tools/dead-lint.js

      - name: Commit verified prune
        run: |
          cat .prune-result
          rm .prune-result
          git config user.name 'A-ORG-2 Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html sw.js CLAUDE.md .github/workflows/prune-release.yml
          git diff --cached --check
          git status --short
          git commit -m 'v1.25.1: second prune restores byte headroom'
          git push origin HEAD:main
